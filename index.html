   recall:{q:'In Chapter 3, what did Mr. Ross see the guard carrying?', o:['Something big and flat wrapped in white paper','A bucket of paint','A long black tube']},
   pages:[
    {t:'Emma\'s first thought was a terrible one. "Mr. Bell took the map," she whispered. "He has a key, and he was carrying it!" Then she stopped herself, remembering Mr. Ross and how wrong she had been. "But why would he steal something he has guarded for thirty years?" Nate tilted his head. "Maybe he didn\'t steal it," he said. "Maybe he moved it." Emma stared at him. That idea had not even crossed her mind, not even once, in all her guessing. She was starting to notice that Nate\'s quiet ideas were often the best ones in the room. "Let\'s find him," she said. "And this time, let\'s look and listen first."',

    {t:'They found Mr. Bell near the front desk, but he was not on the phone anymore. He was kneeling beside a little boy who had lost his family in the crowd. Mr. Bell spoke gently, helped the boy dry his tears, and gave him a museum sticker to hold until the child\'s mother came running. Emma noticed things she had missed before. The cuffs of Mr. Bell\'s uniform were soaked. A smear of white paper dust was on his jacket. And on the floor behind the desk sat a plastic bucket, half full of rainwater. "He doesn\'t seem like a thief," Nate murmured. "He seems like someone who has had a very busy morning."',

   pages:[
    {t:'Owen and Lily were twins. They had a dog named Daisy. Daisy was brown and white, with one floppy ear. The whole family was driving to Grandma\'s house by the sea. The car was full of suitcases, snacks, and one very happy dog. Daisy sat between the twins. She licked Owen\'s cheek. She licked Lily\'s hand. "Two more hours," said Dad. Lily groaned. Owen groaned. Daisy groaned too, which made everyone laugh.',

    {t:'Daisy ran until the thunder stopped. Then she sat down in the mud. She was wet. She was tired. Her leash was gone, lost somewhere in the corn. Daisy sniffed the air. She could not smell Owen. She could not smell Lily. She could only smell rain, dirt, and something new. It was the smell of hay. Daisy followed her nose. Soon she came out of the corn and saw a red barn and an old green tractor.',

  {title:'A Boy Named Leo',
   tricky:[['sidewalk','side-walk','a path for walking next to a street'],['microchip','mi-cro-chip','a tiny tag under a pet\'s skin'],['scanner','scan-ner','a tool that reads hidden information'],['animal','an-i-mal','a living thing like a dog or bird']],
   recall:{q:'In Chapter 3, what toy did Lily find in the car?', o:['A rubber duck that squeaks','A red ball','A stuffed bear']},
   pages:[
    {t:'Daisy had walked all night. Now she was in a little town with tall trees and a park. She was hungry. Her paws hurt. She lay down on the sidewalk next to a bench. A boy named Leo was walking by with his grandpa. Leo stopped. "Grandpa, look," he said. "That dog looks sad and lost." Grandpa bent down slowly. Daisy thumped her tail, just a little. "She is sweet," said Grandpa. "But where is her family?"',

   pages:[
    {t:'At the motel, Owen and Lily were putting on their shoes. They had the squeaky duck ready. Then Mom\'s phone started ringing. Mom answered. She listened. Her eyes got big. "You found her? She is safe?" she said. The twins jumped up and down. Dad grabbed the car keys. "The vet is only twenty minutes away," Mom said. "A boy named Leo found her." Owen hugged the duck. "Let\'s go, let\'s go!" he shouted.',

{id:'s5-camp', title:'Three Whistles on Pine Ridge', icon:'🏕️', lvl:5,
 blurb:'When Jack and Ella wander off the trail on a camping trip, the bickering siblings must stay calm, use everything they know, and learn to trust each other to be found.',
 chapters:[
  {title:'The Shortcut',
   tricky:[['backpacks','back-packs','bags you carry on your back'],['impatient','im-pa-tient','not wanting to wait for anything'],['waterfall','wa-ter-fall','water pouring down over rocks'],['disappeared','dis-ap-peared','went out of sight and could not be seen']],
   pages:[
    {t:'Jack was twelve, and he was certain he knew everything about the woods. His sister Ella was ten, and she was certain he did not. They had been bickering since the car ride, mostly about who got the window seat and who had eaten the last granola bar. On the first morning of the family camp trip at Pine Ridge, the group gathered at the trailhead with their backpacks. Their guide, Mr. Sam, held up a silver whistle. "Everyone gets one of these," he said. "If you are ever lost, stay where you are and blow three times. Three of anything means help." Jack rolled his eyes and stuffed the whistle in his pocket without really listening. Ella hung hers around her neck.',
     q:'What do Jack\'s and Ella\'s actions with the whistles show about them?', o:['Ella takes safety seriously and Jack does not','Jack is more careful than Ella','Neither of them listens to Mr. Sam'], e:'Jack rolled his eyes and stuffed the whistle in his pocket without really listening.', k:'character'},
    {t:'The hike was slow. Their parents and the younger kids kept stopping to look at mushrooms and birds. Jack grew impatient. He kicked at pinecones and sighed loudly enough for everyone to hear. At a bend in the trail, he heard rushing water off to the left. "I bet there is a waterfall down there," he whispered to Ella. "We can see it and catch up in five minutes." Ella frowned. "Mr. Sam said to stay on the trail," she said. "You always do this." Jack was already stepping over a log and sliding down a muddy slope, grabbing at roots to keep his balance. Ella hesitated, then followed him, because she did not want her brother to go alone.',
     q:'Why did Ella follow Jack even though she disagreed?', o:['She did not want him to be alone in the woods','She wanted to see the waterfall more than he did','Mr. Sam told her to go with him'], e:'because she did not want her brother to go alone', k:'inference'},
    {t:'The waterfall was real, and it was beautiful, spilling white foam into a green pool. For a few minutes, the siblings forgot to argue. They skipped flat stones across the pool and counted the ripples, laughing like they used to when they were little. Then Ella noticed the air turning gray. A thick fog was rolling down the ridge like a wave. "We need to go back now," she said. They climbed the slope they thought they had come down, but every tree looked exactly the same. The log Jack had stepped over had disappeared. The voices of the group were gone. Jack stopped walking. For the first time all morning, he did not look certain at all.',
     q:'In this page, what does the word "certain" mean?', o:['Sure about something','Scared of something','Tired of something'], e:'he did not look certain at all', k:'vocabulary'}
   ],
   seq:['Mr. Sam gives everyone a whistle','Jack leaves the trail to find a waterfall','Ella follows him to the waterfall','Fog rolls in and they cannot find the trail'],
   sum:['Jack leads his sister Ella off the trail to see a waterfall, and when fog rolls in, they realize they are lost.','The younger kids stopped to look at mushrooms and birds.','Jack and Ella find the waterfall and quickly return to the group.']},

  {title:'Stop and Think',
   tricky:[['argument','ar-gu-ment','a fight using angry words'],['clearing','clear-ing','an open space in a forest with no trees'],['panicking','pan-ick-ing','being so scared you cannot think clearly'],['explained','ex-plained','told how or why something happened']],
   recall:{q:'In Chapter 1, what did Mr. Sam say three of anything means?', o:['Help','Hello','Hurry']},
   pages:[
    {t:'"This is your fault," Ella said, her voice shaking. "You never listen." Jack spun around. "You didn\'t have to come!" he shot back. Their argument echoed off the wet trees, and then the woods went quiet again. Ella\'s heart was pounding so hard she could feel it in her ears, and her hands had gone cold and clammy. Jack started to march uphill in a new direction. "Wait," Ella said. She was remembering a poster from the ranger station. It had a big red sign on it that spelled STOP. "Stop, Think, Observe, Plan," she said slowly. "If we keep wandering, we could get even more lost." Jack paused with one foot on a rock.',
     q:'What did Ella remember that helped her calm down?', o:['A STOP poster from the ranger station','A map in her backpack','A song her mom used to sing'], e:'She was remembering a poster from the ranger station.', k:'detail'},
    {t:'Jack did not like admitting his little sister was right, but he knew panicking would not help. He sat down on the rock and took three slow breaths, the way his soccer coach taught him to do before a penalty kick. "Okay," he said. "Stop. We stopped. Now think." Ella explained what Mr. Sam had said. "Stay where you are. People will look for us where we were last seen." Jack nodded. "And we are close to the waterfall," he added. "Maybe someone heard us talking about it." They looked around carefully this time, really observing instead of just glancing. Nearby was a small clearing with a fallen tree and open sky above it.',
     q:'How does Jack change on this page?', o:['He stops rushing and starts listening to Ella','He becomes angrier at Ella','He decides to walk home alone'], e:'Jack did not like admitting his little sister was right, but he knew panicking would not help.', k:'character'},
    {t:'They moved to the clearing, where searchers could see them from above and from the trees. Ella lifted the whistle hanging from her neck and blew three long blasts. They waited. Jack dug his whistle out of his pocket and blew three more. The fog seemed to swallow the sound whole. Nobody answered, and the only reply was the steady roar of the distant waterfall. They took turns blowing every few minutes until their cheeks ached. The light was starting to fade, and the air was growing colder. Jack looked at the sky, then at his sister. "If they don\'t find us soon," he said quietly, "we are going to have to spend the night out here."',
     q:'Why did they choose to wait in the clearing?', o:['Searchers could see them there from above and from the trees','It was the warmest place in the forest','It was right next to the trail'], e:'where searchers could see them from above and from the trees', k:'inference'}
   ],
   seq:['Jack and Ella blame each other','Ella remembers the STOP poster','They decide to stay near the waterfall','They blow their whistles from the clearing'],
   sum:['Instead of panicking, Jack and Ella use the STOP plan, choose to stay put in a clearing, and signal with their whistles.','Jack sits on a rock and takes three breaths.','The siblings walk all the way back to camp on their own.']},

  {title:'Shelter Before Dark',
   tricky:[['shelter','shel-ter','a place that keeps you safe from weather'],['branches','branch-es','arms of a tree that grow out from the trunk'],['tablets','tab-lets','small flat pills'],['insulation','in-su-la-tion','material that keeps cold out and warmth in']],
   recall:{q:'In Chapter 2, what did STOP stand for?', o:['Stop, Think, Observe, Plan','Stay, Turn, Open, Play','Stand, Talk, Organize, Pack']},
   pages:[
    {t:'"Okay," Ella said, pulling her jacket tighter. "We need a shelter before it gets dark. Being cold and wet is more dangerous than being hungry." Jack studied the fallen tree at the edge of the clearing, walking all the way around it and testing it with his boot to make sure it would not roll. It had landed at an angle, making a low roof on one side. "We can lean branches against it," he said. "Like a little tent." For once, they did not argue about whose idea it was. Jack dragged long sticks, and Ella leaned them close together against the trunk. Then they piled armfuls of leaves and pine needles over the top to keep out the wind.',
     q:'Which detail shows that the siblings are starting to work as a team?', o:['They did not argue about whose idea it was','Jack dragged long sticks','The fallen tree made a low roof'], e:'For once, they did not argue about whose idea it was.', k:'character'},
    {t:'Ella stuffed a thick layer of dry leaves on the ground inside. "The ground pulls heat out of you," she said. "Leaves are insulation." Jack raised his eyebrows. "How do you know that?" Ella shrugged. "I read the camping book Mom bought. Twice." Next they checked their supplies: two granola bars, a small first aid kit, a keychain flashlight, and their water. Each had half a bottle left. Jack wanted to drink from the stream near the waterfall, but Ella shook her head. "Stream water can make you sick," she said. Then Jack remembered the packing list. He dug in his backpack and found a small bottle of water purifying tablets.',
     q:'What can you tell about Ella from this page?', o:['She prepared by reading and remembering useful facts','She does not like to share her water','She thinks Jack knows more than she does'], e:'"I read the camping book Mom bought. Twice."', k:'character'},
    {t:'They filled one bottle from the stream, dropped in a tablet, and set it aside to wait the full time printed on the label. "Thirty minutes," Jack read. "No cheating." Ella smiled, because that was exactly what she would have said. While they waited, Jack spread his bright orange rain jacket on top of the shelter. "So it stands out," he explained. "Green and brown blend in. Orange doesn\'t." By the time the water was ready, the sky had turned deep blue, and the first stars were blinking through the fog. Somewhere far off, an owl called. Then they heard a different sound, a crack of branches, coming toward them.',
     q:'Why did Jack spread his orange jacket on the shelter?', o:['So searchers could spot it easily','To keep the leaves from blowing away','Because it was wet and needed to dry'], e:'"So it stands out," he explained.', k:'inference'}
   ],
   seq:['They build a shelter against a fallen tree','Ella lines the ground with dry leaves','Jack finds water purifying tablets','Jack spreads his orange jacket on the shelter'],
   sum:['Working together, Jack and Ella build a shelter, make their water safe to drink, and mark their spot with a bright jacket.','An owl called somewhere far away.','Jack and Ella drink straight from the stream because they are thirsty.']},

  {title:'The Longest Night',
   tricky:[['flashlight','flash-light','a small lamp you carry in your hand'],['apologized','a-pol-o-gized','said sorry for something you did'],['reflection','re-flec-tion','light bouncing back off a shiny thing'],['morning','morn-ing','the early part of the day']],
   recall:{q:'In Chapter 3, why did Ella say they should not drink straight from the stream?', o:['Stream water can make you sick','The stream was too cold','The stream was too far away']},
   pages:[
    {t:'The crackling sound came closer, and both siblings held their breath. Jack switched on the tiny flashlight on his keychain. Two shining eyes stared back from the ferns, then a deer bounded away into the dark. Ella let out a shaky laugh. "Just a deer," she said. They crawled into the shelter and squeezed together under the leaves. It was cold, but not as cold as outside, and the leaves crackled every time one of them shifted. They split one granola bar and saved the other for morning. To keep their minds busy, they took turns telling the silliest stories they could invent. Jack made up a tale about a raccoon who ran a pizza shop, and Ella laughed so hard she snorted.',
     q:'Why did the siblings tell silly stories in the shelter?', o:['To keep their minds busy and stay calm','To scare away the deer','To practice for a school play'], e:'To keep their minds busy, they took turns telling the silliest stories they could invent.', k:'inference'},
    {t:'After a while, the stories ran out, and the woods felt very large. Every rustle sounded louder in the dark, and the cold crept in around their ankles. Jack stared at the leafy ceiling. "Ella," he said, "I\'m sorry. I left the trail because I was bored, and I didn\'t listen to Mr. Sam or to you. You only came because you were worried about me." Ella was quiet for a long moment. "I\'m sorry I yelled," she finally said. "And you were smart about the jacket and the tablets." It was the first time either of them had apologized without being told to. Ella leaned her head on Jack\'s shoulder, and somehow the dark felt smaller.',
     q:'What does Jack\'s apology show about how he has changed?', o:['He can admit his mistake and see why Ella followed him','He still thinks the trip was Ella\'s fault','He only cares about getting home'], e:'I left the trail because I was bored, and I didn\'t listen to Mr. Sam or to you.', k:'character'},
    {t:'Neither of them slept much, but the night finally ended. When gray morning light filled the clearing, the fog was lifting. Ella crawled out and stretched her stiff arms. They shared the last granola bar and sipped the clean water slowly, making it last. Then they made a plan for the day. Jack gathered pale rocks from the stream and laid them in a giant X in the middle of the clearing, big enough to see from the sky. Ella pulled a small mirror out of her backpack and practiced flashing its reflection into the trees. Every few minutes, they blew their whistles three times. Then, faintly, from far down the ridge, came an answer: three short whistle blasts.',
     q:'What does the word "faintly" mean in this page?', o:['Very quietly, hard to hear','Very loudly','Very quickly'], e:'Then, faintly, from far down the ridge, came an answer', k:'vocabulary'}

  {title:'Found',

   recall:{q:'In Chapter 4, what did Jack make in the middle of the clearing?', o:['A giant X out of pale rocks','A campfire ring','A sign made of sticks']},
   pages:[
    {t:'Jack and Ella blew their whistles again and again, and the answering whistles grew louder. Soon they heard voices calling their names, and Ella was so happy that she almost forgot to keep blowing her whistle. Jack waved his flashlight even though it was daytime. Two searchers in yellow vests stepped out of the trees, followed by Mr. Sam. "There you are!" Mr. Sam said, his face full of relief. One searcher spoke into a radio: "Found them. Both safe." Then she smiled at the siblings. "You two did everything right after you got lost," she said. "We spotted your orange jacket and that X from the ridge. You stayed put, you stayed warm, and you made yourselves easy to find."',
     q:'According to the searcher, what helped them find Jack and Ella?', o:['The orange jacket and the rock X','A phone call from the siblings','Smoke from a campfire'], e:'"We spotted your orange jacket and that X from the ridge.', k:'detail'},
    {t:'The hike back took two hours, and the searchers let Jack and Ella walk between them, sharing trail mix and asking how they had kept warm. When they reached camp, their parents ran to meet them, and Mom hugged them both so tightly that Ella squeaked. Dad looked exhausted, as if he had not slept at all. Jack stepped forward before anyone could say a word. "It was my idea to leave the trail," he said. "Ella only came to keep me safe. And she knew the STOP rule." Mom looked at Ella with surprise and pride. Ella squeezed her brother\'s hand. "Jack knew about the tablets and the jacket," she said. "We figured it out together."',
     q:'How have Jack and Ella\'s feelings toward each other changed since Chapter 1?', o:['They now respect each other and share the credit','They still blame each other for everything','They are too tired to care about each other'], e:'"We figured it out together."', k:'character'},
    {t:'That night, the whole group sat around the campfire roasting marshmallows. Mr. Sam asked Jack and Ella to tell everyone what they had learned. Jack felt his face get hot, because it was embarrassing to admit a mistake in front of everyone. But he stood up anyway. Jack held up his whistle. "Stay on the trail," he said, "and if you do get lost, stay where you are. Blow three times." Ella added, "Stop, think, observe, and plan. And don\'t waste time arguing." Everyone laughed, even Jack. Later, as the fire crackled low, Jack hung his whistle around his neck, right where Ella wore hers. "Just in case," he said. Ella grinned. For once, she did not tell him she had been right all along.',
     q:'What does Jack hanging his whistle around his neck show?', o:['He now takes safety seriously, like Ella','He wants to blow it at the campfire','He is planning to leave the trail again'], e:'Jack hung his whistle around his neck, right where Ella wore hers.', k:'character'}

   seq:['Searchers and Mr. Sam find the siblings','Jack tells his parents it was his idea to leave the trail','Ella shares the credit with Jack','The siblings share what they learned at the campfire'],

{id:'s5-quest', title:'Grace and the Needing Compass', icon:'🧭', lvl:5,
 blurb:'Grandma\'s old compass does not point north. It points to whatever you need most, and today it is leading Grace somewhere no map has ever shown.',
 chapters:[
  {title:'The Compass in the Drawer',
   tricky:[['grandmother','grand-moth-er','the mother of your mom or dad'],['scratched','scratched','marked with thin lines from rubbing'],['peculiar','pe-cu-liar','strange or unusual'],['trembled','trem-bled','shook a little']],
   pages:[
    {t:'Grace had spent every summer at her grandmother\'s farmhouse at the edge of the woods, but this was the first summer without Grandma in it. The house still smelled like cinnamon and old books. Mom was busy packing boxes in the kitchen, so Grace wandered upstairs to Grandma\'s sewing room. She opened the bottom drawer of the desk, the one Grandma had always kept locked. Today it slid open easily. Inside, wrapped in a faded blue handkerchief, was a brass compass. It was scratched and worn, and its glass was cloudy. Tucked beneath it was a small card in Grandma\'s curly handwriting. It said only: For Grace, when she is ready.',
     q:'Why do you think this summer felt different to Grace?', o:['Her grandmother was no longer there','She had never visited the farmhouse before','Her mom had moved to a new town'], e:'this was the first summer without Grandma in it', k:'inference'},
    {t:'Grace turned the compass over in her hands. Something about it was peculiar. The needle did not point north. She knew the woods were north of the house, but the needle swung slowly toward the kitchen. She followed it down the stairs, feeling a little silly. The needle pointed straight at the cookie jar. Grace laughed out loud. She had skipped lunch, and she was starving. She took a cookie, and the needle trembled, then swung away toward the back door. "Mom," she called, "did Grandma ever tell you about her compass?" Mom looked up from a box, smiling in a sad, faraway way. "She said it never once let her down," Mom said.',
     q:'What does the cookie jar scene show about the compass?', o:['It points to what Grace needs','It is broken and points anywhere','It only points to food'], e:'She had skipped lunch, and she was starving.', k:'inference'},
    {t:'That afternoon, Grace tested the compass again and again. When she lost her shoe, it pointed under the porch steps. When she felt lonely, it pointed to Mom, who was sitting on the porch swing. Grace sat beside her, and Mom wrapped an arm around her without saying a word. It was exactly what she needed. By evening, Grace was sure. The compass did not point to north. It pointed to whatever she needed most. Then, as the sun dipped low, the needle did something new. It spun in a fast circle, stopped, and pointed firmly toward the dark woods. It did not waver at all. Grace felt her heart begin to pound.',
     q:'How did Grace figure out what the compass really does?', o:['She tested it many times and noticed a pattern','Her mom explained it to her','She read the instructions on the card'], e:'Grace tested the compass again and again', k:'main idea'}
   ],
   seq:['Grace finds the compass in Grandma\'s locked drawer','The needle points to the cookie jar','Grace tests the compass and learns what it does','The needle points firmly toward the dark woods'],
   sum:['Grace discovers that her grandmother\'s old compass points to whatever she needs most, and now it is pointing into the woods.','The farmhouse smelled like cinnamon and old books.','Grace throws away the compass because it is broken.']},

  {title:'The Path Behind the Waterfall',
   tricky:[['flashlight','flash-light','a small light you hold in your hand'],['waterfall','wa-ter-fall','water falling over the edge of rocks'],['hesitated','hes-i-tat-ed','paused because you were unsure'],['sparkling','spar-kling','shining with little flashes of light']],
   recall:{q:'In Chapter 1, what did the compass point to when Grace felt lonely?', o:['Her mom on the porch swing','The cookie jar','The porch steps']},
   pages:[
    {t:'Grace knew she should wait until morning. She also knew the compass had never pointed anywhere so firmly. She told Mom she was going for a short walk along the creek, which was true, and grabbed a flashlight and her jacket. The needle led her past the old apple trees and into the woods. The path she followed was not one she knew. It wound between tall pines and over mossy logs, always toward the sound of rushing water. After twenty minutes, she came to a small waterfall that splashed down a wall of gray rock. The needle pointed straight into the falling water. Grace frowned and shook it gently. A compass that pointed at a waterfall made no sense at all.',
     q:'Why did Grace tell Mom she was walking along the creek?', o:['It was true, and she did not want to worry Mom','She wanted to trick Mom on purpose','Mom had asked her to check the creek'], e:'which was true', k:'character'},
    {t:'Grace stepped closer and shined her flashlight through the spray. Behind the water, the rock was not solid. There was a narrow opening, just wide enough for a person to squeeze through. She hesitated. Her sneakers were already soaked, and the opening was very dark. She thought about turning back to the warm, bright farmhouse. But she remembered what Mom had said: the compass never once let Grandma down. Grace took a deep breath, ducked her head, and stepped through the curtain of water. The cold made her gasp. She shuffled through a short, dripping tunnel, one hand on the wet stone, until a soft green light appeared ahead of her.',
     q:'What helped Grace find the courage to go through the waterfall?', o:['Remembering that the compass never let Grandma down','Hearing Mom call her name','Seeing a sign that said it was safe'], e:'she remembered what Mom had said', k:'character'},
    {t:'Grace stepped out of the tunnel and stopped. In front of her lay a hidden valley that was not on any map. A silver river curled through meadows of tall grass. Trees with leaves the color of honey stood on the hills, and tiny lights drifted in the air like sparkling dust. The sky above was the pale pink of early morning, even though it had been evening a moment ago. Grace looked at the compass. The needle was spinning slowly, as if it were thinking. Then, from somewhere in the tall grass nearby, she heard a small sound. It was a thin, sad cry, like something that was very lost.',
     q:'What clue shows the valley is a magical place?', o:['The sky looked like morning even though it was evening','The river was silver and wide','There were trees on the hills'], e:'even though it had been evening a moment ago', k:'inference'}
   ],
   seq:['Grace follows the compass into the woods','The needle points into a waterfall','Grace steps through the water and the tunnel','She finds a hidden valley and hears a sad cry'],
   sum:['Grace bravely follows the compass through a waterfall and discovers a hidden, magical valley.','Grace\'s sneakers got wet near the waterfall.','Grace decides to turn around and go home to bed.']},

  {title:'A Creature Made of Clouds',
   tricky:[['creature','crea-ture','an animal or living being'],['tangled','tan-gled','twisted and caught together'],['carefully','care-ful-ly','slowly, so nothing goes wrong'],['shivering','shiv-er-ing','shaking from cold or fear']],
   recall:{q:'In Chapter 2, how did Grace get into the hidden valley?', o:['She went through an opening behind a waterfall','She climbed over a tall mountain','She crossed a bridge over the river']},
   pages:[
    {t:'Grace followed the crying sound through the grass. Caught in a thorny bush was a small creature about the size of a cat. Its fur was white and fluffy, like a piece of cloud that had come down to rest, and its ears were long and soft. Its eyes were large and gray. One of its back legs was tangled in the thorns, and it was shivering. When it saw Grace, it shrank back and gave a frightened squeak. Grace knelt down slowly. "It\'s okay," she said quietly. "I won\'t hurt you." She kept her voice gentle and low, the way Grandma used to when Grace woke up from a bad dream.',
     q:'How did Grace show kindness to the creature?', o:['She moved slowly and spoke gently to calm it','She grabbed it quickly before it ran','She ran to find a grown-up first'], e:'She kept her voice gentle', k:'character'},
    {t:'Grace carefully pulled the thorns apart, one branch at a time. A thorn scratched her hand, but she did not stop. At last, the creature\'s leg came free. It hopped a few steps away and turned to look at her, its nose twitching. Grace held out her hand, and after a long moment, the creature crept forward and pressed its cool, soft head against her palm. "I think I\'ll call you Puff," Grace said. Puff made a sound like a tiny bell. Then it looked up at the hills and cried again, softer this time. Grace understood. Puff did not just need help getting free. Puff needed to get home.',
     q:'What did Grace realize about what Puff needed?', o:['Puff needed to get home','Puff needed food to eat','Puff needed a new name'], e:'Puff needed to get home.', k:'inference'},
    {t:'Grace pulled out the compass. "Can you show me where Puff lives?" she whispered. The needle spun, then pointed across the river toward the tallest hill, where a ring of white clouds rested on top like a crown. Puff saw where the needle pointed and wiggled with excitement. Grace knew that hill was far away. The sun was moving across the pink sky, and she had no idea how time passed here. Mom would be worried. She could go back now, through the waterfall, and no one would blame her. Grace looked at Puff\'s small, hopeful face. Then she stood up, tucked the compass into her pocket, and started walking toward the river.',
     q:'What choice does Grace make at the end of this chapter?', o:['She decides to take Puff home even though it is far','She decides to go back through the waterfall','She decides to keep Puff as a pet'], e:'started walking toward the river', k:'character'}
   ],
   seq:['Grace finds a cloud-white creature caught in thorns','She frees its leg and names it Puff','The compass points to the hill with clouds on top','Grace decides to take Puff home'],
   sum:['Grace rescues a small cloud creature named Puff and chooses to help it find its way home.','A thorn scratched Grace\'s hand.','Grace takes Puff back to the farmhouse to live with her.']},

  {title:'The River Crossing',
   tricky:[['stepping','step-ping','putting your feet down as you walk'],['slippery','slip-per-y','wet and smooth so you might slide'],['balanced','bal-anced','steady, without falling over'],['stubborn','stub-born','not wanting to change your mind']],
   recall:{q:'In Chapter 3, what did Grace name the little creature?', o:['Puff','Snow','Button']},
   pages:[
    {t:'The silver river was wider than it looked from the meadow. The water moved fast, and Grace could see the stones on the bottom tumbling along. A row of flat stepping stones led across, but they were wet and slippery, and some were far apart. Puff sat at the edge and refused to move. It pressed itself against Grace\'s ankle and trembled. Grace remembered being afraid of the deep end of the pool when she was little. Grandma had never pushed her. Instead, she had held Grace\'s hand and said, "We\'ll go one step at a time, and only when you\'re ready." Grace knelt down beside Puff. "We\'ll go one step at a time," she told it.',
     q:'How does the memory of Grandma help Grace?', o:['It shows her how to be patient with Puff','It reminds her to go home','It tells her how to swim across'], e:'Grandma had never pushed her.', k:'character'},
    {t:'Grace picked Puff up and held it close against her jacket. Puff was lighter than she expected, almost like holding a pillow. She stepped onto the first stone and balanced carefully. Then the second. The water rushed past her shoes, cold and loud. On the fifth stone, her foot slipped. Grace threw out her arms and wobbled, and for one terrible second she was sure they would fall in. Then something strange happened. Puff\'s fur puffed up, wider and wider, until it was as big as a small cloud. Grace felt herself grow lighter. Her feet barely touched the stone. Together, they floated the last few steps to the other side.',
     q:'What surprising thing did Puff do on the river?', o:['It puffed up like a cloud and made them lighter','It jumped into the water and swam','It ran ahead across the stones'], e:'Puff\'s fur puffed up, wider and wider', k:'detail'},
    {t:'On the far bank, Puff shrank back to its normal size and licked Grace\'s chin. Grace laughed, breathless. "You helped me," she said. "I thought I was the one helping you." She realized they were a team now, and the thought made her feel braver. As they climbed the first slope of the tall hill, the path grew steep and rocky. Grace\'s legs ached, and she was getting hungry. Puff hopped ahead, then waited, then hopped ahead again, as stubborn and hopeful as a puppy. Near the top, the air grew misty and cool. Then Grace heard voices, high and musical, calling from inside the clouds. Puff froze, its long ears standing straight up, listening hard.',
     q:'What does Grace learn about helping from the river crossing?', o:['Helping can go both ways, like a team','Only strong people can help others','It is better to do things alone'], e:'"I thought I was the one helping you."', k:'main idea'}

   seq:['Puff is afraid to cross the river','Grace carries Puff onto the stepping stones','Grace slips and Puff puffs up to make them light','They climb the hill and hear voices in the clouds'],
   sum:['Grace and Puff help each other cross a dangerous river and climb toward the voices in the clouds.','The river had stones tumbling along the bottom.','Grace falls into the river and has to swim home.']},

{id:'s5-island', title:'Anna Crosses the Ocean', icon:'🗽', lvl:5,

   pages:[
    {t:'In the spring of 1907, a thick envelope came to our little village in Germany. It was from Papa. Two years earlier, he had sailed to America to find work. He promised he would send for us when he had saved enough money. Now the envelope held three ship tickets. Mama cried and laughed at the same time. My little brother Max, who was six, danced around the kitchen. I was eleven, and I felt two things at once. I was thrilled to see Papa again. But I was also afraid to leave everything I knew: my school, my friend Greta, and the old pear tree behind our house. I wondered if America had pear trees too.',
     q:'How did Anna feel about the tickets?', o:['Both thrilled and afraid','Only angry','Only bored'], e:'I was thrilled to see Papa again. But I was also afraid to leave everything I knew', k:'character'},
    {t:'We could bring only what we could carry. Mama packed our clothes, a feather blanket, and Grandmother\'s brass candlesticks wrapped in a shawl. I wanted to bring my books, but there was no room. I chose just one, a thin book of stories with a blue cover. Max wanted to bring his wooden horse, his ball, and three rocks from the river. "One thing, Max," Mama said. He held each rock for a long time. Finally, he chose the horse. I put one small rock in my own pocket so he would have it later. I did not tell him. I wanted it to be a surprise for the hard days ahead, whenever they came.',
     q:'What does hiding the rock in her pocket show about Anna?', o:['She cares about her brother\'s feelings','She wants to trick Max','She likes collecting rocks'], e:'I put one small rock in my own pocket so he would have it later.', k:'character'},
    {t:'We rode a train to the port city of Hamburg. The docks were crowded with families just like ours, carrying bundles and baskets. Our ship was enormous, with tall black smokestacks. Before we could board, a doctor looked at our eyes and throats. A man wrote our names in a big book. Then we climbed up the ramp. Max held my hand so tightly that my fingers hurt. The ship\'s horn gave a long, deep blast. The dock began to slide away. I watched the land grow smaller and smaller. Mama whispered a prayer. Then I made Max a promise. "No matter what happens," I said, "I will stay right beside you."',
     q:'What happened before the family could board the ship?', o:['A doctor checked their eyes and throats','They had to buy new clothes','Papa came to meet them'], e:'Before we could board, a doctor looked at our eyes and throats.', k:'detail'}

   sum:['Anna, Mama and Max leave their village in Germany and board a ship to join Papa in America.','Max likes wooden horses and river rocks.','Papa comes back to Germany to bring the family to America.']},

  {title:'Below the Deck',
   tricky:[['steerage','steer-age','the cheapest, most crowded part of a ship'],['seasick','sea-sick','sick in the stomach from a rocking boat'],['passengers','pas-sen-gers','people riding on a ship or train'],['languages','lan-guag-es','ways people speak, like German or English']],
   recall:{q:'In Chapter 1, what promise did Anna make to Max on the ship?', o:['She would stay right beside him','She would buy him a new horse','She would teach him to swim']},
   pages:[
    {t:'Our tickets were for steerage, the cheapest part of the ship, deep below the deck. We slept in a long room packed with metal bunks, stacked two high. Hundreds of passengers shared that room. There were families from Poland, Italy, Russia, and Hungary, and I heard more languages than I could count. The air smelled of salt, sweat, and onions. There were no windows, only a few round holes high up. At night, babies cried and old men snored. Mama made a little home in our corner. She hung the shawl from the top bunk like a curtain, so we had a tiny room of our own. It was not much, but it was ours.',

    {t:'On the third day, the sea grew rough. The ship rolled up and down like a giant rocking chair. Mama became terribly seasick. She could not lift her head from her bunk. So I had to take care of Max. I brought him bread and soup from the long tables where everyone ate. I took him up on deck for fresh air when the sailors allowed it. I read him stories from my blue book until he fell asleep. Some nights I was so tired that my eyes burned, and I missed my own bed in the village. But whenever I wanted to give up, I looked at my little brother sleeping, and I remembered my promise.',
     q:'Why did Anna have to take care of Max?', o:['Mama was too seasick to get up','Max was sick and needed medicine','The sailors asked her to'], e:'Mama became terribly seasick.', k:'detail'},
    {t:'On deck one afternoon, Max made a friend, a boy named Tony from Italy. They could not speak the same language, but they did not need to. They rolled Max\'s wooden horse back and forth and laughed. Tony\'s older sister, Gina, smiled at me, and I smiled back. She knew three English words: "hello," "yes," and "America." I knew five, from Papa\'s letters. We traded them like treasures. The trip lasted almost two weeks, and every day looked the same: gray water, gray sky. Then, early one morning, a shout rang through the steerage room. People leaped from their bunks and rushed toward the stairs. Someone was calling out a word everyone understood: "America!"',

   ],

   sum:['During the long, hard ocean crossing, Anna cares for Max while Mama is seasick and makes new friends.','Steerage had metal bunks stacked two high.','Anna and Max stay in a fancy cabin with big windows.']},

  {title:'The Lady in the Harbor',
   tricky:[['statue','stat-ue','a big shape of a person made of stone'],['inspection','in-spec-tion','a careful check to look for problems'],['examined','ex-am-ined','looked at very closely'],['interpreter','in-ter-pre-ter','a person who changes words into another language']],

    {t:'I squeezed onto the deck between the grownups and saw her: a giant green statue holding a torch high above the water. Mama, pale and weak, stood beside me and held my shoulder. "The Statue of Liberty," she whispered. Her eyes were wet. Behind the statue, tall buildings rose from the city of New York. They looked like cliffs made of stone and glass. Everyone on deck grew quiet. Even Max stopped wiggling. But we did not get off in New York. The passengers in first and second class were checked on the ship. Those of us from steerage had one more stop: a small island in the harbor called Ellis Island.',
     q:'Why did the steerage passengers go to Ellis Island?', o:['Only first and second class passengers were checked on the ship','They wanted to see the statue up close','The city of New York was closed'], e:'The passengers in first and second class were checked on the ship.', k:'inference'},
    {t:'A crowded ferry carried us across the harbor to a large building with four towers. Before we left the ship, a worker had pinned a paper tag to each of our coats. It had a number that matched our names in the ship\'s list. Inside, we climbed a long, steep staircase with our bundles. Later, I learned that doctors stood at the top and watched each person climb. Anyone who breathed hard or limped might be pulled aside. This was the first part of the inspection. At the top was the Great Hall. It was the biggest room I had ever seen, filled with long lines of people and echoing voices in many languages.',
     q:'Why did doctors watch people climb the stairs?', o:['To spot people who might be sick or hurt','To make sure no one carried too much','To count how many people arrived'], e:'Anyone who breathed hard or limped might be pulled aside.', k:'inference'},
    {t:'We waited in line for a long time. At last, a doctor examined us. He looked at our faces, our hands, and our hair. Another doctor used a small hook to fold back our eyelids and check our eyes. It did not hurt, but Max squirmed. Then the first doctor bent down and put his hand on Max\'s forehead. He frowned. An interpreter told Mama, in German, that Max felt warm. The doctor took a piece of chalk and wrote a letter on the front of Max\'s coat. Mama\'s face turned white. I knew what a chalk mark could mean. It meant Max might not be allowed in. He might even be sent back across the ocean.',
     q:'Why did Mama\'s face turn white?', o:['She was afraid Max might not be allowed into America','She was angry at the interpreter','She was cold from the ferry ride'], e:'It meant Max might not be allowed in.', k:'inference'}
   ],

// ---------- Out-loud minutes: only time the microphone heard the reader (opens Brain Break) ----------
// Counted from the first word the microphone heard to the last one, so pauses at the start and walking away do not count.
const BREAK_ALOUD = 20;
function countAloud(){
  if (!mic.t0 || !(mic.last > mic.t0)) return;
  const from = Math.max(mic.t0, mic.counted || 0), secs = (mic.last - from)/1000;
  mic.counted = mic.last;
  if (secs > 0) addAloud(secs);
}
function addAloud(secs){
  const p = me(); if (!p || !(secs > 0)) return;
  p.aloud = p.aloud || {}; const t = today();
  for (const d of Object.keys(p.aloud)) if (d < addDays(-60)) delete p.aloud[d];
  const was = aloudToday(p);
  p.aloud[t] = (p.aloud[t]||0) + Math.min(secs, 900)/60; save();
  if (was < BREAK_ALOUD && aloudToday(p) >= BREAK_ALOUD){ floatText(breakOpen(p) ? '🎉 Brain Break open!' : '🎤 20 reading minutes done!'); confetti(100); }
}
function aloudToday(p){ return ((p.aloud||{})[today()]) || 0; }

// ---------- Daily reading minutes (matches the class reading logs) ----------
function goalOf(p){ return p.goal || (p.grade >= 5 ? 20 : 15); }
function minsToday(p){ return Math.floor(((p.daily||{})[today()]||0)); }
function addMinutes(m){
  const p = me(); if (!p || !(m > 0)) return;
  m = Math.min(m, 15); // one sitting never counts more than 15 minutes (a page left open is not reading)
  p.minutes = (p.minutes||0) + m; p.daily = p.daily || {};
  const t = today(); p.daily[t] = (p.daily[t]||0) + m; save();
  if (p.goalPaid !== t && minsToday(p) >= goalOf(p)){ p.goalPaid = t; save(); giveTickets(1); addCoins(10, 'daily goal!'); confetti(50); }
}
function ringSvg(p){
  const done = Math.min(1, minsToday(p)/goalOf(p)), r = 26, c = 2*Math.PI*r;
  return `<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--soft)" stroke-width="8"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--good)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*done} ${c}" transform="rotate(-90 32 32)"/>
    <text x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" font-family="Baloo 2, sans-serif">${minsToday(p)}</text></svg>`;

// ---------- Word bank: the words this reader actually struggles with ----------
const BANK_SKIP = new Set('the and a an to of in is it was he she they you i we on at for with his her that this but not are be as had have said from or one all were so up out can no if my me do did what when there then them some him its our your'.split(' '));
function bankKey(w){ return String(w).toLowerCase().replace(/[’']s$/,'').replace(/[^a-z]/g,''); }
function bankAdd(w, src, ctx){
  const p = me(); if (!p) return; const k = bankKey(w);
  if (k.length < 4 || BANK_SKIP.has(k)) return;
  p.bank = p.bank || {}; const b = p.bank[k] || (p.bank[k] = {n:0, ok:0, d:today()});
  // a word counts once per page (or per practice session), so tapping it twice on one page is not "routinely"
  const occ = (view.name === 'read' && R) ? R.s.id + '#' + R.page : view.name + '|' + (view.psg ? view.psg.title : '') + '|' + today();
  b.occ = b.occ || [];
  if (!b.occ.includes(occ)){ b.n++; b.occ.push(occ); if (b.occ.length > 8) b.occ.shift(); }
  b.ok = 0; b.d = today(); if (src) b.src = src;
  if (!ctx && view.words){ const w0 = view.words.find(x => bankKey(x.raw) === k); const txt = (view.name === 'read' && R) ? R.s.pages[R.page].t : (view.psg && view.psg.t); if (w0 && txt) ctx = sentenceAt(txt, w0.at); }
  if (ctx) b.ctx = ctx;
  save();
}
function bankOk(w){
  const p = me(), k = bankKey(w); if (!p || !p.bank || !p.bank[k]) return;
  p.bank[k].ok++;
  if (p.bank[k].ok >= 3){ delete p.bank[k]; p.mastered = (p.mastered||0) + 1; floatText('Mastered: ' + k + '!'); }
  save();
}
function bankWords(p){ const b = p.bank || {}; return Object.keys(b).sort((x,y) => b[y].n - b[x].n); }

// ---------- Today's Quest ----------
function questToday(p){ p.quest = p.quest || {}; return p.quest[today()] || {}; }
function questItems(p){

  const items = [

  // matching games are the favourite, so they alternate day by day with the other practice games
  const odd = Math.floor(Date.now() / 86400000) % 2 === 1;
  const fp = (k, label) => ({k, icon:GAMES[k].icon, label: `${GAMES[k].name}: ${label} (free play)`, run:()=>startGame(k, true)});
  if (f.phonics) items.push(odd ? fp('smash', 'your tricky words') : fp('chunks', 'snap word halves together'));

function questMark(k){

  const items = questItems(p);
  if (items.some(i => i.k === k) && items.every(i => i.done) && !q.paid){ q.paid = true; save(); giveTickets(1); addCoins(20, 'quest complete!'); confetti(90); }

// ---------- Chapter books (one chapter a day) ----------
let _chapters = null;
function chapterStories(){
  if (_chapters) return _chapters;
  _chapters = SERIES.flatMap(se => se.chapters.map((c, n) => ({
    id: se.id + '-c' + (n+1), title: `${se.title}, Chapter ${n+1}: ${c.title}`, icon: se.icon, cat:'series', lvl: se.lvl,
    tricky: c.tricky, pages: c.pages, seq: c.seq, sum: c.sum, recall: c.recall, series: se.id, chap: n, chapters: se.chapters.length,
    prevSum: n ? se.chapters[n-1].sum[0] : null})));

}
function seriesState(p, sid){ p.series = p.series || {}; return p.series[sid] || {ch:0, d:''}; }
function chaptersRead(st){ return st.read || [...Array(st.ch || 0).keys()]; }
function chapterInfo(p, se){
  const st = seriesState(p, se.id), rd = chaptersRead(st), n = se.chapters.findIndex((_, i) => !rd.includes(i));
  if (n < 0) return {se, done:true, n: se.chapters.length};
  return {se, n, locked: false, story: chapterStories().find(c => c.id === se.id + '-c' + (n+1))};

function seriesFor(p){ return SERIES.filter(se => p.grade >= 5 ? se.lvl >= 4 : se.lvl <= 4); }
// the book the reader is in the middle of (most recently read), else the first one they have not started
function nextChapter(p){
  const list = seriesFor(p).map(se => chapterInfo(p, se)).filter(c => !c.done);
  const started = list.filter(c => chaptersRead(seriesState(p, c.se.id)).length).sort((a,b) => (seriesState(p, b.se.id).d||'').localeCompare(seriesState(p, a.se.id).d||''));
  return started[0] || list[0] || null;
}
function vSeries(){
  const p = me(), se = SERIES.find(x => x.id === view.id); if (!se){ go({name:'library'}); return; }
  const st = seriesState(p, se.id), info = chapterInfo(p, se);

    <div class="row"><span class="big-emoji">${se.icon}</span><div><h1>${esc(se.title)}</h1><p class="mut">${esc(se.blurb||'')}</p></div></div>

    const s = chapterStories().find(x => x.id === se.id + '-c' + (n+1));
    const done = chaptersRead(st).includes(n), now = n === info.n && !info.done, open = true;
    return `<button class="opt chap ${done?'right':''}" ${open?'':'disabled'} data-a="${A(()=>go({name:'intro', id:s.id}))}">
      <b>Chapter ${n+1}: ${esc(c.title)}</b><span class="mut">${done ? '✓ Read' : now ? '⭐ Up next' : '📖 Open'}</span></button>`; }).join('')}</div>
  ${info.done ? `<p class="result">🏆 You finished the whole book!</p>` : ''}`;

function gymStart(){
  const v = view; v.run = true; v.errs = new Set(); v.t0 = Date.now(); render();

}
function gymDone(secsIn){
  const v = view, p = me(); if (!v.run) return;
  const secs = Math.max(5, (Date.now() - v.t0)/1000);
  let w;
  if (v.mode === 'mic'){
    const r = micRate(), heard = mic.ptr;
    stopMic(); v.run = false; view.onMicDone = null;

    p.gym = p.gym || []; p.gym.push({d:today(), w:v.reads.slice(), m:v.mode, s:v.psg.s}); if (p.gym.length > 60) p.gym.shift();

// ---------- Monthly check-in: a one-minute cold read ----------
const BENCH = {2:[50,84,100], 3:[83,97,112], 4:[94,120,133], 5:[121,133,146], 6:[132,145,146]}; // Hasbrouck & Tindal (2017), 50th percentile words correct per minute: fall, winter, spring
function season(d){ const m = +d.slice(5,7); return (m >= 8 && m <= 11) ? 0 : (m === 12 || m <= 2) ? 1 : 2; }
function benchFor(grade, d){ const b = BENCH[Math.max(2, Math.min(6, grade))]; return b[season(d)]; }
// ---------- Reading speed vs. national benchmarks ----------
// Hasbrouck & Tindal (2017) oral reading fluency norms, words correct per minute at the 25th, 50th, 75th and
// 90th percentile, fall / winter / spring. Bands: below the 25th = high risk, 25th-49th = some risk,
// 50th-74th = on grade level, 75th and up = the upper band, which is the target.
const NORMS = {
  3:{25:[59,79,91],   50:[83,97,112],  75:[104,137,139], 90:[134,161,166]},
  4:{25:[75,95,105],  50:[94,120,133], 75:[125,143,160], 90:[153,168,184]},
  5:{25:[87,109,119], 50:[121,133,146],75:[153,160,169], 90:[179,183,194]}};
const BANDS = [
  {k:'high', min:0,  lab:'High risk',      kid:'Warm-up zone',  ic:'🔴', col:'var(--oops)'},
  {k:'some', min:25, lab:'Some risk',      kid:'Getting there', ic:'🟠', col:'var(--sun)'},
  {k:'on',   min:50, lab:'On grade level', kid:'On track',      ic:'✅', col:'var(--accent)'},
  {k:'top',  min:75, lab:'Upper band (target)', kid:'Rocket zone', ic:'🚀', col:'var(--good)'}];
// the benchmark for a percentile on a given day: fall is mid-September, winter mid-January, spring mid-May,
// with a straight line between them, so the target rises a little every week the way real readers grow
function normAt(grade, pc, d){
  const n = NORMS[Math.max(3, Math.min(5, grade))][pc], t = new Date((d || today()) + 'T12:00');

const KEY_SKIP = new Set('with that this from they then when were have into about after back down over their there what your will just very more came made took said them each every went could would which while where before because again still also only first last next other some than these those once upon long time story chapter little great really people found began asked'.split(' '));

    const k = bankKey(raw); if (k.length >= 4 && !KEY_SKIP.has(k) && !out.includes(k)) out.push(k);

}

function weekText(p, end){

// ---------- Focus words: words a reader stumbles on again and again ----------
// Any word flagged on two different pages or days (unclear to the microphone, tapped for help, stuck on,
// or marked by a grown-up) becomes a focus word. Focus words show up everywhere until read correctly 3 times.
const FOCUS_N = 2;
function focusWords(p){ return bankWords(p).filter(k => p.bank[k].n >= FOCUS_N); }
function isFocus(p, k){ const b = (p && p.bank || {})[k]; return !!(b && b.n >= FOCUS_N); }
function meaningOf(k){
  k = String(k).toLowerCase();
  if ((EXTRA.defs||{})[k]) return EXTRA.defs[k];
  const v = MATCHWORDS.vocab3.concat(MATCHWORDS.vocab5).find(x => x[0].toLowerCase() === k);
  return v ? v[1] : '';
}
function sentenceAt(text, at){
  const t = String(text).replace(/\n/g, ' ');
  let a = at; while (a > 0 && !/[.!?]/.test(t[a-1])) a--;
  let b = at; while (b < t.length && !/[.!?]/.test(t[b])) b++;
  return t.slice(a, Math.min(t.length, b + 1)).replace(/^["\s]+/, '').trim().slice(0, 220);
}
// page words the microphone passed over without clearly hearing; longer words first, at most 4 a page
function unclearWords(){
  const words = view.words || [], heard = mic.heard || new Set(), out = [];
  for (let i = 0; i < Math.min(mic.ptr, words.length); i++){
    const k = bankKey(words[i].raw);
    if (!heard.has(i) && k.length >= 4 && !BANK_SKIP.has(k) && !out.some(o => o.k === k)) out.push({i, k});
  }
  return out.sort((a,b) => b.k.length - a.k.length).slice(0, 4);
}
function flagUnclear(text){
  const list = unclearWords();
  list.forEach(x => bankAdd(view.words[x.i].raw, 'mic', sentenceAt(text, view.words[x.i].at)));
  const heard = mic.heard || new Set();
  document.querySelectorAll('#passage .w').forEach((el, i) => el.classList.toggle('unclear', i < mic.ptr && !heard.has(i) && list.some(x => x.k === bankKey(view.words[i].raw))));
  return list;
}
function unclearHtml(list){
  if (!list.length) return '';
  const p = me();
  return `<div class="notice" style="margin-top:10px"><b>Words to practise:</b> ${list.map(x => `<span class="chip fwchip">${isFocus(p, x.k) ? '🎯 ' : ''}${esc(x.k)}</span>`).join(' ')}
    <p class="mut" style="font-size:.9rem;margin-top:4px">The iPad didn't hear these clearly. Tap an underlined word in the story to see it in chunks, then read it again out loud.${list.some(x => isFocus(p, x.k)) ? ' 🎯 means it is one of your focus words.' : ''}</p></div>`;
}
// listen for one word; cb(true) heard it, cb(false) did not, cb(null) no microphone
function listenFor(word, cb){
  stopRetell(); let rec;
  try{ rec = new SR(); }catch(e){ cb(null); return; }
  retellRec = rec; rec.lang = 'en-US'; rec.continuous = false; rec.interimResults = true;
  let done = false;
  const fin = ok => { if (done) return; done = true; clearTimeout(t); try{ rec.onend = null; rec.abort(); }catch(e){} if (retellRec === rec) retellRec = null; cb(ok); };
  const t = setTimeout(() => fin(false), 7000);
  rec.onresult = e => { const heard = heardText(e).split(/\s+/).map(norm); // 'pan cake' counts for pancake
    if (heard.some((h, i) => h === word || h + (heard[i+1]||'') === word || (word.length >= 6 && lev(h, word) <= 1))) fin(true); };
  rec.onerror = e => { if (['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){ micBlocked = true; fin(null); } };
  rec.onend = () => fin(false);
  try{ rec.start(); }catch(e){ fin(null); }
}

  const speedCell = (s, g2, d) => s ? `${bandOf(g2, s, d).ic} ${s}` : '–';
  let body = '';
  if (tab === 'school') body = dayLogHtml(mine, false);
  else if (tab === 'ir'){ const kid = logStore().kids[who] || {}, fake = {iready: kid.ir || [], cps: kid.cp || []}, l = irLatest(fake);
    body = `${l ? `<table class="daytab"><tr><th>Diagnostic ${niceDate(l.d)}</th><th class="num">Level</th></tr>

      ${IR_DOMS.filter(([k]) => irHas((l.dom||{})[k])).map(([k, lab]) => `<tr><td>${lab}</td><td class="num">${irTier(l.dom[k]).ic} ${IR_LEVELS[l.dom[k]]}</td></tr>`).join('')}</table>
      <h3>Growth goal</h3>${irGoalHtml(irGoal(fake))}` : '<p class="mut">No i-Ready results yet. Enter them on the child\'s iPad under Grown-ups, then scan their code.</p>'}
      <h3>Monthly checkpoints</h3>${cpTableHtml(fake.cps)}
      <h3>MAP math</h3>${(kid.map || []).length ? `<table class="daytab"><tr><th>Test</th><th class="num">RIT</th><th class="num">Percentile</th></tr>${kid.map.slice().reverse().map(r => `<tr><td>${niceDate(r.d)}</td><td class="num"><b>${r.rit}</b></td><td class="num">${r.pct ? r.pct + '%' : '–'}</td></tr>`).join('')}</table>` : '<p class="mut">No MAP math scores yet.</p>'}`; }
  else if (tab === 'week') body = `<table class="daytab"><tr><th>Week of</th><th class="num">Minutes</th><th class="num">Days</th><th class="num">Speed</th></tr>

    <p class="mut" style="font-size:.85rem">Speed is words per minute, out loud. ✅ on grade level · 🚀 top 25% · 🟠 some risk · 🔴 high risk.</p>`;
  else {

    ${body}</div>` : ''}
  <div class="card">${logFilesHtml(today(), rows.length)}</div>`;

let scanStop = () => {};
function loadJsQR(){
  if (window.jsQR) return Promise.resolve(window.jsQR);
  return new Promise((ok, bad) => { const s = document.createElement('script'); s.src = 'lib/jsQR.js?v=1'; s.onload = () => window.jsQR ? ok(window.jsQR) : bad(); s.onerror = bad; document.head.appendChild(s); });
}
function vScan(){
  app.innerHTML = `<div class="row"><button class="btn ghost small" data-a="${A(()=>go({name:'hub'}))}">← Back</button></div>
    <h1>Scan a reading report</h1>
    <div class="card" style="display:flex;flex-direction:column;gap:10px;align-items:center">
      <div class="scanbox"><video id="scanVid" playsinline muted></video><div class="scanframe"></div></div>
      <p id="scanMsg">Point the camera at the code on the iPad.</p></div>`;
  const vid = document.getElementById('scanVid'), msg = t => { const el = document.getElementById('scanMsg'); if (el) el.innerHTML = t; };
  let stream = null, raf = 0, done = false; const myView = view;
  scanStop = () => { done = true; cancelAnimationFrame(raf); if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; scanStop = () => {}; };
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ msg('This browser cannot use the camera. Use the iPhone Camera app instead.'); return; }
  Promise.all([loadJsQR(), navigator.mediaDevices.getUserMedia({video:{facingMode:'environment', width:{ideal:1920}, height:{ideal:1080}}, audio:false})]).then(([jsQR, st]) => {
    if (done || view !== myView){ st.getTracks().forEach(t => t.stop()); return; }
    stream = st; vid.srcObject = st; vid.play().catch(() => {});
    const cv = document.createElement('canvas'), cx = cv.getContext('2d', {willReadFrequently:true});
    const tick = () => {
      if (done) return;
      if (vid.readyState >= 2 && vid.videoWidth){
        // read the middle of the picture (where the frame is) at full detail: a dense code needs every pixel
        const side = Math.round(Math.min(vid.videoWidth, vid.videoHeight) * 0.9), sx = (vid.videoWidth - side) / 2, sy = (vid.videoHeight - side) / 2, out = Math.min(side, 1000);
        cv.width = cv.height = out; cx.drawImage(vid, sx, sy, side, side, 0, 0, out, out);
        const code = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height, {inversionAttempts:'dontInvert'});
        const m = code && code.data.match(/#r=([A-Za-z0-9_-]+)/);
        if (m){ scanStop(); msg('✓ Got it!');
          unpackReport(m[1]).then(pk => { phoneSave(pk); if (navigator.vibrate) navigator.vibrate(60); go({name:'phonerep', pack:pk}); })
            .catch(() => msg('That code could not be read. Make a new one on the iPad and try again.'));
          return; }
        if (code) msg('That is not a Page Quest report code.');
      }
      raf = requestAnimationFrame(tick);
    };
    tick();
  }).catch(e => msg(e && e.name === 'NotAllowedError' ? 'Camera access was turned off. Allow the camera for Page Quest in Settings, or use the iPhone Camera app.' : 'The camera could not start. You can also scan with the iPhone Camera app.'));
}

// ---------- The report on a grown-up's phone ----------
const PHONE_KEY = 'pagequest.reports';
function phoneReports(){ try{ return JSON.parse(localStorage.getItem(PHONE_KEY)) || []; }catch(e){ return []; } }
function phoneSave(pack){
  logMerge(pack);
  const list = phoneReports().filter(x => !(x.d === pack.d && x.r === pack.r && x.k.map(k => k.n).join() === pack.k.map(k => k.n).join()));
  list.push(Object.assign({saved: Date.now()}, pack)); list.sort((a, b) => b.d.localeCompare(a.d) || b.saved - a.saved);
  try{ localStorage.setItem(PHONE_KEY, JSON.stringify(list.slice(0, 400))); }catch(e){}
}
function packText(k, d, r){
  if (k.t) return k.t;
  const days = k.dd || [], tot = days.reduce((a, x) => a + (x.m||0), 0), start = new Date(d + 'T12:00'); start.setDate(start.getDate() - 6);
  return [`${k.n}: reading log, ${niceDate(today(start))} to ${niceDate(d)}`].concat(days.map(x => `${niceDate(x.d)}: ${x.m} min${x.al ? ` (${x.al} out loud)` : ''}. ${(x.rd||[]).length ? x.rd.map(q => q[0]).join('; ') : 'Practice passages and word games'}${x.s ? `. Speed ${x.s} words/min` : ''}`), [`Total: ${tot} minutes`]).join('\n');
}
function phoneCard(k, d, r, n){
  const b = k.b && BANDS.find(x => x.k === k.b);
  return `<div class="card" style="display:flex;flex-direction:column;gap:10px"><h2>${esc(k.a || '')} ${esc(k.n)} <span class="mut" style="font-size:1rem">Grade ${k.g}</span></h2>
    ${r === 'day' ? `<div class="row" style="gap:6px"><span class="chip">${k.m >= k.gl ? '✓ ' : ''}${k.m} of ${k.gl} min</span><span class="chip">🎤 ${k.al} min out loud</span>
      ${k.s ? `<span class="chip">⚡ ${k.s} words/min · ${b ? b.ic + ' ' + b.lab : ''}</span><span class="chip">🚀 target ${k.tg}+</span>` : ''}</div>` : ''}
    <pre class="journal">${esc(packText(k, d, r))}</pre>
    <div class="row"><button class="btn small" data-a="${A(()=>copyText(packText(k, d, r), 'pm'+n))}">Copy</button>${navigator.share ? `<button class="btn ghost small" data-a="${A(()=>shareText(packText(k, d, r), 'pm'+n))}">Share…</button>` : ''}<span id="pm${n}"></span></div></div>`;
}
function vPhoneRep(){
  const v = view, list = phoneReports();
  if (v.err){ app.innerHTML = `<h1>Reading report</h1><p class="notice">This code could not be read. Ask for a new one on the iPad.</p><button class="btn" data-a="${A(()=>go({name:'phonerep'}))}">Saved reports</button>`; return; }
  const pk = v.pack, saved = pk && list.some(x => x.d === pk.d && x.r === pk.r && x.saved && JSON.stringify(x.k) === JSON.stringify(pk.k));
  const head = `<div class="row"><button class="btn ghost small" data-a="${A(()=>{ if (location.hash) history.replaceState(null, '', location.pathname); go({name: me() ? 'hub' : 'profiles'}); })}">← Page Quest</button>${isParent(me()) ? `<button class="btn small sun" data-a="${A(()=>go({name:'scan'}))}">📷 Scan another</button>` : ''}</div>`;
  if (pk){
    const all = pk.k.map(k => packText(k, pk.d, pk.r)).join('\n\n');
    app.innerHTML = `${head}<h1>Reading report</h1>
      <div class="card row spread"><b style="font-family:var(--display);font-size:1.2rem">${pk.r === 'day' ? niceDate(pk.d, true) : `Week ending ${niceDate(pk.d)}`}</b>
        <span class="row">${saved ? '<span class="chip">✓ Saved on this phone</span>' : `<button class="btn small sun" data-a="${A(()=>{ phoneSave(pk); render(); })}">Save to this phone</button>`}
        ${list.length ? `<button class="btn ghost small" data-a="${A(()=>go({name:'phonerep'}))}">All saved (${list.length})</button>` : ''}</span></div>
      ${pk.k.length > 1 ? `<div class="row"><button class="btn small" data-a="${A(()=>copyText(all, 'pmAll'))}">Copy everyone's log</button><span id="pmAll"></span></div>` : ''}
      ${pk.k.map((k, n) => phoneCard(k, pk.d, pk.r, n)).join('')}`;
    return;
  }
  // saved reports: newest first, one row per child per day
  const rows = []; list.forEach(x => x.k.forEach(k => rows.push({d:x.d, r:x.r, k})));
  const names = [...new Set(rows.map(x => x.k.n))], who = v.who && names.includes(v.who) ? v.who : '';
  const shown = rows.filter(x => !who || x.k.n === who);
  app.innerHTML = `${head}<h1>Saved reports</h1>
    ${names.length > 1 ? `<div class="tabs"><button class="${who?'':'on'}" data-a="${A(()=>{ v.who = ''; render(); })}">Everyone</button>${names.map(nm => `<button class="${who===nm?'on':''}" data-a="${A(()=>{ v.who = nm; render(); })}">${esc(nm)}</button>`).join('')}</div>` : ''}
    ${shown.length ? shown.map((x, n) => `<p class="mut" style="margin:14px 0 -4px">${x.r === 'day' ? niceDate(x.d, true) : `Week ending ${niceDate(x.d)}`}</p>${phoneCard(x.k, x.d, x.r, n)}`).join('')
      : '<p class="mut">No reports saved yet. On each iPad, open Grown-ups → Daily reading report → 📱 Send to my phone, and scan the code with your phone camera.</p>'}
    ${list.length ? `<div class="row"><button class="btn ghost small" data-a="${A(()=>{ if (confirm('Delete all saved reports from this phone?')){ localStorage.removeItem(PHONE_KEY); render(); } })}">Delete saved reports</button></div>` : ''}`;
}
async function openReportLink(){
  const m = location.hash.match(/^#r=([A-Za-z0-9_-]+)/); if (!m) return false;
  try{ view = {name:'phonerep', pack: await unpackReport(m[1])}; }catch(e){ view = {name:'phonerep', err:true}; }
  render(); return true;
}
window.addEventListener('hashchange', () => { if (/^#r=/.test(location.hash)) openReportLink(); });

{id:'i3-01', g:3, title:`The Amazing Octopus`, icon:'🐙', topic:'animals',
text:`The octopus is one of the strangest animals in the ocean. It has eight long arms, three hearts, and blue blood. It has no bones at all. Scientists who study octopuses say they are also very smart.\n\n## A Body That Can Squeeze\nBecause an octopus has no bones, its body is soft and bendy. An octopus can squeeze through a gap as small as its beak. The beak is the only hard part of its body. This lets an octopus slip into tiny cracks between rocks. A crack makes a safe place to hide from sharks and other hunters.\n\n## Masters of Disguise\nAn octopus can change the color of its skin in less than a second. Its skin has thousands of tiny color cells. The octopus uses these cells to match the sand, rocks, or coral around it. Some octopuses can even make their skin bumpy to look like a rock. This kind of hiding is called camouflage. If a hunter still finds it, the octopus has another trick. It squirts a cloud of dark ink into the water. The ink hides the octopus while it zooms away. By the time the cloud fades, the octopus is gone.\n\n## Arms That Can Taste\nEach arm is covered with round suckers. The suckers help the octopus grab food like crabs and clams. The suckers can also taste! An octopus can touch a rock and know if there is food inside.\n\n## Clever Problem Solvers\nOctopuses are good at solving puzzles. In aquariums, some octopuses have learned to open jars to get the food inside. Others have escaped from their tanks at night. These clever animals keep surprising the people who study them.`,

{id:'i3-02', g:3, title:`Mountains of Fire`, icon:'🌋', topic:'earth and space',
text:`Deep under the ground, it is very hot. In some places, it is hot enough to melt rock. This melted rock is called magma. Magma is lighter than the solid rock around it, so it slowly rises toward the surface. A volcano is an opening in Earth's crust where magma can escape.\n\nWhen magma reaches the surface, it gets a new name. It is called lava. Lava can be hotter than 2,000 degrees Fahrenheit. Some lava is thick and moves slowly, like cold honey. Other lava is thin and runs downhill like a river. As lava cools, it hardens into new rock. Over many years, layer after layer of cooled lava can build a tall mountain.\n\nNot every eruption looks the same. Some volcanoes ooze lava gently. Others explode with a loud blast. These eruptions throw ash and rocks high into the sky. Volcanic ash is not like the soft ash from a campfire. It is made of tiny, sharp bits of rock and glass.\n\nMany volcanoes sit in a giant loop around the Pacific Ocean. This loop is called the Ring of Fire. Pieces of Earth's crust, called plates, meet there and push against each other. More than half of the world's active volcanoes are in this ring.\n\nVolcanoes can be dangerous, but they also help our planet. Over time, ash and lava break down into rich soil. Farmers near volcanoes can grow healthy crops in this soil. Volcanoes have also made new land. The islands of Hawaii were built by volcanoes rising up from the ocean floor. Scientists watch volcanoes closely so they can warn people before an eruption.`,

{t:'two', k:'key details', a:{q:`What is the difference between magma and lava?`, o:[`Lava is magma that has reached the surface.`,`Magma is much cooler than lava.`,`Lava is found only in Hawaii.`,`Magma is made of ash and glass.`]}, b:{q:`Which sentence from the passage best supports the answer to Part A?`, o:[`When magma reaches the surface, it gets a new name.`,`Lava can be hotter than 2,000 degrees Fahrenheit.`,`Many volcanoes sit in a giant loop around the Pacific Ocean.`,`Farmers near volcanoes can grow healthy crops in this soil.`]}},

{id:'i3-03', g:3, title:`The Wright Brothers Take Off`, icon:'✈️', topic:'history',
text:`For thousands of years, people watched birds and wished they could fly too. Many inventors built flying machines, but none of them worked well. Then two brothers from Dayton, Ohio, changed history.\n\nWilbur and Orville Wright owned a bicycle shop. They built and fixed bikes for their customers. Working with bicycles taught them a lot about balance, light parts, and chains. The brothers believed these lessons could help them build a flying machine.\n\nThe Wrights did not rush. First, they studied how birds steer by twisting the tips of their wings. Next, they tested gliders, which are aircraft with no engine. They also built a small wind tunnel in their shop. It was a wooden box with a fan that blew air over tiny model wings. These tests showed them which wing shapes worked best. Finally, they built an airplane with an engine and two propellers. They named it the Wright Flyer.\n\nThe brothers needed a windy place with soft sand for landing. They chose a spot near Kitty Hawk, North Carolina. On December 17, 1903, Orville climbed onto the Flyer. The engine roared, and the plane rolled along a wooden track. Then it lifted into the air! The flight lasted only 12 seconds and went about 120 feet. That is shorter than many school hallways. Still, it was the first controlled flight of a powered airplane.\n\nThe brothers took turns flying that day. On the fourth flight, Wilbur stayed in the air for 59 seconds. Today, giant jets carry millions of people around the world. Every one of those flights traces back to two patient brothers and their bicycle shop.`,
