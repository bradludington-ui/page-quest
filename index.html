{"id":"i5-01","g":5,"title":"The Race to Link a Nation","icon":"🚂","topic":"history","text":"In the 1850s, a trip from the East Coast of the United States to California was long, expensive, and often dangerous. Travelers could ride a wagon across the plains and mountains for four to six months. They could also sail around the southern tip of South America, a voyage that could take just as long. Many Americans dreamed of a faster way to connect the two sides of the country.\n\n## A Plan Becomes Law\n\nIn 1862, President Abraham Lincoln signed the Pacific Railway Act. This law gave two companies the job of building a railroad that would link the East and the West. The Central Pacific Railroad would start in Sacramento, California, and build east. The Union Pacific Railroad would start near Omaha, Nebraska, and build west. The government promised the companies land and loans for every mile of track they completed, so each company raced to lay as much track as possible.\n\n## Mountains and Plains\n\nThe two companies faced very different challenges. The Central Pacific had to cross the Sierra Nevada, a mountain range of solid granite and deep winter snow. Workers used hand drills, black powder, and later a powerful explosive called nitroglycerin to blast tunnels through the rock. Progress was sometimes measured in inches per day. Thousands of Chinese immigrants did much of this difficult and risky work, and by the end they made up most of the Central Pacific's workforce. Meanwhile, the Union Pacific crews, which included many Irish immigrants and veterans of the Civil War, crossed the wide, flat Great Plains. Their land was easier to build on, but they had to haul supplies hundreds of miles across open country.\n\nDid you know? On April 28, 1869, a Central Pacific crew laid about ten miles of track in a single day. It was an amazing record for track laid entirely by hand.\n\n## The Golden Spike\n\nOn May 10, 1869, the two lines finally met at Promontory Summit in Utah Territory. Leaders gathered for a ceremony and tapped a special golden spike into the last tie. A telegraph operator sent a one-word message to cities across the nation: \"DONE.\" Crowds celebrated in the streets of Chicago, New York, and San Francisco. Together, the two companies had laid about 1,800 miles of new track.\n\n## A Changed Nation\n\nThe railroad transformed the country almost overnight. A journey that once took months now took about a week. Goods such as fruit from California and tools made in Eastern factories could be shipped quickly and cheaply. New towns grew up along the tracks, and more settlers moved west. However, the railroad also brought hardship. It sped up the destruction of the huge buffalo herds and the loss of land for many Native American nations who had lived on the plains for generations. The Transcontinental Railroad shows how one project can bring great progress for some people and serious loss for others.","words":[["haul","to carry or pull something heavy"],["veterans","people who served in the military in the past"],["transformed","changed completely"]],"qs":[{"t":"two","k":"main idea","a":{"q":"What is the main idea of the passage?","o":["Building the Transcontinental Railroad was a huge challenge that changed travel and life across the country.","The Central Pacific was a better and faster company than the Union Pacific.","The golden spike ceremony was the most important part of building the railroad.","Travelers in the 1850s preferred sailing around South America to riding a wagon."]},"b":{"q":"Which sentence from the passage best supports the answer to Part A?","o":["The railroad transformed the country almost overnight.","Leaders gathered for a ceremony and tapped a special golden spike into the last tie.","The Union Pacific Railroad would start near Omaha, Nebraska, and build west.","They could also sail around the southern tip of South America, a voyage that could take just as long."]}},{"t":"one","k":"word parts","q":"The word \"transcontinental\" is made of the prefix \"trans-,\" which means \"across,\" and the word \"continental.\" Based on this, a transcontinental railroad is one that","o":["goes all the way across a continent","stays inside one city","travels under the ocean","was built before the continent was mapped"],"e":"The Transcontinental Railroad shows how one project can bring great progress for some people and serious loss for others."},{"t":"one","k":"vocabulary","q":"Read this sentence from the passage: \"Their land was easier to build on, but they had to haul supplies hundreds of miles across open country.\" What does the word \"haul\" mean?","o":["carry or pull something heavy","sell something for money","hide something carefully","grow food on a farm"],"e":"Their land was easier to build on, but they had to haul supplies hundreds of miles across open country."},{"t":"one","k":"text structure","q":"How does the author mainly organize the section \"Mountains and Plains\"?","o":["by comparing and contrasting the challenges the two companies faced","by listing events in time order from 1850 to 1869","by describing a problem and then one solution to it","by telling the story from one worker's point of view"],"e":"The two companies faced very different challenges."},{"t":"multi","k":"key details","n":2,"q":"Which TWO details explain why the Central Pacific's work was so slow? Choose two answers.","o":["Workers had to blast tunnels through solid granite.","The Sierra Nevada had deep winter snow.","Crews crossed the wide, flat Great Plains.","The government gave the company land and loans.","A telegraph operator sent the message \"DONE.\""]},{"t":"one","k":"author purpose","q":"Why does the author include the information about the buffalo herds and Native American nations in the last section?","o":["to show that the railroad caused loss for some people, not only progress","to explain how the railroad was built so quickly","to prove that buffalo helped workers carry supplies","to show which groups laid the most track"],"e":"However, the railroad also brought hardship."}]},

{"id":"i5-02","g":5,"title":"Cities Under the Sea","icon":"🐠","topic":"science","text":"From above, a coral reef can look like an underwater garden full of colorful rocks and plants. But a reef is neither a pile of rocks nor a garden. It is a living city built by tiny animals.\n\n## Builders the Size of a Pea\n\nEach coral is made of many soft-bodied animals called polyps. Most polyps are smaller than a pea, and they are related to jellyfish and sea anemones. A polyp has a mouth surrounded by tentacles, which it stretches out at night to catch tiny drifting creatures. To protect its soft body, each polyp builds a hard cup of limestone beneath itself. When polyps die, their stony cups remain, and new polyps grow on top of them. Over hundreds and even thousands of years, these layers pile up into enormous reefs.\n\n## A Helpful Partnership\n\nCorals could not build such large reefs alone. Inside the bodies of most reef-building polyps live tiny algae. Like plants, the algae use sunlight to make food, and they share much of that food with the coral. In return, the coral gives the algae a safe home and nutrients they need. Scientists call this kind of relationship, in which two living things help each other, symbiosis. The algae also give many corals their bright colors. Because the algae need sunlight, most reef-building corals grow in clear, shallow, warm water.\n\nDid you know? Coral reefs cover less than one percent of the ocean floor, yet scientists estimate that about one quarter of all ocean species depend on them for food or shelter.\n\n## The Largest Reef on Earth\n\nThe Great Barrier Reef, off the northeast coast of Australia, is the largest coral reef system in the world. It stretches for more than 1,400 miles and is made up of nearly 3,000 separate reefs. It is so large that astronauts can see it from space. The reef is home to thousands of kinds of fish, along with sea turtles, sharks, dolphins, and giant clams.\n\n## Reefs in Trouble\n\nToday, coral reefs face a serious problem. When ocean water stays too warm for too long, corals become stressed and push the algae out of their bodies. Without the algae, the coral turns white, a change known as coral bleaching. A bleached coral is not dead yet, but it is starving. If the water cools down soon enough, the algae can return and the coral can recover. If the heat lasts, the coral may die. Pollution and careless fishing can also harm reefs.\n\n## Protecting the Reefs\n\nPeople around the world are working to solve this problem. Scientists grow young corals in underwater nurseries and replant them on damaged reefs. Many countries protect reef areas where fishing is limited. Even visitors can help by using reef-safe sunscreen and never touching or standing on coral. Coral reefs took thousands of years to build, and protecting them helps the many creatures that call them home.","words":[["polyp","a tiny, soft ocean animal with a mouth and tentacles"],["symbiosis","a partnership in which two living things help each other"],["bleaching","turning white because color has been lost"]],"qs":[{"t":"two","k":"main idea","a":{"q":"What is the main idea of the passage?","o":["Coral reefs are living structures built by tiny animals, and they need protection to survive.","Coral reefs are piles of colorful rocks found mostly in deep, cold water.","The Great Barrier Reef is the only coral reef left in the world.","Algae are more important to the ocean than any other living thing."]},"b":{"q":"Which sentence from the passage best supports the answer to Part A?","o":["Coral reefs took thousands of years to build, and protecting them helps the many creatures that call them home.","It stretches for more than 1,400 miles and is made up of nearly 3,000 separate reefs.","The algae also give many corals their bright colors.","Most polyps are smaller than a pea, and they are related to jellyfish and sea anemones."]}},{"t":"one","k":"vocabulary","q":"Read this sentence from the passage: \"Scientists call this kind of relationship, in which two living things help each other, symbiosis.\" What does the word \"symbiosis\" mean?","o":["a partnership in which two living things help each other","a contest between two animals for food","the way a coral turns white","the process of building a limestone cup"],"e":"Scientists call this kind of relationship, in which two living things help each other, symbiosis."},{"t":"one","k":"word parts","q":"Read this sentence from the passage: \"Scientists grow young corals in underwater nurseries and replant them on damaged reefs.\" The prefix \"re-\" in \"replant\" means","o":["again","not","before","under"],"e":"Scientists grow young corals in underwater nurseries and replant them on damaged reefs."},{"t":"one","k":"text structure","q":"How is the section \"Reefs in Trouble\" mainly organized?","o":["cause and effect: it explains what happens to coral when the water gets too warm","chronological order: it lists the years when reefs were discovered","compare and contrast: it compares corals to jellyfish","description: it lists the animals that live on the Great Barrier Reef"],"e":"When ocean water stays too warm for too long, corals become stressed and push the algae out of their bodies."},{"t":"multi","k":"key details","n":2,"q":"According to the passage, which TWO things do the algae do for the coral? Choose two answers.","o":["They make food from sunlight and share it.","They give many corals their bright colors.","They build hard cups of limestone.","They catch tiny drifting creatures at night.","They keep the ocean water cool."]},{"t":"one","k":"inference","q":"Based on the passage, why is a bleached coral more likely to survive a short heat wave than a long one?","o":["The algae can come back if the water cools soon, so the coral can get food again.","Bleached coral grows a new limestone cup during a long heat wave.","A long heat wave brings more algae into the coral.","Corals only need algae during the winter."],"e":"If the water cools down soon enough, the algae can return and the coral can recover."}]},

{"id":"i5-03","g":5,"title":"How Vaccines Train Your Body","icon":"💉","topic":"science","text":"Every day, your body is under attack. Germs such as viruses and bacteria are on the things you touch, in the air you breathe, and in the food you eat. Most of the time, you never notice, because your body has a powerful defense team called the immune system.\n\n## Meet the Defenders\n\nThe immune system is made of organs, tissues, and special cells that work together to protect you. Some of its most important workers are white blood cells, which travel through your body looking for invaders. When certain white blood cells find a germ they have never seen before, they study it carefully. Then they begin making proteins called antibodies. Antibodies are shaped to fit one particular germ, the way a key fits one lock. They grab onto the germ and mark it so other cells can destroy it.\n\n## Why the First Time Is Hard\n\nThis defense works well, but it takes time. The first time your body meets a new germ, it may need a week or more to make enough of the right antibodies. During that time, the germ can multiply and make you sick. After the battle is won, however, your body keeps some memory cells. These cells remember the germ. If the same germ ever returns, the memory cells recognize it right away, and your body can fight it off so quickly that you may not get sick at all. This protection is called immunity.\n\n## Practice Without the Danger\n\nA vaccine gives your immune system a chance to practice. It contains a weakened or inactive form of a germ, or just a harmless piece of it, or instructions that teach your cells to make that harmless piece. None of these can give you the real disease, but they look enough like the germ to get the immune system's attention. Your body makes antibodies and memory cells, just as it would during a real infection. Later, if the actual germ appears, your immune system is already prepared. Sometimes a person feels a sore arm or a little tired after a vaccine. That is usually a sign that the immune system is busy practicing.\n\nDid you know? The word \"vaccine\" comes from \"vacca,\" the Latin word for cow. In 1796, a doctor named Edward Jenner showed that people who had caught a mild illness called cowpox from cows were protected from smallpox, a much more dangerous disease.\n\n## Protecting a Whole Community\n\nVaccines protect more than one person. When most people in a community are immune to a disease, the germ has trouble spreading from person to person. This helps protect people who cannot get certain vaccines, such as newborn babies. Thanks to vaccines used around the world, smallpox was completely wiped out. In 1980, world health leaders announced that the disease no longer existed anywhere in nature.","words":[["antibodies","proteins the body makes to grab onto and mark germs"],["immunity","protection from getting sick with a certain disease"],["multiply","to increase in number"]],"qs":[{"t":"two","k":"main idea","a":{"q":"What is the main idea of the passage?","o":["Vaccines help the immune system practice so it can fight a germ quickly later.","White blood cells are the only part of the immune system that matters.","Edward Jenner discovered how white blood cells are made.","Germs can be found in food, in the air, and on objects."]},"b":{"q":"Which sentence from the passage best supports the answer to Part A?","o":["A vaccine gives your immune system a chance to practice.","Germs such as viruses and bacteria are on the things you touch, in the air you breathe, and in the food you eat.","Antibodies are shaped to fit one particular germ, the way a key fits one lock.","This helps protect people who cannot get certain vaccines, such as newborn babies."]}},{"t":"one","k":"vocabulary","q":"Read this sentence from the passage: \"During that time, the germ can multiply and make you sick.\" What does the word \"multiply\" mean?","o":["increase in number","become weaker","leave the body","change its shape"],"e":"During that time, the germ can multiply and make you sick."},{"t":"one","k":"word parts","q":"In the passage, a vaccine may contain an \"inactive\" form of a germ. The prefix \"in-\" in \"inactive\" means","o":["not","again","very","before"],"e":"It contains a weakened or inactive form of a germ, or just a harmless piece of it, or instructions that teach your cells to make that harmless piece."},{"t":"one","k":"text structure","q":"How do the sections \"Why the First Time Is Hard\" and \"Practice Without the Danger\" work together?","o":["The first describes a problem, and the second explains how vaccines help solve it.","The first lists events in time order, and the second lists more events.","The first compares two diseases, and the second compares two doctors.","The first tells a story about a sick child, and the second gives her advice."],"e":"This defense works well, but it takes time."},{"t":"multi","k":"key details","n":2,"q":"According to the passage, which TWO things does the body make after getting a vaccine? Choose two answers.","o":["antibodies","memory cells","germs that cause the real disease","cowpox","new organs"]},{"t":"one","k":"inference","q":"Based on the passage, why might a person who had a vaccine not get sick when the real germ appears?","o":["Memory cells recognize the germ right away, so the body fights it off quickly.","The vaccine removes every germ from the body forever.","The real germ cannot enter the body of a person who had a vaccine.","A sore arm keeps the germ from spreading."],"e":"If the same germ ever returns, the memory cells recognize it right away, and your body can fight it off so quickly that you may not get sick at all."}]},

{"id":"i5-04","g":5,"title":"Robot Explorers on Mars","icon":"🚀","topic":"earth and space","text":"Mars is our neighbor in space, but it is never closer than about 34 million miles away. No person has ever stood on its rusty red surface. Still, scientists have explored Mars for decades by sending robot geologists called rovers.\n\n## Driving From Millions of Miles Away\n\nDriving a rover is not like steering a remote-control car. A radio signal from Earth can take up to about twenty minutes to reach Mars, so engineers cannot react to a rock or a cliff in the moment. Instead, they plan each day's drive carefully and send a list of commands. Newer rovers also use cameras and computers to choose a safe path on their own. This careful approach is necessary because there is no repair shop on Mars. Each Martian day, called a sol, is about 40 minutes longer than a day on Earth, so the team's work schedule slowly shifts.\n\n## A Rover Timeline\n\n- 1997: Sojourner, a rover about the size of a microwave oven, rolls off the Mars Pathfinder lander.\n- 2004: The twin rovers Spirit and Opportunity land on opposite sides of Mars.\n- 2012: Curiosity, a rover as large as a car, lands in Gale Crater.\n- 2021: Perseverance lands in Jezero Crater, carrying a small helicopter named Ingenuity.\n\n## Lasting Longer Than Expected\n\nSpirit and Opportunity were designed to work for about 90 days. Dust on their solar panels was expected to block the sunlight they needed for power. Instead, Martian winds sometimes blew the panels clean. Spirit kept working for about six years. Opportunity lasted almost fifteen years and drove more than 28 miles, farther than a marathon. Along the way, the twins found rocks and minerals that could only have formed in water. This evidence suggested that Mars was once a much wetter place.\n\n## Bigger Rovers, Bigger Questions\n\nCuriosity and Perseverance do not use solar panels. They run on power from a nuclear battery, which keeps working through dust storms and Martian winters. Each one carries a full science laboratory. Curiosity drilled into rocks and found chemicals that living things need, showing that ancient Mars could have supported tiny life forms. Perseverance is searching for signs that such life really existed. It is also collecting rock samples in sealed tubes, which scientists hope a future mission will bring back to Earth for study.\n\nLanding such heavy rovers was a challenge of its own. Engineers designed a rocket-powered platform called a sky crane that hovered above the ground and gently lowered Curiosity on cables. Perseverance landed the same way in 2021.\n\nDid you know? In April 2021, Ingenuity became the first aircraft to make a powered, controlled flight on another planet. Flying was difficult because the air on Mars is about one percent as thick as the air on Earth.\n\n## Why Explore Mars?\n\nRovers help answer one of the biggest questions people have ever asked: Are we alone in the universe? Even if the answer is no, every discovery teaches us more about how planets change over time, including our own. The rovers also test tools that may someday help human astronauts explore Mars safely.","words":[["geologist","a scientist who studies rocks and the ground"],["evidence","facts or clues that show something is true"],["mission","an important trip or job with a goal"]],"qs":[{"t":"two","k":"main idea","a":{"q":"Which statement best tells the central idea of the passage?","o":["Rovers have let scientists explore Mars and learn whether it could ever have supported life.","Rovers are easy to drive because they respond to commands right away.","Ingenuity is the most important machine ever sent to Mars.","Mars is too far away for scientists to learn anything about it."]},"b":{"q":"Which sentence from the passage best supports the answer to Part A?","o":["Rovers help answer one of the biggest questions people have ever asked: Are we alone in the universe?","Instead, Martian winds sometimes blew the panels clean.","Sojourner, a rover about the size of a microwave oven, rolls off the Mars Pathfinder lander.","Driving a rover is not like steering a remote-control car."]}},{"t":"one","k":"word parts","q":"The root \"geo\" comes from a Greek word. In the word \"geologists,\" what does \"geo\" most likely mean?","o":["earth or ground","water","sky","life"],"e":"Still, scientists have explored Mars for decades by sending robot geologists called rovers."},{"t":"one","k":"vocabulary","q":"Read this sentence from the passage: \"Instead, they plan each day's drive carefully and send a list of commands.\" What does the word \"commands\" mean?","o":["orders or instructions","photographs of rocks","spare machine parts","questions to answer"],"e":"Instead, they plan each day's drive carefully and send a list of commands."},{"t":"one","k":"text structure","q":"How does the author organize the section \"Driving From Millions of Miles Away\"?","o":["by explaining a problem and how engineers solve it","by listing the rovers in time order","by comparing Mars with Earth's moon","by describing one rover's daily schedule"],"e":"A radio signal from Earth can take up to about twenty minutes to reach Mars, so engineers cannot react to a rock or a cliff in the moment."},{"t":"multi","k":"text evidence","n":2,"q":"Which TWO details support the idea that Mars was once wetter or could have supported life? Choose two answers.","o":["The twin rovers found rocks and minerals that could only have formed in water.","Curiosity found chemicals in Martian rocks that living things need.","Martian winds sometimes blew dust off the solar panels.","Perseverance runs on power from a nuclear battery.","The air on Mars is about one percent as thick as the air on Earth."]},{"t":"one","k":"author purpose","q":"Why does the author include the fact that the air on Mars is about one percent as thick as the air on Earth?","o":["to explain why flying Ingenuity was so difficult","to show why rovers need solar panels","to prove that people could breathe on Mars","to explain why radio signals travel slowly"],"e":"Flying was difficult because the air on Mars is about one percent as thick as the air on Earth."}]},

{"id":"i5-05","g":5,"title":"The Secret Codebreakers","icon":"🔐","topic":"history","text":"During World War II, thousands of messages flew through the air every day as radio signals. Armies and navies did not want their enemies to understand these messages, so they turned them into secret codes. A code might replace each word with a group of numbers or scramble letters in a complicated pattern. Breaking these codes could reveal where ships were heading or what supplies were running low. To do this enormous job, the United States and Great Britain turned to an unexpected group of experts: thousands of young women.\n\n## Secret Letters\n\nIn 1941 and 1942, the United States Navy and Army began searching for people who were skilled at math, languages, and puzzles. Navy officials sent secret letters to women at colleges, asking just two questions: Did they like crossword puzzles, and were they engaged to be married? The Army also recruited schoolteachers from small towns across the country. More than 10,000 American women eventually worked as codebreakers. Many of them worked in Washington, D.C., or at Arlington Hall, a former girls' school in Virginia. Some college women took a secret codebreaking course during their last year of school, mailing their practice work to the Navy, before reporting for duty after graduation.\n\n## Patient Puzzle Solvers\n\nCodebreaking was slow, careful work. A code is a little like a lock, and the codebreakers' job was to find the key. Because messages arrived day and night, the women often worked in shifts around the clock. The women sorted through stacks of intercepted messages, searching for patterns. If a group of numbers appeared again and again, it might stand for a common word, such as the name of a ship. Little by little, these clues helped them figure out how a code worked. Some women operated large machines that tested thousands of possible settings. Their discoveries helped military leaders make better decisions and helped bring the war to an end sooner.\n\n## A Pioneer Before the War\n\nOne woman had been breaking codes for years before the war began. Elizebeth Smith Friedman started studying secret messages in 1916. In the 1920s and 1930s, she worked with the United States Coast Guard and cracked thousands of coded messages sent by smugglers. During World War II, her small team decoded messages used by spy rings in South America, helping officials uncover the spies.\n\nDid you know? In Great Britain, about three out of every four people who worked at Bletchley Park, the country's top-secret codebreaking center, were women.\n\n## Silence for Decades\n\nEvery codebreaker took a vow of secrecy. The women could not tell their parents, their friends, or even the people they later married what they had done during the war. Many said only that they had answered phones or done office work. For decades, their stories stayed hidden in locked government files. Only after the records were finally released, many years later, did the public begin to learn how important these women had been. Today, historians recognize them as heroes whose sharp minds helped change history.","words":[["intercepted","caught before reaching the person it was meant for"],["recruited","asked people to join a group or do a job"],["vow","a serious promise"]],"qs":[{"t":"two","k":"inference","a":{"q":"Why did Navy officials most likely ask women whether they liked crossword puzzles?","o":["Enjoying puzzles suggested a person might be good at finding patterns in codes.","The Navy wanted to hire people to write newspaper puzzles.","Crossword puzzles were used to send secret messages to ships.","Officials wanted to know how college students spent their free time."]},"b":{"q":"Which sentence from the passage best supports the answer to Part A?","o":["The women sorted through stacks of intercepted messages, searching for patterns.","Many of them worked in Washington, D.C., or at Arlington Hall, a former girls' school in Virginia.","Every codebreaker took a vow of secrecy.","Elizebeth Smith Friedman started studying secret messages in 1916."]}},{"t":"one","k":"main idea","q":"What is the main idea of the passage?","o":["Thousands of women did important, secret codebreaking work during World War II that stayed hidden for many years.","Elizebeth Smith Friedman was the only woman who broke codes during World War II.","Codebreaking machines did all of the work during World War II.","Most codebreakers in World War II were schoolteachers who answered phones."],"e":"Today, historians recognize them as heroes whose sharp minds helped change history."},{"t":"one","k":"vocabulary","q":"Read this sentence from the passage: \"The women sorted through stacks of intercepted messages, searching for patterns.\" What does the word \"intercepted\" mean?","o":["caught before reaching the person they were meant for","written in pencil by the women","sent by the women to their families","thrown away because they were useless"],"e":"The women sorted through stacks of intercepted messages, searching for patterns."},{"t":"one","k":"word parts","q":"Read this sentence from the passage: \"During World War II, her small team decoded messages used by spy rings in South America, helping officials uncover the spies.\" The prefix \"de-\" in \"decoded\" means","o":["to undo or reverse","to do again","to do before","to do together"],"e":"During World War II, her small team decoded messages used by spy rings in South America, helping officials uncover the spies."},{"t":"one","k":"text structure","q":"How does the author organize the first paragraph of the passage?","o":["by describing a problem (secret codes) and then the solution (hiring codebreakers)","by comparing American codebreakers with British codebreakers","by listing events in time order from 1916 to 1945","by explaining the effects of keeping a secret"],"e":"To do this enormous job, the United States and Great Britain turned to an unexpected group of experts: thousands of young women."},{"t":"multi","k":"key details","n":2,"q":"Which TWO details show that the codebreakers' work was kept secret? Choose two answers.","o":["Many said only that they had answered phones or done office work.","Their stories stayed hidden in locked government files for decades.","The Army recruited schoolteachers from small towns.","Some women operated large machines.","Friedman cracked thousands of messages sent by smugglers."]}]},

{"id":"i5-06","g":5,"title":"Water Bears: Tiny and Tough","icon":"🔬","topic":"science","text":"If you could shrink down and wander through a clump of damp moss, you might meet one of the toughest animals on Earth. It has eight stubby legs, tiny claws, and a round, wrinkled body. It moves with a slow, lumbering walk, like a bear in a cartoon. Scientists call it a tardigrade, but most people know it by its nickname, the water bear.\n\n## Tiny but Everywhere\n\nMost tardigrades are less than one millimeter long, smaller than a grain of salt, so you need a microscope to see one clearly. Scientists have described more than 1,000 kinds of tardigrades. They live almost everywhere, from mountaintops to the deep sea, and from tropical rain forests to the ice of Antarctica. Many live in the thin film of water that coats moss and lichens. There, they eat plant cells, algae, and even other tiny animals. Young tardigrades hatch from eggs and grow by shedding their outer skin, much as insects do.\n\nDid you know? A German scientist first described these creatures in 1773 and called them \"little water bears.\" A few years later, an Italian scientist named them tardigrades, from Latin words meaning \"slow stepper.\"\n\n## The Tun Trick\n\nA tardigrade's most amazing ability appears when its home dries out. Instead of dying, it pulls in its head and legs and curls into a dry, shriveled ball called a tun. It loses almost all of the water in its body, and its body processes slow down until they nearly stop. In this state, a tardigrade can survive conditions that would destroy most living things. When water returns, the tardigrade soaks it up, uncurls, and begins walking again, sometimes within an hour. A tardigrade can stay in this state for years.\n\n## Tested to the Limits\n\nScientists have tested tardigrades in tuns under extreme conditions. Tuns have survived being frozen to temperatures far colder than any place on Earth. They have survived being heated above the boiling point of water for a short time. In 2007, researchers even sent tuns into space on a satellite and exposed them to the empty vacuum outside. When the tardigrades returned to Earth and were given water, some of them came back to life. In another study, scientists revived tardigrades that had been frozen in a sample of Antarctic moss for about 30 years. Scientists have discovered part of the secret. As a tardigrade dries out, it makes special proteins that surround the parts of its cells and form a protective, glass-like material. Another protein helps shield its DNA, the instructions inside every cell, from damage caused by radiation.\n\n## Not Quite Superheroes\n\nTardigrades are not truly unbeatable, however. An active tardigrade, full of water and walking around, is fragile and can be harmed easily. Their survival skills mostly work when they are dried out, and even then, long periods of extreme heat can kill them. Scientists study tardigrades to learn how their cells stay protected. Someday, these discoveries might help people store medicines without refrigerators or protect astronauts on long space journeys.","words":[["lumbering","moving in a slow, heavy, clumsy way"],["fragile","easily broken or hurt"],["revived","brought back to life or activity"]],"qs":[{"t":"two","k":"main idea","a":{"q":"What is the central idea of the passage?","o":["Tardigrades are tiny animals that can survive extreme conditions by drying out into a tun.","Tardigrades are dangerous animals that hunt in the deep sea.","Tardigrades can survive anything, even while they are active.","Tardigrades were first discovered by astronauts in space."]},"b":{"q":"Which sentence from the passage best supports the answer to Part A?","o":["In this state, a tardigrade can survive conditions that would destroy most living things.","Many live in the thin film of water that coats moss and lichens.","Scientists have described more than 1,000 kinds of tardigrades.","It moves with a slow, lumbering walk, like a bear in a cartoon."]}},{"t":"one","k":"vocabulary","q":"Read this sentence from the passage: \"An active tardigrade, full of water and walking around, is fragile and can be harmed easily.\" What does the word \"fragile\" mean?","o":["easily broken or hurt","very fast","very hungry","strong and tough"],"e":"An active tardigrade, full of water and walking around, is fragile and can be harmed easily."},{"t":"one","k":"word parts","q":"The word \"tardigrade\" comes from Latin words meaning \"slow stepper.\" Which word shares the word part \"tard,\" meaning \"slow\"?","o":["tardy","target","tandem","tablet"],"e":"A few years later, an Italian scientist named them tardigrades, from Latin words meaning \"slow stepper.\""},{"t":"one","k":"text structure","q":"How is the section \"The Tun Trick\" mainly organized?","o":["cause and effect: it explains what a tardigrade does when its home dries out and what happens next","compare and contrast: it compares tardigrades with real bears","chronological order: it lists discoveries from 1773 to 2007","problem and solution: it explains how scientists protect tardigrades"],"e":"A tardigrade's most amazing ability appears when its home dries out."},{"t":"multi","k":"key details","n":2,"q":"According to the passage, which TWO extreme conditions have tardigrades in tuns survived? Choose two answers.","o":["the empty vacuum of space","temperatures far colder than any place on Earth","being heated above boiling for many years","living without water while walking around","being crushed by a falling rock"]},{"t":"one","k":"author purpose","q":"Why does the author include the section \"Not Quite Superheroes\"?","o":["to correct the idea that tardigrades cannot be harmed at all","to explain how tardigrades find their food","to describe the places where tardigrades live","to persuade readers to keep tardigrades as pets"],"e":"Tardigrades are not truly unbeatable, however."}]},

{"id":"i5-07","g":5,"title":"Louis Braille: Reading by Touch","icon":"👆","topic":"biography","text":"Run your fingertip across the buttons in an elevator, and you might feel small raised dots beside the numbers. Those dots are braille, a system that allows people who are blind to read and write by touch. It was invented by a teenager who refused to accept that books were out of reach.\n\n## A Childhood Accident\n\nLouis Braille was born in 1809 in Coupvray, a small village near Paris, France. His father made leather harnesses and saddles for horses. When Louis was three years old, he was hurt in an accident in his father's workshop, and an infection spread to both of his eyes. By the age of five, he was completely blind. Louis was bright and curious, and his family was determined that he would get an education.\n\n## Books Too Heavy to Hold\n\nAt age ten, Louis won a place at the Royal Institute for Blind Youth in Paris. The school owned only a few books for its students. Each one was printed with large raised letters that readers traced with their fingers. The books were enormous and heavy, and reading them was painfully slow because each letter took time to recognize. Students also had no simple way to write anything down for themselves.\n\n## Learning From Night Writing\n\nIn 1821, a former army captain named Charles Barbier visited the school. He showed the students a system he called night writing. It used patterns of raised dots so soldiers could share messages in the dark without lighting a lamp. Louis was excited, but he quickly saw its problems. Barbier's system used up to twelve dots for a single sound, which was too large to feel with one fingertip, and it had no punctuation or numbers.\n\n## A Cell of Six Dots\n\nLouis spent the next three years experimenting, often working late into the night. By 1824, when he was only fifteen, he had created a much simpler code. Each letter fit into a small rectangle, called a cell, with room for just six dots arranged in two columns of three. Because a cell was small enough to feel all at once, readers could move their fingers smoothly across a line. Louis later added symbols for numbers, punctuation, and even music.\n\nDid you know? Six dots can be arranged in 63 different patterns, which is enough for every letter of the alphabet plus numbers, punctuation marks, and some short words.\n\n## A Lasting Gift\n\nLouis Braille became a teacher at the institute, where his students loved his system. Surprisingly, some school leaders resisted it at first and preferred the old raised letters. Louis died in 1852 at age 43. Two years later, France officially adopted his code. Today, braille is used in countries all over the world, and his invention has given millions of people the independence to read and write on their own.","words":[["determined","having a strong wish to do something and not giving up"],["resisted","fought against or refused to accept"],["independence","the ability to do things without help from others"]],"qs":[{"t":"two","k":"inference","a":{"q":"Which word best describes Louis Braille, based on the passage?","o":["determined","careless","shy","impatient"]},"b":{"q":"Which sentence from the passage best supports the answer to Part A?","o":["Louis spent the next three years experimenting, often working late into the night.","His father made leather harnesses and saddles for horses.","The school owned only a few books for its students.","Louis died in 1852 at age 43."]}},{"t":"one","k":"main idea","q":"What is the main idea of the passage?","o":["Louis Braille created a system of raised dots that made it much easier for blind people to read and write.","Louis Braille was a soldier who sent messages in the dark.","Charles Barbier invented the braille alphabet used today.","The Royal Institute for Blind Youth had the largest library in France."],"e":"It was invented by a teenager who refused to accept that books were out of reach."},{"t":"one","k":"vocabulary","q":"Read this sentence from the passage: \"Today, braille is used in countries all over the world, and his invention has given millions of people the independence to read and write on their own.\" What does the word \"independence\" mean?","o":["the ability to do things without help from others","a holiday celebrated in France","a book printed with raised letters","the need to ask others for help"],"e":"Today, braille is used in countries all over the world, and his invention has given millions of people the independence to read and write on their own."},{"t":"one","k":"text structure","q":"How does the author organize most of the passage?","o":["in chronological order, following events in Louis Braille's life","by comparing braille with printed letters in every section","by listing causes of blindness and their effects","by asking questions and then answering them"],"e":"By 1824, when he was only fifteen, he had created a much simpler code."},{"t":"multi","k":"key details","n":2,"q":"Which TWO problems did Louis see with Barbier's night writing? Choose two answers.","o":["It used too many dots to feel with one fingertip.","It had no punctuation or numbers.","It could only be read in daylight.","It was printed in enormous, heavy books.","It was written in a foreign language."]},{"t":"one","k":"author purpose","q":"Why does the author begin the passage by describing the dots beside elevator buttons?","o":["to show readers that braille is part of everyday life today","to explain how elevators were invented","to prove that Louis Braille built elevators","to warn readers not to touch elevator buttons"],"e":"Those dots are braille, a system that allows people who are blind to read and write by touch."}]},

{"id":"i5-08","g":5,"title":"The Science of Lightning","icon":"⚡","topic":"earth and space","text":"A summer afternoon grows dark as a towering cloud rolls in. Suddenly, a jagged streak of light splits the sky, and a few seconds later, thunder booms. Lightning can seem mysterious, but scientists have learned a great deal about how this powerful spark forms.\n\n## Building Up a Charge\n\nLightning begins inside a tall storm cloud called a cumulonimbus. Strong winds called updrafts carry water droplets high into the cloud, where they freeze. Tiny ice crystals rise while heavier pellets of soft hail fall, and the two bump and rub against each other millions of times. These collisions separate electric charges. Lighter, positively charged particles collect near the top of the cloud, and negatively charged particles gather near the bottom. The ground below the storm becomes positively charged.\n\n## The Path of a Lightning Bolt\n\nOpposite charges attract each other, and eventually the attraction becomes too strong to hold back. First, a faint, branching channel of negative charge called a stepped leader zigzags down from the cloud. As it gets close to the ground, a streamer of positive charge reaches up from a tall object, such as a tree or a building. When the two connect, a giant current races up the channel in a fraction of a second. This return stroke is the bright flash we see. Most lightning, however, never touches the ground at all. It jumps between different parts of the same cloud or from one cloud to another.\n\n## Where Thunder Comes From\n\nA lightning bolt heats the air around it to about 50,000 degrees Fahrenheit, which is roughly five times hotter than the surface of the sun. The heated air expands so suddenly that it creates a powerful shock wave. That shock wave is the sound we hear as thunder. Since light travels much faster than sound, we see the flash before we hear the boom. To estimate how far away a storm is, count the seconds between the flash and the thunder and divide by five. The answer is the distance in miles.\n\nDid you know? Lightning flashes about 40 to 50 times every second somewhere on Earth. That adds up to more than a billion flashes each year.\n\n## Franklin's Famous Experiment\n\nIn 1752, Benjamin Franklin flew a kite during a storm to show that lightning is a form of electricity. His experiment was extremely dangerous, and no one should ever repeat it. Franklin used what he learned to invent the lightning rod, a metal pole that guides electricity safely into the ground. Lightning rods still protect many buildings today.\n\n## Staying Safe\n\nLightning can strike miles away from the center of a storm, so a good rule to remember is \"When thunder roars, go indoors.\" A building with plumbing and wiring, or a car with a hard metal roof, offers good shelter. Stay inside until about thirty minutes after the last thunder. Understanding lightning helps people enjoy its beauty while staying safe.","words":[["collisions","crashes or bumps between things"],["attract","to pull toward"],["estimate","to make a careful guess about an amount"]],"qs":[{"t":"two","k":"main idea","a":{"q":"What is the main idea of the passage?","o":["Lightning forms when electric charges build up in a storm cloud, and understanding it helps people stay safe.","Benjamin Franklin was the first person ever to see lightning.","Thunder is more dangerous than lightning because it is so loud.","Lightning only happens on summer afternoons."]},"b":{"q":"Which sentence from the passage best supports the answer to Part A?","o":["Understanding lightning helps people enjoy its beauty while staying safe.","Lightning rods still protect many buildings today.","A summer afternoon grows dark as a towering cloud rolls in.","The answer is the distance in miles."]}},{"t":"one","k":"vocabulary","q":"Read this sentence from the passage: \"These collisions separate electric charges.\" What does the word \"collisions\" mean?","o":["crashes or bumps between things","storms that last a long time","bright colors in the sky","loud sounds after a flash"],"e":"These collisions separate electric charges."},{"t":"one","k":"text structure","q":"How is the section \"The Path of a Lightning Bolt\" organized?","o":["in sequence, describing the steps that happen as a bolt forms","by comparing lightning with thunder","by describing a problem and how Franklin solved it","by listing safety rules in order of importance"],"e":"First, a faint, branching channel of negative charge called a stepped leader zigzags down from the cloud."},{"t":"multi","k":"key details","n":2,"q":"Which TWO statements about lightning are supported by the passage? Choose two answers.","o":["Most lightning never touches the ground.","A lightning bolt is hotter than the surface of the sun.","Sound travels faster than light.","Lightning only strikes the center of a storm.","Lightning rods pull storms toward buildings."]},{"t":"one","k":"inference","q":"Maya sees a flash of lightning and counts 10 seconds before she hears the thunder. Based on the passage, about how far away is the storm?","o":["about 2 miles","about 10 miles","about 5 miles","about 50 miles"],"e":"To estimate how far away a storm is, count the seconds between the flash and the thunder and divide by five."},{"t":"one","k":"author purpose","q":"Why does the author write that Franklin's experiment \"was extremely dangerous, and no one should ever repeat it\"?","o":["to warn readers not to try flying a kite in a storm","to show that Franklin was a careless scientist","to explain how a kite makes electricity","to persuade readers that lightning rods do not work"],"e":"His experiment was extremely dangerous, and no one should ever repeat it."}]},

{"id":"i5-09","g":5,"title":"The Great Monarch Journey","icon":"🦋","topic":"science","text":"Every fall, something remarkable happens across North America. Millions of orange and black monarch butterflies leave their summer homes in Canada and the United States and begin flying south. Some will travel as far as 3,000 miles to reach a small area of mountain forest in central Mexico. No butterfly on the journey has ever made the trip before, yet each one somehow finds its way.\n\n## A Special Generation\n\nMost monarch butterflies live only about two to six weeks as adults. The monarchs that hatch in late summer, however, are different. They are a special generation that can live for about eight months. Instead of laying eggs right away, they store fat in their bodies and prepare for the long flight. Scientists sometimes call them the super generation because their lives last so much longer than the lives of their parents and grandparents.\n\n## Finding the Way\n\nHow does a butterfly smaller than your hand find a forest it has never seen? Scientists have discovered that monarchs use the sun as a compass. A kind of internal clock, partly located in their antennae, helps them adjust for the sun's changing position throughout the day. Research also suggests that monarchs can sense Earth's magnetic field, which may help them on cloudy days. Riding warm rising air, a monarch can glide long distances while saving energy.\n\n## Winter in the Mountains\n\nBy early November, the monarchs arrive in the fir forests high in the mountains of central Mexico. There, millions of butterflies cluster together on the tree branches, covering them so thickly that the branches sometimes bend under their weight. The cool mountain air keeps the butterflies resting quietly, so they use very little energy, while the forest shelters them from freezing temperatures and rain.\n\n## The Journey North\n\nIn early spring, the monarchs leave Mexico and fly north. When they reach the southern United States, they lay their eggs on milkweed plants and then die. Milkweed is the only plant monarch caterpillars eat. Their children continue the journey north, and it takes three or four generations to reach Canada again. Then, at the end of summer, a new super generation begins the cycle once more.\n\nDid you know? Milkweed contains a bitter poison that does not hurt monarch caterpillars. The poison stays in their bodies, which makes both the caterpillars and the adult butterflies taste terrible to birds.\n\n## Helping the Monarchs\n\nThe number of monarchs has dropped sharply in recent decades. Many fields where milkweed once grew have been cleared for farms, roads, and buildings, and parts of the winter forests have been cut down. Extreme weather can also harm the butterflies during their journey. To solve this problem, people are planting milkweed and other flowers in gardens, schoolyards, and parks. Mexico has also protected many of the forests where monarchs spend the winter. With help, this amazing journey can continue for generations to come.","words":[["generation","all the living things born at about the same time"],["cluster","to gather closely together in a group"],["remarkable","unusual and worth noticing"]],"qs":[{"t":"two","k":"inference","a":{"q":"Based on the passage, why do the late-summer monarchs store fat instead of laying eggs right away?","o":["They need energy for a long flight and many months of winter.","They are too young to lay eggs until they reach Canada.","All of the milkweed has already been eaten by late summer.","Stored fat helps them sense Earth's magnetic field."]},"b":{"q":"Which sentence from the passage best supports the answer to Part A?","o":["Instead of laying eggs right away, they store fat in their bodies and prepare for the long flight.","Most monarch butterflies live only about two to six weeks as adults.","Milkweed is the only plant monarch caterpillars eat.","Scientists have discovered that monarchs use the sun as a compass."]}},{"t":"one","k":"main idea","q":"What is the main idea of the passage?","o":["Monarch butterflies make an amazing migration that takes several generations and needs people's help to continue.","Monarch butterflies live in Mexico all year long.","Milkweed is the most important plant in North America.","Monarch butterflies use maps to find their way to Canada."],"e":"With help, this amazing journey can continue for generations to come."},{"t":"one","k":"vocabulary","q":"Read this sentence from the passage: \"There, millions of butterflies cluster together on the tree branches, covering them so thickly that the branches sometimes bend under their weight.\" What does the word \"cluster\" mean?","o":["gather closely in a group","fly away quickly","lay their eggs","change their color"],"e":"There, millions of butterflies cluster together on the tree branches, covering them so thickly that the branches sometimes bend under their weight."},{"t":"one","k":"text structure","q":"How is the section \"Helping the Monarchs\" organized?","o":["problem and solution","chronological order","compare and contrast","question and answer"],"e":"To solve this problem, people are planting milkweed and other flowers in gardens, schoolyards, and parks."},{"t":"multi","k":"key details","n":2,"q":"According to the passage, which TWO things help monarchs find their way? Choose two answers.","o":["the position of the sun","Earth's magnetic field","the smell of milkweed","maps learned from their parents","the sounds of other butterflies"]},{"t":"one","k":"text features","q":"What is the purpose of the \"Did you know?\" paragraph?","o":["to give an extra fact about how milkweed protects monarchs from birds","to explain how monarchs find their way south","to list the places where monarchs spend the winter","to tell readers how to plant milkweed"],"e":"The poison stays in their bodies, which makes both the caterpillars and the adult butterflies taste terrible to birds."}]},

{"id":"i5-10","g":5,"title":"From Boneshakers to Bikes","icon":"🚲","topic":"technology","text":"Today, a bicycle seems like a simple machine: two wheels, a frame, pedals, and a chain. But it took inventors about seventy years of experimenting, and many bumps and bruises, to arrive at the design most people ride today.\n\n## A Bicycle Timeline\n\n- 1817: Karl Drais of Germany builds a wooden \"running machine\" with no pedals.\n- 1860s: Pedals attached to the front wheel appear in France.\n- 1870s: High-wheel bicycles with giant front wheels become popular.\n- 1885: The Rover safety bicycle, with two same-size wheels and a chain, is built in England.\n- 1888: John Boyd Dunlop invents a practical air-filled rubber tire.\n\n## Walking While Sitting Down\n\nThe first bicycle-like machine had no pedals at all. Riders sat on a wooden frame between two wheels and pushed against the ground with their feet, as if walking while sitting down. In England, people nicknamed it the \"dandy horse.\" On a smooth road, a rider could glide faster than a person on foot. Unfortunately, most roads at the time were rough and muddy, so the invention was more of a fad than a practical way to travel.\n\n## Pedals and Boneshakers\n\nIn the 1860s, inventors in France attached pedals directly to the front wheel. Now riders could keep their feet off the ground. These machines had heavy iron frames and wooden wheels wrapped in iron, so every bump in the road shook the rider. People gave them a fitting nickname: boneshakers.\n\n## The Daring High Wheel\n\nBuilders soon realized that a bigger front wheel would travel farther with each turn of the pedals. Before long, some front wheels were five feet tall, while the back wheel was tiny. These high-wheel bicycles were fast, but riding one took skill and courage. The rider sat high above the front wheel, and hitting a stone could send him tumbling over the handlebars. In England, these bicycles were later nicknamed \"penny-farthings,\" because the big and small wheels looked like a large penny coin beside a tiny farthing coin. Because they were risky, high wheels were ridden mostly by daring young men.\n\n## The Safety Bicycle Changes Everything\n\nThe solution came in 1885 with the Rover, called a safety bicycle. Its two wheels were nearly the same size, and the pedals turned a chain connected to the back wheel. A rider's feet could easily reach the ground. Just a few years later, air-filled rubber tires made the ride far smoother. Suddenly, cycling was safe and comfortable enough for almost anyone.\n\nDid you know? In the 1890s, bicycles gave many women a new kind of freedom to travel on their own. The women's rights leader Susan B. Anthony said that the bicycle had done more to free women than anything else in the world.\n\n## Still Rolling\n\nThe bicycle boom of the 1890s led to smoother roads and new businesses. Bicycle makers also developed tools and ideas, such as ball bearings and lightweight steel tubes, that were later used in cars and airplanes. Two brothers in Dayton, Ohio, named Wilbur and Orville Wright even ran a bicycle shop before they built their first airplane. More than a century later, the basic design of the safety bicycle has hardly changed.","words":[["fad","something that is popular for only a short time"],["practical","useful and sensible in real life"],["daring","brave and willing to take risks"]],"qs":[{"t":"two","k":"main idea","a":{"q":"What is the main idea of the passage?","o":["The bicycle went through many designs until the safety bicycle made riding safe for almost everyone.","The high-wheel bicycle was the safest bicycle ever built.","Karl Drais invented the chain, pedals, and rubber tires all at once.","Bicycles were only popular for a few years in the 1890s."]},"b":{"q":"Which sentence from the passage best supports the answer to Part A?","o":["Suddenly, cycling was safe and comfortable enough for almost anyone.","These machines had heavy iron frames and wooden wheels wrapped in iron, so every bump in the road shook the rider.","Two brothers in Dayton, Ohio, named Wilbur and Orville Wright even ran a bicycle shop before they built their first airplane.","On a smooth road, a rider could glide faster than a person on foot."]}},{"t":"one","k":"text features","q":"According to the timeline, which invention came right after the high-wheel bicycle became popular?","o":["the Rover safety bicycle","the wooden running machine","pedals on the front wheel","the air-filled rubber tire"],"e":"1885: The Rover safety bicycle, with two same-size wheels and a chain, is built in England."},{"t":"one","k":"vocabulary","q":"Read this sentence from the passage: \"Unfortunately, most roads at the time were rough and muddy, so the invention was more of a fad than a practical way to travel.\" What does the word \"fad\" mean?","o":["something popular for only a short time","a kind of muddy road","a tool that is very useful","a long and difficult trip"],"e":"Unfortunately, most roads at the time were rough and muddy, so the invention was more of a fad than a practical way to travel."},{"t":"one","k":"text structure","q":"How do the sections \"The Daring High Wheel\" and \"The Safety Bicycle Changes Everything\" work together?","o":["The first describes a problem, and the second explains its solution.","The first compares two bicycles, and the second compares two more.","The first gives a cause, and the second gives an unrelated fact.","Both sections list events from 1817 to 1888."],"e":"The solution came in 1885 with the Rover, called a safety bicycle."},{"t":"multi","k":"key details","n":2,"q":"Which TWO features made the Rover safer than the high-wheel bicycle? Choose two answers.","o":["Its two wheels were nearly the same size.","A rider's feet could easily reach the ground.","Its front wheel was five feet tall.","Its pedals were attached to the front wheel.","It had no pedals at all."]},{"t":"one","k":"inference","q":"Based on the passage, why did the boneshaker get its nickname?","o":["Its iron frame and iron-wrapped wheels made every bump shake the rider.","It was built to carry bones and other heavy loads.","Riders shook hands with each other before racing.","Its giant front wheel made riders fall over the handlebars."],"e":"These machines had heavy iron frames and wooden wheels wrapped in iron, so every bump in the road shook the rider."}]},

{"id":"i5-11","g":5,"title":"Clinton's Big Ditch","title2":"The Canal That Built a City","icon":"🛶","topic":"history","text":"In the early 1800s, the United States had a problem. Farmers in the growing lands west of the Appalachian Mountains had plenty of wheat and corn, but getting those crops to cities on the East Coast was slow and costly. Wagons bounced over muddy roads for weeks. New York's governor, DeWitt Clinton, believed he had the answer: a canal stretching 363 miles across the state, from the Hudson River at Albany to Lake Erie at Buffalo.\n\nMany people thought the idea was foolish. Thomas Jefferson called a canal of that size \"little short of madness.\" Critics mocked the plan as \"Clinton's Ditch.\" They pointed out that the country had very few trained engineers and that the route had to climb about 570 feet from the Hudson River to Lake Erie. Thick forests, swamps, and solid rock stood in the way. The project would cost about seven million dollars, an enormous sum at the time.\n\nClinton refused to give up. Digging began on July 4, 1817. Workers, including many Irish immigrants and local farmers, cleared trees and dug with shovels, picks, and horse-drawn plows. Because few American engineers existed, the builders learned as they went, and the canal itself became a training school for a new generation of engineers. To lift boats up and down the hills, they built 83 locks, which are chambers that raise or lower boats by filling or draining water. At Lockport, workers built five locks in a row, like a giant water staircase, to climb a steep ridge.\n\nAfter eight years of hard work, the canal opened on October 26, 1825. The doubters had been proven wrong.","text2":"When the Erie Canal opened in 1825, it changed trade in America almost immediately. Before the canal, shipping one ton of goods from Buffalo to New York City cost about 100 dollars and could take weeks. On the canal, the same ton could travel for about 10 dollars. Boats pulled by mules walking along a path beside the water carried flour, grain, lumber, and salt east, and they carried tools, cloth, and new settlers west.\n\nNew York City gained the most. Goods from the Great Lakes region now flowed down the canal and the Hudson River to its harbor, where many were loaded onto ships bound for Europe. The canal was only about 40 feet wide and 4 feet deep at first, but it carried so much traffic that it was later made wider and deeper. The city's harbor became busier than ever, and New York grew into the nation's greatest center of trade. Small villages along the canal, such as Rochester and Syracuse, grew into booming cities.\n\nThe canal also paid for itself. Boats paid tolls to use it, and the money collected covered the cost of building it within about ten years. Seeing this success, other states rushed to dig canals of their own.\n\nTo celebrate the opening, Governor Clinton traveled by boat from Buffalo to New York City. When he arrived, he poured a barrel of water from Lake Erie into the Atlantic Ocean. People called the ceremony the \"Wedding of the Waters.\" It was a fitting name, because the canal had joined the West and the East.\n\nRailroads later carried much of the canal's traffic, but by then the Erie Canal had already done its most important job. It had shown the country that a bold public project could pay off.","words":[["critics","people who say what they think is wrong with something"],["locks","water chambers that raise or lower boats"],["tolls","fees paid for using a road, bridge, or canal"]],"qs":[{"t":"two","k":"main idea","a":{"q":"What is the main idea of \"Clinton's Big Ditch\"?","o":["Even though many people doubted it, New Yorkers built the Erie Canal across difficult land.","Thomas Jefferson designed and paid for the Erie Canal.","The Erie Canal made shipping goods cost about 10 dollars a ton.","Farmers preferred wagons on muddy roads to boats on a canal."]},"b":{"q":"Which sentence from \"Clinton's Big Ditch\" best supports the answer to Part A?","o":["The doubters had been proven wrong.","Wagons bounced over muddy roads for weeks.","Digging began on July 4, 1817.","Thick forests, swamps, and solid rock stood in the way."]}},{"t":"one","k":"vocabulary","q":"Read this sentence from \"The Canal That Built a City\": \"Boats paid tolls to use it, and the money collected covered the cost of building it within about ten years.\" What does the word \"tolls\" mean?","o":["fees paid for using a road, bridge, or canal","ropes used to pull boats","workers who dug the canal","gifts given at a ceremony"],"e":"Boats paid tolls to use it, and the money collected covered the cost of building it within about ten years."},{"t":"one","k":"text structure","q":"How is \"The Canal That Built a City\" mainly organized?","o":["cause and effect: it explains the results of the canal's opening","chronological order: it tells how the canal was dug, year by year","problem and solution: it explains how engineers were trained","compare and contrast: it compares Lake Erie with the Atlantic Ocean"],"e":"When the Erie Canal opened in 1825, it changed trade in America almost immediately."},{"t":"multi","k":"key details","n":2,"q":"According to \"Clinton's Big Ditch,\" which TWO challenges did the canal builders face? Choose two answers.","o":["The country had very few trained engineers.","The route had to climb about 570 feet.","Mules refused to pull the boats.","Railroads had already taken most of the traffic.","Lake Erie was too shallow for boats."]},{"t":"one","k":"compare texts","q":"How is the focus of \"The Canal That Built a City\" different from the focus of \"Clinton's Big Ditch\"?","o":["The first text focuses on doubts about the canal and the work of building it, while the second focuses on what the canal changed after it opened.","The first text focuses on railroads, while the second focuses on wagons.","The first text says the canal failed, while the second says it succeeded.","The first text is about Lake Erie, while the second is about the Hudson River only."],"e":"When the Erie Canal opened in 1825, it changed trade in America almost immediately."},{"t":"one","k":"author purpose","q":"Which statement best explains the author's purpose and point of view in \"The Canal That Built a City\"?","o":["to show that the canal was a wise project that brought great benefits","to argue that the canal was a waste of money that helped no one","to persuade readers that railroads were always better than canals","to explain why canals were too slow to be useful for trade"],"e":"It had shown the country that a bold public project could pay off."}]},

{"id":"i5-12","g":5,"title":"Twelve Seconds at Kitty Hawk","title2":"Learning From the Birds","icon":"✈️","topic":"biography","text":"On the morning of December 17, 1903, a cold wind swept across the sand dunes near Kitty Hawk, North Carolina. Two brothers from Dayton, Ohio, Wilbur and Orville Wright, had spent weeks preparing for this moment. Only five local men had come to watch. One of them stood beside a camera that Orville had set up, ready to snap a picture.\n\nThe brothers' machine, which they called the Flyer, had two long wings covered in cloth, a small gasoline engine, and two propellers. They had built the engine with help from their mechanic, Charlie Taylor, because no company could sell them one that was both light and powerful enough. Orville lay flat on the lower wing, at the controls, while Wilbur ran alongside to steady a wingtip.\n\nAt about 10:35 in the morning, the Flyer rolled along a wooden rail and rose into the air. It stayed up for 12 seconds and traveled about 120 feet before landing in the sand. It was a short hop, but it was the first time a powered airplane carrying a pilot had taken off on its own power and flown under control.\n\nThe brothers took turns and made three more flights that day. On the last one, Wilbur flew 852 feet in 59 seconds. Soon after, a gust of wind flipped the parked Flyer over and damaged it, and it never flew again. The photograph from that morning, showing the Flyer just lifting off, became one of the most famous pictures in history. Few newspapers reported the news correctly at first, and many people did not believe it until the brothers flew in public a few years later.","text2":"Wilbur and Orville Wright never went to college, but they thought like careful scientists. Before they ever built an airplane, they ran a bicycle shop in Dayton, Ohio. Bicycles taught them an important lesson: a rider stays upright by constantly balancing and steering. The brothers believed a flying machine would need the same kind of control. In 1899, Wilbur even wrote to the Smithsonian Institution, asking for everything it had published about flight.\n\nIn the 1890s, other inventors were focused mainly on building powerful engines. The Wrights thought the biggest problem was something else. How could a pilot keep a machine balanced in shifting winds? To find out, Wilbur watched birds. He noticed that a bird twists the tips of its wings to turn and to keep its balance. One day, while twisting an empty cardboard box in his hands, he realized that airplane wings could be twisted in a similar way. The brothers called this idea wing warping.\n\nThey tested their ideas step by step. First they flew a large kite. Then, from 1900 to 1902, they built and flew gliders at Kitty Hawk, where steady winds and soft sand made testing safer. When their early gliders did not lift as much as expected, they built a wind tunnel in their shop and tested about 200 small wing shapes. Their careful measurements helped them design much better wings. They also kept notes and photographs of their tests, so they could learn from each mistake.\n\nBy the time they added an engine in 1903, the Wrights had already solved the problem of control. Their patient, step-by-step approach is a big reason they succeeded where others had failed.","words":[["propeller","a set of spinning blades that pushes a machine forward"],["glider","an aircraft with wings but no engine"],["approach","a way of doing something"]],"qs":[{"t":"two","k":"main idea","a":{"q":"What is the main idea of \"Learning From the Birds\"?","o":["The Wright brothers succeeded because they solved the problem of control through careful study and testing.","The Wright brothers invented the first bicycle in Dayton, Ohio.","Birds taught the Wright brothers how to build powerful engines.","The Wright brothers' first glider flew perfectly on its first try."]},"b":{"q":"Which sentence from \"Learning From the Birds\" best supports the answer to Part A?","o":["Their patient, step-by-step approach is a big reason they succeeded where others had failed.","Before they ever built an airplane, they ran a bicycle shop in Dayton, Ohio.","First they flew a large kite.","In the 1890s, other inventors were focused mainly on building powerful engines."]}},{"t":"one","k":"vocabulary","q":"Read this sentence from \"Twelve Seconds at Kitty Hawk\": \"Orville lay flat on the lower wing, at the controls, while Wilbur ran alongside to steady a wingtip.\" What does the word \"steady\" mean in this sentence?","o":["hold still and balanced","paint a bright color","push away quickly","measure carefully"],"e":"Orville lay flat on the lower wing, at the controls, while Wilbur ran alongside to steady a wingtip."},{"t":"one","k":"text structure","q":"How is \"Twelve Seconds at Kitty Hawk\" mainly organized?","o":["in chronological order, following the events of one day","by comparing bicycles and airplanes","by describing a problem and several solutions","by listing facts about birds"],"e":"At about 10:35 in the morning, the Flyer rolled along a wooden rail and rose into the air."},{"t":"multi","k":"key details","n":2,"q":"According to \"Learning From the Birds,\" which TWO ways did the Wright brothers test their ideas before 1903? Choose two answers.","o":["They built and flew gliders at Kitty Hawk.","They tested about 200 wing shapes in a wind tunnel.","They flew passengers across the ocean.","They bought a powerful engine from a company.","They raced their bicycles against birds."]},{"t":"one","k":"compare texts","q":"How are the two texts different?","o":["\"Twelve Seconds at Kitty Hawk\" tells about one day of flights, while \"Learning From the Birds\" explains the years of work that led to that day.","\"Twelve Seconds at Kitty Hawk\" is about bicycles, while \"Learning From the Birds\" is about engines.","\"Twelve Seconds at Kitty Hawk\" says the first flight failed, while \"Learning From the Birds\" says it worked.","Both texts only describe how Wilbur watched birds."],"e":"By the time they added an engine in 1903, the Wrights had already solved the problem of control."},{"t":"one","k":"author purpose","q":"What is the author's main purpose in \"Twelve Seconds at Kitty Hawk\"?","o":["to describe the events of the day of the first powered flight","to persuade readers to become pilots","to explain how a wind tunnel works","to compare airplanes with bicycles"],"e":"It stayed up for 12 seconds and traveled about 120 feet before landing in the sand."}]}
