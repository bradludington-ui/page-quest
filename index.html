<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page Quest</title>
<meta name="description" content="A reading game: warm up on tricky words, read each page out loud, answer a question to move on, and earn treasure.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Page Quest">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef4fb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1724" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Lexend:wght@400;500;600&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%} body{margin:0} img{max-width:100%}
/* Layout: one centred column (max 760px) per screen; the reading page is a plain, high-contrast card with large Lexend type. */
:root{
  --bg:#eef4fb; --panel:#ffffff; --ink:#1b2638; --mut:#55627a; --line:#d4dfec; --soft:#e4ecf8;
  --accent:#2a5bd7; --accent-ink:#ffffff; --sun:#e9a614; --sun-soft:#fff3cf; --good:#1c8f5a; --good-soft:#d8f2e4;
  --oops:#d24a2f; --oops-soft:#fde3dc; --mark:#ffe680; --path:#b9c9de;
  --display:"Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --read:"Lexend", "Verdana", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1724; --panel:#17233a; --ink:#eef3fb; --mut:#a8b5ca; --line:#2b3a57; --soft:#1f2d48;
  --accent:#86a8ff; --accent-ink:#0f1724; --sun:#f6c24a; --sun-soft:#3b3214; --good:#52d495; --good-soft:#163d2b;
  --oops:#ff8a70; --oops-soft:#46221b; --mark:#6b5a12; --path:#3a4c6d; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1724; --panel:#17233a; --ink:#eef3fb; --mut:#a8b5ca; --line:#2b3a57; --soft:#1f2d48;
  --accent:#86a8ff; --accent-ink:#0f1724; --sun:#f6c24a; --sun-soft:#3b3214; --good:#52d495; --good-soft:#163d2b;
  --oops:#ff8a70; --oops-soft:#46221b; --mark:#6b5a12; --path:#3a4c6d; color-scheme:dark }
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--read);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 48px;-webkit-tap-highlight-color:transparent}
#app{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:2.3rem} h2{font-size:1.6rem} h3{font-size:1.25rem}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:10px 22px;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-family:var(--display);font-weight:700;font-size:1.2rem;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000)}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:var(--soft);color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn.sun{background:var(--sun);color:#2b1d00;box-shadow:0 3px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.btn.small{min-height:40px;padding:6px 14px;font-size:1rem;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.spread{justify-content:space-between}
.card{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:20px}
.mut{color:var(--mut)}
.coins{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-weight:800;font-size:1.25rem;background:var(--sun-soft);padding:4px 14px;border-radius:999px;font-variant-numeric:tabular-nums}
.coin{width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe48a,var(--sun) 60%,#b77d00);display:inline-block;flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:999px;background:var(--soft);font-size:.85rem;font-weight:600}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.topbar .grow{flex:1;min-width:0}
.avatar{width:56px;height:56px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:2rem;flex:none}
.xp{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin-top:6px}
.xp>i{display:block;height:100%;background:var(--good);border-radius:99px}
.brand{font-family:var(--display);font-weight:800;font-size:2.6rem;letter-spacing:.5px;color:var(--accent);line-height:1}
.brand small{display:block;font-size:1rem;color:var(--mut);font-weight:600;letter-spacing:0}

/* profiles */
.who{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}
.who button{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px 12px;display:flex;flex-direction:column;align-items:center;gap:6px}
.who .big{font-size:3rem;line-height:1}
.who b{font-family:var(--display);font-size:1.4rem}
.pick{display:flex;gap:8px;flex-wrap:wrap}
.pick button{min-width:56px;min-height:56px;border-radius:16px;background:var(--soft);font-size:1.7rem;border:3px solid transparent}
.pick button.on{border-color:var(--accent);background:var(--panel)}
.pick.words button{font-size:1.05rem;font-weight:600;padding:0 16px}
input[type=text]{font:inherit;font-size:1.3rem;padding:12px 16px;border-radius:14px;border:2px solid var(--line);background:var(--panel);color:var(--ink);width:100%}
label.lab{font-weight:600;display:block;margin-bottom:6px}

/* hub */
.vault{background:linear-gradient(135deg,var(--sun-soft),var(--panel));border-color:var(--sun)}
.map{width:100%;height:auto;display:block}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.tile{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:16px;text-align:left;display:flex;gap:12px;align-items:center}
.tile .ic{font-size:2.2rem}
.tile b{font-family:var(--display);font-size:1.25rem;display:block}

/* library */
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{padding:8px 16px;border-radius:999px;background:var(--soft);font-weight:600;min-height:44px}
.tabs button.on{background:var(--ink);color:var(--bg)}
.books{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.book{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.book .ic{font-size:2.6rem;line-height:1}
.book b{font-family:var(--display);font-size:1.2rem;line-height:1.2}
.book .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.stars{color:var(--sun);letter-spacing:2px;font-size:1.1rem}
.new{border-style:dashed;border-color:var(--accent)}

/* warm-up */
.tw{display:flex;flex-direction:column;gap:12px}
.twrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.syl{font-family:var(--read);font-size:1.7rem;font-weight:500;padding:8px 14px;border-radius:12px;background:var(--soft);min-height:56px}
.syl.lit{background:var(--good-soft);color:var(--good)}
.twdone{font-family:var(--read);font-size:1.7rem;font-weight:600;color:var(--good)}

/* reader */
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;background:var(--soft);border:2px solid var(--line)}
.dots i.done{background:var(--good);border-color:var(--good)}
.dots i.now{background:var(--accent);border-color:var(--accent)}
.passage{font-family:var(--read);font-size:calc(var(--fs,1) * 1.6rem);line-height:2;word-spacing:.12em;letter-spacing:.01em}
.lv5 .passage{font-size:calc(var(--fs,1) * 1.4rem)}
.w{border-radius:6px;padding:1px 2px;cursor:pointer;transition:background .15s}
.w.read{background:var(--good-soft)}
.w.now{background:var(--mark);box-shadow:0 3px 0 var(--sun)}
.w.ev{background:var(--mark)}
.modes{display:flex;gap:8px;flex-wrap:wrap}
.modes button{padding:8px 14px;border-radius:12px;background:var(--soft);font-weight:600;min-height:44px}
.modes button.on{background:var(--accent);color:var(--accent-ink)}
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.speed{display:flex;align-items:center;gap:8px}
.speed input{width:140px;accent-color:var(--accent)}
.result{background:var(--good-soft);border-radius:16px;padding:14px 16px;font-weight:500}
.notice{background:var(--sun-soft);border-radius:16px;padding:12px 16px}
.pop{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);border:2px solid var(--accent);border-radius:20px;padding:14px 18px;box-shadow:0 10px 30px rgba(0,0,0,.25);z-index:20;max-width:calc(100% - 32px);display:flex;flex-direction:column;gap:10px;align-items:center}
.pop .syls{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.listen{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--good)}
.listen i{width:12px;height:12px;border-radius:50%;background:var(--oops);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.3}}

/* question */
.q{font-family:var(--display);font-size:1.6rem;line-height:1.25}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{text-align:left;padding:16px 18px;border-radius:16px;background:var(--soft);border:2px solid var(--line);font-size:1.2rem;font-weight:500;min-height:60px}
.opt.right{background:var(--good-soft);border-color:var(--good)}
.opt.wrong{background:var(--oops-soft);border-color:var(--oops);opacity:.7}
.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.skill{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;font-weight:600;color:var(--mut)}

/* sequence */
.slots{display:flex;flex-direction:column;gap:8px}
.slot{min-height:54px;border:2px dashed var(--line);border-radius:14px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:1.1rem}
.slot.full{border-style:solid;border-color:var(--good);background:var(--good-soft)}
.slot .n{font-family:var(--display);font-weight:800;color:var(--mut);width:22px}

/* shop */
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:12px}
.item{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.item .big{font-size:2.6rem;line-height:1.1}
.item.own{border-color:var(--good);background:var(--good-soft)}
.shelf{display:flex;flex-wrap:wrap;gap:6px;font-size:2rem;min-height:48px;padding:10px;border-radius:16px;background:var(--soft)}

/* celebrate */
.float{position:fixed;left:50%;top:40%;transform:translate(-50%,0);font-family:var(--display);font-weight:800;font-size:2.4rem;color:var(--sun);text-shadow:0 2px 0 rgba(0,0,0,.2);pointer-events:none;animation:up 1.1s ease-out forwards;z-index:30}
@keyframes up{to{transform:translate(-50%,-120px);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:25}
.big-emoji{font-size:4rem;line-height:1}

/* grown-ups */
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.bar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;min-width:80px}
.bar>i{display:block;height:100%;background:var(--accent)}
.tablewrap{overflow-x:auto}
a{color:var(--accent)}
@media (max-width:520px){h1{font-size:1.9rem}.brand{font-size:2.1rem}.passage{line-height:1.85}}

/* arcade */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.gtile{background:var(--panel);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:8px;min-width:0}
.gtile p{flex:0}
.gtile .row{margin-top:auto}
.gcanvas{width:100%;display:block;border-radius:18px;background:var(--soft);touch-action:none}
.sslots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.sslot{min-width:72px;min-height:60px;border:3px dashed var(--line);border-radius:14px;display:grid;place-items:center;font-family:var(--read);font-size:1.7rem;font-weight:600;padding:0 10px}
.sslot.full{border-style:solid;border-color:var(--good);background:var(--good-soft);color:var(--good)}
.chunks{display:flex;justify-content:center;gap:10px;flex-wrap:wrap}
.chunks .syl{font-size:2rem;min-width:84px;min-height:68px;background:var(--panel);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.mcard{aspect-ratio:4/5;border-radius:16px;background:var(--accent);color:var(--accent-ink);font-size:2.4rem;display:grid;place-items:center;box-shadow:0 3px 0 color-mix(in srgb,var(--accent) 60%,#000);padding:4px;min-width:0}
.mcard.open{background:var(--panel);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.mcard.word.open{font-family:var(--read);font-size:1.15rem;font-weight:600;overflow-wrap:normal;word-break:normal;white-space:nowrap;overflow:hidden}
@media (max-width:520px){.mcard.word.open{zoom:.85}}
.mcard.got{background:var(--good-soft);border-color:var(--good)}
.mcard.long.open{font-family:var(--read);font-size:clamp(.78rem,2.1vw,1rem);font-weight:500;line-height:1.3;padding:8px}
.mgrid.five{grid-template-columns:repeat(5,1fr)}
@media (max-width:700px){.mgrid.five{grid-template-columns:repeat(4,1fr)}}
@media (max-width:520px){.mgrid.five{grid-template-columns:repeat(3,1fr)}}
@media (max-width:520px){.mgrid{grid-template-columns:repeat(3,1fr)}}
.chip.school{background:var(--sun-soft)}
.w.ptitle{font-weight:600}

/* quest, gym, chapters, retell */
.quest{border-color:var(--accent)}
.ring{display:flex;align-items:center;gap:8px;font-size:.85rem;line-height:1.2}
.qlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.qitem{display:flex;align-items:center;gap:12px;text-align:left;padding:12px 14px;border-radius:14px;background:var(--soft);border:2px solid var(--line);font-weight:600;min-height:52px}
.qitem.done{background:var(--good-soft);border-color:var(--good);opacity:.85}
.qcheck{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;flex:none;color:var(--good);font-weight:800;background:var(--panel)}
.qitem.done .qcheck{border-color:var(--good)}
.gchart{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;align-items:end;height:170px;padding:0 10px}
.gbar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.gbar i{display:block;width:60%;min-height:4px;background:var(--accent);border-radius:10px 10px 4px 4px}
.gbar b{font-family:var(--display);font-size:1.3rem;font-variant-numeric:tabular-nums}
.gbar span{color:var(--mut);font-size:.85rem}
.w.err{background:var(--oops-soft);color:var(--oops);text-decoration:line-through}
.keys{display:flex;flex-wrap:wrap;gap:8px}
.kchip{padding:8px 14px;border-radius:999px;background:var(--soft);border:2px dashed var(--line);font-weight:600;min-width:64px;text-align:center}
.kchip.on{background:var(--good-soft);border:2px solid var(--good);color:var(--good)}
.def{flex-basis:100%;color:var(--mut);font-size:1.05rem;padding-left:4px}
.wparts{display:flex;align-items:center;justify-content:center;gap:8px;flex-wrap:wrap}
.wparts .plus{font-family:var(--display);font-size:1.8rem;color:var(--mut)}
.opt.chap{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.chapbook{border-color:var(--accent)}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:110px;margin-top:10px}
.wday{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;font-size:.8rem}
.wday i{display:block;width:70%;min-height:3px;background:var(--path);border-radius:6px 6px 2px 2px}
.wday i.met{background:var(--good)}
.wday span{color:var(--mut)}
.install{border-color:var(--sun);background:var(--sun-soft)}
.isteps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:6px;line-height:1.45}
.pcode{width:100%;min-height:90px;font:inherit;font-size:.85rem;padding:10px;border-radius:12px;border:2px solid var(--line);background:var(--panel);color:var(--ink)}
.journal{white-space:pre-wrap;font-family:var(--read);font-size:.95rem;line-height:1.55;background:var(--soft);border-radius:14px;padding:14px;margin:0;user-select:text;-webkit-user-select:text}
.rlist{display:flex;flex-direction:column;gap:10px;margin-top:8px}
.ritem{display:flex;gap:12px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:14px}
.plist{margin:6px 0 0;padding-left:1.3em;display:flex;flex-direction:column;gap:4px}
.hballoons{font-size:2.2rem;text-align:center;letter-spacing:2px;min-height:2.8rem}
.hballoons .popped{opacity:.45;font-size:1.5rem}
.havatar{font-size:3rem;text-align:center;line-height:1}
.hclue{text-align:center;font-size:1.2rem}
.hslots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.hslot{width:2.2rem;height:2.8rem;border-bottom:4px solid var(--ink);font-family:var(--read);font-size:1.8rem;font-weight:600;display:grid;place-items:center;text-transform:lowercase}
.hslot.miss{color:var(--oops)}
.hkeys{display:grid;grid-template-columns:repeat(9,1fr);gap:6px}
.hkey{min-height:48px;border-radius:12px;background:var(--panel);border:2px solid var(--line);font-family:var(--read);font-size:1.3rem;font-weight:600;box-shadow:0 3px 0 var(--line)}
.hkey.hit{background:var(--good-soft);border-color:var(--good);color:var(--good);box-shadow:none}
.hkey.miss{background:var(--soft);color:var(--mut);opacity:.5;box-shadow:none}
@media (max-width:520px){.hkeys{grid-template-columns:repeat(7,1fr)}.hslot{width:1.7rem;font-size:1.4rem}}
.w.fw{text-decoration:underline dotted var(--sun);text-decoration-thickness:3px;text-underline-offset:5px}
.w.unclear{background:var(--sun-soft);text-decoration:underline wavy var(--sun);text-underline-offset:5px}
.fwchip{background:var(--sun-soft);border:1px solid var(--sun)}
.breakhost{position:relative;width:100%;border-radius:22px;overflow:hidden;background:var(--panel);border:2px solid var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.btile{text-align:left;align-items:flex-start}
.btile h3{font-family:var(--display)}
.breakgrid.locked .btile{opacity:.5}
.tile.bopen{border-color:var(--good);background:var(--good-soft)}
.ghost *{fill:none!important;stroke:var(--mut)!important;stroke-width:1.2!important;stroke-dasharray:3 3;opacity:.55}
.ghost text{display:none}
.tshelf{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.tbuild{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px;border-radius:16px;background:var(--soft);font-weight:600;font-size:.85rem}
.tbuild.complete{background:var(--sun-soft);box-shadow:0 0 0 2px var(--sun) inset}
.builds{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
.bcard{display:flex;gap:14px;align-items:flex-start}
.bcard.complete{border-color:var(--sun);background:var(--sun-soft)}
.bpic{flex:none;background:var(--soft);border-radius:16px;padding:6px}
.plist2{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.plist2 .btn{white-space:nowrap}
.chip.got{background:var(--good-soft);color:var(--good)}
@media (max-width:520px){.builds{grid-template-columns:1fr}.bcard{flex-direction:column;align-items:center}}
.abar{height:12px;border-radius:99px;background:var(--soft);overflow:hidden;flex-basis:100%}

{id:'pancake',title:'The Pancake That Rolled Away',icon:'🥞',cat:'fun',lvl:3,

 pages:[
 {t:'Gus the goat loved music. Every day he listened to the town band practice in the park. The drums went boom. The horns went toot. Gus wanted to play too, but he did not have an instrument. All he could do was say "Maaa!" very loudly. Nobody thought that was music.',
  q:'What did Gus want to do?',o:['Play in the band','Eat the drums','Take a nap'],e:'Gus wanted to play too',k:'detail'},
 {t:'One day the band got ready for the big summer parade. Then Max, the drummer, slipped on a banana peel. He hurt his wrist and could not play. "Oh no," said the band leader. "A parade without drums is too quiet. What will we do?" Gus trotted over and tapped the drum with his hoof.',
  q:'Why couldn\'t Max play the drums?',o:['He hurt his wrist','He was asleep','He lost his drum'],e:'He hurt his wrist and could not play.',k:'detail'},
 {t:'Tap, tap, BOOM! Gus kept a perfect beat. The band leader\'s mouth fell open. "That goat has rhythm!" she said. The band let Gus practice with them all week. He learned to play loud and soft, fast and slow. He only ate one drumstick, and it was an accident.',
  q:'What does "That goat has rhythm" mean?',o:['Gus can keep a good beat','Gus is very hungry','Gus runs fast'],e:'Gus kept a perfect beat.',k:'vocabulary'},
 {t:'On the day of the parade, Gus marched at the front of the band. The crowd cheered and clapped. At the end of the song, Gus lifted his head and shouted, "Maaa!" This time, everyone cheered even louder. The band leader gave Gus a shiny medal. He wore it every single day.',
  q:'How did the crowd feel about Gus?',o:['They loved him','They were angry','They wanted to go home'],e:'The crowd cheered and clapped.',k:'inference'}],
 seq:['Gus listened to the band in the park.','Max slipped on a banana peel.','Gus practiced with the band.','Gus marched in the parade.']},

{id:'dot',title:'Dot the Dragon and the Dark',icon:'🐉',cat:'fun',lvl:3,
 tricky:[['breathe','breathe'],['whispered','whis-pered'],['lantern','lan-tern'],['shadows','shad-ows']],
 pages:[
 {t:'Dot was a young dragon who could breathe fire, fly over mountains, and lift a whole tree. But Dot had a secret. She was afraid of the dark. Every night she hid under her blanket in the cave. "Real dragons are brave," she whispered. "What is wrong with me?"',
  q:'What was Dot\'s secret?',o:['She was afraid of the dark','She could not breathe fire','She did not like trees'],e:'She was afraid of the dark.',k:'detail'},
 {t:'One night, a storm knocked out all the lights in the village below. The people could not see their way home. A little boy named Theo was lost in the woods. His mother called his name again and again. Dot heard her from the cave. Her wings shook. The woods were very, very dark.',
  q:'Why were Dot\'s wings shaking?',o:['She was scared of the dark woods','She was cold from the rain','She was getting ready to dance'],e:'The woods were very, very dark.',k:'inference'},
 {t:'Dot took a deep breath. Then she flew into the woods and blew a small, gentle flame. The flame glowed like a lantern. Shadows jumped and danced, but nothing scary came out. Soon Dot heard crying. She found Theo sitting under a tall pine tree.',
  q:'Why did Dot blow a small, gentle flame?',o:['To light the way like a lantern','To burn down the trees','To cook her dinner'],e:'The flame glowed like a lantern.',k:'inference'},
 {t:'Theo climbed onto Dot\'s back, and she carried him home. The whole village cheered. "You are the bravest dragon ever," said Theo\'s mother. Dot smiled. She learned that being brave does not mean you are never scared. It means you help even when you are.',
  q:'What did Dot learn?',o:['Being brave means helping even when you are scared','Dragons are never scared','The dark is always fun'],e:'It means you help even when you are.',k:'main idea'}],
 seq:['Dot hid under her blanket at night.','A storm knocked out the lights.','Dot found Theo under a pine tree.','Dot carried Theo home.']},

{id:'rex',title:'Robot Rex Goes to School',icon:'🤖',cat:'fun',lvl:3,
 tricky:[['blinking','blink-ing'],['classroom','class-room'],['carefully','care-ful-ly'],['perfectly','per-fect-ly']],
 pages:[
 {t:'Rex was a robot dog built by Ms. Park\'s class. He had wheels instead of legs and two blinking lights for eyes. On the first day, Rex rolled into the classroom and said, "Beep! Good morning!" The kids laughed and clapped. Rex was going to be their class helper.',
  q:'Who built Rex?',o:['Ms. Park\'s class','A toy store','A scientist'],e:'Rex was a robot dog built by Ms. Park\'s class.',k:'detail'},
 {t:'Rex tried very hard to help. He passed out papers, but he gave each kid five pages instead of one. He watered the plant, but he used a whole bucket. The floor was soaked! Rex\'s lights blinked slowly. "Beep," he said quietly. "I am not a good helper."',
  q:'How did Rex feel after the floor got soaked?',o:['Sad','Excited','Silly'],e:'Rex\'s lights blinked slowly.',k:'inference'},
 {t:'A girl named Ava sat down next to Rex. "Everyone makes mistakes when they are learning," she said. "Let\'s practice together." Ava showed Rex how to count papers, one for each desk. She showed him how much water a plant needs. Rex listened carefully and tried again.',
  q:'What did Ava teach Rex?',o:['How to count papers and water the plant','How to roll faster','How to say good morning'],e:'Ava showed Rex how to count papers, one for each desk.',k:'detail'},
 {t:'By Friday, Rex was the best class helper in the whole school. He handed out papers perfectly. He watered the plant with just one small cup. The class gave him a sticker that said "Super Helper." Rex\'s lights blinked fast and bright. "Beep beep!" he said. That meant thank you.',
  q:'What do Rex\'s fast, bright lights show?',o:['He is happy','He is broken','He is sleepy'],e:'Rex\'s lights blinked fast and bright.',k:'inference'}],
 seq:['Rex rolled into the classroom.','Rex soaked the floor.','Ava helped Rex practice.','The class gave Rex a sticker.']},

{id:'earhart',title:'Amelia Earhart: Wings Over the Ocean',icon:'✈️',cat:'people',lvl:5,
 tricky:[['adventure','ad-ven-ture'],['expensive','ex-pen-sive'],['Atlantic','At-lan-tic'],['navigator','nav-i-ga-tor']],
 pages:[
 {t:'Amelia Earhart was born in 1897 in Kansas. As a girl, she did not like to sit still. She collected bugs, climbed trees, and once built a homemade roller coaster that started on the roof of a tool shed. In those days, many people believed girls should be quiet and stay close to home. Amelia did not agree. She kept a scrapbook of newspaper stories about women who did jobs usually done by men. She wanted adventures of her own.',
  q:'What does the roller coaster tell you about young Amelia?',o:['She was daring and creative','She was afraid of heights','She liked to stay indoors'],e:'once built a homemade roller coaster that started on the roof of a tool shed',k:'inference'},
 {t:'In 1920, Amelia rode in an airplane for the first time, at an air show in Long Beach, California. The ride lasted about ten minutes. "By the time I had got two or three hundred feet off the ground," she later wrote, "I knew I had to fly." Flying lessons were expensive, so Amelia worked several jobs to pay for them, including truck driver and photographer. Within two years, she bought her first plane. It was bright yellow, and she named it The Canary.',
  q:'How did Amelia pay for flying lessons?',o:['She worked several jobs','Her school paid for them','She won a contest'],e:'Amelia worked several jobs to pay for them',k:'detail'},
 {t:'On May 20, 1932, Amelia took off alone from an island near Canada to fly across the Atlantic Ocean. The trip was dangerous. Ice formed on her wings, and one of her instruments stopped working. She flew through storms in the dark for hours. About fifteen hours later, she landed in a cow pasture in Northern Ireland. A surprised farmworker asked if she had come far. "From America," she answered. She was the first woman to fly solo across the Atlantic.',
  q:'What does the word "solo" mean on this page?',o:['Alone','Very fast','At night'],e:'Amelia took off alone from an island near Canada',k:'vocabulary'},
 {t:'In 1937, Amelia tried her biggest adventure yet: flying around the world near the equator. Her navigator, Fred Noonan, flew with her. They had traveled about 22,000 miles when they headed for tiny Howland Island in the Pacific Ocean. They never arrived. The United States Navy searched for weeks, but the plane was never found. People still wonder what happened. Amelia believed women should try the same things men tried, and her courage inspired many girls to dream bigger.',
  q:'What is the main idea of this page?',o:['Amelia disappeared on her last flight, but her courage still inspires people','Fred Noonan was a navigator','Howland Island is in the Pacific Ocean'],e:'her courage inspired many girls to dream bigger.',k:'main idea'}],
 seq:['Amelia built a backyard roller coaster.','She rode in an airplane for the first time.','She flew alone across the Atlantic.','She disappeared over the Pacific.']},

{id:'robinson',title:'Jackie Robinson: Number 42',icon:'⚾',cat:'people',lvl:5,
 tricky:[['treatment','treat-ment'],['barrier','bar-ri-er'],['courage','cour-age'],['valuable','val-u-a-ble']],
 pages:[
 {t:'Jackie Robinson was born in 1919 in Cairo, Georgia, the youngest of five children. When he was a baby, his mother moved the family to Pasadena, California, hoping for a better life. Money was tight, and the family faced unfair treatment because they were Black. Jackie found his talent in sports. His older brother Mack was a track star who won a silver medal at the 1936 Olympics. At UCLA, Jackie became the first student to earn varsity letters in four sports: baseball, basketball, football, and track.',
  q:'Who in Jackie\'s family was an Olympic athlete?',o:['His brother Mack','His mother','His sister'],e:'His older brother Mack was a track star who won a silver medal at the 1936 Olympics.',k:'detail'},
 {t:'In the 1940s, Major League Baseball had an unfair rule that was never written down: Black players were not allowed. They played in their own leagues, called the Negro Leagues. Jackie joined the Kansas City Monarchs in 1945. That same year, Branch Rickey, the leader of the Brooklyn Dodgers, asked to meet him. Rickey wanted to break baseball\'s color barrier. He warned Jackie that fans and players would insult him. He needed a player with the courage not to fight back. Jackie agreed.',
  q:'What does "color barrier" mean here?',o:['The unfair rule that kept Black players out','A wall painted on the field','The colors of team uniforms'],e:'Black players were not allowed.',k:'vocabulary'},
 {t:'On April 15, 1947, Jackie Robinson stepped onto the field for the Brooklyn Dodgers. He became the first Black player in the major leagues in modern times. Some fans shouted terrible things. Some players tried to hurt him with the metal spikes on their shoes. Jackie kept his promise and answered with his playing instead of his fists. He hit, ran, and stole bases with amazing speed. At the end of the season, he was named the first Rookie of the Year.',
  q:'How did Jackie respond when people treated him badly?',o:['He answered with his playing','He quit the team','He fought back with his fists'],e:'Jackie kept his promise and answered with his playing instead of his fists.',k:'detail'},
 {t:'Jackie played ten seasons with the Dodgers. He won the National League\'s Most Valuable Player award in 1949 and helped Brooklyn win the World Series in 1955. After baseball, he spoke out for equal rights for all Americans. In 1997, Major League Baseball retired his number, 42, for every team. Today, on April 15 each year, every major league player wears number 42 to honor him.',
  q:'Why does every player wear number 42 on April 15?',o:['To honor Jackie Robinson','Because it is a lucky number','Because the uniforms ran out'],e:'every major league player wears number 42 to honor him.',k:'inference'}],
 seq:['Jackie earned letters in four sports at UCLA.','He joined the Kansas City Monarchs.','He played his first game for the Dodgers.','His number 42 was retired for every team.']},

{id:'wright',title:'The Wright Brothers Take Off',icon:'🛩️',cat:'people',lvl:5,
 tricky:[['helicopter','hel-i-cop-ter'],['bicycle','bi-cy-cle'],['propellers','pro-pel-lers'],['controlled','con-trolled']],
 pages:[
 {t:'Wilbur and Orville Wright grew up in Dayton, Ohio. In 1878, their father came home with a gift: a small toy helicopter made of cork, bamboo, and paper, powered by a rubber band. The boys played with it until it broke, then built copies of their own. Years later, they said that little toy first made them curious about flying. Neither brother earned a high school diploma, but they never stopped learning. They read books, built machines, and asked endless questions.',
  q:'What first made the brothers curious about flying?',o:['A toy helicopter','A trip in a balloon','A book about birds'],e:'they said that little toy first made them curious about flying.',k:'detail'},
 {t:'In 1892, the brothers opened a bicycle shop. They repaired, sold, and later built their own bicycles. This work taught them an important lesson: a rider must balance and steer. The brothers believed a flying machine would need the same kind of control. Most inventors at the time focused on powerful engines. The Wrights focused on balance. They watched birds and noticed how they twisted their wingtips to turn. So the brothers designed wings that could twist, too.',
  q:'How was the Wrights\' idea different from other inventors\'?',o:['They focused on balance and control','They built bigger engines','They only studied bicycles'],e:'The Wrights focused on balance.',k:'main idea'},
 {t:'The brothers needed strong, steady wind to test their gliders. They chose Kitty Hawk, North Carolina, a sandy place by the ocean. For three years they tested gliders there, crashing, fixing, and trying again. Back home, they built a wind tunnel to test about two hundred tiny wing shapes. Each failure taught them something new. By 1903 they had built a plane with an engine and two propellers. They called it the Flyer.',
  q:'Why did the brothers choose Kitty Hawk?',o:['It had strong, steady wind','It was close to their home','It had a big airport'],e:'The brothers needed strong, steady wind to test their gliders.',k:'detail'},
 {t:'On December 17, 1903, Orville lay on the lower wing of the Flyer while Wilbur ran alongside. The plane rose into the cold air and stayed up for twelve seconds, traveling 120 feet. It was the first powered, controlled airplane flight in history. The brothers took turns flying three more times that day. On the last flight, Wilbur flew 852 feet in 59 seconds. Only a few people saw it, but that short hop led to every airplane in the sky today.',
  q:'Why was a twelve-second flight such a big deal?',o:['It was the first powered, controlled airplane flight','It was the fastest flight ever','It crossed the ocean'],e:'It was the first powered, controlled airplane flight in history.',k:'inference'}],
 seq:['Their father gave them a toy helicopter.','They opened a bicycle shop.','They tested gliders at Kitty Hawk.','Orville flew the Flyer for twelve seconds.']},

{id:'tubman',title:'Harriet Tubman: Following the North Star',icon:'⭐',cat:'people',lvl:5,
 tricky:[['slavery','slav-er-y'],['Underground','Un-der-ground'],['network','net-work'],['passenger','pas-sen-ger']],
 pages:[
 {t:'Harriet Tubman was born into slavery around 1822 in Maryland. As a girl, her family called her Minty. Enslaved people were forced to work without pay and could be sold away from their families at any time. As a child, Harriet worked in fields and in houses. When she was young, an overseer threw a heavy weight that struck her head. She survived, but she had painful headaches and sudden sleeping spells for the rest of her life.',
  q:'What could happen to enslaved people at any time?',o:['They could be sold away from their families','They could choose a new job','They could move to a city'],e:'could be sold away from their families at any time',k:'detail'},
 {t:'In 1849, Harriet decided to escape. She traveled at night, mostly on foot, about 90 miles to Pennsylvania, where slavery was against the law. She followed the North Star to find her way. Along the way, she was helped by the Underground Railroad. It was not a real railroad. It was a secret network of people and safe houses that helped enslaved people reach freedom. When Harriet reached Pennsylvania, she said she felt like she was in heaven.',
  q:'What was the Underground Railroad?',o:['A secret network of people and safe houses','A train that ran under the ground','A road to Maryland'],e:'It was a secret network of people and safe houses that helped enslaved people reach freedom.',k:'vocabulary'},
 {t:'Harriet was free, but her family was not. So she went back. Over about ten years, she returned to Maryland about thirteen times and led around seventy people to freedom, including her parents and brothers. She was clever and careful. She traveled in winter, when nights were long, and often left on Saturday nights, because notices about runaways could not be printed in newspapers until Monday. Harriet later said she never lost a single passenger.',
  q:'Why did Harriet often leave on Saturday nights?',o:['Runaway notices could not be printed until Monday','Saturday nights were the warmest','Trains only ran on weekends'],e:'because notices about runaways could not be printed in newspapers until Monday.',k:'inference'},
 {t:'During the Civil War, Harriet worked for the Union Army as a cook, a nurse, and a spy. In 1863, she helped lead a raid along a river in South Carolina that freed more than 700 enslaved people. She was the first woman to lead an armed raid in the war. After the war, she lived in Auburn, New York, where she cared for elderly people and worked for women\'s right to vote. Harriet Tubman showed that one brave person can change many lives.',
  q:'What is the main idea of this page?',o:['Harriet kept helping others her whole life','The Civil War was long','Auburn is in New York'],e:'Harriet Tubman showed that one brave person can change many lives.',k:'main idea'}],
 seq:['Harriet was born in Maryland.','She escaped to Pennsylvania.','She led her family to freedom.','She helped lead a raid that freed 700 people.']},

{id:'armstrong',title:'Neil Armstrong: One Small Step',icon:'🌕',cat:'people',lvl:5,
 tricky:[['astronaut','as-tro-naut'],['experimental','ex-per-i-men-tal'],['boulders','boul-ders'],['mankind','man-kind']],
 pages:[
 {t:'Neil Armstrong was born in 1930 in a small town in Ohio. When he was about six years old, he took his first airplane ride, and he fell in love with flying. As a boy, he built model airplanes and read flying magazines. He worked at a drugstore to pay for flying lessons, and he earned his student pilot\'s license on his sixteenth birthday, before he even had a license to drive a car.',
  q:'What did Neil earn on his sixteenth birthday?',o:['A student pilot\'s license','A driver\'s license','A model airplane'],e:'he earned his student pilot\'s license on his sixteenth birthday',k:'detail'},
 {t:'Neil studied aerospace engineering at Purdue University and flew fighter jets for the U.S. Navy during the Korean War. Later, he became a test pilot, flying experimental planes to learn how they behaved. One of them, the X-15, was a rocket plane that flew so high it nearly reached space. Test pilots needed to stay calm when things went wrong, and Neil was known for his cool head. In 1962, NASA chose him to become an astronaut.',
  q:'Why did test pilots need to stay calm?',o:['Experimental planes could have problems','They had to talk on the radio','They flew only at night'],e:'Test pilots needed to stay calm when things went wrong',k:'inference'},
 {t:'On July 16, 1969, Neil Armstrong, Buzz Aldrin, and Michael Collins blasted off on Apollo 11. Four days later, Neil and Buzz rode the lunar module, named the Eagle, toward the Moon while Collins stayed in orbit. As they came down, Neil saw that the computer was steering them toward a field of large boulders. He took control and flew the Eagle himself, searching for a safe spot. When they landed, they had less than a minute of landing fuel left.',
  q:'Why did Neil take control of the Eagle?',o:['The computer was steering toward boulders','Buzz asked him to','The radio stopped working'],e:'the computer was steering them toward a field of large boulders.',k:'detail'},
 {t:'Neil radioed, "The Eagle has landed." Hours later, he climbed down the ladder and became the first person to walk on the Moon. As his boot touched the dusty ground, he said, "That\'s one small step for man, one giant leap for mankind." He and Buzz collected rocks, took pictures, and planted an American flag. Their footprints are still there today, because the Moon has no wind to blow them away.',
  q:'Why are their footprints still on the Moon?',o:['There is no wind to blow them away','Someone guards them','They were made of metal'],e:'because the Moon has no wind to blow them away.',k:'inference'}],
 seq:['Neil took his first airplane ride.','He flew the X-15 rocket plane.','Apollo 11 blasted off.','Neil walked on the Moon.']}
];

STORIES.push(
{id:'tortoise',title:'The Tortoise and the Hare',icon:'🐢',cat:'tales',lvl:3,school:'Class unit: Ways Characters Shape Stories',
 tricky:[['finish','fin-ish','the end of something, like a race'],['tortoise','tor-toise'],['snoring','snor-ing'],['steady','stead-y']],
 pages:[
 {t:'Long ago, Hare loved to brag. "I am the fastest animal in the whole forest!" he told anyone who would listen. One day he laughed at Tortoise. "You are so slow," Hare said. "It takes you all day to cross the road." Tortoise did not get angry. He just smiled. "Let\'s have a race," he said. All the animals gasped.',
  q:'What kind of character is Hare at the start of the story?',o:['A bragger who thinks he is the best','A shy animal who hides','A helper who is kind to everyone'],e:'"I am the fastest animal in the whole forest!"',k:'character'},
 {t:'Fox drew a line in the dirt. "Ready, set, go!" Hare zoomed away in a cloud of dust. Tortoise took one slow step, then another. Soon Hare was so far ahead that he could not even see Tortoise. "This race is too easy," Hare said with a yawn. He lay down under a shady tree. "I will take a little nap."',
  q:'Why did Hare stop to take a nap?',o:['He was sure he could not lose','He hurt his leg','Fox told him to rest'],e:'"This race is too easy,"',k:'inference'},
 {t:'While Hare slept, Tortoise kept going. Step, step, step. He did not stop to rest. He did not stop to eat. The sun moved slowly across the sky. Tortoise passed the shady tree where Hare was snoring. He did not wake him up. He just kept going, one slow step at a time.',
  q:'Which word best describes Tortoise?',o:['Steady','Lazy','Boastful'],e:'He just kept going, one slow step at a time.',k:'character'},
 {t:'Hare woke up as the sun was setting. He ran as fast as he could. But when he reached the finish line, Tortoise was already there. All the animals were cheering. Hare\'s ears drooped. "How did you beat me?" he asked. Tortoise smiled. "Slow and steady wins the race."',
  q:'How did Hare\'s actions change the end of the story?',o:['His bragging and napping made him lose','His speed helped him win','His kindness made him new friends'],e:'But when he reached the finish line, Tortoise was already there.',k:'main idea'}],
 seq:['Hare bragged about being fast.','Hare took a nap under a tree.','Tortoise passed the sleeping Hare.','Tortoise won the race.']},

{id:'anansi',title:'Jill the Spider and the Pot of Wisdom',icon:'🕷️',cat:'tales',lvl:3,school:'Class unit: Ways Characters Shape Stories',
 tricky:[['wisdom','wis-dom'],['gathered','gath-ered','collected things into one place'],['creature','crea-ture'],['easily','eas-i-ly','without any trouble']],
 pages:[
 {t:'This story comes from Ghana, in West Africa. Long ago, a spider named Jill wanted to be the smartest creature in the world. One day she gathered all the wisdom in the world and put it in a big clay pot. "Now I will be the only wise one," Jill said. "I will not share any of it!"',
  q:'What did Jill want?',o:['To be the smartest creature in the world','To build the biggest web','To make new friends'],e:'a spider named Jill wanted to be the smartest creature in the world.',k:'detail'},
 {t:'Jill decided to hide the pot at the top of a tall tree. She tied the pot to her belly and began to climb. But the pot was big and round. It bumped against the tree trunk. Jill slipped and slid. She tried again and again, but she could not climb higher than a few feet.',
  q:'Why couldn\'t Jill climb the tree?',o:['The pot on her belly got in the way','The tree was wet from rain','She was afraid of heights'],e:'It bumped against the tree trunk.',k:'inference'},
 {t:'Jill\'s young son was watching. "Mother," he said, "why don\'t you tie the pot to your back? Then you can hold onto the tree." Jill blinked. It was such a simple idea. She moved the pot to her back and climbed easily to the top. But she did not feel wise. She felt very silly.',
  q:'Why did Jill feel silly?',o:['Her son thought of an idea she had missed','She fell out of the tree','She forgot where the tree was'],e:'It was such a simple idea.',k:'inference'},
 {t:'Jill was so upset that she let the pot slip. It fell and broke on the ground below. The wind picked up all the wisdom and blew it around the world. Now everyone has a little bit of wisdom. And that is why, the storytellers of Ghana say, no one person can ever know everything.',
  q:'What lesson does this folktale teach?',o:['No one person can know everything','Spiders are the best climbers','Clay pots break easily'],e:'no one person can ever know everything.',k:'main idea'}],
 seq:['Jill put all the wisdom in a pot.','She could not climb with the pot on her belly.','Her son told her to tie it to her back.','The pot broke and wisdom blew everywhere.']},

{id:'midas',title:'King Midas and the Golden Touch',icon:'👑',cat:'tales',lvl:3,school:'Class unit: Ways Characters Shape Stories',
 tricky:[['statue','stat-ue','a figure of a person made of stone or metal'],['shining','shin-ing'],['horror','hor-ror'],['daughter','daugh-ter']],
 pages:[
 {t:'In an old Greek myth, King Midas loved gold more than anything. He had rooms full of gold coins, but he always wanted more. One day, Midas was kind to a lost friend of a god. To thank him, the god said, "I will grant you one wish." Midas did not have to think. "I wish that everything I touch turns to gold!"',
  q:'What did King Midas love most at the start?',o:['Gold','His garden','His horses'],e:'King Midas loved gold more than anything.',k:'detail'},
 {t:'The next morning, Midas touched his bed. It turned to gold! He touched a chair, a table, and a rose in his garden. Each one turned to shining gold. "I am the richest king in the world!" he shouted. Midas danced through the halls, touching everything he could reach.',
  q:'How did Midas feel about his wish at first?',o:['Thrilled','Worried','Bored'],e:'"I am the richest king in the world!" he shouted.',k:'inference'},
 {t:'At lunch, Midas picked up a piece of bread. It turned to hard, cold gold. He tried to drink a cup of water, but it turned to gold too. Midas began to worry. Then his daughter ran to hug him. The moment he touched her, she became a golden statue. Midas cried out in horror.',
  q:'What happened when Midas touched his daughter?',o:['She became a golden statue','She laughed and ran away','She turned into a rose'],e:'she became a golden statue.',k:'detail'},
 {t:'Midas begged the god to take the wish away. "Wash your hands in the river," the god told him. Midas ran to the river and washed. His daughter turned back into a girl, and his food became food again. From then on, Midas cared more about the people he loved than about gold.',
  q:'How did Midas change by the end of the myth?',o:['He cared more about people than gold','He wanted even more gold','He became a river god'],e:'Midas cared more about the people he loved than about gold.',k:'character'}],
 seq:['Midas wished for the golden touch.','Everything he touched turned to gold.','His daughter became a golden statue.','Midas washed the wish away in the river.']},

{id:'weather',title:'Weather Poems',icon:'🌦️',cat:'tales',lvl:3,school:'Class: figurative language and poetry',
 tricky:[['playful','play-ful'],['whistles','whis-tles'],['feathers','feath-ers'],['sparkles','spar-kles']],
 pages:[
 {t:'The Wind\nThe wind is a playful puppy today.\nIt tugs at my scarf and runs away.\nIt chases the leaves across the street,\nthen rolls in the grass around my feet.\nIt whistles and howls and jumps up high,\nthen curls up to nap in the quiet sky.',
  q:'The poem says, "The wind is a playful puppy." What does that mean?',o:['The wind moves around in a playful way, like a puppy','A real puppy is outside','The wind is very quiet all day'],e:'The wind is a playful puppy today.',k:'figurative language'},
 {t:'Rain\nThe rain tap-dances on my roof,\nthe drops as quick as feet.\nIt drums upon the window glass\na soft and steady beat.\nThe puddles fill like little lakes\nall up and down the street.',
  q:'What does "The rain tap-dances on my roof" help you picture?',o:['Raindrops making quick tapping sounds','A person dancing on the roof','A hole in the roof'],e:'The rain tap-dances on my roof,',k:'figurative language'},
 {t:'Snow\nSnow falls as soft as feathers,\nas quiet as a sleeping cat.\nIt puts a white coat on the cars\nand gives each fence post a hat.\nIn the morning, the whole world sparkles\nlike a cake with sugar on top.',
  q:'Why does the poet say snow gives each fence post "a hat"?',o:['Snow piles up on top of each post','Someone puts real hats on the fence','The fence posts are cold'],e:'and gives each fence post a hat.',k:'figurative language'},
 {t:'After the Storm\nAfter the storm, the sun peeks out\nlike a shy kid at the door.\nIt smiles at the wet and dripping trees.\nThe rain does not fall anymore.\nThe birds begin to sing again,\nand puddles shine like gold.',
  q:'Which line compares the sun to a person?',o:['like a shy kid at the door.','The birds begin to sing again,','The rain does not fall anymore.'],e:'like a shy kid at the door.',k:'figurative language'}],
 seq:['The wind plays like a puppy.','The rain tap-dances on the roof.','Snow falls as soft as feathers.','The sun peeks out after the storm.']},

{id:'drip',title:'Drip\'s Big Trip',icon:'💧',cat:'fun',lvl:3,school:'Science: the water cycle',
 tricky:[['evaporation','e-vap-o-ra-tion'],['condensation','con-den-sa-tion'],['precipitation','pre-cip-i-ta-tion'],['collection','col-lec-tion']],
 pages:[
 {t:'Drip was a tiny drop of water who lived in a big blue lake. Every day she floated, splashed, and played with the fish. One hot summer day, the sun shone down on the lake. Drip felt warmer and warmer. Then something strange happened. She felt as light as air, and she began to rise up, up, up into the sky!',
  q:'What made Drip rise into the sky?',o:['The sun warmed her up','A fish pushed her','A boat splashed her'],e:'Drip felt warmer and warmer.',k:'inference'},
 {t:'Drip had turned into water vapor, a gas too small to see. This is called evaporation. High in the sky, the air was cold. Drip shivered and squeezed close to millions of other tiny drops. Together they made a big, puffy cloud. This part is called condensation. "What a view!" said Drip.',
  q:'What happens during evaporation?',o:['Water warms up and turns into a gas','Water freezes into ice','A cloud makes thunder'],e:'Drip had turned into water vapor, a gas too small to see.',k:'vocabulary'},
 {t:'The cloud grew darker and heavier as more drops joined in. Soon it was too heavy to hold them all. Whoosh! Drip fell out of the cloud as a raindrop. This is called precipitation. Rain, snow, sleet, and hail are all kinds of precipitation. Drip zoomed toward the ground.',
  q:'Why did Drip fall out of the cloud?',o:['The cloud got too heavy','The wind blew the cloud away','The sun went down'],e:'Soon it was too heavy to hold them all.',k:'detail'},
 {t:'Drip landed on a hill and slid down into a stream. The stream rushed into a river, and the river flowed back into her big blue lake. This is called collection. "I\'m home!" Drip shouted. The fish swam over to say hello. Drip smiled. She knew that tomorrow, the sun might send her on her trip all over again.',
  q:'Why might Drip go on her trip "all over again"?',o:['The water cycle keeps repeating','The fish will carry her','She will get lost'],e:'the sun might send her on her trip all over again.',k:'main idea'}],
 seq:['The sun warmed Drip in the lake.','Drip became part of a cloud.','Drip fell as a raindrop.','Drip flowed back home to the lake.']},

{id:'partner',title:'The Science Fair Partner',icon:'🔬',cat:'fiction',lvl:5,school:'Class unit: Characters\' Relationships (realistic fiction)',
 tricky:[['erosion','e-ro-sion'],['sketches','sketch-es'],['handwriting','hand-writ-ing'],['annoyed','an-noyed']],
 pages:[
 {t:'When Ms. Ford read the science fair partners out loud, Jada\'s stomach dropped. Her partner was Marcus, the boy who never raised his hand and always sat alone at lunch. Jada had already planned everything: a volcano with foam lava and a poster with glitter titles. "He probably won\'t even help," she whispered to her best friend, Kate. Kate shrugged. "Maybe give him a chance." Jada rolled her eyes and stuffed her notebook into her backpack.',
  q:'What does Jada expect from Marcus at the start?',o:['She thinks he will not help','She thinks he is the smartest kid in class','She is excited to work with him'],e:'"He probably won\'t even help,"',k:'character'},
 {t:'The next day, Jada explained her volcano plan while Marcus listened quietly. When she finished, he slid a worn notebook across the table. Inside were pencil sketches of rock layers, each one labeled in tiny, careful handwriting. "My grandpa and I collect rocks on weekends," Marcus said softly. "What if our project showed how erosion carves canyons? We could use sand and a watering can." Jada stared at the sketches. They were better than anything she had planned.',
  q:'What do Marcus\'s careful sketches show about him?',o:['He is thoughtful and knows a lot about rocks','He does not care about the project','He copies other people\'s work'],e:'each one labeled in tiny, careful handwriting.',k:'character'},
 {t:'For two weeks, they worked after school. Jada was good at making things look exciting, and Marcus knew how to make the science correct. They argued once, when Jada wanted to add glitter to the canyon. "Real canyons don\'t sparkle," Marcus said, and for a second Jada felt annoyed. Then she laughed. "Fine. But the title gets glitter." Marcus grinned. It was the first time she had seen him smile.',
  q:'How is the partners\' relationship changing?',o:['They are learning to work together and respect each other','They are becoming enemies','They have stopped talking'],e:'Jada was good at making things look exciting, and Marcus knew how to make the science correct.',k:'character'},
 {t:'On the night of the science fair, a judge asked how the model worked. Jada started to answer, then stopped and nodded at Marcus instead. He stepped forward and explained every layer of the canyon, his voice growing stronger with each word. They won second place. At lunch the next Monday, Jada carried her tray past her usual table and sat down next to Marcus. "Save a seat for Kate too," she said.',
  q:'Why does the author end the story with Jada sitting next to Marcus at lunch?',o:['To show they have become friends','To show the cafeteria was crowded','To show Jada is still upset'],e:'sat down next to Marcus.',k:'character'}],
 seq:['Jada was unhappy about her partner.','Marcus showed his rock sketches.','They argued about the glitter.','Jada sat with Marcus at lunch.']},

{id:'jumpshot',title:'The Jump Shot',icon:'🏀',cat:'fiction',lvl:5,school:'Class unit: Characters\' Relationships (realistic fiction)',
 tricky:[['driveway','drive-way'],['sprained','sprained'],['crutches','crutch-es'],['streetlights','street-lights']],
 pages:[
 {t:'Every evening, Leo watched his older sister, Callie, shoot baskets in the driveway. She was the best player on her middle school team, and she almost never missed. Leo was in fifth grade, and he missed almost every shot. "Can you teach me?" he asked one night. Callie didn\'t look up. "I\'m busy practicing," she said, and the ball swished through the net again. Leo went inside and slammed the door harder than he meant to.',
  q:'How does Leo feel at the end of this page?',o:['Hurt and frustrated','Proud and happy','Sleepy and calm'],e:'Leo went inside and slammed the door harder than he meant to.',k:'inference'},
 {t:'The next week, Callie sprained her ankle in a game. The doctor said no basketball for a month. She sat on the porch steps with her crutches, staring at the empty hoop. Leo picked up the ball and took a shot. It bounced off the rim. "Your elbow is sticking out," Callie called. "Tuck it in, like you\'re holding a pizza tray." Leo tried again. The ball rolled around the rim and dropped in.',
  q:'Why does Callie start helping Leo?',o:['She cannot play, so she watches him instead','Her coach told her to','Leo paid her'],e:'The doctor said no basketball for a month.',k:'inference'},
 {t:'Every afternoon that month, Callie coached from the porch. She was strict. She made Leo shoot fifty free throws before dinner and wouldn\'t let him quit when his arms got tired. Some days Leo wanted to give up. But he noticed something: when he made a hard shot, Callie cheered louder than she ever cheered for herself. Little by little, his shots started falling.',
  q:'Which word best describes Callie as a coach?',o:['Strict','Lazy','Silly'],e:'She was strict.',k:'character'},
 {t:'When Callie\'s ankle healed, she grabbed the ball and bounced it to Leo. "Game of HORSE?" she asked. Leo won the first game. Callie stared at him, then broke into a huge smile. "I taught you too well," she said. That night they practiced together until the streetlights came on, and neither of them was keeping score.',
  q:'What does "neither of them was keeping score" show?',o:['They cared more about playing together than winning','They forgot how to count','The game was boring'],e:'neither of them was keeping score.',k:'character'}],
 seq:['Callie was too busy to teach Leo.','Callie sprained her ankle.','Callie coached Leo from the porch.','Leo beat Callie at HORSE.']},

{id:'anning',title:'Mary Anning: Fossil Hunter',icon:'🦕',cat:'people',lvl:5,school:'Science: landforms, erosion and fossils',
 tricky:[['fossils','fos-sils'],['erosion','e-ro-sion'],['skeleton','skel-e-ton'],['geology','ge-ol-o-gy']],
 pages:[
 {t:'Mary Anning was born in 1799 in a small seaside town in England. The cliffs near her home were full of fossils, the remains of animals that lived millions of years ago. Mary\'s father was a cabinetmaker who also hunted for fossils and sold them to tourists. He took Mary and her brother, Joseph, along the beaches to search. When Mary was eleven, her father died, and the family was very poor. Selling fossils became one way they could earn money.',
  q:'Why did selling fossils become so important to Mary\'s family?',o:['They needed money after her father died','Fossils were their favorite toys','The town ordered them to'],e:'Selling fossils became one way they could earn money.',k:'inference'},
 {t:'The cliffs near her town are always changing. Storms and waves wear away the rock, and parts of the cliffs crumble and slide onto the beach. This erosion uncovers fossils that have been buried for millions of years. It also made fossil hunting dangerous. Mary searched most often in winter, right after storms, when new fossils were exposed. In 1833, a landslide nearly killed her, and it killed her dog, Tray.',
  q:'Why did Mary search right after storms?',o:['Storms uncovered new fossils','The beach was empty and quiet','Fossils float in storm water'],e:'when new fossils were exposed.',k:'inference'},
 {t:'Around 1811, Joseph found the skull of a strange creature. Over the next months, Mary carefully dug out the rest of its skeleton. It was an ichthyosaur, a sea reptile that looked a bit like a dolphin. In 1823, Mary found the first complete skeleton of a plesiosaur, a sea reptile with a very long neck. Some scientists did not believe it was real until they examined it themselves. In 1828, she found the first pterosaur, a flying reptile, ever discovered in Britain.',
  q:'What was an ichthyosaur?',o:['A sea reptile that looked like a dolphin','A kind of rock','A bird that could swim'],e:'a sea reptile that looked a bit like a dolphin.',k:'vocabulary'},
 {t:'Even though her discoveries changed science, Mary was not allowed to join London\'s most important science club, because it did not accept women. Scientists bought her fossils and wrote about them, often without mentioning her name. Mary kept working anyway, and she taught herself geology and anatomy. Today her fossils are displayed at the Natural History Museum in London, and she is remembered as one of the greatest fossil hunters who ever lived.',
  q:'What is the main idea of this page?',o:['Mary was treated unfairly, but her work is honored today','The science club met in London','Fossils belong in museums'],e:'she is remembered as one of the greatest fossil hunters who ever lived.',k:'main idea'}],
 seq:['Mary hunted fossils with her father.','Storms and erosion uncovered new fossils.','Mary found a plesiosaur skeleton.','Her fossils went on display in London.']},

{id:'cailun',title:'Cai Lun and the Gift of Paper',icon:'📜',cat:'people',lvl:5,school:'Social studies: Ancient China',
 tricky:[['dynasty','dy-nas-ty'],['official','of-fi-cial'],['historians','his-to-ri-ans'],['centuries','cen-tu-ries']],
 pages:[
 {t:'More than two thousand years ago, during the Han dynasty in China, people often wrote on strips of bamboo tied together with string. A single book could be so heavy that it took a cart to move it. Some people wrote on silk, which was light and smooth but very expensive. China needed something better: a writing material that was light, cheap, and easy to make.',
  q:'What was the problem with writing on bamboo?',o:['It was very heavy','It was too expensive','It fell apart in water'],e:'A single book could be so heavy that it took a cart to move it.',k:'detail'},
 {t:'Cai Lun was an official who worked in the emperor\'s palace. Around the year 105, he presented a method for making paper to the emperor. Workers mashed tree bark, hemp, old rags, and even worn-out fishing nets with water to make a pulp. The pulp was spread thin on a screen and left to dry. When it was peeled off, it became a sheet of paper.',
  q:'What is "pulp" on this page?',o:['A wet, mashed mixture used to make paper','A kind of ink','A tree that grows in China'],e:'Workers mashed tree bark, hemp, old rags, and even worn-out fishing nets with water to make a pulp.',k:'vocabulary'},
 {t:'Historians have found scraps of paper in China that are older than Cai Lun. So he probably did not invent paper all by himself. What he did was improve it and show how to make good paper from cheap materials. Because of his work, paper became common across China. For centuries, many people honored Cai Lun as the father of papermaking.',
  q:'According to historians, what did Cai Lun really do?',o:['He improved paper and made it cheaper to produce','He was the first person ever to make paper','He invented bamboo books'],e:'What he did was improve it and show how to make good paper from cheap materials.',k:'main idea'},
 {t:'For hundreds of years, China kept papermaking mostly to itself. Slowly, the knowledge spread along trade routes like the Silk Road. Papermakers were working in Central Asia and the Middle East by the end of the 700s, and paper eventually reached Europe. Books became cheaper, more people learned to read, and ideas could travel farther than ever. Every page you read today comes from the craft Cai Lun helped spread.',
  q:'How did paper change the world, according to the passage?',o:['It made books cheaper and helped ideas spread','It replaced the Silk Road','It made bamboo more valuable'],e:'Books became cheaper, more people learned to read, and ideas could travel farther than ever.',k:'main idea'}],
 seq:['People in China wrote on heavy bamboo.','Cai Lun presented a way to make paper.','Paper became common across China.','Papermaking spread along the Silk Road.']},

{id:'aryabhata',title:'Aryabhata: Reading the Sky',icon:'🔭',cat:'people',lvl:5,school:'Social studies: Ancient India',
 tricky:[['astronomer','as-tron-o-mer'],['mathematician','math-e-ma-ti-cian'],['eclipses','e-clip-ses'],['satellite','sat-el-lite']],
 pages:[
 {t:'Aryabhata was born in India in the year 476. He grew up to be one of the greatest mathematicians and astronomers of the ancient world. At the time, India was an important center of learning, where scholars studied numbers, the stars, and the movements of the planets. Aryabhata worked near a great city in the north of India.',
  q:'What did Aryabhata become?',o:['A great mathematician and astronomer','A famous king','A traveling merchant'],e:'He grew up to be one of the greatest mathematicians and astronomers of the ancient world.',k:'detail'},
 {t:'When he was only twenty-three years old, Aryabhata finished a famous book about math and the stars. It was written in short verses, like poems, so students could memorize it. The book explained ways to solve math problems, measure shapes, and track the planets. It also gave a very close value for pi, the number used to measure circles: about 3.1416.',
  q:'Why was the book written in short verses?',o:['So students could memorize it','Because paper was too expensive','So it could be sung at festivals'],e:'so students could memorize it.',k:'detail'},
 {t:'Aryabhata also had bold ideas about the sky. Many people believed the stars moved around a still Earth. Aryabhata wrote that Earth spins on its axis, which is why the stars seem to move across the night sky. He also explained that eclipses happen when the shadow of Earth or the Moon falls on the other, not because a monster swallows the Sun, as some old stories said.',
  q:'What did Aryabhata say causes eclipses?',o:['The shadow of Earth or the Moon','A monster swallowing the Sun','Clouds covering the Sun'],e:'eclipses happen when the shadow of Earth or the Moon falls on the other',k:'detail'},
 {t:'Scholars in India studied Aryabhata\'s work for hundreds of years, and his ideas later reached scholars in the Arab world. In 1975, India launched its very first satellite into space. Scientists named it Aryabhata, in honor of the astronomer who had studied the sky with careful math and simple tools more than fourteen centuries earlier.',
  q:'Why did India name its first satellite Aryabhata?',o:['To honor the ancient astronomer','Because he designed it','Because it was launched from Patna'],e:'in honor of the astronomer',k:'inference'}],
 seq:['Aryabhata was born in India.','He wrote his book in verses.','He explained what causes eclipses.','India named a satellite after him.']}
);
