function mapSvg(p){
  const W = 700, H = 210, pts = [];
  for (let i=0;i<=STOPS;i++){ const x = 30 + i*(W-60)/STOPS; const y = 105 + Math.sin(i*0.9)*60; pts.push([x,y]); }
  const pos = Math.min(p.completed, STOPS);
  let d = 'M'+pts[0].join(' ');
  for (let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; const mx=(x0+x1)/2; d += ` C${mx} ${y0} ${mx} ${y1} ${x1} ${y1}`; }
  const stops = pts.map(([x,y],i) => {
    const chest = i>0 && i%5===0, reached = p.completed >= i;
    if (chest) return `<text x="${x}" y="${y+10}" text-anchor="middle" font-size="30">${reached?'🎁':'🧰'}</text>`;
    return `<circle cx="${x}" cy="${y}" r="13" fill="${reached?'var(--good)':'var(--panel)'}" stroke="${reached?'var(--good)':'var(--path)'}" stroke-width="4"/>`;
  }).join('');
  const [ax, ay] = pts[pos];
  return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Story path: ${p.completed} of ${STOPS} stops">
    <path d="${d}" fill="none" stroke="var(--path)" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 18"/>
    ${stops}<text x="${ax}" y="${ay-22}" text-anchor="middle" font-size="36">${p.av}</text></svg>`;
}

async function makeStory(d){
  const p = me(); d.topic = val('topic').trim();
  if (!d.topic){ d.err = 'Type or pick a topic first.'; render(); return; }
  d.busy = true; d.err = ''; render();
  const lvl = Math.max(2, Math.min(6, p.grade));
  const words = lvl <= 3 ? '60 to 80' : lvl === 4 ? '80 to 100' : '100 to 130';
  const prompt = `You write reading-practice stories for a child in grade ${lvl} who reads slowly and is working on decoding and fluency.
Write ${d.kind==='people' ? `a TRUE, carefully fact-checked biography of ${d.topic}. Use only well-established facts; if you are unsure of a detail, leave it out. If this is not a real, widely known person who is appropriate for children, write instead about Amelia Earhart.` : `an original, funny, kind story about: ${d.topic}.`}
Rules: suitable for children, no scary violence, short clear sentences, grade-${lvl} vocabulary, exactly 4 pages of ${words} words each, plain text (straight quotes, no markdown).
After each page, one question with 3 answer choices. The FIRST choice must be correct; the other two must be clearly wrong to a careful reader. Mix question types: detail, inference, vocabulary, main idea.
"e" must be copied EXACTLY, word for word, from that page's text: the sentence that proves the answer.
"tricky": 4 longer words from the story, each with its syllables joined by hyphens.
"seq": 4 short sentences, one event from each page, in story order.
Answer ONLY with JSON in this shape:
{"title":"...","icon":"one emoji","tricky":[["word","syl-la-bles"]],"pages":[{"t":"page text","q":"question","o":["correct","wrong","wrong"],"e":"exact sentence","k":"detail|inference|vocabulary|main idea"}],"seq":["...","...","...","..."]}`;
  makeCtl = new AbortController();
  try{
    const j = await sampleFn.json(prompt, {signal: makeCtl.signal, cache:false});
    const s = cleanStory(j, d.kind, lvl);
    if (!s) throw {code:'bad_story'};
    p.custom = p.custom || []; p.custom.unshift(s); save();
    view.d = null; go({name:'intro', id:s.id});
  }catch(e){
    d.busy = false;
    d.err = e && e.code === 'cancelled' ? 'Stopped.' :
            e && e.code === 'not_granted' ? 'A grown-up needs to allow this page to ask Claude.' :
            e && e.code === 'rate_limited' ? 'Too many stories at once. Try again in a minute.' :
            'That story did not come out right. Try again, or pick a different topic.';
    if (view.name === 'make') render();
  }finally{ makeCtl = null; }
}
function cleanStory(j, kind, lvl){
  if (!j || !Array.isArray(j.pages) || j.pages.length < 3) return null;
  const pages = j.pages.slice(0,5).map(pg => {
    const t = String(pg.t||'').trim(); const o = (pg.o||[]).map(String).slice(0,3);
    if (!t || o.length < 3 || !pg.q) return null;
    let e = String(pg.e||''); if (!t.includes(e) || !e) e = (t.match(/[^.!?]+[.!?]/)||[t])[0];
    return {t, q:String(pg.q), o, e, k:SKILLS.includes(pg.k)?pg.k:'detail'};

// ----- word help: syllable chunks (no audio, by design) -----
function syllables(word){
  const w = word.replace(/[^A-Za-z]/g,''); if (w.length <= 3) return [w];

    if (!isV(i)) continue;
    if ((silentE && i===l.length-1) || (silentEd && i===l.length-2)) continue;
    if (groups.length && groups[groups.length-1][1] === i) groups[groups.length-1][1] = i+1; else groups.push([i,i+1]);
  }

  const cuts = [];
  for (let g=0; g<groups.length-1; g++){
    const a = groups[g][1], b = groups[g+1][0], n = b - a;
    let cut;
    if (n === 0) cut = a; else if (n === 1) cut = l[a]==='x' ? a+1 : a;
    else if (n === 2) cut = (keep.slice(0,8).includes(l.slice(a,b)) || /^[bcdfgpt][rl]$/.test(l.slice(a,b))) ? a : a+1; // digraphs and r/l blends stay together (mi-grate), others split (bas-ket)
    else cut = keep.includes(l.slice(b-2,b)) ? b-2 : a+1;

    cuts.push(cut);
  }
  const parts = []; let prev = 0;
  for (const c of cuts){ if (c > prev && c < w.length){ parts.push(w.slice(prev,c)); prev = c; } }
  parts.push(w.slice(prev));

}

    // the microphone sometimes misses a whole phrase: find the reader again where two heard words in a row match two page words in a row
    if (hit < 0 && heard[i+1]) for (let k=4;k<16 && p+k+1<words.length;k++){
      if (sameWord(heard[i], words[p+k].n) && sameWord(heard[i+1], words[p+k+1].n)){ hit = k; break; }
    }
    if (hit >= 0){ heardNow.add(p + hit); if (two) i++; p = p + hit + 1; }
  }
  mic.heard = mic.heard || new Set(); heardNow.forEach(x => mic.heard.add(x));
  if (p > mic.ptr){ const now = Date.now(); if (!mic.t0){ mic.t0 = now; mic.p0 = p; } mic.ptr = p; mic.last = now; paintRead(); }
  checkMicDone();
}
// Reading speed = words between the first and the last word the microphone heard, over the time between them.
// Both ends carry the same recognizer delay, so it cancels out. null when there is too little to time.
function micRate(){
  if (!mic.t0 || !(mic.last > mic.t0)) return null;
  const n = mic.ptr - (mic.p0 || 0), secs = (mic.last - mic.t0)/1000;
  if (n < 8 || secs < 4) return null;
  return Math.round(n / (secs/60));
}
function checkMicDone(){
  const words = view.words; if (!words || mic.ptr < words.length || mic.done) return;
  mic.done = true; stopMic();
  const secs = Math.max(1, (Date.now() - (mic.t0 || view.t0))/1000);
  if (view.onMicDone){ const f = view.onMicDone; view.onMicDone = null; f(secs); return; }
  micResult(micRate() || Math.round(words.length / (secs/60)), true);
}
function micResult(w, whole){
  const key = R.s.id+'#'+R.page, p = me();
  if (w >= 15 && w <= 300){ p.wpm.push({d:today(), w, how:'mic', s:R.s.id}); if (p.wpm.length > 60) p.wpm.shift(); save(); }
  p.best = p.best || {}; const prev = p.best[key];
  const beat = prev && w > prev;
  if (!prev || w > prev) p.best[key] = w; save();
  setMicState('');
  const out = document.getElementById('micOut');
  const unclear = flagUnclear(R.s.pages[R.page].t);
  if (out) out.innerHTML = `<div class="result">${whole ? 'You read the whole page' : 'You read this page'} at about <b>${w} words a minute</b>${beat?`, faster than last time (${prev})! 🎉`: prev?` (your best is ${prev}).`:'.'}</div>${unclearHtml(unclear)}`;
  if (beat){ R.coins += 5; addCoins(5,'new best'); }
  confetti(20);
}
function paintRead(){
  document.querySelectorAll('#passage .w').forEach((el,i) => { el.classList.toggle('read', i < mic.ptr); el.classList.toggle('now', mic.on && i === mic.ptr); });
}
// Read along: a highlighter moves across the words at the chosen speed.
// time on each word: a bit more for longer words and at commas and full stops, scaled so the whole page
// takes exactly as long as the chosen words-per-minute says
function paceTimes(words, wpm){
  const wt = words.map(w => { let x = 0.7 + 0.3*Math.max(1, syllables(w.raw).length); if (/[.!?]["”]?$/.test(w.raw)) x *= 1.8; else if (/[,;:]["”]?$/.test(w.raw)) x *= 1.3; return x; });
  const sum = wt.reduce((a,b) => a+b, 0), total = words.length / wpm * 60000;
  return wt.map(x => x / sum * total);
}
function runPace(){
  const p = me(), words = view.words; if (pace.i >= words.length) pace.i = 0;
  pace.run = true; document.getElementById('paceBtn').textContent = '⏸ Pause';
  const step = () => {
    if (!pace.run) return;
    document.querySelectorAll('#passage .w').forEach((el,i) => { el.classList.toggle('now', i === pace.i); el.classList.toggle('read', i < pace.i); });
    const w = words[pace.i]; if (!w){ pace.run = false; const b = document.getElementById('paceBtn'); if (b) b.textContent = '↻ Read it again'; pace.i = 0; return; }
    const ms = paceTimes(words, p.pace)[pace.i];
    pace.i++; pace.timer = setTimeout(step, ms);
  };
  step();
}
function pausePace(){ pace.run = false; clearTimeout(pace.timer); const b = document.getElementById('paceBtn'); if (b) b.textContent = '▶ Keep going'; }
function stopPace(){ pace.run = false; clearTimeout(pace.timer); }

function finishStory(){
  const p = me(), s = R.s;
  const right = R.firstTry.filter(Boolean).length, total = s.pages.length;

  const first = !p.done[s.id];
  p.done[s.id] = {stars: Math.max(stars, (p.done[s.id]||{}).stars||0), d:today()};
  const bonus = first ? 25 : 10;
  p.completed++;

  if (p.completed <= STOPS && p.completed % 5 === 0){ chest = 50; p.chests++; }
  // this story's questions and word meanings come back in the memory vault
  s.pages.forEach((_,i) => { if (!p.vault.some(v => v.s === s.id && v.i === i && !v.w)) p.vault.push({s:s.id, i, due:addDays(1), b:0}); });

// ---------- Memory vault ----------
function vaultQ(it){
  const s = storyById(it.s);
  if (it.w){
    const def = defOf(it.w, s);
    const others = shuffle([...new Set(Object.values(EXTRA.defs||{}))].filter(d => d !== def)).slice(0, 2);
    return {s, q:`What does the word “${it.w}” mean?`, o:[def].concat(others), why:`“${it.w}” means: ${def}`, k:'vocabulary'};
  }
  const pg = s.pages[it.i];
  return {s, q:pg.q, o:pg.o, why:`The story said: “${pg.e}”`, k:'memory'};
}
function vVault(){
  const v = view;
  if (v.i >= v.items.length){
    bumpStreak(); if (!v.paid){ v.paid = true; giveTickets(1); questMark('vault'); logEvent('vault', 'Memory Vault', {right:v.right||0, total:v.items.length}); }

}
function vaultAnswer(i, el){
  const v = view, it = v.items[v.i], d = v.qd, p = me();

function endGame(k, score, extra){

  const coins = Math.max(2, Math.min(20, Math.round(score/15)));

  go({name:'gameOver', k, score, newBest, coins, extra:extra||{}, gotMedal: medal(k, score) && medal(k, score) !== prevMedal && newBest ? medal(k, score) : ''});
}

function rr(cx, x, y, w, h, r){ cx.beginPath(); cx.moveTo(x+r,y); cx.arcTo(x+w,y,x+w,y+h,r); cx.arcTo(x+w,y+h,x,y+h,r); cx.arcTo(x,y+h,x,y,r); cx.arcTo(x,y,x+w,y,r); cx.closePath(); }

function vCatch(){

  app.innerHTML = `${topbar(()=>go({name:'arcade'}))}

    <div class="row spread"><h2>🧺 Word Catcher</h2><span class="chip" id="gHud" style="font-size:1rem">Score 0 · ❤️❤️❤️</span></div>

    <canvas id="gc" class="gcanvas" aria-label="Word Catcher game"></canvas>
    <p class="mut" style="font-size:.9rem">Slide your finger on the game to move your basket.</p></div>`;
  const cv = document.getElementById('gc'), cx = cv.getContext('2d');
  const W = cv.clientWidth, H = Math.max(320, Math.min(560, Math.round(innerHeight*0.6)));
  const dpr = window.devicePixelRatio || 1; cv.style.height = H+'px'; cv.width = W*dpr; cv.height = H*dpr; cx.scale(dpr, dpr);
  const css = getComputedStyle(document.documentElement), col = n => css.getPropertyValue(n).trim();
  const C = {panel:col('--panel'), line:col('--line'), ink:col('--ink'), good:col('--good'), oops:col('--oops'), sun:col('--sun')};
  const bankW = bankWords(p), real = (hard ? REAL5 : REAL3).concat(bankW, bankW, focusWords(p), focusWords(p)), fake = hard ? FAKE5 : FAKE3, fs = W < 500 ? 18 : 22, base = hard ? 50 : 42;
  const g = G = {k:'catch', score:0, lives:3, x:W/2, items:[], t:0, next:0.5, last:performance.now(), fake:[], hud:''};
  const move = e => { const r = cv.getBoundingClientRect(); g.x = Math.max(46, Math.min(W-46, e.clientX - r.left)); };
  cv.addEventListener('pointerdown', move); cv.addEventListener('pointermove', move);
  cv.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
  const key = e => { if (e.key === 'ArrowLeft') g.x = Math.max(46, g.x-34); if (e.key === 'ArrowRight') g.x = Math.min(W-46, g.x+34); };
  addEventListener('keydown', key); g.cleanup = () => removeEventListener('keydown', key);
  cx.font = `600 ${fs}px Lexend, Verdana, sans-serif`;
  function spawn(){
    const isReal = Math.random() < 0.6, list = isReal ? real : fake, word = list[Math.floor(Math.random()*list.length)];
    const w = cx.measureText(word).width + 28;
    g.items.push({word, real:isReal, w, x: w/2 + Math.random()*Math.max(1, W-w), y:-24, vy:(base + g.t*1.4)*(0.85+Math.random()*0.3)});
  }
  function frame(now){
    if (g.stop) return;
    const dt = Math.min(0.05, (now - g.last)/1000); g.last = now; g.t += dt;
    g.next -= dt; if (g.next <= 0){ spawn(); g.next = Math.max(0.8, 1.7 - g.t*0.012); }
    const by = H - 34;
    for (const it of g.items){
      if (it.hit){ it.fade += dt; continue; }
      it.y += it.vy*dt;
      if (it.y >= by-16 && it.y <= by+12 && Math.abs(it.x - g.x) < 40 + it.w/2){
        it.hit = true; it.fade = 0;
        if (it.real){ g.score += 10; it.fx = '+10'; bankOk(it.word); } else { g.lives--; g.fake.push(it.word); it.fx = '✗ '+it.word; }
      }
    }
    g.items = g.items.filter(it => it.hit ? it.fade < 0.5 : it.y < H + 30);
    cx.clearRect(0,0,W,H); cx.textAlign = 'center'; cx.textBaseline = 'middle'; cx.font = `600 ${fs}px Lexend, Verdana, sans-serif`;
    for (const it of g.items){
      cx.globalAlpha = it.hit ? Math.max(0, 1 - it.fade/0.5) : 1;
      cx.fillStyle = C.panel; cx.strokeStyle = it.hit ? (it.real ? C.good : C.oops) : C.line; cx.lineWidth = 2;
      rr(cx, it.x - it.w/2, it.y - 20, it.w, 40, 14); cx.fill(); cx.stroke();
      cx.fillStyle = it.hit ? (it.real ? C.good : C.oops) : C.ink; cx.fillText(it.hit ? it.fx : it.word, it.x, it.y + 1);
    }
    cx.globalAlpha = 1;
    cx.fillStyle = C.sun; rr(cx, g.x-46, by-4, 92, 28, 10); cx.fill();
    cx.font = '30px sans-serif'; cx.fillText(p.av, g.x, by - 20);
    const hud = `Score ${g.score} · ${'❤️'.repeat(Math.max(0,g.lives))}${'🤍'.repeat(3-Math.max(0,g.lives))}`;
    if (hud !== g.hud){ g.hud = hud; const el = document.getElementById('gHud'); if (el) el.textContent = hud; }
    if (g.lives <= 0){ const s = g.score, f = g.fake; setTimeout(() => { if (G === g) endGame('catch', s, {fake:f}); }, 600); g.stop = true; return; }
    g.raf = requestAnimationFrame(frame);
  }
  g.raf = requestAnimationFrame(frame);
}

// Syllable Smash: tap chunks in order to build long words; 60 seconds.
function nextSmash(){
  const g = G, item = g.pool[g.i % g.pool.length], w = typeof item === 'string' ? item : item.w; g.i++;
  const parts = w.split('-'); let order = shuffle(parts.map((_,i)=>i));
  if (parts.length > 1 && order.every((x,i)=>x===i)) order.reverse();
  g.cur = {w: parts.join(''), parts, order, placed:[], done:false, p: typeof item === 'string' ? '' : item.p, bank: typeof item === 'string' ? '' : item.bank};
}
function vSmash(){
  const p = me();
  if (!G || G.k !== 'smash'){
    const read = Object.keys(p.done).map(storyById).filter(Boolean).flatMap(s => s.tricky.map(t => t[1])).filter(w => w.includes('-'));
    const base = [...new Set((p.grade >= 5 ? SMASH5 : SMASH3).concat(read))];
    // 3rd grade: about half the words come from this month's class spelling patterns, labelled with the pattern
    const spell = p.grade <= 4 ? SPELL3.flatMap(x => x.w.map(w => ({w, p:x.p}))) : [];
    const pool = []; const a = shuffle(spell), b = shuffle(base);
    while (a.length || b.length){ if (a.length) pool.push(a.pop()); if (b.length) pool.push(b.pop()); }
    pool.unshift(...shuffle(bankWords(p).map(k => ({w: syllables(k).join('-'), p:'Your tricky word', bank:k})).filter(x => x.w.includes('-'))).slice(0, 8));
    G = {k:'smash', pool, i:0, score:0, combo:1, left:60, words:0};
    G.timer = setInterval(() => {
      if (!G || G.k !== 'smash') return;
      G.left--; const el = document.getElementById('sTime'); if (el) el.textContent = G.left + 's';
      if (G.left <= 0){ const s = G.score, n = G.words; endGame('smash', s, {words:n}); }
    }, 1000);

  }
  const g = G, c = g.cur;

    ${c.p ? `<p style="text-align:center"><span class="chip school">✏️ ${c.bank ? esc(c.p) : 'Spelling pattern from class: ' + esc(c.p)}</span></p>` : ''}
    <div class="sslots">${c.parts.map((pt,i) => `<span class="sslot ${i < c.placed.length ? 'full' : ''}">${i < c.placed.length ? esc(pt) : ''}</span>`).join('')}</div>
    ${c.done ? `<p class="twdone" style="text-align:center">${esc(c.w)}! Say it out loud.</p>` :
    `<div class="chunks">${c.order.map(j => c.placed.includes(j) ? '' : `<button class="syl" data-a="${A((e,el)=>smashTap(j, el))}">${esc(c.parts[j])}</button>`).join('')}</div>
     <p class="mut" style="text-align:center">Tap the chunks in order to build the word.</p>`}
  </div>`;
}
function smashTap(j, el){
  const g = G; if (!g || g.k !== 'smash') return; const c = g.cur; if (c.done) return;
  if (c.parts[j] === c.parts[c.placed.length]){
    c.placed.push(j);
    if (c.placed.length === c.parts.length){
      c.done = true; g.words++; if (c.bank) bankOk(c.bank); g.score += 5*c.parts.length*g.combo; g.combo = Math.min(5, g.combo+1);
      render(); setTimeout(() => { if (G === g){ nextSmash(); render(); } }, 900);
    } else render();
  } else { g.combo = 1; el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }

// Memory Match family: the same flip-and-match game, each version practising a reading skill.
//   match   = word and picture        meaning = word and what it means (story words + word bank)
//   chunks  = two halves of a word     prefix  = a word part and what it means
const MATCH_KINDS = ['match','meaning','chunks','prefix'];
const MATCH_HOW = {
  match:'Match each word with its picture. Read the word out loud when you flip it!',
  meaning:'Match each word with what it means. Read both cards out loud!',
  chunks:'Match the two halves that make a word. Say the whole word when you find it!',
  prefix:'Match each word with what it means. Some words share a root, like careful and careless, so look closely at the beginning and the end!'};
// [part, meaning, example word, group]; parts in the same group mean nearly the same thing and never share a board
const AFFIX = {
  3:[['un-','not','unlock','not'],['re-','again','redo','again'],['pre-','before','preview','before'],['dis-','the opposite of','disagree','opp'],
     ['-ful','full of','hopeful','full'],['-less','without','fearless','without'],['-er','a person who does it','teacher','person'],['-ly','in a way that is','quickly','way']],
  5:[['mis-','wrongly','misspell','wrong'],['non-','no or none','nonstop','not'],['sub-','under or below','submarine','under'],['inter-','between','interstate','between'],
     ['-able','can be done','readable','can'],['-ment','the act or result of','movement','act'],['-ness','the state of being','kindness','state'],['-ous','having a lot of','joyous','full'],
     ['-ist','a person who studies or does','artist','person'],['-ward','in the direction of','homeward','dir'],['multi-','many','multicolor','many']]};
// Each reader remembers the last words each matching game showed, and new boards use words not seen recently first.
const SEEN_KEEP = 80;
function seenList(p, kind){ p.seen = p.seen || {}; return p.seen[kind] || (p.seen[kind] = []); }
function markSeen(p, kind, keys){ const l = seenList(p, kind).filter(k => !keys.includes(k)); l.push(...keys); p.seen[kind] = l.slice(-SEEN_KEEP); save(); }
// fresh-first order: never-seen words shuffled, then seen words oldest first
function freshOrder(p, kind, list, key){
  const seen = seenList(p, kind), pos = new Map(seen.map((k,i) => [k,i]));
  const fresh = shuffle(list.filter(x => !pos.has(key(x)))), old = list.filter(x => pos.has(key(x))).sort((a,b) => pos.get(key(a)) - pos.get(key(b)));
  return fresh.concat(old);
}
function uniqBy(list, key){ const s = new Set(); return list.filter(x => { const k = key(x); if (s.has(k)) return false; s.add(k); return true; }); }
function matchPairs(kind, p){
  const hi = p.grade >= 5, bank = bankWords(p), MW = MATCHWORDS;
  if (kind === 'match'){
    const pool = uniqBy((hi ? PICS5.concat(MW.pics5) : PICS3.concat(MW.pics3)), x => x[0]);
    const out = [], emo = new Set();
    for (const [w,e] of freshOrder(p, kind, pool, x => x[0])){ if (emo.has(e)) continue; emo.add(e); out.push({a:w, b:e, aw:true, bw:false, key:w}); if (out.length === 6) break; }
    return out;
  }
  if (kind === 'meaning'){
    // up to 2 review words (the reader's word bank, then words from stories read in the last few days), the rest new vocabulary
    const lv = s => hi ? s.lvl >= 4 : s.lvl <= 4, recent = addDays(-4);
    const stories = allStories().concat(chapterStories()).filter(lv);
    const review = [];
    bank.forEach(k => { const d = (EXTRA.defs||{})[k]; if (d) review.push({w:k, def:d, bank:k}); });
    stories.filter(s => p.done[s.id] && p.done[s.id].d >= recent).forEach(s => s.tricky.forEach(t => { const d = defOf(t[0], s); if (d) review.push({w:t[0], def:d}); }));
    const vocab = (hi ? MW.vocab5 : MW.vocab3).map(([w, def]) => ({w, def}));
    const out = [], words = new Set(), defs = new Set();
    const take = x => { const k = bankKey(x.w); if (words.has(k) || defs.has(x.def)) return false; words.add(k); defs.add(x.def); out.push({a:x.w, b:x.def, aw:true, bw:false, bank:x.bank||'', key:k}); return true; };
    for (const x of freshOrder(p, kind, uniqBy(review, x => bankKey(x.w)), x => bankKey(x.w))){ if (out.length >= 2) break; take(x); }
    for (const x of freshOrder(p, kind, vocab, x => bankKey(x.w))){ if (out.length >= 5) break; take(x); }
    return shuffle(out);
  }
  if (kind === 'chunks'){
    const base = hi ? MW.chunks5.concat(SMASH5) : MW.chunks3.concat(SPELL3.flatMap(x => x.w), SMASH3);
    const words = uniqBy(base.map(w => ({parts:w.split('-'), bank:''})), x => x.parts.join('').toLowerCase());
    const banked = bank.map(k => ({parts:syllables(k), bank:k})).filter(x => x.parts.length >= 2);
    const firsts = new Set(), seconds = new Set(), out = [];
    const order = banked.slice(0, 2).concat(freshOrder(p, kind, words, x => x.parts.join('').toLowerCase()));
    for (const x of order){
      if (x.parts.length < 2) continue;
      const h = Math.ceil(x.parts.length/2), a = x.parts.slice(0,h).join('').toLowerCase(), b = x.parts.slice(h).join('').toLowerCase();
      if (firsts.has(a) || seconds.has(b)) continue;
      firsts.add(a); seconds.add(b); out.push({a:a+'-', b:'-'+b, aw:true, bw:true, done:a+b, bank:x.bank, key:a+b});
      if (out.length === 6) break;
    }
    return out;
  }
  // prefix: words that share a root sit on the same board (careful, careless), so the word part is what tells them apart
  const items = uniqBy((hi ? MW.affix5.concat(MW.affix3.slice(0)) : MW.affix3), x => x.word);
  const fam = new Map(); items.forEach(x => { if (!fam.has(x.root)) fam.set(x.root, []); fam.get(x.root).push(x); });
  const roots = freshOrder(p, kind, [...fam.keys()], r => r);
  const out = [], meanings = new Set();
  const take = x => { if (meanings.has(x.meaning) || out.some(o => o.a === x.word)) return; meanings.add(x.meaning); out.push({a:x.word, b:x.meaning, aw:true, bw:false, key:x.root}); };
  for (const r of roots){ const f = fam.get(r); if (f.length < 2 || out.length > 4) continue; shuffle(f).slice(0, 2).forEach(take); }
  for (const r of roots){ if (out.length >= 6) break; if (!out.some(o => o.key === r)) take(shuffle(fam.get(r))[0]); }
  return shuffle(out.slice(0, 6));
}

function vMatch(){
  const p = me(), kind = view.name.slice(2);
  if (!G || G.k !== kind){
    const pairs = matchPairs(kind, p);
    const cards = shuffle(pairs.flatMap((x,i) => [
      {pair:i, txt:x.a, word:x.aw, got:x.done || x.doneA || x.a},
      {pair:i, txt:x.b, word:x.bw, got:x.done || x.b, long: kind === 'meaning' || kind === 'prefix'}]));
    G = {k:kind, pairs, cards, open:[], got:new Set(), moves:0, lock:false};
    markSeen(p, kind, pairs.map(x => x.key));
  }
  const g = G, n = g.pairs.length, gm = GAMES[kind];
  app.innerHTML = `${topbar(()=>go({name:'arcade'}))}
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="row spread"><h2>${gm.icon} ${gm.name}</h2><span class="chip" style="font-size:1rem">Tries <b>${g.moves}</b> · Pairs ${g.got.size/2} of ${n}</span></div>
    <p class="mut">${MATCH_HOW[kind]}</p>
    <div class="mgrid ${n === 5 ? 'five' : ''}">${g.cards.map((c,i) => { const shown = g.open.includes(i) || g.got.has(i);
      return `<button class="mcard ${shown?'open':''} ${g.got.has(i)?'got':''} ${c.word?'word':''} ${c.long?'long':''}" aria-label="${shown ? esc(c.txt) : 'Hidden card'}" ${shown && c.word ? `style="font-size:${wordFs(g.got.has(i) ? c.got : c.txt, n)}rem"` : ''} data-a="${A(()=>matchTap(i))}">${shown ? esc(g.got.has(i) ? c.got : c.txt) : '★'}</button>`; }).join('')}</div>
  </div>`;
}
// long words shrink to fit their card instead of being cut or split mid-word
function wordFs(t, n){ const len = String(t).length, base = n === 5 ? 1.15 : 1.25, fit = n === 5 ? 6.5 : 7.5; return Math.max(0.74, Math.min(base, base*fit/len)).toFixed(2); }
function matchTap(i){
  const g = G; if (!g || !MATCH_KINDS.includes(g.k) || g.lock || g.open.includes(i) || g.got.has(i)) return;
  g.open.push(i);
  if (g.open.length === 2){
    g.moves++;
    const [a,b] = g.open;
    if (g.cards[a].pair === g.cards[b].pair){
      g.got.add(a); g.got.add(b); g.open = []; confetti(10);
      const pr = g.pairs[g.cards[a].pair]; if (pr.bank) bankOk(pr.bank);
      if (g.k === 'meaning' || g.k === 'prefix') skillMark('vocabulary', true);
      if (g.got.size === g.cards.length){ const m = g.moves, n = g.pairs.length; render(); setTimeout(() => endGame(g.k, Math.max(20, 100 - (m-n)*6), {moves:m}), 700); return; }
    } else { g.lock = true; setTimeout(() => { if (G === g){ g.open = []; g.lock = false; render(); } }, 1100); }
  }
  render();
}

// Hangman (balloon style): guess the word a letter at a time; the clue is its meaning. Each wrong letter pops a balloon.
const HANG_BALLOONS = 7, HANG_WORDS = 5;
// a word's syllables: the hand-made split from the word lists when there is one, else the automatic one
let _splits = null;
function splitOf(w){
  if (!_splits){ _splits = new Map(); MATCHWORDS.chunks3.concat(MATCHWORDS.chunks5, SMASH3, SMASH5, SPELL3.flatMap(x => x.w)).forEach(x => _splits.set(x.replace(/-/g,'').toLowerCase(), x.split('-')));
    allStories().concat(chapterStories()).forEach(s => s.tricky.forEach(t => _splits.set(t[0].toLowerCase(), t[1].split('-')))); }
  return _splits.get(String(w).toLowerCase()) || syllables(w);
}
function hangPick(p){
  const hi = p.grade >= 5, ok = w => /^[a-z]+$/.test(w) && w.length >= (hi ? 5 : 4) && w.length <= (hi ? 12 : 9);
  const vocab = (hi ? MATCHWORDS.vocab5 : MATCHWORDS.vocab3).map(([w, def]) => ({w:w.toLowerCase(), def})).filter(x => ok(x.w));
  const banked = bankWords(p).filter(k => ok(k) && (EXTRA.defs||{})[k]).map(k => ({w:k, def:EXTRA.defs[k], bank:k}));
  const list = banked.slice(0, 2).concat(freshOrder(p, 'hang', vocab, x => x.w));
  return uniqBy(list, x => x.w).slice(0, HANG_WORDS);
}
function vHang(){
  const p = me();
  if (!G || G.k !== 'hang'){
    G = {k:'hang', words: hangPick(p), i:0, guessed:new Set(), wrong:0, score:0, solved:0, hint:false, state:'play'};
    markSeen(p, 'hang', G.words.map(x => x.w));
    const key = e => { if (!G || G.k !== 'hang' || view.name !== 'g_hang') return; const c = (e.key||'').toLowerCase(); if (/^[a-z]$/.test(c)) hangGuess(c); else if (e.key === 'Enter' && G.state !== 'play') hangNext(); };
    addEventListener('keydown', key); G.cleanup = () => removeEventListener('keydown', key);
  }
  const g = G, x = g.words[g.i], left = HANG_BALLOONS - g.wrong;
  const slots = [...x.w].map(c => g.guessed.has(c) || g.state !== 'play' ? c : '');
  app.innerHTML = `${topbar(()=>go({name:'arcade'}))}
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="row spread"><h2>🎈 Hangman</h2><span class="chip" style="font-size:1rem">Word ${g.i+1} of ${g.words.length} · Score <b>${g.score}</b></span></div>
    <div class="hballoons" aria-label="${left} balloons left">${'🎈'.repeat(left)}${'<span class="popped">💥</span>'.repeat(g.wrong)}</div>
    <div class="havatar">${p.av}</div>
    <p class="hclue"><span class="skill">Clue</span><br>${esc(x.def)}</p>
    <div class="hslots">${slots.map(c => `<span class="hslot ${g.state==='lost' && !g.guessed.has(c) ? 'miss' : ''}">${esc(c)}</span>`).join('')}</div>
    ${g.state === 'play' ? `<div class="hkeys">${'abcdefghijklmnopqrstuvwxyz'.split('').map(c => { const used = g.guessed.has(c), hit = used && x.w.includes(c);
        return `<button class="hkey ${used ? (hit ? 'hit' : 'miss') : ''}" ${used ? 'disabled' : ''} data-a="${A(()=>hangGuess(c))}">${c}</button>`; }).join('')}</div>
      <div class="row">${g.hint ? '' : `<button class="btn ghost small" data-a="${A(hangHint)}">💡 Show me one letter</button>`}<span class="mut">${x.w.length} letters</span></div>`
    : `<div class="result">${g.state === 'won' ? '🎉 You got it!' : 'The balloons are gone. The word was:'} <b>${esc(splitOf(x.w).join('-'))}</b>. Say it out loud!<br>It means: ${esc(x.def)}</div>
      <div><button class="btn" data-a="${A(hangNext)}">${g.i + 1 >= g.words.length ? 'Finish' : 'Next word'}</button></div>`}
  </div>`;
}
function hangGuess(c){
  const g = G; if (!g || g.k !== 'hang' || g.state !== 'play' || g.guessed.has(c)) return;
  const x = g.words[g.i]; g.guessed.add(c);
  if (!x.w.includes(c)) g.wrong++;
  if ([...x.w].every(ch => g.guessed.has(ch))){
    g.state = 'won'; g.solved++; g.score += 10 + 2*(HANG_BALLOONS - g.wrong) - (g.hint ? 3 : 0);
    skillMark('vocabulary', true); if (x.bank) bankOk(x.bank); confetti(30);
  } else if (g.wrong >= HANG_BALLOONS){ g.state = 'lost'; skillMark('vocabulary', false); }
  render();
}
function hangHint(){
  const g = G; if (!g || g.hint || g.state !== 'play') return;
  const x = g.words[g.i], missing = [...new Set(x.w)].filter(c => !g.guessed.has(c));
  if (!missing.length) return; g.hint = true; hangGuess(missing[Math.floor(Math.random()*missing.length)]);
}
function hangNext(){
  const g = G; if (!g || g.k !== 'hang' || g.state === 'play') return;
  if (g.i + 1 >= g.words.length){ endGame('hang', g.score, {solved:g.solved, total:g.words.length}); return; }
  g.i++; g.guessed = new Set(); g.wrong = 0; g.hint = false; g.state = 'play'; render();
}

// ---------- Celebration ----------
function floatText(t){ const d = document.createElement('div'); d.className = 'float'; d.textContent = t; document.body.appendChild(d); setTimeout(()=>d.remove(), 1200); }
const fx = document.getElementById('fx'), ctx = fx.getContext('2d'); let parts = [], fxOn = false;
function confetti(n){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  fx.width = innerWidth; fx.height = innerHeight;
  const cols = ['#f4b324','#2a5bd7','#1c8f5a','#e2553a','#9b6bff'];
  for (let i=0;i<n;i++) parts.push({x:innerWidth/2, y:innerHeight*0.45, vx:(Math.random()-.5)*12, vy:-Math.random()*12-4, r:4+Math.random()*5, c:cols[i%cols.length], life:70+Math.random()*30});
  if (!fxOn){ fxOn = true; requestAnimationFrame(tick); }
}
function tick(){
  ctx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.life--; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.r, p.r*1.6); });
  parts = parts.filter(p => p.life > 0 && p.y < fx.height+20);
  if (parts.length) requestAnimationFrame(tick); else { fxOn = false; ctx.clearRect(0,0,fx.width,fx.height); }
}

   {title: 'The Mighty Mississippi', t: 'The Mississippi River is one of the longest rivers in North America. It begins as a small, clear stream flowing out of Lake Itasca in northern Minnesota. At that point, it is narrow enough that visitors can walk across it on a row of stepping stones. From there, the river travels about two thousand three hundred miles south until it empties into the Gulf of Mexico. Along the way, it grows enormous. Hundreds of smaller rivers and streams join it, including the Missouri and the Ohio. By the time it reaches Louisiana, parts of the river are more than a mile wide. For thousands of years, the Mississippi has been important to the people who live near it. Native American nations built towns along its banks and traveled its waters in canoes. Later, steamboats carried cotton, lumber, and passengers up and down the river. Today, huge barges still move grain, coal, and other goods along its route. The river also shapes the land itself. Each spring, melting snow and heavy rain can cause floods. When the water spreads across the land, it leaves behind rich soil that farmers depend on to grow their crops.'},

   {title: 'Why Leaves Change Color', t: 'Every autumn, many trees in cooler parts of the world put on a brilliant show. Their green leaves turn shades of yellow, orange, red, and purple before drifting to the ground. This change is not magic. It is chemistry. During spring and summer, leaves are packed with a substance called chlorophyll. Chlorophyll gives leaves their green color, and it also helps them capture energy from sunlight. Leaves use that energy to turn water and carbon dioxide into sugar, which feeds the tree. This process is called photosynthesis. Leaves also contain yellow and orange substances, but during the summer there is so much chlorophyll that these colors stay hidden. As autumn arrives, the days grow shorter and the nights grow cooler. Trees begin to prepare for winter, when there is not enough sunlight or liquid water to keep making food. They slowly stop producing chlorophyll. As the green fades away, the hidden yellows and oranges finally appear. Some trees, such as red maples, also make new red and purple pigments in the fall. Weather affects the show too. Sunny days and cool nights usually produce the brightest colors, while an early frost can make leaves turn brown quickly.'}
  ]

    {t:'Jonah Price and Felix Hill had built the tree house in the old maple behind Jonah\'s house the summer they were nine. Two summers later, it was still the most important place in Jonah\'s world. Painted on the trapdoor, in letters that had faded to pale orange, was their one and only rule: MEMBERS ONLY, TWO MAXIMUM. Felix had suggested it as a joke, but Jonah had taken it seriously. To him, the rule meant something permanent. People changed schools, teachers, and haircuts, but the tree house stayed the same. Every Saturday, the boys climbed up with a bag of pretzels and a stack of comic books, and nothing interrupted them. At least, nothing had until this particular Saturday.',
     q:'What does the rule on the trapdoor show about Jonah?', o:['He wants things in his life to stay the same','He wants to meet as many new people as possible','He does not really care about the tree house'], e:'To him, the rule meant something permanent.', k:'character'},
    {t:'That morning, Jonah\'s mom had announced that Pop, Jonah\'s grandfather, was moving in. Pop had lived alone in a small apartment across town since Grandma died, but lately he had been forgetting to eat lunch and leaving the stove on. "He needs family nearby," Mom explained gently. "And he\'ll need your room, Jonah. You can share with your little brother." Jonah stared at his cereal until it turned soggy. He loved Pop, but Pop was quiet and old-fashioned, and he smelled like peppermints and motor oil. Jonah never knew what to say to him. Now he was losing his room, his privacy, and maybe his Saturday mornings, all at once.',

  {title:'Two Maximum',
   tricky:[['easygoing','eas-y-go-ing','relaxed and not easily upset'],['disappeared','dis-ap-peared','went out of sight'],['maximum','max-i-mum','the most allowed'],['understanding','un-der-stand-ing','knowing what something means']],
   recall:{q:'In Chapter 1, what was Kate carrying when she arrived at the tree house?', o:['A toolbox','A bag of pretzels','A stack of comic books']},
   pages:[
    {t:'"Sorry," Jonah said, and his voice came out harder than he meant it to. "Members only. Two maximum. You know the rule." Felix laughed, waiting for Jonah to laugh too. When he didn\'t, Felix\'s smile slowly disappeared. Kate shifted her toolbox to her other hand and studied the grass. "It\'s fine," she said quietly. "I should finish unpacking anyway." "No, wait," Felix said. He squinted up at Jonah. "That rule was a joke, man. I made it up when we were nine." "Well, I didn\'t think it was a joke," Jonah replied. The words hung in the air between them like a rope pulled too tight, ready to snap. Neither of them said anything for a long, awful moment.',
     q:'What does the simile "like a rope pulled too tight" suggest about the friendship?', o:['The friendship is tense and could break','The boys are about to play tug-of-war','Jonah needs a new rope for the ladder'], e:'like a rope pulled too tight, ready to snap', k:'vocabulary'},
    {t:'Felix was usually the most easygoing person Jonah knew. He never stayed angry for more than five minutes, and he shared his snacks with anybody who asked. So it surprised Jonah when Felix crossed his arms. "You know what, Jonah? You\'re acting like the tree house is a castle and you\'re the king," Felix said. "Kate is nice. You haven\'t even said hello to her." Jonah felt his face burn. He knew Felix was partly right, which only made him angrier. "Then go hang out at her house," he snapped. Felix stared at him for a long moment. Then he turned and walked away with Kate, and he did not look back.',
     q:'Why is it surprising that Felix crosses his arms and argues?', o:['Felix is usually easygoing and rarely gets angry','Felix is always grumpy with everyone','Felix has never liked the tree house'], e:'Felix was usually the most easygoing person Jonah knew.', k:'character'},
    {t:'Jonah stayed in the tree house all afternoon, reading the same comic book three times without understanding a single page. He told himself he was glad to have the place to himself. That was the whole point of the rule, wasn\'t it? But the tree house felt larger and emptier than it ever had. At dinner, Pop tried to ask him about school, and Jonah answered with one-word replies until Pop gave up. The next morning, Jonah biked past Felix\'s street on his way to the store. He slowed down when he heard hammering. In Kate\'s backyard, Felix and Kate were nailing boards together, building something big, and they were both laughing.',
     q:'What does the tree house feeling "larger and emptier" show about Jonah?', o:['He misses Felix more than he wants to admit','He thinks the tree house needs more furniture','He is truly happy to be alone'], e:'But the tree house felt larger and emptier than it ever had.', k:'character'}

  {title:'Pop\'s Radio',
   tricky:[['magnifying','mag-ni-fy-ing','making something look bigger'],['patiently','pa-tient-ly','calmly, without hurrying or getting upset'],['regret','re-gret','to feel sorry about something you did'],['envelopes','en-ve-lopes','paper covers that hold letters']],
   recall:{q:'In Chapter 2, what did Jonah see when he biked past Kate\'s backyard?', o:['Felix and Kate building something and laughing','Felix sitting alone and looking sad','Kate painting a new rule on a trapdoor']},
   pages:[
    {t:'For three days, Jonah avoided everyone. He took the long way to the bus stop so he would not pass Felix\'s street, and he ate lunch in the library. At home, he stayed out of Pop\'s way. On the fourth evening, Pop knocked on the doorframe of the room Jonah now shared with his little brother, Matt. In his hands was an old radio with a cracked wooden case. "This was my father\'s," Pop said. "It hasn\'t worked in years. My eyes aren\'t good enough for the tiny parts anymore. Would you help me?" Jonah almost said no. Then he noticed how carefully Pop was holding it, as if it were a sleeping bird.',
     q:'What does the comparison to "a sleeping bird" tell the reader about the radio?', o:['It is precious and fragile to Pop','It makes chirping noises when it plays','It actually belongs to Matt'], e:'as if it were a sleeping bird', k:'vocabulary'},
    {t:'They worked at the kitchen table with a magnifying glass and a set of tiny screwdrivers. Pop explained each part patiently, never once hurrying Jonah, even when he dropped a screw on the floor for the third time. As they worked, Pop began to talk. He told Jonah about Walt, his best friend from when he was a boy. "We did everything together," Pop said. "Fished, built go-karts, fixed engines. Then Walt met a fellow named Henry at work, and suddenly it was the three of them. I didn\'t like that one bit." Pop tightened a wire. "So I said some things I regret. Walt stopped calling. That was fifty years ago."',
     q:'How is Pop\'s story about Walt similar to Jonah\'s problem?', o:['Both were jealous when a best friend made a new friend','Both of them loved going fishing','Both of them broke an old radio'], e:'and suddenly it was the three of them. I didn\'t like that one bit.', k:'character'},
    {t:'Jonah didn\'t say anything, but he listened harder than he had listened to anyone in weeks. Finally, Pop connected the last wire and turned the dial. At first there was only crackling static. Then, faintly, a trumpet came through, playing an old song. Pop closed his eyes and smiled. Later that night, Jonah went to the garage to return the screwdrivers to Pop\'s toolbox. Underneath the tray, he found a bundle of envelopes tied with string. The top one was addressed to Pop in shaky handwriting. The return address said Walter Dunn. Jonah turned it over. The envelope had never been opened, and the postmark was from just last spring.',
     q:'Why might Pop have never opened Walt\'s letter?', o:['He may be afraid of what Walt wrote','He did not have time to read his mail','He thought it was a bill from the bank'], e:'The envelope had never been opened', k:'inference'}
   ],
   seq:['Jonah avoids Felix and Pop for three days','Pop asks Jonah to help fix an old radio','Pop tells Jonah about his lost friend Walt','Jonah finds an unopened letter from Walt'],
   sum:['While fixing a radio, Pop shares how jealousy cost him his best friend, and Jonah discovers an unopened letter from that friend.','Pop and Jonah used a magnifying glass and tiny screwdrivers.','Pop tells Jonah to stop being friends with Felix.']},

  {title:'The Unopened Letter',
   tricky:[['apology','a-pol-o-gy','words that say you are sorry'],['protecting','pro-tect-ing','keeping something safe from harm'],['argument','ar-gu-ment','an angry talk where people disagree'],['lightning','light-ning','a bright flash in the sky during storms']],
   recall:{q:'In Chapter 3, who was Walt?', o:['Pop\'s best friend from when he was a boy','Jonah\'s new science teacher','Kate\'s older brother']},
   pages:[
    {t:'Jonah carried the envelope inside and set it on the table in front of Pop. For a long moment, Pop just looked at it. "Walt wrote you last spring," Jonah said. "Why didn\'t you open it?" Pop rubbed his thumb across the shaky handwriting. "Because I was a coward," he admitted. "I figured it was either an apology or an argument. If it was an apology, I would have to admit I was wrong too. If it was an argument, I would lose him all over again." He set the letter down. "Pride is a funny thing, Jonah. It feels like strength, but mostly it just keeps you lonely." Jonah felt the words land somewhere deep inside him.',
     q:'What does Pop mean when he says pride "keeps you lonely"?', o:['Being too proud to admit mistakes can push people away','Proud people prefer to live alone','Pride makes you stronger than your friends'], e:'It feels like strength, but mostly it just keeps you lonely.', k:'main idea'},
    {t:'Jonah lay awake that night listening to Matt snore. He kept thinking about the faded letters on the trapdoor and about Felix\'s face when Jonah said the rule wasn\'t a joke. He had told himself that he was protecting the tree house. Now he wondered whether he had really been protecting himself, from the fear that Felix would like Kate better. At breakfast, Jonah tore a page from his notebook and wrote a note. It was short, because every longer version sounded wrong. "I was a jerk. I\'m sorry. The rule was dumb. Jonah." He slipped it into Felix\'s mailbox on his way to school, his heart thudding the whole time.',
     q:'How has Jonah changed since Chapter 2?', o:['He realizes he was wrong and decides to apologize','He decides to put a lock on the tree house','He becomes even angrier at Felix'], e:'"I was a jerk. I\'m sorry. The rule was dumb. Jonah."', k:'character'},
    {t:'Felix did not answer that day, or the next. Jonah checked his own mailbox so many times that Matt started teasing him about it. Maybe Pop had been right to be afraid, Jonah thought. Maybe some things could not be fixed once they were broken. On Friday night, a storm rolled in. Thunder shook the windows, and wind howled through the backyard. Jonah sat at the window with Pop, watching the maple tree bend and sway. Then, with a crack louder than any thunder, a huge branch split away from the trunk. In the next flash of lightning, Jonah saw the tree house tilting sideways, half its floor hanging in the air.',
     q:'Why might the author have the storm break the tree house right after Jonah worries about broken things?', o:['It makes Jonah\'s fear feel real and raises the stakes','It shows that Felix has finally answered the note','It makes the ending feel calm and peaceful'], e:'Maybe some things could not be fixed once they were broken.', k:'inference'}
   ],
   seq:['Jonah asks Pop why he never opened the letter','Pop explains how pride kept him lonely','Jonah writes an apology note to Felix','A storm breaks the tree house'],
   sum:['After Pop admits that pride kept him from his friend, Jonah apologizes to Felix, but then a storm wrecks the tree house.','Matt snores loudly at night.','Felix answers Jonah\'s note right away, and they fix the tree house together.']},

   pages:[
    {t:'In the morning, the backyard was a mess of leaves and splintered boards. Jonah stood at the bottom of the maple, staring at what was left of the tree house. The trapdoor lay in the mud, its orange letters facing the sky. He was trying not to cry when he heard footsteps. Felix was walking up the driveway. Kate was right behind him, carrying her patched backpack and her toolbox. "I got your note," Felix said. "Sorry I took so long. I was still kind of mad." He looked up at the broken floor. "Kate and I have been practicing on her shed. We figured you might need some help."',
     q:'What does Felix\'s choice to come and help show about him?', o:['He is forgiving and still cares about Jonah','He wants to take over the tree house','He is still too angry to talk'], e:'We figured you might need some help.', k:'character'},
    {t:'Jonah swallowed hard. He turned to Kate. "I\'m sorry I didn\'t even say hello," he said. "That wasn\'t fair to you." Kate shrugged, but she was smiling. "I\'ve moved four times," she said. "Everybody is weird about new people at first." Then Pop came out of the house in his old work boots, carrying his own toolbox. All weekend, the four of them rebuilt the tree house. Pop showed them how to brace the beams so the next storm would not knock them loose. Kate wired a string of lights along the roof. When they finished, the new floor was wider than before, wide enough for three, or even four.',
     q:'Why might the author make the new floor wider than the old one?', o:['To show the friendship now has room for more people','Because the old wood was too heavy','To give Pop a place to sleep'], e:'the new floor was wider than before, wide enough for three, or even four', k:'inference'},
    {t:'That evening, Felix found the old trapdoor in the mud and held it up. "What should we do with the rule?" he asked. Jonah thought for a moment. Then he took a can of paint and wrote across the faded letters in bright blue: ALWAYS ROOM FOR ONE MORE. Inside the house, Pop was sitting at the kitchen table with the radio playing softly. In his hand was Walt\'s letter, finally open. He looked up as Jonah came in, his eyes shining. "Walt says he has been wanting to call for years," Pop said, reaching for the phone. "I think it\'s time I let him." Out in the yard, the new lights in the tree house flickered on, one by one.',
     q:'How does the new rule show how Jonah has changed?', o:['He now welcomes others instead of keeping them out','He wants the tree house to be private again','He thinks only Pop should be allowed inside'], e:'ALWAYS ROOM FOR ONE MORE', k:'character'}

// ---------- Daily reading minutes (matches the class reading logs) ----------
function goalOf(p){ return p.goal || (p.grade >= 5 ? 20 : 15); }
function minsToday(p){ return Math.floor(((p.daily||{})[today()]||0)); }
function addMinutes(m){
  const p = me(); if (!p || !(m > 0)) return;
  m = Math.min(m, 15); // one sitting never counts more than 15 minutes (a page left open is not reading)
  p.minutes = (p.minutes||0) + m; p.daily = p.daily || {};
  const t = today(); p.daily[t] = (p.daily[t]||0) + m; save();
  if (p.goalPaid !== t && minsToday(p) >= goalOf(p)){ p.goalPaid = t; save(); giveTickets(1); addCoins(10, 'daily goal!'); confetti(50); }
}
function ringSvg(p){
  const done = Math.min(1, minsToday(p)/goalOf(p)), r = 26, c = 2*Math.PI*r;
  return `<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--soft)" stroke-width="8"/>
    <circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--good)" stroke-width="8" stroke-linecap="round" stroke-dasharray="${c*done} ${c}" transform="rotate(-90 32 32)"/>
    <text x="32" y="37" text-anchor="middle" font-size="15" font-weight="700" fill="var(--ink)" font-family="Baloo 2, sans-serif">${minsToday(p)}</text></svg>`;
}

// ---------- Word bank: the words this reader actually struggles with ----------
const BANK_SKIP = new Set('the and a an to of in is it was he she they you i we on at for with his her that this but not are be as had have said from or one all were so up out can no if my me do did what when there then them some him its our your'.split(' '));
function bankKey(w){ return String(w).toLowerCase().replace(/[’']s$/,'').replace(/[^a-z]/g,''); }
function bankAdd(w, src, ctx){
  const p = me(); if (!p) return; const k = bankKey(w);
  if (k.length < 4 || BANK_SKIP.has(k)) return;
  p.bank = p.bank || {}; const b = p.bank[k] || (p.bank[k] = {n:0, ok:0, d:today()});
  // a word counts once per page (or per practice session), so tapping it twice on one page is not "routinely"
  const occ = (view.name === 'read' && R) ? R.s.id + '#' + R.page : view.name + '|' + (view.psg ? view.psg.title : '') + '|' + today();
  b.occ = b.occ || [];
  if (!b.occ.includes(occ)){ b.n++; b.occ.push(occ); if (b.occ.length > 8) b.occ.shift(); }
  b.ok = 0; b.d = today(); if (src) b.src = src;
  if (!ctx && view.words){ const w0 = view.words.find(x => bankKey(x.raw) === k); const txt = (view.name === 'read' && R) ? R.s.pages[R.page].t : (view.psg && view.psg.t); if (w0 && txt) ctx = sentenceAt(txt, w0.at); }
  if (ctx) b.ctx = ctx;
  save();
}
function bankOk(w){
  const p = me(), k = bankKey(w); if (!p || !p.bank || !p.bank[k]) return;
  p.bank[k].ok++;
  if (p.bank[k].ok >= 3){ delete p.bank[k]; p.mastered = (p.mastered||0) + 1; floatText('Mastered: ' + k + '!'); }
  save();
}
function bankWords(p){ const b = p.bank || {}; return Object.keys(b).sort((x,y) => b[y].n - b[x].n); }

// ---------- Today's Quest ----------
function questToday(p){ p.quest = p.quest || {}; return p.quest[today()] || {}; }
function questItems(p){
  const q = questToday(p), f = p.focus || {}, ch = nextChapter(p);
  const items = [
    {k:'gym', icon:'🏋️', label:'Fluency Gym: read one passage 3 times', run:()=>go({name:'gym'})},
    ...(focusWords(p).length || q.focus ? [{k:'focus', icon:'🎯', label:`Focus words: practise ${Math.min(6, focusWords(p).length) || 'your'} word${focusWords(p).length === 1 ? '' : 's'}`, run:()=>go({name:'focus'})}] : []),
    {k:'story', icon:'📖', label: ch && !ch.locked ? `Read today's chapter of ${ch.se.title}` : 'Read a story', run:()=> ch && !ch.locked ? go({name:'intro', id:ch.story.id}) : go({name:'library', tab:'rec'})}];
  if (vaultDue().length || q.vault) items.push({k:'vault', icon:'🔐', label:'Open the Memory Vault', run:()=>go({name:'vault', items:shuffle(vaultDue()).slice(0,6), i:0})});
  // matching games are the favourite, so they alternate day by day with the other practice games
  const odd = Math.floor(Date.now() / 86400000) % 2 === 1;
  const fp = (k, label) => ({k, icon:GAMES[k].icon, label: `${GAMES[k].name}: ${label} (free play)`, run:()=>startGame(k, true)});
  if (f.phonics) items.push(odd ? fp('smash', 'your tricky words') : fp('chunks', 'snap word halves together'));
  if (f.vocab) items.push(odd ? fp('parts', 'prefixes and suffixes') : fp('meaning', 'words from your stories'));
  if (!f.phonics && !f.vocab) items.push(odd ? fp('prefix', 'word parts') : fp('meaning', 'words from your stories'));
  return items.map(i => Object.assign(i, {done: !!q[i.k]}));
}
function questMark(k){
  const p = me(); if (!p) return; p.quest = p.quest || {}; const t = today();
  for (const d of Object.keys(p.quest)) if (d < addDays(-14)) delete p.quest[d];
  const q = p.quest[t] || (p.quest[t] = {});
  if (q[k]) return; q[k] = true; save();
  const items = questItems(p);
  if (items.some(i => i.k === k) && items.every(i => i.done) && !q.paid){ q.paid = true; save(); giveTickets(1); addCoins(20, 'quest complete!'); confetti(90); }
}

// ---------- Chapter books (one chapter a day) ----------
let _chapters = null;
function chapterStories(){
  if (_chapters) return _chapters;
  _chapters = SERIES.flatMap(se => se.chapters.map((c, n) => ({
    id: se.id + '-c' + (n+1), title: `${se.title}, Chapter ${n+1}: ${c.title}`, icon: se.icon, cat:'series', lvl: se.lvl,
    tricky: c.tricky, pages: c.pages, seq: c.seq, sum: c.sum, recall: c.recall, series: se.id, chap: n, chapters: se.chapters.length,
    prevSum: n ? se.chapters[n-1].sum[0] : null})));
  return _chapters;
}
function seriesState(p, sid){ p.series = p.series || {}; return p.series[sid] || {ch:0, d:''}; }
function chapterInfo(p, se){
  const st = seriesState(p, se.id), n = st.ch;
  if (n >= se.chapters.length) return {se, done:true, n};
  return {se, n, locked: n > 0 && st.d >= today(), story: chapterStories().find(c => c.id === se.id + '-c' + (n+1))};
}
function seriesFor(p){ return SERIES.filter(se => p.grade >= 5 ? se.lvl >= 4 : se.lvl <= 4); }
function nextChapter(p){ const list = seriesFor(p).map(se => chapterInfo(p, se)).filter(c => !c.done); return list.find(c => !c.locked) || list[0] || null; }

// ---------- Fluency Gym: repeated reading ----------
const gymT = {timer:null};

function gymPassage(p, avoid){

}

function gymStart(){

function gymDone(secsIn){
  const v = view, p = me(); if (!v.run) return;

}

function season(d){ const m = +d.slice(5,7); return (m >= 8 && m <= 11) ? 0 : (m === 12 || m <= 2) ? 1 : 2; }

function checkStart(){

const KEY_SKIP = new Set('with that this from they then when were have into about after back down over their there what your will just very more came made took said them each every went could would which while where before because again still also only first last next other some than these those once upon long time story chapter little great really people found began asked'.split(' '));

    const k = bankKey(raw); if (k.length >= 4 && !KEY_SKIP.has(k) && !out.includes(k)) out.push(k);

}

function retellStart(){
  const v = view; stopRetell(); v.on = true; render();

  retellRec = rec; rec.lang = 'en-US'; rec.continuous = true; rec.interimResults = true; v.base = v.txt || '';
  rec.onresult = e => { let t = ''; for (let i=0;i<e.results.length;i++) t += e.results[i][0].transcript + ' ';
    v.txt = (v.base + ' ' + t).trim(); const heard = v.txt.toLowerCase().split(/\s+/).map(bankKey);
    let changed = false;
    for (const k of v.keys) if (!v.said.has(k) && heard.some(h => h === k || (h.length >= 4 && (k.startsWith(h.slice(0, Math.max(4, h.length-2))) || h.startsWith(k.slice(0, Math.max(4, k.length-2))))))){ v.said.add(k); changed = true; }

  try{ rec.start(); }catch(e){}
}
function retellDone(){
  const v = view; stopRetell(); v.on = false;

}

// ---------- Word meanings ----------
function defOf(word, s){
  const t = s && s.tricky ? s.tricky.find(x => x[0] === word) : null;
  return (t && t[2]) || (EXTRA.defs||{})[String(word).toLowerCase()] || '';
}

function nowTime(){ const d = new Date(); return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0'); }
function logEvent(type, title, extra){
  const p = me(); if (!p) return;

const KIND_LBL = {fun:'story', tales:'folktale, myth or poems', fiction:'realistic fiction', people:'biography', series:'chapter book', mine:'story'};
function kindOf(s){ if (!s) return 'story'; if (s.id === 'weather') return 'poems'; if (s.cat === 'tales') return /myth|Midas/i.test(s.title) ? 'myth' : 'folktale'; return KIND_LBL[s.cat] || 'story'; }
function fmtTime(t){ const [h, m] = t.split(':').map(Number); return `${(h % 12) || 12}:${String(m).padStart(2,'0')} ${h < 12 ? 'AM' : 'PM'}`; }
function niceDate(d, long){ return new Date(d + 'T12:00').toLocaleDateString(undefined, long ? {weekday:'long', month:'long', day:'numeric'} : {weekday:'short', month:'numeric', day:'numeric'}); }
// Everything one reader did on one day. Days before the log existed fall back to finished stories and minutes.
function dayData(p, d){
  const log = (p.log||[]).filter(e => e.d === d);
  let reads = log.filter(e => e.type === 'story' || e.type === 'chapter');
  const first = (p.log||[]).length ? p.log[0].d : null;

  const words = [];
  for (const r of reads){ const s = storyById(r.id); if (s) for (const t of s.tricky){ const def = defOf(t[0], s); if (!words.some(w => w[0] === t[0])) words.push([t[0], def]); } }
  const practise = Object.entries(p.bank||{}).filter(([,b]) => b.d === d).sort((a,b) => b[1].n - a[1].n).map(([k,b]) => ({k, focus: b.n >= FOCUS_N}));
  return {d, practise, mins: Math.floor(((p.daily||{})[d]) || 0), reads, gym: log.filter(e => e.type === 'gym'), vault: log.filter(e => e.type === 'vault'),
    games: log.filter(e => e.type === 'game'), breaks: log.filter(e => e.type === 'break'), checks: log.filter(e => e.type === 'checkin'), words};
}

// ---------- Focus words: words a reader stumbles on again and again ----------
// Any word flagged on two different pages or days (unclear to the microphone, tapped for help, stuck on,
// or marked by a grown-up) becomes a focus word. Focus words show up everywhere until read correctly 3 times.
const FOCUS_N = 2;
function focusWords(p){ return bankWords(p).filter(k => p.bank[k].n >= FOCUS_N); }
function isFocus(p, k){ const b = (p && p.bank || {})[k]; return !!(b && b.n >= FOCUS_N); }
function meaningOf(k){
  k = String(k).toLowerCase();
  if ((EXTRA.defs||{})[k]) return EXTRA.defs[k];
  const v = MATCHWORDS.vocab3.concat(MATCHWORDS.vocab5).find(x => x[0].toLowerCase() === k);
  return v ? v[1] : '';
}
function sentenceAt(text, at){
  const t = String(text).replace(/\n/g, ' ');
  let a = at; while (a > 0 && !/[.!?]/.test(t[a-1])) a--;
  let b = at; while (b < t.length && !/[.!?]/.test(t[b])) b++;
  return t.slice(a, Math.min(t.length, b + 1)).replace(/^["\s]+/, '').trim().slice(0, 220);
}
// page words the microphone passed over without clearly hearing; longer words first, at most 4 a page
function unclearWords(){
  const words = view.words || [], heard = mic.heard || new Set(), out = [];
  for (let i = 0; i < Math.min(mic.ptr, words.length); i++){
    const k = bankKey(words[i].raw);
    if (!heard.has(i) && k.length >= 4 && !BANK_SKIP.has(k) && !out.some(o => o.k === k)) out.push({i, k});
  }
  return out.sort((a,b) => b.k.length - a.k.length).slice(0, 4);
}
function flagUnclear(text){
  const list = unclearWords();
  list.forEach(x => bankAdd(view.words[x.i].raw, 'mic', sentenceAt(text, view.words[x.i].at)));
  const heard = mic.heard || new Set();
  document.querySelectorAll('#passage .w').forEach((el, i) => el.classList.toggle('unclear', i < mic.ptr && !heard.has(i) && list.some(x => x.k === bankKey(view.words[i].raw))));
  return list;
}
function unclearHtml(list){
  if (!list.length) return '';
  const p = me();
  return `<div class="notice" style="margin-top:10px"><b>Words to practise:</b> ${list.map(x => `<span class="chip fwchip">${isFocus(p, x.k) ? '🎯 ' : ''}${esc(x.k)}</span>`).join(' ')}
    <p class="mut" style="font-size:.9rem;margin-top:4px">The iPad didn't hear these clearly. Tap an underlined word in the story to see it in chunks, then read it again out loud.${list.some(x => isFocus(p, x.k)) ? ' 🎯 means it is one of your focus words.' : ''}</p></div>`;
}
// listen for one word; cb(true) heard it, cb(false) did not, cb(null) no microphone
function listenFor(word, cb){
  stopRetell(); let rec;
  try{ rec = new SR(); }catch(e){ cb(null); return; }
  retellRec = rec; rec.lang = 'en-US'; rec.continuous = false; rec.interimResults = true;
  let done = false;
  const fin = ok => { if (done) return; done = true; clearTimeout(t); try{ rec.onend = null; rec.abort(); }catch(e){} if (retellRec === rec) retellRec = null; cb(ok); };
  const t = setTimeout(() => fin(false), 7000);
  rec.onresult = e => { const heard = heardText(e).split(/\s+/).map(norm); // 'pan cake' counts for pancake
    if (heard.some((h, i) => h === word || h + (heard[i+1]||'') === word || (word.length >= 6 && lev(h, word) <= 1))) fin(true); };
  rec.onerror = e => { if (['not-allowed','service-not-allowed','audio-capture'].includes(e.error)){ micBlocked = true; fin(null); } };
  rec.onend = () => fin(false);
  try{ rec.start(); }catch(e){ fin(null); }
}
function vFocus(){
  const p = me(), v = view;

  }

      <button class="btn" data-a="${A(()=>go({name:'hub'}))}">Today's quest</button></div>`;
    return;
  }
  const k = v.list[v.i], b = (p.bank||{})[k] || {ok:0}, parts = splitOf(k), def = meaningOf(k), canMic = SR && !micBlocked;
  const ctx = b.ctx ? esc(b.ctx).replace(new RegExp('\\b(' + k.replace(/[^a-z]/g,'') + ')\\b', 'i'), '<b>$1</b>') : '';
  app.innerHTML = `${topbar(()=>go({name:'hub'}))}
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="row spread"><h2>🎯 Focus words</h2><span class="chip">Word ${v.i+1} of ${v.list.length}</span></div>
    <p class="mut">Tap each chunk and say it. Then read the whole word out loud.</p>
    <div class="twrow" style="justify-content:center">${parts.map((pt,j) => `<button class="syl ${j < v.lit ? 'lit':''}" ${j===v.lit?`data-a="${A(()=>{ v.lit++; if (v.lit >= parts.length) v.state = 'say'; render(); })}"`:''} ${j>v.lit?'disabled':''}>${esc(pt)}</button>`).join('')}</div>
    ${v.lit >= parts.length ? `<p class="twdone" style="text-align:center;font-size:2.4rem">${esc(k)}</p>
      ${def ? `<p style="text-align:center">It means: ${esc(def)}</p>` : ''}
      ${ctx ? `<p class="mut" style="text-align:center">From your reading: “${ctx}”</p>` : ''}` : ''}
    <p style="text-align:center" aria-label="${b.ok} of 3 correct reads">${[0,1,2].map(j => j < (b.ok||0) ? '✅' : '⚪').join(' ')} <span class="mut">read it right 3 times to master it</span></p>
    <div class="row" style="justify-content:center">
      ${v.state === 'say' ? (canMic ? `<button class="btn sun" data-a="${A(()=>{ v.state = 'listening'; render(); listenFor(k, ok => { if (view !== v) return; if (ok === null){ v.state = 'say'; render(); return; } v.state = ok ? 'right' : 'again'; if (ok){ v.got++; bankOk(k); addCoins(3); confetti(15); } render(); }); })}">🎤 Say it</button>`
          : `<button class="btn" data-a="${A(()=>{ v.state = 'right'; v.got++; bankOk(k); addCoins(3); render(); })}">I read it out loud</button>`) : ''}
      ${v.state === 'listening' ? `<span class="listen"><i></i>Listening… say “${esc(k)}”</span>` : ''}
      ${v.state === 'right' ? `<span class="result">✓ Great reading!</span>` : ''}
      ${v.state === 'again' ? `<span class="notice">I didn't quite hear it.</span><button class="btn sun small" data-a="${A(()=>{ v.state = 'say'; render(); })}">Try again</button>` : ''}
      ${v.state === 'right' || v.state === 'again' ? `<button class="btn" data-a="${A(()=>{ v.i++; v.lit = 0; v.state = 'learn'; render(); })}">${v.i + 1 >= v.list.length ? 'Finish' : 'Next word'}</button>` : ''}
    </div>
  </div>`;
}

// ---------- Break Zone: just-for-fun games, open once Today's Quest is done ----------
// Each game lives in games/<id>.js and registers itself as window.BreakGames[id] = {start(el, api) -> cleanup}.
// Break games give no coins (reading stays the way to earn treasure); they keep their own best scores.
const BREAK_LIST = [
  {id:'bowling',  name:'Bowling',        icon:'🎳', players:'1-2', blurb:'Swipe to roll. Curve it, knock down all 10 pins!'},
  {id:'golf',     name:'Mini Golf',      icon:'⛳', players:'1-2', blurb:'Pull back to putt around walls and obstacles. 9 holes.', lower:true},
  {id:'hoops',    name:'Basketball',     icon:'🏀', players:'1',   blurb:'Flick the ball into the hoop. 60 seconds!'},
  {id:'penalty',  name:'Penalty Kicks',  icon:'⚽', players:'1',   blurb:'Swipe to shoot past the goalie.'},
  {id:'hockey',   name:'Table Hockey',   icon:'🏒', players:'1-2', blurb:'Play the computer, or a friend on the same iPad.'},
  {id:'fishing',  name:'Fishing',        icon:'🎣', players:'1',   blurb:'Cast, wait for a bite, reel it in. Fill your aquarium!'},
  {id:'stack',    name:'Tower Stacker',  icon:'🧱', players:'1',   blurb:'Drop the swinging blocks and build the tallest tower.'},
  {id:'space',    name:'Space Dodge',    icon:'🚀', players:'1',   blurb:'Steer through the asteroids and grab the stars.'},
  {id:'rings',    name:'Ring Toss',      icon:'🎪', players:'1',   blurb:'Toss rings onto the bottles at the fair.'},
  {id:'rollball', name:'Roll & Score',   icon:'🎯', players:'1',   blurb:'Roll the ball up the ramp into the scoring holes.'},
  {id:'balloons', name:'Balloon Pop',    icon:'🎈', players:'1',   blurb:'Toss suction balls to pop the floating balloons.'},
  {id:'draw',     name:'Drawing Pad',    icon:'🎨', players:'1',   blurb:'Draw, color and stamp. No score, just fun.', noScore:true},
  {id:'ttt',      name:'Tic-Tac-Toe',    icon:'❌', players:'1-2', blurb:'Three in a row. Play the computer or a friend.'},
  {id:'four',     name:'Four in a Row',  icon:'🔴', players:'1-2', blurb:'Drop discs and connect four.'},
  {id:'checkers', name:'Checkers',       icon:'⚫', players:'1-2', blurb:'Jump and crown your pieces.'}];
window.BreakGames = window.BreakGames || {};
let breakCleanup = null;
function breakStop(){ if (breakCleanup){ try{ breakCleanup(); }catch(e){} breakCleanup = null; } }
function breakOpen(p){ return !!questToday(p).paid; }
function breakApi(p, g){
  p.breakScores = p.breakScores || {}; p.breakStore = p.breakStore || {};
  const css = getComputedStyle(document.documentElement), c = n => css.getPropertyValue(n).trim();
  return {
    name: p.name, avatar: p.av, grade: p.grade,
    get best(){ const b = p.breakScores[g.id]; return b == null ? null : b; },
    saveScore(score){
      const prev = p.breakScores[g.id], isBest = prev == null || (g.lower ? score < prev : score > prev);
      if (isBest) p.breakScores[g.id] = score;
      p.breakPlays = (p.breakPlays||0) + 1; save();
      logEvent('break', g.name, {score});
      if (isBest) confetti(60);
      return {best: p.breakScores[g.id], isBest};
    },
    store: { get: k => (p.breakStore[g.id]||{})[k], set: (k, v) => { p.breakStore[g.id] = p.breakStore[g.id] || {}; p.breakStore[g.id][k] = v; save(); } },
    colors: {bg:c('--bg'), panel:c('--panel'), ink:c('--ink'), mut:c('--mut'), line:c('--line'), soft:c('--soft'), accent:c('--accent'), accentInk:c('--accent-ink'), good:c('--good'), oops:c('--oops'), sun:c('--sun')},
    reducedMotion: matchMedia('(prefers-reduced-motion: reduce)').matches,
    confetti: n => confetti(n||40),
    done: () => go({name:'break'})
  };
}
function loadBreakGame(id){
  return new Promise((ok, fail) => {
    if (window.BreakGames[id]) return ok(window.BreakGames[id]);
    const s = document.createElement('script'); s.src = 'games/' + id + '.js?v=1';
    s.onload = () => window.BreakGames[id] ? ok(window.BreakGames[id]) : fail(new Error('missing'));
    s.onerror = () => fail(new Error('load'));
    document.head.appendChild(s);
  });
}
function vBreak(){
  const p = me(), open = breakOpen(p), qi = questItems(p), left = qi.filter(i => !i.done);
  app.innerHTML = `${topbar(()=>go({name:'hub'}))}
  <div class="row spread"><h1>🎉 Break Zone</h1>${open ? '<span class="chip school">Open all day today!</span>' : ''}</div>
  ${open ? `<p class="mut">Just for fun. You finished today's quest, so play as much as you like.</p>` : `
  <div class="card" style="display:flex;flex-direction:column;gap:12px">
    <h2>🔒 Finish today's quest to open the Break Zone</h2>
    <p>${left.length} thing${left.length===1?'':'s'} left. Then every game here is open for the rest of the day!</p>
    <div class="qlist">${qi.map(i => `<button class="qitem ${i.done?'done':''}" ${i.done?'disabled':''} data-a="${A(i.run)}"><span class="qcheck">${i.done?'✓':''}</span><span>${i.icon} ${esc(i.label)}</span></button>`).join('')}</div>
  </div>`}
  <div class="games breakgrid ${open ? '' : 'locked'}">${BREAK_LIST.map(g => { const best = (p.breakScores||{})[g.id];
    return `<button class="gtile btile" ${open ? '' : 'disabled'} data-a="${A(()=>go({name:'breakgame', id:g.id}))}">
      <span class="big-emoji">${g.icon}</span><h3>${g.name}</h3><p class="mut">${g.blurb}</p>
      <span class="row" style="gap:6px">${g.players === '1-2' ? '<span class="chip">👥 1 or 2 players</span>' : ''}${best != null && !g.noScore ? `<span class="chip">🏆 Best ${best}</span>` : ''}</span></button>`; }).join('')}</div>`;
}
function vBreakGame(){
  const p = me(), g = BREAK_LIST.find(x => x.id === view.id) || (/^_/.test(view.id||'') ? {id:view.id, name:'Test', icon:'🧪', players:'1', blurb:''} : null);
  if (!g || !breakOpen(p)){ go({name:'break'}); return; }
  app.innerHTML = `<div class="row spread"><button class="btn ghost small" data-a="${A(()=>go({name:'break'}))}">← Break Zone</button>
    <h2>${g.icon} ${g.name}</h2><span class="chip">${p.av} ${esc(p.name)}</span></div>
    <div id="breakHost" class="breakhost"><p class="mut" style="padding:20px">Loading…</p></div>`;
  const host = document.getElementById('breakHost');
  host.style.height = Math.max(420, Math.min(820, window.innerHeight - 110)) + 'px';
  const myView = view;
  loadBreakGame(g.id).then(game => {
    if (view !== myView) return;
    host.innerHTML = '';
    breakCleanup = game.start(host, breakApi(p, g)) || null;
  }).catch(() => { if (view === myView) host.innerHTML = `<p class="notice" style="margin:20px">This game could not load. Check the internet connection and try again.</p>`; });
}

// ---------- Start ----------
if (S.cur && me()) view = {name:'hub'};
render();
</script>
