{id:'i3-04', g:3, title:`From Seed to Plant`, icon:'🌱', topic:'science',
text:`A seed may look like a tiny pebble, but it is full of life. Inside every seed is a baby plant. The seed also holds a supply of food. A hard outer layer, called the seed coat, protects everything inside.\n\nA seed can wait for a long time before it starts to grow. It needs three things to wake up: water, warmth, and air. When a seed gets all three, it begins to sprout. This is called germination.\n\n## How to Grow a Bean Seed\nYou can watch germination happen at home. Follow these steps.\n1. Wet a paper towel and fold it in half.\n2. Place three bean seeds on the towel.\n3. Slide the towel into a clear plastic bag, and leave the bag open a little.\n4. Tape the bag to a sunny window.\n5. Check the seeds every day, and add water if the towel feels dry.\n\nAfter a few days, the seed coat will split open. A tiny root will poke out first. The root always grows down, even if the seed is upside down. It soaks up water and holds the plant in place. Next, a shoot will push up toward the light. The shoot becomes the stem.\n\nSoon the first leaves will open. Until now, the young plant has been living on the food stored in the seed. Once it has leaves, it can make its own food. Leaves use sunlight, air, and water to make food for the plant. Now your bean plant is ready for a pot of soil. With care, it may one day grow beans with new seeds inside, and the cycle can start again.`,
words:[[`seed coat`,`the hard outer layer that protects a seed`],[`germination`,`when a seed starts to grow`],[`shoot`,`the first part of a new plant that grows up toward the light`]],
qs:[
{t:'one', k:'main idea', q:`What is the main idea of this passage?`, o:[`A seed holds a baby plant that grows when it gets water, warmth, and air.`,`Bean seeds grow best when they are kept in a dark closet.`,`Paper towels are the best place to grow every kind of plant.`,`Plants do not need sunlight, air, or water to make food.`], e:`It needs three things to wake up: water, warmth, and air.`},
{t:'one', k:'vocabulary', q:`Read this sentence from the passage: "When a seed gets all three, it begins to sprout." What does the word "sprout" mean?`, o:[`start to grow`,`dry out`,`fall apart`,`stay asleep`], e:`When a seed gets all three, it begins to sprout.`},
{t:'two', k:'text structure', a:{q:`What happens right after the seed coat splits open?`, o:[`A tiny root pokes out.`,`The first leaves open.`,`The plant grows beans.`,`The plant goes in soil.`]}, b:{q:`Which sentence from the passage best supports the answer to Part A?`, o:[`A tiny root will poke out first.`,`Soon the first leaves will open.`,`Tape the bag to a sunny window.`,`The shoot becomes the stem.`]}},
{t:'multi', k:'key details', q:`Which TWO jobs does the root do? Choose two answers.`, o:[`It soaks up water.`,`It holds the plant in place.`,`It makes food from sunlight.`,`It protects the baby plant.`,`It grows up toward the light.`], n:2},
{t:'one', k:'text features', q:`Why does the author use a numbered list?`, o:[`to show the steps for growing a bean seed in order`,`to count how many seeds are inside one bean`,`to name each of the parts of a plant`,`to tell how many days a seed can sleep`], e:`Follow these steps.`}
]},

{id:'i3-05', g:3, title:`A Second Life for Trash`, icon:'♻️', topic:'communities',
text:`Every week, families fill trash cans with bottles, cans, boxes, and paper. Much of that trash ends up in a landfill. A landfill is a huge area where garbage is buried in the ground. Some trash can stay there for hundreds of years without breaking down. Recycling is one way to send less trash to landfills.\n\nWhen you recycle, used things are turned into new things. A truck picks up the items from your bin and takes them to a recycling center. There, machines and workers sort everything. Magnets pull out steel cans. Other machines separate paper from plastic. Then each material is cleaned, melted, or mashed so it can be used again.\n\nThe results can be surprising. Old newspapers become new paper, cereal boxes, and egg cartons. Plastic bottles can be turned into carpet or even warm fleece jackets. An aluminum can is one of the best things to recycle. A recycled can may be back on a store shelf as a new can in about 60 days.\n\nRecycling saves more than space. Making a can from old cans uses much less energy than making one from new metal dug out of the ground. Recycling paper also means fewer trees are cut down.\n\n## How You Can Help\nRecycling works best when everyone does it the right way. Rinse food and drink out of containers before you put them in the bin. Keep plastic bags out of the bin unless your town says they are okay, because they can jam the sorting machines. Check your town's rules to learn what it accepts. Small choices at home can add up to a cleaner neighborhood for everyone.`,
words:[[`landfill`,`a big place where trash is buried`],[`material`,`what something is made of, like paper, metal, or plastic`],[`energy`,`the power needed to make things work or move`]],
qs:[
{t:'one', k:'main idea', q:`What is this passage mostly about?`, o:[`how recycling turns used things into new things and why it matters`,`how workers build a landfill and bury garbage in the ground`,`how magnets pull steel cans out of a pile of trash`,`why aluminum cans are shiny and easy to carry`], e:`When you recycle, used things are turned into new things.`},
{t:'one', k:'vocabulary', q:`Read this sentence from the passage: "Other machines separate paper from plastic." What does the word "separate" mean?`, o:[`pull apart into groups`,`melt together into one`,`throw away in the trash`,`paint a brand new color`], e:`There, machines and workers sort everything.`},
{t:'two', k:'text evidence', a:{q:`Why should people keep plastic bags out of the recycling bin?`, o:[`The bags can get stuck in the sorting machines.`,`The bags are too heavy for the recycling truck.`,`The bags are needed to make fleece jackets.`,`The bags are made of steel and need magnets.`]}, b:{q:`Which sentence from the passage best supports the answer to Part A?`, o:[`Keep plastic bags out of the bin unless your town says they are okay, because they can jam the sorting machines.`,`Magnets pull out steel cans.`,`Plastic bottles can be turned into carpet or even warm fleece jackets.`,`Check your town's rules to learn what it accepts.`]}},
{t:'multi', k:'key details', q:`Which TWO things can old newspapers become? Choose two answers.`, o:[`cereal boxes`,`egg cartons`,`fleece jackets`,`steel cans`,`new carpet`], n:2},
{t:'one', k:'author purpose', q:`What is the author's main purpose in the last paragraph?`, o:[`to tell readers how they can recycle the right way`,`to explain how magnets pull steel cans out`,`to describe what a big landfill looks like`,`to tell a funny story about a recycling truck`], e:`Recycling works best when everyone does it the right way.`}
]},

{id:'i3-06', g:3, title:`Staying Warm in the Arctic`, icon:'❄️', topic:'animals',
text:`The Arctic is the area around the North Pole. In winter, the sun may not rise for weeks, and the temperature can drop far below zero. Cold winds blow across ice and snow. It seems like nothing could live there. Yet many animals make their homes in the Arctic. Each one has special features that help it stay warm and find food.\n\n## Polar Bears\nPolar bears are the largest bears on land. Their fur looks white, but each hair is actually clear and hollow. Under the fur, their skin is black. Dark skin soaks up heat from the sun. A thick layer of fat under the skin, called blubber, keeps the bear warm. Polar bears are also strong swimmers. They hunt seals at holes in the sea ice.\n\n## Arctic Foxes\nThe Arctic fox changes its coat with the seasons. In winter, its fur is thick and white, so it blends in with the snow. In summer, the fox sheds its white coat and grows a thinner brown or gray one. Its small, round ears lose less heat than big ears would. When it sleeps, the fox wraps its fluffy tail around its body like a blanket.\n\n## Walruses\nWalruses live along icy coasts. They have long tusks that can grow up to three feet long. A walrus uses its tusks to pull its heavy body out of the water and onto the ice. Like polar bears, walruses have thick blubber to stay warm in freezing water.\n\nEvery Arctic animal has its own way to survive. Fur, fat, and clever habits help them live in one of the coldest places on Earth.`,
words:[[`blubber`,`a thick layer of fat that keeps an animal warm`],[`tusks`,`very long, pointed teeth that stick out of an animal's mouth`],[`hollow`,`empty inside`]],
qs:[
{t:'one', k:'main idea', q:`What is the main idea of this passage?`, o:[`Arctic animals have special features that help them survive the cold.`,`Polar bears are the very best swimmers in the whole world.`,`The sun never shines at all in the Arctic, even in summer.`,`Walruses and Arctic foxes live together in the same dens.`], e:`Each one has special features that help it stay warm and find food.`},
{t:'one', k:'vocabulary', q:`Read this sentence from the passage: "In summer, the fox sheds its white coat and grows a thinner brown or gray one." What does the word "sheds" mean?`, o:[`loses or drops`,`washes clean`,`paints over`,`hides under`], e:`In summer, the fox sheds its white coat and grows a thinner brown or gray one.`},
{t:'two', k:'inference', a:{q:`Why is it helpful for the Arctic fox to have a white coat in winter?`, o:[`It helps the fox blend in with the snow.`,`It helps the fox swim much faster.`,`It keeps the fox's ears small and round.`,`It helps the fox catch seals at ice holes.`]}, b:{q:`Which sentence from the passage best supports the answer to Part A?`, o:[`In winter, its fur is thick and white, so it blends in with the snow.`,`Its small, round ears lose less heat than big ears would.`,`They hunt seals at holes in the sea ice.`,`Walruses live along icy coasts.`]}},
{t:'multi', k:'key details', q:`Which TWO animals in the passage have blubber? Choose two answers.`, o:[`polar bears`,`walruses`,`Arctic foxes`,`snowy owls`,`gray wolves`], n:2},
{t:'one', k:'text features', q:`Under which heading would you find out how an animal uses its tusks?`, o:[`Walruses`,`Polar Bears`,`Arctic Foxes`,`none of the headings`], e:`A walrus uses its tusks to pull its heavy body out of the water and onto the ice.`}
]},

{id:'i3-07', g:3, title:`The Moon's Changing Shape`, icon:'🌙', topic:'earth and space',
text:`Have you ever noticed that the Moon seems to change shape? Some nights it is a big, bright circle. Other nights it is a thin curve, like a fingernail clipping. On some nights you cannot see it at all. The Moon is not really changing shape. What changes is how much of its lit side we can see.\n\nThe Moon does not make its own light. It shines because sunlight bounces off it, the same way light bounces off a mirror. The Sun always lights up half of the Moon. The other half is dark. The Moon travels in a path around Earth. One full trip takes about 29 and a half days. As the Moon moves, we see different amounts of its sunny side. These changing shapes are called phases.\n\nThe cycle begins with the new moon. At this time, the Moon is between Earth and the Sun. Its lit side faces away from us, so the Moon looks dark. Over the next few nights, a thin sliver of light appears. This is called a crescent. Each night, the lit part grows a little bigger. When the lit part is growing, we say the Moon is waxing.\n\nAbout two weeks after the new moon, we see the whole lit side. This is the full moon. After that, the lit part gets smaller each night. When the lit part is shrinking, the Moon is waning. Finally, the Moon is dark again, and a new cycle begins.\n\nYou can keep a Moon journal to see the phases yourself. Draw the Moon every clear night for a month. By the end, you will have drawn the whole cycle.`,
words:[[`phase`,`one of the shapes the Moon seems to have as it moves around Earth`],[`crescent`,`a thin, curved shape like a banana`],[`cycle`,`a set of events that happens again and again in the same order`]],
qs:[
{t:'one', k:'main idea', q:`What is the main idea of this passage?`, o:[`The Moon seems to change shape because we see different amounts of its lit side.`,`The Moon makes its own light and turns it on and off each night.`,`The Moon grows and shrinks in size during every month of the year.`,`A Moon journal is the best kind of journal for a person to keep.`], e:`What changes is how much of its lit side we can see.`},
{t:'one', k:'vocabulary', q:`Read this sentence from the passage: "When the lit part is growing, we say the Moon is waxing." What does the word "waxing" mean?`, o:[`getting bigger`,`getting smaller`,`turning dark`,`moving away`], e:`When the lit part is growing, we say the Moon is waxing.`},
{t:'two', k:'key details', a:{q:`Why does the Moon look dark during a new moon?`, o:[`Its lit side is facing away from Earth.`,`The Sun stops shining on it for a while.`,`Clouds always cover it during that time.`,`It moves too far away from Earth to see.`]}, b:{q:`Which sentence from the passage best supports the answer to Part A?`, o:[`Its lit side faces away from us, so the Moon looks dark.`,`This is called a crescent.`,`Draw the Moon every clear night for a month.`,`This is the full moon.`]}},
{t:'multi', k:'key details', q:`Which TWO sentences about the Moon are true, based on the passage? Choose two answers.`, o:[`It shines because sunlight bounces off it.`,`One trip around Earth takes about 29 and a half days.`,`It makes its own light like the Sun does.`,`It is full about two days after the new moon.`,`Its dark half is always facing the Sun.`], n:2},
{t:'one', k:'text structure', q:`How does the author explain the phases in paragraphs 3 and 4?`, o:[`in time order, from new moon to full moon and back`,`by comparing the Moon to the Sun and the stars`,`by listing reasons why people like the Moon`,`by telling a story about a girl named Mia`], e:`Finally, the Moon is dark again, and a new cycle begins.`}
]},

{id:'i3-08', g:3, title:`How Bridges Stay Up`, icon:'🌉', topic:'how things work',
text:`Every day, bridges carry cars, trucks, trains, and people across rivers and valleys. A bridge has a hard job. It must hold up its own heavy weight, plus everything that crosses it. Engineers are the people who design bridges. They use two important forces to make bridges strong.\n\nThe first force is compression. Compression is a pushing or squeezing force. When you stand on a step, your weight squeezes it down. The second force is tension. Tension is a pulling or stretching force. When you play tug-of-war, the rope is under tension. A good bridge handles both forces without bending or breaking.\n\n## Beam Bridges\nThe simplest bridge is a beam bridge. It is a flat beam that rests on supports at each end. A log lying across a stream is a beam bridge. When weight presses down, the top of the beam is squeezed and the bottom is stretched. Beam bridges work well for short distances. If a beam is too long, it sags in the middle.\n\n## Arch Bridges\nAn arch bridge has a curved shape. The curve pushes the weight outward and down to the ends of the bridge. The ground at each end pushes back. Because the arch is always being squeezed, it can be made of stone. Some stone arch bridges built by the ancient Romans are still standing today.\n\n## Suspension Bridges\nSuspension bridges can stretch across very wide spaces. The road hangs from strong steel cables. The cables run over tall towers and are tied down at both ends. The Golden Gate Bridge in San Francisco is a famous suspension bridge. It opened in 1937, and millions of cars cross it every year.`,
words:[[`engineer`,`a person who plans and designs things like bridges and machines`],[`compression`,`a pushing or squeezing force`],[`tension`,`a pulling or stretching force`]],
qs:[
{t:'one', k:'main idea', q:`What is the main idea of this passage?`, o:[`Engineers design different kinds of bridges to handle pushing and pulling forces.`,`The Golden Gate Bridge is the longest and oldest bridge in the world.`,`Logs lying across streams make the strongest bridges of all.`,`Tug-of-war is a game that teaches people how to build bridges.`], e:`They use two important forces to make bridges strong.`},
{t:'one', k:'vocabulary', q:`Read this sentence from the passage: "If a beam is too long, it sags in the middle." What does the word "sags" mean?`, o:[`droops down`,`breaks apart`,`rises up`,`shines bright`], e:`If a beam is too long, it sags in the middle.`},
{t:'two', k:'text structure', a:{q:`How is an arch bridge different from a beam bridge?`, o:[`Its curve pushes the weight out to its ends.`,`Its road hangs from strong steel cables.`,`It is always made from a single log.`,`It can only cross very short streams.`]}, b:{q:`Which sentence from the passage best supports the answer to Part A?`, o:[`The curve pushes the weight outward and down to the ends of the bridge.`,`The road hangs from strong steel cables.`,`A log lying across a stream is a beam bridge.`,`Beam bridges work well for short distances.`]}},
{t:'multi', k:'key details', q:`Which TWO parts help hold up a suspension bridge? Choose two answers.`, o:[`steel cables`,`tall towers`,`a stone arch`,`a single log`,`a long rope`], n:2},
{t:'one', k:'author purpose', q:`Why does the author mention tug-of-war?`, o:[`to give an example of tension that readers know`,`to show that bridges are fun places to play`,`to explain how arch bridges are built of stone`,`to tell readers where the Golden Gate Bridge is`], e:`When you play tug-of-war, the rope is under tension.`}
]},

{id:'i3-09', g:3, title:`Dogs with Jobs`, icon:'🦮', topic:'communities',
text:`Most dogs are pets, but some dogs have important jobs. Service dogs are trained to help people with disabilities live more freely. They go almost everywhere with their partners, including stores, schools, buses, and restaurants.\n\nService dogs can do many different jobs. Guide dogs help people who are blind or cannot see well. A guide dog leads its partner around poles, holes, and other things in the way. It also stops at curbs and stairs. Hearing dogs help people who are deaf. They touch their partner with a paw when the doorbell rings or a smoke alarm beeps. Other service dogs pick up dropped keys, open doors, or bring a phone to a person who uses a wheelchair.\n\nTraining a service dog takes a long time, often about two years. Many puppies first live with volunteer families. These families teach the puppy good manners and take it to busy places like parks and malls. That way, the puppy learns to stay calm around noise and crowds. Later, the dog goes to a trainer to learn its special skills.\n\nNot every dog is right for the job. A service dog must be calm, gentle, and good at paying attention. Some dogs are too excited or too nervous. Those dogs often become loving family pets instead.\n\nWhen you see a service dog, remember that it is working. Many service dogs wear a vest, but some do not. Do not pet, feed, or call to the dog. Even a quick pat can distract it from its partner. If you want to say hello, always ask the owner first. Giving a service dog space helps it do its important job.`,
words:[[`disability`,`something that makes it harder for a person's body or mind to do certain things`],[`volunteer`,`a person who helps without being paid`],[`partner`,`a person who works together with someone else`]],
qs:[
{t:'one', k:'main idea', q:`What is the main idea of this passage?`, o:[`Service dogs are specially trained to help people with disabilities.`,`All dogs should wear vests when they go to stores and schools.`,`Puppies like to visit busy places such as parks and malls.`,`Hearing dogs are smarter and better than guide dogs.`], e:`Service dogs are trained to help people with disabilities live more freely.`},
{t:'one', k:'vocabulary', q:`Read this sentence from the passage: "Even a quick pat can distract it from its partner." What does the word "distract" mean?`, o:[`take attention away from`,`make stronger and faster`,`lead safely around`,`help find something`], e:`Even a quick pat can distract it from its partner.`},
{t:'two', k:'inference', a:{q:`Why do volunteer families take puppies to busy places?`, o:[`so the puppies learn to stay calm in crowds`,`so the puppies can meet their new owners`,`so the puppies can practice picking up keys`,`so the puppies can rest after hard training`]}, b:{q:`Which sentence from the passage best supports the answer to Part A?`, o:[`That way, the puppy learns to stay calm around noise and crowds.`,`Later, the dog goes to a trainer to learn its special skills.`,`Some dogs are too excited or too nervous.`,`Many service dogs wear a vest, but some do not.`]}},
{t:'multi', k:'key details', q:`Which TWO things should you do when you see a service dog? Choose two answers.`, o:[`Give the dog space to work.`,`Ask the owner before saying hello.`,`Pat the dog gently on the head.`,`Offer the dog a small snack.`,`Call out the dog's name.`], n:2},
{t:'one', k:'key details', q:`How does a hearing dog let its partner know the doorbell is ringing?`, o:[`It touches its partner with a paw.`,`It barks over and over very loudly.`,`It brings its partner a phone.`,`It stops and sits at the curb.`], e:`They touch their partner with a paw when the doorbell rings or a smoke alarm beeps.`}

{id:'i3-10', g:3, title:`The Story of the Library`, icon:'📚', topic:'history',
text:`Today you can walk into a library, pick out a book, and take it home for free. But libraries did not always work this way. The story of the library goes back thousands of years.\n\nLong ago, people did not have paper books. In ancient times, people wrote on clay tablets or on scrolls. A scroll was a long roll of paper-like material. One of the most famous libraries of the ancient world was in Alexandria, Egypt. It was built more than 2,000 years ago. Scholars from far away traveled there to read and study its thousands of scrolls.\n\nFor many years after that, books were copied by hand. Making one book could take months, so books were very rare and costly. Only rich people and schools could own them. Most people never got to borrow a book.\n\nThat began to change in the 1700s. In 1731, Benjamin Franklin and his friends started a library in Philadelphia. Each member paid money to join. Together, they bought more books than any one person could afford alone. Members could borrow the books and bring them back.\n\nLater, towns began to open public libraries that were free for everyone. A rich businessman named Andrew Carnegie helped a lot. Starting in the late 1800s, he gave money to build more than 2,500 libraries around the world. Many of these buildings are still used as libraries today.\n\nLibraries keep changing. Now they lend e-books, movies, and even tools. Many have computers, story times, and summer reading clubs. Still, their main job is the same. Libraries help everyone learn and explore, no matter how much money they have.`,
words:[[`scroll`,`a long roll of paper or similar material with writing on it`],[`scholar`,`a person who studies and learns a lot about a subject`],[`public`,`open to and shared by everyone`]],
qs:[
{t:'one', k:'main idea', q:`What is this passage mostly about?`, o:[`how libraries changed over time to serve more people`,`how people long ago wrote on clay tablets`,`the whole life story of Benjamin Franklin`,`why e-books are better than paper books`], e:`The story of the library goes back thousands of years.`},
{t:'one', k:'vocabulary', q:`Read this sentence from the passage: "Making one book could take months, so books were very rare and costly." What does the word "costly" mean?`, o:[`expensive`,`heavy`,`dusty`,`boring`], e:`Only rich people and schools could own them.`},
{t:'two', k:'text evidence', a:{q:`Why could most people long ago NOT borrow books?`, o:[`Books were copied by hand, so there were very few.`,`People long ago did not want to read any books.`,`Libraries long ago were only open late at night.`,`Books were written in secret codes nobody knew.`]}, b:{q:`Which sentence from the passage best supports the answer to Part A?`, o:[`For many years after that, books were copied by hand.`,`It was built more than 2,000 years ago.`,`Each member paid money to join.`,`Now they lend e-books, movies, and even tools.`]}},
{t:'multi', k:'key details', q:`Which TWO things can people find in many libraries today? Choose two answers.`, o:[`e-books and movies`,`computers and story times`,`clay tablets to write on`,`scrolls from Alexandria`,`free money for books`], n:2},
{t:'one', k:'text structure', q:`How does the author organize most of this passage?`, o:[`in time order, from long ago to today`,`by comparing two libraries in one town`,`as a list of rules for using a library`,`as a story told by a friendly librarian`], e:`That began to change in the 1700s.`}
]},

{id:'i3-11', g:3, title:`How Bees Talk`, title2:`Busy Helpers`, icon:'🐝', topic:'animals',
text:`A honeybee cannot speak, but it can still share news with its hive. When a worker bee finds a field full of flowers, it flies home and does a special dance.\n\nIf the flowers are close to the hive, the bee does a round dance. It runs in small circles, first one way and then the other. This tells the other bees to search nearby.\n\nIf the flowers are far away, the bee does a waggle dance. It walks in a straight line while shaking its body from side to side. Then it loops back and does it again. The direction of the straight line points the way to the flowers, using the sun as a guide. The longer the bee waggles, the farther away the food is.\n\nThe other bees crowd around the dancer. They feel its movements and smell the flowers on its body. Then they fly off to find the food themselves. One scientist studied these dances for many years and won a famous prize for his work.`,
text2:`Honeybees are famous for making honey, but they have another important job. They help plants make seeds and fruit.\n\nA bee visits a flower to drink a sweet liquid called nectar. While it drinks, a yellow powder called pollen sticks to the tiny hairs on its body. When the bee flies to the next flower, some of that pollen rubs off. Moving pollen from one flower to another is called pollination. Many flowers need pollen from another flower of the same kind to make seeds.\n\nMany of the foods people eat depend on bees. Apples, cherries, almonds, and blueberries all need pollinators to grow well. Farmers sometimes rent hives of bees and bring them to their fields when the flowers bloom.\n\nA single bee can visit dozens of flowers in one trip. That makes honeybees some of the hardest workers in nature. The next time you bite into a crunchy apple, you can thank a bee.`,
words:[[`waggle`,`to shake or wiggle from side to side`],[`nectar`,`a sweet liquid inside flowers`],[`pollination`,`moving pollen from one flower to another so plants can make seeds`]],
qs:[
{t:'one', k:'main idea', q:`What is the main idea of "How Bees Talk"?`, o:[`Honeybees use dances to tell other bees where to find food.`,`Honeybees make honey from the nectar inside flowers.`,`Bees use the sun to stay warm on cold days.`,`Scientists like to watch bees dance just for fun.`], e:`When a worker bee finds a field full of flowers, it flies home and does a special dance.`},
{t:'one', k:'vocabulary', q:`Read this sentence from "Busy Helpers": "Farmers sometimes rent hives of bees and bring them to their fields when the flowers bloom." What does the word "bloom" mean?`, o:[`open up`,`dry up`,`fall off`,`get picked`], e:`Farmers sometimes rent hives of bees and bring them to their fields when the flowers bloom.`},
{t:'two', k:'key details', a:{q:`In "How Bees Talk," how do bees show that food is far away?`, o:[`The dancing bee does a waggle dance.`,`The dancing bee runs in small circles.`,`The dancing bee brings back pollen.`,`The dancing bee flies straight up high.`]}, b:{q:`Which sentence from the passage best supports the answer to Part A?`, o:[`If the flowers are far away, the bee does a waggle dance.`,`It runs in small circles, first one way and then the other.`,`The other bees crowd around the dancer.`,`They help plants make seeds and fruit.`]}},
{t:'multi', k:'key details', q:`Based on "Busy Helpers," which TWO foods need pollinators to grow well? Choose two answers.`, o:[`apples`,`blueberries`,`bread`,`milk`,`eggs`], n:2},
{t:'one', k:'compare texts', q:`How are the two passages different?`, o:[`One tells how bees share news, and the other tells how bees help plants.`,`One is about bees, and the other is about butterflies and birds.`,`One says bees make honey, and the other says bees never make honey.`,`One is a story about a bee named Max, and the other is a poem.`], e:`They help plants make seeds and fruit.`}
]},

{id:'i3-12', g:3, title:`Life in the Rain Forest`, icon:'🌳', topic:'science',
text:`Imagine a forest so thick that sunlight barely reaches the ground. Rain falls almost every day, and the air feels warm and wet. This is a tropical rain forest. Rain forests grow near the equator, where it is warm all year. The largest one is the Amazon rain forest in South America.\n\nRain forests cover only a small part of Earth's land. Yet scientists think more than half of all the kinds of plants and animals on Earth live in them. Many have not even been discovered yet. A rain forest is like a tall building, with different layers from top to bottom.\n\n## The Layers of a Rain Forest\nThe emergent layer is the very top. A few giant trees poke up above the rest of the forest. Eagles and butterflies live up here in the bright sun.\n\nJust below is the canopy. The leaves and branches in this layer grow close together like a leafy roof. Most rain forest animals live in the canopy, including monkeys, toucans, and sloths. Sloths move so slowly that tiny green plants called algae grow on their fur.\n\nUnder the canopy is the understory. It is dark and shady here because the canopy blocks most of the light. Plants in the understory often have very large leaves to catch what little sunlight gets through. The forest floor is the bottom layer. Fallen leaves rot quickly in the warm, damp air. Ants, beetles, and other tiny creatures help break them down.\n\nRain forests give us many things, such as fruits, nuts, and even some medicines. Their plants also take in carbon dioxide and give off oxygen. That is why people around the world work to protect them.`,
words:[[`canopy`,`the thick layer of leaves and branches that covers a forest like a roof`],[`equator`,`an imaginary line around the middle of Earth`],[`layer`,`one level that lies over or under another`]],
qs:[
{t:'one', k:'main idea', q:`What is this passage mostly about?`, o:[`the layers of a rain forest and the life found in each one`,`how to plant a tree and help it grow tall`,`why sloths move so slowly through the trees`,`how people make medicine from rain forest plants`], e:`A rain forest is like a tall building, with different layers from top to bottom.`},
{t:'one', k:'vocabulary', q:`Read this sentence from the passage: "Fallen leaves rot quickly in the warm, damp air." What does the word "damp" mean?`, o:[`a little wet`,`very cold`,`very dusty`,`very bright`], e:`Rain falls almost every day, and the air feels warm and wet.`},
