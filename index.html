// ---------- i-Ready: results, informational reading, monthly checkpoints, goal tracker ----------
// The parent's goal: raise each child's i-Ready Diagnostic reading scores, out of "high risk" and past their peers.
// A grown-up enters each Diagnostic from the family report; the daily quest then works on the weakest domains.
const IR_DOMS = [['phon','Phonics'],['hfw','High-Frequency Words'],['voc','Vocabulary'],['lit','Literature'],['info','Informational Text']];
const IR_LEVELS = ['3+ grades below','2 grades below','1 grade below','Early on grade level','Mid on grade level','Late on grade level','Above grade level'];
// i-Ready's own colours: red = 2 or more grades below, yellow = 1 below, green = on or above
function irTier(lv){ lv = +lv; return lv <= 1 ? {ic:'🔴', lab:'High risk', col:'var(--oops)'} : lv === 2 ? {ic:'🟡', lab:'1 grade below', col:'var(--sun)'} : lv >= 6 ? {ic:'🚀', lab:'Above grade', col:'var(--good)'} : {ic:'🟢', lab:'On grade level', col:'var(--good)'}; }
const irHas = v => v !== '' && v != null && !isNaN(+v);
function irList(p){ return (p.iready || []).slice().sort((a, b) => a.d.localeCompare(b.d)); }
function irLatest(p){ return irList(p).pop() || null; }
// the school year runs August to July; its first Diagnostic is the baseline the growth targets are measured from
function schoolYearStart(d){ const t = new Date((d || today()) + 'T12:00'), y = t.getMonth() >= 7 ? t.getFullYear() : t.getFullYear() - 1; return y + '-08-01'; }
function irBaseline(p){ const L = irList(p), sy = schoolYearStart(); return L.find(r => r.d >= sy && irHas(r.s)) || L.filter(r => irHas(r.s))[0] || null; }
// weakest domains first; only domains below "early on grade level" count as weak
function irWeak(p){ const r = irLatest(p); if (!r || !r.dom) return []; return IR_DOMS.map(x => x[0]).filter(k => irHas(r.dom[k]) && +r.dom[k] <= 2).sort((a, b) => r.dom[a] - r.dom[b]); }
function irFocus(p){ const w = irWeak(p), f = {}; w.forEach(k => { f[k === 'phon' || k === 'hfw' ? 'phonics' : k === 'voc' ? 'vocab' : k] = true; }); return f; }
function irGoal(p){
  const b = irBaseline(p), l = irLatest(p); if (!b || !l || !irHas(l.s)) return null;
  const typ = irHas(b.typ) ? +b.s + +b.typ : null, str = irHas(b.str) ? +b.s + +b.str : null, gain = +l.s - +b.s;
  return {base:+b.s, now:+l.s, gain, typ, str, d0:b.d, d1:l.d, pctStr: str ? Math.round(gain / (str - b.s) * 100) : null, pctTyp: typ ? Math.round(gain / (typ - b.s) * 100) : null};
}
function irGoalHtml(g){
  if (!g) return '<p class="mut">Enter a Diagnostic with its overall score and growth targets to see progress.</p>';
  const lo = g.base, hi = Math.max(g.str || 0, g.typ || 0, g.now) + 5, pc = v => Math.max(0, Math.min(100, (v - lo) / (hi - lo) * 100));
  return `<div class="irgoal"><div class="irbar"><i style="width:${pc(g.now)}%"></i>${g.typ ? `<span class="irmk" style="left:${pc(g.typ)}%"><b>Typical ${g.typ}</b></span>` : ''}${g.str ? `<span class="irmk str" style="left:${pc(g.str)}%"><b>Stretch ${g.str}</b></span>` : ''}</div>
    <table class="daytab"><tr><td>Start of year (${niceDate(g.d0)})</td><td class="num">${g.base}</td></tr><tr><td>Latest (${niceDate(g.d1)})</td><td class="num"><b>${g.now}</b></td></tr>
      <tr><td>Points gained</td><td class="num"><b style="color:${g.gain >= 0 ? 'var(--good)' : 'var(--oops)'}">${g.gain >= 0 ? '+' : ''}${g.gain}</b></td></tr>
      ${g.typ ? `<tr><td>Typical growth goal</td><td class="num">${g.typ} <span class="mut">(${g.pctTyp}%)</span></td></tr>` : ''}
      ${g.str ? `<tr><td>Stretch growth goal 🎯</td><td class="num">${g.str} <span class="mut">(${g.pctStr}%)</span></td></tr>` : ''}</table></div>`;
}

// ---- a shared question player: single answer, two-part (Part A / Part B), and choose-two ----
// practice mode shows right/wrong and the proof; test mode just records and moves on, like the real Diagnostic
const IR_SKILL = {'main idea':'main idea', 'key details':'detail', 'text evidence':'detail', 'vocabulary':'vocabulary', 'inference':'inference', 'character':'character', 'theme':'main idea', 'word parts':'vocabulary'};
function qOrder(st, key, n){ return st[key] || (st[key] = shuffle([...Array(n).keys()])); }
function qHtml(it, st, practice, done){
  const opt = (o, ord, picked, right, onPick, multi) => `<div class="opts">${ord.map(i => { const isR = multi ? i < it.n : i === 0, sel = multi ? picked.includes(i) : picked === i;
    const cls = right == null ? (sel ? 'sel' : '') : (practice ? (isR ? 'right' : sel ? 'wrong' : '') : (sel ? 'sel' : ''));
    return `<button class="opt ${cls}" ${right != null ? 'disabled' : ''} data-a="${A(() => onPick(i))}">${esc(o[i])}</button>`; }).join('')}</div>`;
  if (it.t === 'two'){
    const oa = qOrder(st, 'oa', it.a.o.length), ob = qOrder(st, 'ob', it.b.o.length);
    return `<p class="irpart">Part A</p><p class="q">${esc(it.a.q)}</p>${opt(it.a.o, oa, st.a, st.a == null ? null : st.a === 0, i => { st.a = i; render(); })}
      ${st.a != null ? `<p class="irpart">Part B</p><p class="q">${esc(it.b.q)}</p>${opt(it.b.o, ob, st.b, st.b == null ? null : st.b === 0, i => { st.b = i; st.ok = st.a === 0 && st.b === 0; render(); })}` : ''}
      ${st.b != null ? done() : ''}`;
  }
  if (it.t === 'multi'){
    const ord = qOrder(st, 'o', it.o.length), pk = st.pk || (st.pk = []);
    return `<p class="q">${esc(it.q)}</p>${opt(it.o, ord, pk, st.checked ? true : null, i => { if (pk.includes(i)) pk.splice(pk.indexOf(i), 1); else if (pk.length < it.n) pk.push(i); render(); }, true)}
      ${st.checked ? done() : `<button class="btn" ${pk.length === it.n ? '' : 'disabled'} data-a="${A(() => { st.checked = true; st.ok = pk.length === it.n && pk.every(i => i < it.n); render(); })}">Check (${pk.length} of ${it.n} chosen)</button>`}`;
  }
  const ord = qOrder(st, 'o', it.o.length);
  return `<p class="q">${esc(it.q)}</p>${opt(it.o, ord, st.pick, st.pick == null ? null : st.pick === 0, i => { st.pick = i; st.ok = i === 0; render(); })}${st.pick != null ? done() : ''}`;
}
// a passage with "## Heading" lines, numbered or bulleted lists and paragraphs
function articleHtml(title, text){
  // line by line: "## " lines are headings, runs of "1." or "-" lines are lists, everything else joins into paragraphs
  const out = [];
  String(text).split(/\n\n+/).forEach(block => {
    let para = [], list = null;
    const flushP = () => { if (para.length){ out.push(`<p>${esc(para.join(' '))}</p>`); para = []; } };
    const flushL = () => { if (list){ out.push(`<${list.t} class="artlist">${list.items.map(x => `<li>${esc(x)}</li>`).join('')}</${list.t}>`); list = null; } };
    block.split('\n').forEach(line => {
      const l = line.trim(); if (!l) return;
      if (/^##\s/.test(l)){ flushP(); flushL(); out.push(`<h3>${esc(l.replace(/^##\s*/, ''))}</h3>`); return; }
      const m = l.match(/^(\d+\.|[-•*])\s+(.*)$/);
      if (m){ flushP(); const t = /\d/.test(m[1]) ? 'ol' : 'ul'; if (!list || list.t !== t){ flushL(); list = {t, items:[]}; } list.items.push(m[2]); return; }
      flushL(); para.push(l);
    });
    flushP(); flushL();
  });
  return `<article class="article">${title ? `<h2>${esc(title)}</h2>` : ''}${out.join('')}</article>`;
}

function mathLvl(p, k){ return mathState(p).lvl[k] || 1; }
// weakest skills first: lowest accuracy, with at least a few tries
function mathPlan(p, kind){
  const M = window.MathSkills || {}, u = mathUnitNow(p), U = mathUnits(p), ui = U.indexOf(u), st = mathState(p).stat;
  const acc = k => { const s = st[k]; return s && s[1] ? s[0] / s[1] : 0.5; };
  const R = mkR(Date.now() % 1e9);
  if (kind === 'warm'){ const ws = mathSkillsOf(p).filter(k => M[k].warm); return [...Array(8)].map((_, i) => ws[i % ws.length]).filter(Boolean); }
  if (kind === 'lesson'){ const ks = mathSkillsOf(p, u.id).sort((a, b) => acc(a) - acc(b)); return ks.length ? [...Array(8)].map((_, i) => ks[i % ks.length]) : []; }
  if (kind === 'spiral'){ const past = U.slice(0, Math.max(0, ui)).flatMap(x => mathSkillsOf(p, x.id)); return past.length ? R.shuffle(past).slice(0, 5).concat(past.length < 5 ? R.shuffle(past).slice(0, 5 - past.length) : []).slice(0, 5) : []; }
  if (kind === 'focus'){ const f = mathState(p).facts; return Object.keys(f).filter(k => f[k].n > (f[k].ok || 0)).length ? [...Array(6)].map(() => mathSkillsOf(p).find(k => M[k].warm)) : []; }
  return [kind];
}

// ---- the problem player ----
function mathStart(p, skills, title, questKey, factsOnly){
  skills = (skills || []).filter(Boolean);
  loadMath(p).then(() => { skills = skills.filter(k => window.MathSkills[k]); if (!skills.length){ alertBox('Nothing to practise here yet.'); return; }
    MTIME.last = Date.now(); go({name:'mathplay', skills, title, questKey, factsOnly, i:0, right:0, t0:Date.now(), m0:mathToday(p), prob:null}); })
   .catch(() => alertBox('Math could not load. Check the internet connection and try again.'));
}
function mathNext(v){
  const p = me(), k = v.skills[v.i], M = window.MathSkills[k], R = mkR((Date.now() ^ (v.i * 7919)) % 1e9);
  let pr = null;
  for (let tries = 0; tries < 12; tries++){ pr = M.gen(R, mathLvl(p, k));
    if (v.factsOnly && pr.fact){ const f = mathState(p).facts[pr.fact]; if (f && f.n > (f.ok || 0)) break; if (tries < 11) continue; }
    if (!v.prob || pr.q !== v.prob.q) break; }
  v.prob = pr; v.k = k; v.tries = 0; v.input = ''; v.state = null; v.showHint = false; v.showSteps = false; v.plot = null;
  if (pr.kind === 'choice') v.order = R.shuffle(pr.choices.slice());
}
function mathCheck(v, given){
  const p = me(), pr = v.prob, k = v.k, m = mathState(p); mathTick();
  let ok;
  if (pr.kind === 'num'){ const g = parseFloat(String(given).replace('−', '-')); ok = !isNaN(g) && Math.abs(g - pr.a) < 1e-6; }
  else if (pr.kind === 'plot') ok = given && given[0] === pr.a[0] && given[1] === pr.a[1];
  else ok = String(given) === String(pr.a);
  v.tries++;
  if (ok){
    const first = v.tries === 1 && !v.showSteps;
    const s = m.stat[k] || (m.stat[k] = [0, 0]); s[1]++; if (first) s[0]++;
    if (first){ v.right++; m.streak[k] = (m.streak[k] || 0) + 1; m.miss[k] = 0; if (m.streak[k] >= 3 && (m.lvl[k] || 1) < 3){ m.lvl[k] = (m.lvl[k] || 1) + 1; m.streak[k] = 0; } }
    if (pr.fact){ const f = m.facts[pr.fact]; if (f) f.ok = Math.min(f.n, (f.ok || 0) + (first ? 1 : 0)); }
    v.state = first ? 'right' : 'rightAfter'; addCoins(first ? 2 : 1, ''); save(); render(); return;
  }
  m.streak[k] = 0;
  if (v.tries === 1){ v.state = 'again'; save(); render(); return; }
  const s = m.stat[k] || (m.stat[k] = [0, 0]); s[1]++;
  m.miss[k] = (m.miss[k] || 0) + 1; if (m.miss[k] >= 2 && (m.lvl[k] || 1) > 1){ m.lvl[k]--; m.miss[k] = 0; }
  if (pr.fact){ const f = m.facts[pr.fact] || (m.facts[pr.fact] = {n:0, ok:0}); f.n = Math.max(f.n, (f.ok || 0) + 3); }
  v.state = 'shown'; v.showSteps = true; save(); render();
}

  <div class="mlay"><div class="card mq"><span class="skill">${esc(window.MathSkills[v.k].name)}</span><p class="q mtext">${esc(pr.q).replace(/\n/g, '<br>')}</p>${pr.model ? `<div class="mpic">${mathModel(pr.model)}</div>` : ''}</div>
    <aside class="card mside">${msg}${answer}
      ${!done ? `<div class="row">${pr.hint ? `<button class="btn ghost small" data-a="${A(()=>{ v.showHint = true; mathTick(); render(); })}">💡 Hint</button>` : ''}<button class="btn ghost small" data-a="${A(()=>{ v.showSteps = true; mathTick(); render(); })}">🪜 Show me how</button></div>` : ''}
      ${v.showHint && !done ? `<p class="notice">💡 ${esc(pr.hint)}</p>` : ''}
      ${v.showSteps ? `<ol class="msteps">${(pr.steps || []).map(s => `<li>${esc(s)}</li>`).join('')}</ol>${!done ? '<p class="mut">Now you try: enter the answer.</p>' : ''}` : ''}
      ${done ? `<button class="btn sun" data-a="${A(()=>{ mathTick(); v.i++; v.prob = null; render(); window.scrollTo({top:0}); })}">${v.i < v.skills.length - 1 ? 'Next →' : 'Finish'}</button>` : ''}</aside></div>`;
  const g = document.getElementById('mgrid');
  if (g && pr.kind === 'plot' && !done) g.addEventListener('click', e => {
    const r = g.getBoundingClientRect(), W = +g.dataset.w, pad = +g.dataset.pad, N = +g.dataset.n, lo = +g.dataset.lo, cell = (W - 2 * pad) / (N - lo);
    const sx = (e.clientX - r.left) / r.width * W, sy = (e.clientY - r.top) / r.height * W;
    const x = Math.round((sx - pad) / cell + lo), y = Math.round((W - pad - sy) / cell + lo);
    if (x < lo || x > N || y < lo || y > N) return; v.plot = [x, y]; mathTick(); render();
  });
  if (v.plot && g){ const W = +g.dataset.w, pad = +g.dataset.pad, N = +g.dataset.n, lo = +g.dataset.lo, cell = (W - 2 * pad) / (N - lo);
    g.querySelector('#plotMark').innerHTML = `<circle cx="${pad + (v.plot[0] - lo) * cell}" cy="${W - pad - (v.plot[1] - lo) * cell}" r="9" fill="var(--good)" stroke="var(--panel)" stroke-width="3"/>`; }
}
function mathFinish(v){
  const p = me(), mins = Math.max(0, mathToday(p) - (v.m0 || 0));
  logEvent('math', v.title, {right:v.right, total:v.skills.length, mins: Math.round(mins * 10) / 10, skills:[...new Set(v.skills)]});
  if (v.questKey && v.questKey !== 'topic') questMark(v.questKey);
  addCoins(5, 'math'); if (v.right === v.skills.length) confetti(50); save();
  app.innerHTML = `${topbar(()=>go({name:'hub'}))}<div class="card" style="display:flex;flex-direction:column;gap:12px;align-items:center;text-align:center">
    <span class="big-emoji">${v.right === v.skills.length ? '🏆' : '⭐'}</span><h1>${v.right} of ${v.skills.length} on the first try</h1>
    <p>${v.right === v.skills.length ? 'Perfect!' : v.right >= v.skills.length * 0.7 ? 'Great work!' : 'Nice effort. Every mistake you fix makes your brain stronger.'}</p>
    <p class="mut">⏱ ${Math.floor(mathToday(p))} of ${MATH_GOAL} math minutes today</p>
    <div class="row"><button class="btn" data-a="${A(()=>go({name:'hub'}))}">Back to math</button></div></div>`;
}
// grown-ups: the math unit, minutes, skills and MAP scores
function mathCardHtml(p){
  const m = mathState(p), u = mathUnitNow(p), M = window.MathSkills || {}, stats = Object.entries(m.stat).filter(([k, s]) => s[1]).sort((a, b) => a[1][0]/a[1][1] - b[1][0]/b[1][1]);
  const fx = Object.keys(m.facts).filter(k => m.facts[k].n > (m.facts[k].ok || 0));
  const maps = (p.map || []).slice().sort((a, b) => a.d.localeCompare(b.d)), ed = view.mapEdit === p.id;
  return `<div><h3>🔢 Math</h3>
    <table class="daytab"><tr><td>Math today</td><td class="num"><b>${Math.floor(mathToday(p))} of ${MATH_GOAL} min</b></td></tr>
      <tr><td>Unit${p.mathUnit ? ' (set by you)' : ' (from the school calendar)'}</td><td class="num"><select data-a2="unit" onchange="mathSetUnit('${p.id}', this.value)"><option value="">Follow the calendar</option>${mathUnits(p).map(x => `<option value="${x.id}" ${p.mathUnit === x.id ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select></td></tr></table>
    <p class="mut" style="font-size:.85rem">Now practising: <b>${esc(u.name)}</b>. Pick a unit to override the school calendar.</p>
    ${stats.length ? `<table class="daytab"><tr><th>Skill</th><th class="num">First try</th><th class="num">Level</th></tr>${stats.map(([k, s]) => `<tr><td>${esc(M[k] ? M[k].name : k)}</td><td class="num"><b style="color:${s[0]/s[1] >= .8 ? 'var(--good)' : s[0]/s[1] >= .6 ? 'var(--ink)' : 'var(--oops)'}">${Math.round(s[0]/s[1]*100)}%</b> <span class="mut">(${s[1]})</span></td><td class="num">${m.lvl[k] || 1}</td></tr>`).join('')}</table>` : '<p class="mut">No math practice yet.</p>'}
    ${fx.length ? `<p style="margin-top:6px">🎯 Focus facts: ${fx.slice(0, 20).map(k => `<span class="chip">${esc(k.replace('x', ' × ').replace('/', ' ÷ ').replace(/^sq/, '√'))}</span>`).join(' ')}</p>` : ''}
    <h3 style="margin-top:12px">MAP math scores</h3>
    ${(() => { const l = maps[maps.length-1], wk = mapWeak(p); return l && l.dom && Object.keys(l.dom).length ? `<table class="daytab"><tr><th>Goal areas (${niceDate(l.d)})</th><th class="num">RIT</th></tr>${MAP_DOMS.filter(([k]) => l.dom[k]).map(([k, lab]) => `<tr><td>${k === wk ? '🚀 ' : ''}${lab}</td><td class="num"><b>${l.dom[k]}</b></td></tr>`).join('')}</table>${wk ? `<p class="mut" style="font-size:.85rem">🚀 = lowest area: the daily math quest adds a Boost round for it.</p>` : ''}` : ''; })()}
    ${maps.length ? `<table class="daytab"><tr><th>Test</th><th class="num">RIT</th><th class="num">Percentile</th></tr>${maps.slice().reverse().map(r => `<tr><td>${niceDate(r.d)}${r.goal ? ` <span class="mut">(goal ${r.goal})</span>` : ''}</td><td class="num"><b>${r.rit}</b></td><td class="num">${r.pct ? r.pct + '%' : '–'}</td></tr>`).join('')}</table>` : '<p class="mut">No MAP scores yet.</p>'}
    ${ed ? `<div class="irform"><label>Test date<input type="date" id="map_d" value="${today()}"></label><label>RIT score<input type="number" id="map_rit" inputmode="numeric" placeholder="e.g. 205"></label>
        <label>Percentile<input type="number" id="map_pct" inputmode="numeric" placeholder="e.g. 62"></label><label>Growth goal (RIT, optional)<input type="number" id="map_goal" inputmode="numeric"></label>
        ${MAP_DOMS.map(([k, l]) => `<label>${l} (score)<input type="number" id="map_${k}" inputmode="numeric"></label>`).join('')}
        <div class="row"><button class="btn sun small" data-a="${A(()=>{ const g = id => document.getElementById(id).value; if (!g('map_rit')) return; p.map = (p.map || []).filter(x => x.d !== g('map_d')); const dom = {}; MAP_DOMS.forEach(([k]) => { if (g('map_' + k)) dom[k] = +g('map_' + k); }); p.map.push({d:g('map_d') || today(), rit:+g('map_rit'), pct:g('map_pct') ? +g('map_pct') : '', goal:g('map_goal') ? +g('map_goal') : '', dom}); save(); view.mapEdit = null; render(); })}">Save</button><button class="btn ghost small" data-a="${A(()=>{ view.mapEdit = null; render(); })}">Cancel</button></div></div>`
      : `<div class="row" style="margin-top:6px"><button class="btn small" data-a="${A(()=>{ view.mapEdit = p.id; render(); })}">＋ Enter a MAP score</button></div>`}</div>`;
}
function mathSetUnit(id, u){ const p = S.profiles.find(x => x.id === id); if (!p) return; p.mathUnit = u || ''; save(); render(); }

// ---------- Start ----------
if (S.cur && me()) view = {name:'hub'};
if (/^#r=/.test(location.hash)) openReportLink(); else render();
</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js').catch(function(){});
}
