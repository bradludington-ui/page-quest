const AVATARS = ['🦊','🐼','🐯','🐸','🐙','🦉','🐢','🦁','🐨','🐧','🦈','🐲'];
const TITLES = ['Page Turner','Word Explorer','Story Seeker','Book Adventurer','Chapter Champion','Reading Wizard','Library Legend'];
const STOPS = 15;               // stops on the story map
const VAULT_DAYS = [1,3,7,14];  // memory vault spacing

// ---------- Storage ----------
const KEY = 'pagequest.v1';
let storageOk = true;
function load(){
  try{ const raw = localStorage.getItem(KEY); if (raw) return JSON.parse(raw); }catch(e){ storageOk = false; }
  return {profiles:[], cur:null};
}
let S = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){ storageOk = false; } }
function me(){ return S.profiles.find(p => p.id === S.cur) || null; }
function today(d){ d = d || new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function addDays(n){ const d = new Date(); d.setDate(d.getDate()+n); return today(d); }
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function allStories(){ const p = me(); return STORIES.concat(p ? (p.custom||[]) : []); }
function storyById(id){ return allStories().concat(chapterStories()).find(s => s.id === id); }

function newProfile(name, grade, av){
  return {id:'p'+Date.now().toString(36), name, grade, av, coins:0, xp:0, owned:[], done:{}, completed:0, chests:0,
    streak:{d:'',n:0}, vault:[], skills:{}, wpm:[], minutes:0, mode:null, pace:grade<=3?70:95, size:1, custom:[]};
}
function level(p){ let lv=0, need=100, xp=p.xp; while (xp >= need){ xp -= need; lv++; need += 50; } return {lv, xp, need, title:TITLES[Math.min(lv,TITLES.length-1)]}; }
function addCoins(n, label){ const p = me(); p.coins += n; p.xp += n; save(); floatText('+'+n+(label?' '+label:'')); }
function bumpStreak(){
  const p = me(), t = today();
  if (p.streak.d === t) return;
  p.streak.n = (p.streak.d === addDays(-1)) ? p.streak.n + 1 : 1;
  p.streak.d = t; save();
}
function skillMark(k, ok){ const p = me(); const s = p.skills[k] || [0,0]; s[1]++; if (ok) s[0]++; p.skills[k] = s; save(); }

// ---------- Running as a full-screen app or in a browser tab ----------
// Page Quest is full screen only when it is opened from a Home Screen icon that Safari added.
// In a browser tab the kids can hit Safari's own buttons, so the start screens say so and show how to fix it.
function isAppMode(){
  try{ return navigator.standalone === true || matchMedia('(display-mode: standalone)').matches || matchMedia('(display-mode: fullscreen)').matches; }catch(e){ return false; }
}
function isAppleTouch(){ return /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
let installOpen = false;
function installHidden(){ try{ return sessionStorage.getItem('pq-install-later') === '1'; }catch(e){ return false; } }
function installBanner(full){
  if (isAppMode() || installHidden() || window.self !== window.top) return '';
  const ua = navigator.userAgent, otherBrowser = /CriOS|FxiOS|EdgiOS|OPiOS/.test(ua);
  const steps = !isAppleTouch()
    ? `<ol class="isteps"><li>In your browser's menu, choose <b>Install Page Quest</b> or <b>Add to Home Screen</b>.</li><li>Open Page Quest from the new icon.</li></ol>`
    : otherBrowser
    ? `<ol class="isteps"><li>This is open in a different browser. Open <b>Safari</b> instead and go to <b>${esc(location.href.split('#')[0])}</b></li><li>Then tap <b>Share</b> (the square with an arrow) and <b>Add to Home Screen</b>.</li></ol>`
    : `<ol class="isteps">
        <li>Tap <b>Share</b> at the top of Safari (the square with an arrow pointing up).</li>
        <li>Scroll down and tap <b>Add to Home Screen</b>.</li>
        <li>If you see a switch called <b>Open as Web App</b>, make sure it is <b>on</b>. Then tap <b>Add</b>.</li>
        <li>Close this Safari tab, and from now on open Page Quest from the blue book icon.</li></ol>
      <p class="mut" style="font-size:.9rem">Already have an icon that still opens in Safari? Press and hold it, choose <b>Remove App</b> (or <b>Delete Bookmark</b>), then add it again with the steps above.</p>`;
  if (!full && !installOpen) return `<div class="card install row spread"><p><b>Page Quest is open in a web browser.</b> Ask a grown-up to make it a full-screen app.</p>
    <button class="btn small" data-a="${A(()=>{ installOpen = true; render(); })}">Show me how</button></div>`;
  return `<div class="card install" style="display:flex;flex-direction:column;gap:10px">
    <h3>Make Page Quest a full-screen app</h3>
    <p>Right now it is open in a web browser, so its buttons are easy to tap by mistake. On this iPad, a grown-up can do this once:</p>
    ${S.profiles.length ? `<div class="notice" style="display:flex;flex-direction:column;gap:8px"><p><b>First, save the progress.</b> The Home Screen app starts empty, so copy ${S.profiles.map(p => esc(p.name)).join(' and ')}'s progress now and paste it in the app afterwards (Grown-ups → Move progress).</p>
      <div><button class="btn small" data-a="${A(()=>copyProgress('bannerMsg'))}">Copy progress</button></div><div id="bannerMsg"></div></div>` : ''}
    ${steps}
    <div><button class="btn ghost small" data-a="${A(()=>{ try{ sessionStorage.setItem('pq-install-later','1'); }catch(e){} installOpen = false; render(); })}">Not now</button></div></div>`;
}

// ---------- Moving progress between Safari and the Home Screen app ----------
// An iPad keeps a Home Screen app's saved data apart from Safari's, so progress is carried across as a code.
function progressCode(){ return 'PQ1:' + btoa(unescape(encodeURIComponent(JSON.stringify({profiles:S.profiles})))); }
function copyProgress(msgId){
  const code = progressCode(), say = t => { const el = document.getElementById(msgId); if (el) el.innerHTML = t; };
  const show = () => say(`<p>Copy all of this text (press and hold, then Select All and Copy):</p><textarea class="pcode" readonly onfocus="this.select()">${esc(code)}</textarea>`);
  try{ navigator.clipboard.writeText(code).then(() => say('<p class="result">✓ Progress copied. Now open Page Quest from the Home Screen icon, tap <b>Grown-ups</b>, and paste it under <b>Move progress</b>.</p>'), show); }catch(e){ show(); }
}
function loadProgress(text){
  text = String(text||'').trim();
  try{
    if (!text.startsWith('PQ1:')) throw 0;
    const data = JSON.parse(decodeURIComponent(escape(atob(text.slice(4)))));
    if (!Array.isArray(data.profiles)) throw 0;
    let added = 0, updated = 0;
    for (const inc of data.profiles){
      if (!inc || !inc.id || !inc.name) continue;
      const i = S.profiles.findIndex(x => x.id === inc.id);
      if (i < 0){ S.profiles.push(inc); added++; }
      else if ((inc.xp||0) >= (S.profiles[i].xp||0)){ S.profiles[i] = inc; updated++; }
    }
    save();
    return `✓ Moved ${added + updated} reader${added + updated === 1 ? '' : 's'}: ${data.profiles.map(x => esc(x.name)).join(', ')}.`;
  }catch(e){ return 'That text is not a Page Quest progress code. Copy it again from the Safari tab and paste all of it.'; }
}
function alertBox(t){ const el = document.getElementById('moveMsg'); if (el) el.innerHTML = `<p class="notice">${t}</p>`; }
function moveCard(){
  return `<div class="card" style="display:flex;flex-direction:column;gap:10px"><h3>Move progress</h3>
    <p class="mut">Use this when switching from the Safari tab to the Home Screen app (or to another iPad). Copy on the old one, paste on the new one.</p>
    <div class="row"><button class="btn small" data-a="${A(()=>copyProgress('moveMsg'))}">Copy progress from here</button></div>
    <div id="moveMsg"></div>
    <label class="lab" for="pasteCode">Paste progress here</label>
    <textarea id="pasteCode" class="pcode" placeholder="Press and hold, then Paste"></textarea>
    <div><button class="btn small sun" data-a="${A(()=>{ const r = loadProgress(document.getElementById('pasteCode').value); document.getElementById('moveMsg').innerHTML = `<p class="result">${r}</p>`; })}">Load progress</button></div></div>`;
}

function mapSvg(p){
  const W = 700, H = 210, pts = [];
  for (let i=0;i<=STOPS;i++){ const x = 30 + i*(W-60)/STOPS; const y = 105 + Math.sin(i*0.9)*60; pts.push([x,y]); }
  const pos = Math.min(p.completed, STOPS);
  let d = 'M'+pts[0].join(' ');
  for (let i=1;i<pts.length;i++){ const [x0,y0]=pts[i-1],[x1,y1]=pts[i]; const mx=(x0+x1)/2; d += ` C${mx} ${y0} ${mx} ${y1} ${x1} ${y1}`; }
  const stops = pts.map(([x,y],i) => {
    const chest = i>0 && i%5===0, reached = p.completed >= i;
    if (chest) return `<text x="${x}" y="${y+10}" text-anchor="middle" font-size="30">${reached?'🎁':'🧰'}</text>`;
    return `<circle cx="${x}" cy="${y}" r="13" fill="${reached?'var(--good)':'var(--panel)'}" stroke="${reached?'var(--good)':'var(--path)'}" stroke-width="4"/>`;
  }).join('');
  const [ax, ay] = pts[pos];
  return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Story path: ${p.completed} of ${STOPS} stops">
    <path d="${d}" fill="none" stroke="var(--path)" stroke-width="10" stroke-linecap="round" stroke-dasharray="2 18"/>
    ${stops}<text x="${ax}" y="${ay-22}" text-anchor="middle" font-size="36">${p.av}</text></svg>`;
}

// ---------- Library ----------
function vLibrary(){
  const p = me(), tab = view.tab || 'rec', f = p.focus || {};
  const lvlFor = s => p.grade >= 5 ? s.lvl >= 4 : s.lvl <= 4;
  const boost = s => (s.school && lvlFor(s) ? 4 : 0) + (lvlFor(s) ? 2 : 0)
    + (f.lit && ['fiction','tales','fun'].includes(s.cat) ? 1 : 0) + (f.info && (s.cat === 'people' || /Science|Social/.test(s.school||'')) ? 1 : 0);
  const doneLast = (a, b) => (p.done[a.id] ? 1 : 0) - (p.done[b.id] ? 1 : 0);
  let list = [];
  if (tab === 'rec') list = allStories().slice().sort((a,b) => doneLast(a,b) || boost(b) - boost(a));
  else if (tab === 'school') list = allStories().filter(s => s.school && lvlFor(s)).sort(doneLast);
  else if (tab === 'mine') list = p.custom || [];
  else if (tab !== 'series') list = STORIES.filter(s => s.cat === tab);
  const series = (tab === 'rec' || tab === 'series') ? SERIES.slice().sort((a,b) => (lvlFor(b)?1:0) - (lvlFor(a)?1:0)).filter(se => tab === 'series' || lvlFor(se)) : [];
  const tabs = [['rec','For you'],['series','Chapter books'],['school','Like class'],['fun','Fun stories'],['tales','Tales & poems'],['fiction','Realistic fiction'],['people','Real people']];
  if ((p.custom||[]).length) tabs.push(['mine','My new stories']);
  app.innerHTML = `${topbar(()=>go({name:'hub'}))}
  <h1>Pick a story</h1>
  <div class="tabs">${tabs.map(([k,l]) => `<button class="${tab===k?'on':''}" data-a="${A(()=>{view.tab=k; render();})}">${l}</button>`).join('')}</div>
  <div class="books">
    ${series.map(se => { const c = chapterInfo(p, se); return `<button class="book chapbook" data-a="${A(()=>go({name:'series', id:se.id}))}">

// ----- word help: syllable chunks (no audio, by design) -----
function syllables(word){
  const w = word.replace(/[^A-Za-z]/g,''); if (w.length <= 3) return [w];
  const l = w.toLowerCase(), isV = (i) => 'aeiou'.includes(l[i]) || (l[i]==='y' && i>0 && !'aeiou'.includes(l[i-1]));
  const leEnd = /[^aeiou]le$/.test(l); // ta-ble, can-dle (but rep-tile has a silent e)
  const silentE = l.endsWith('e') && !leEnd && !'aeiou'.includes(l[l.length-2]);
  const ce = l.slice(-4,-2), blendEd = /^[^aeiou][rl]$/.test(ce) && ce[0] !== ce[1]; // hun-dred, sa-cred say their -ed; jumped, rolled do not
  const silentEd = l.endsWith('ed') && !/[td]ed$/.test(l) && !blendEd;
  const groups = []; // [start,end) of vowel groups
  for (let i=0;i<l.length;i++){
    if (!isV(i)) continue;
    if ((silentE && i===l.length-1) || (silentEd && i===l.length-2)) continue;
    if (groups.length && groups[groups.length-1][1] === i) groups[groups.length-1][1] = i+1; else groups.push([i,i+1]);
  }
  if (groups.length < 2) return [w];
  const keep = ['ch','sh','th','ph','wh','ck','ng','qu','bl','br','cl','cr','dr','fl','fr','gl','gr','pl','pr','sc','sk','sl','sm','sn','sp','st','sw','tr','tw'];
  const cuts = [];
  for (let g=0; g<groups.length-1; g++){
    const a = groups[g][1], b = groups[g+1][0], n = b - a;
    let cut;
    if (n === 0) cut = a; else if (n === 1) cut = l[a]==='x' ? a+1 : a;
    else if (n === 2) cut = (keep.slice(0,8).includes(l.slice(a,b)) || /^[bcdfgpt][rl]$/.test(l.slice(a,b))) ? a : a+1; // digraphs and r/l blends stay together (mi-grate), others split (bas-ket)
    else cut = keep.includes(l.slice(b-2,b)) ? b-2 : a+1;
    if (leEnd && g === groups.length-2) cut = l.length-3;
    cuts.push(cut);
  }
  const parts = []; let prev = 0;
  for (const c of cuts){ if (c > prev && c < w.length){ parts.push(w.slice(prev,c)); prev = c; } }
  parts.push(w.slice(prev));
  return parts.filter(Boolean);
}

function buildDone(p, b){ return b.parts.every(pt => partsOf(p, b.id).includes(pt[0])); }
function buildSvg(p, b, size){
  const have = partsOf(p, b.id);
  return `<svg viewBox="0 0 100 120" width="${size}" height="${size*1.2}" role="img" aria-label="${esc(b.name)}: ${have.length} of ${b.parts.length} parts">
    ${b.parts.map(pt => have.includes(pt[0]) ? `<g>${pt[3]}</g>` : `<g class="ghost">${pt[3]}</g>`).join('')}</svg>`;
}
function buyPart(b, pt){
  const p = me(); if (p.coins < pt[2] || partsOf(p, b.id).includes(pt[0])) return;
  p.coins -= pt[2]; p.parts[b.id] = partsOf(p, b.id).concat(pt[0]); save();
  if (buildDone(p, b)){ addCoins(b.bonus, b.name + ' complete!'); confetti(120); view.done = b.id; } else confetti(25);
  render();
}

  if (parts.length > 1 && order.every((x,i)=>x===i)) order.reverse();

}

// Memory Match family: the same flip-and-match game, each version practising a reading skill.
//   match   = word and picture        meaning = word and what it means (story words + word bank)
//   chunks  = two halves of a word     prefix  = a word part and what it means
const MATCH_KINDS = ['match','meaning','chunks','prefix'];
const MATCH_HOW = {
  match:'Match each word with its picture. Read the word out loud when you flip it!',
  meaning:'Match each word with what it means. Read both cards out loud!',
  chunks:'Match the two halves that make a word. Say the whole word when you find it!',
  prefix:'Match each word with what it means. Some words share a root, like careful and careless, so look closely at the beginning and the end!'};
// [part, meaning, example word, group]; parts in the same group mean nearly the same thing and never share a board
const AFFIX = {
  3:[['un-','not','unlock','not'],['re-','again','redo','again'],['pre-','before','preview','before'],['dis-','the opposite of','disagree','opp'],
     ['-ful','full of','hopeful','full'],['-less','without','fearless','without'],['-er','a person who does it','teacher','person'],['-ly','in a way that is','quickly','way']],
  5:[['mis-','wrongly','misspell','wrong'],['non-','no or none','nonstop','not'],['sub-','under or below','submarine','under'],['inter-','between','interstate','between'],
     ['-able','can be done','readable','can'],['-ment','the act or result of','movement','act'],['-ness','the state of being','kindness','state'],['-ous','having a lot of','joyous','full'],
     ['-ist','a person who studies or does','artist','person'],['-ward','in the direction of','homeward','dir'],['multi-','many','multicolor','many']]};
// Each reader remembers the last words each matching game showed, and new boards use words not seen recently first.
const SEEN_KEEP = 80;
function seenList(p, kind){ p.seen = p.seen || {}; return p.seen[kind] || (p.seen[kind] = []); }
function markSeen(p, kind, keys){ const l = seenList(p, kind).filter(k => !keys.includes(k)); l.push(...keys); p.seen[kind] = l.slice(-SEEN_KEEP); save(); }
// fresh-first order: never-seen words shuffled, then seen words oldest first
function freshOrder(p, kind, list, key){
  const seen = seenList(p, kind), pos = new Map(seen.map((k,i) => [k,i]));
  const fresh = shuffle(list.filter(x => !pos.has(key(x)))), old = list.filter(x => pos.has(key(x))).sort((a,b) => pos.get(key(a)) - pos.get(key(b)));
  return fresh.concat(old);
}
function uniqBy(list, key){ const s = new Set(); return list.filter(x => { const k = key(x); if (s.has(k)) return false; s.add(k); return true; }); }
function matchPairs(kind, p){
  const hi = p.grade >= 5, bank = bankWords(p), MW = MATCHWORDS;
  if (kind === 'match'){
    const pool = uniqBy((hi ? PICS5.concat(MW.pics5) : PICS3.concat(MW.pics3)), x => x[0]);
    const out = [], emo = new Set();
    for (const [w,e] of freshOrder(p, kind, pool, x => x[0])){ if (emo.has(e)) continue; emo.add(e); out.push({a:w, b:e, aw:true, bw:false, key:w}); if (out.length === 6) break; }
    return out;
  }
  if (kind === 'meaning'){
    // up to 2 review words (the reader's word bank, then words from stories read in the last few days), the rest new vocabulary
    const lv = s => hi ? s.lvl >= 4 : s.lvl <= 4, recent = addDays(-4);
    const stories = allStories().concat(chapterStories()).filter(lv);
    const review = [];
    bank.forEach(k => { const d = (EXTRA.defs||{})[k]; if (d) review.push({w:k, def:d, bank:k}); });
    stories.filter(s => p.done[s.id] && p.done[s.id].d >= recent).forEach(s => s.tricky.forEach(t => { const d = defOf(t[0], s); if (d) review.push({w:t[0], def:d}); }));
    const vocab = (hi ? MW.vocab5 : MW.vocab3).map(([w, def]) => ({w, def}));
    const out = [], words = new Set(), defs = new Set();
    const take = x => { const k = bankKey(x.w); if (words.has(k) || defs.has(x.def)) return false; words.add(k); defs.add(x.def); out.push({a:x.w, b:x.def, aw:true, bw:false, bank:x.bank||'', key:k}); return true; };
    for (const x of freshOrder(p, kind, uniqBy(review, x => bankKey(x.w)), x => bankKey(x.w))){ if (out.length >= 2) break; take(x); }
    for (const x of freshOrder(p, kind, vocab, x => bankKey(x.w))){ if (out.length >= 5) break; take(x); }
    return shuffle(out);
  }
  if (kind === 'chunks'){
    const base = hi ? MW.chunks5.concat(SMASH5) : MW.chunks3.concat(SPELL3.flatMap(x => x.w), SMASH3);
    const words = uniqBy(base.map(w => ({parts:w.split('-'), bank:''})), x => x.parts.join('').toLowerCase());
    const banked = bank.map(k => ({parts:syllables(k), bank:k})).filter(x => x.parts.length >= 2);
    const firsts = new Set(), seconds = new Set(), out = [];
    const order = banked.slice(0, 2).concat(freshOrder(p, kind, words, x => x.parts.join('').toLowerCase()));
    for (const x of order){
      if (x.parts.length < 2) continue;
      const h = Math.ceil(x.parts.length/2), a = x.parts.slice(0,h).join('').toLowerCase(), b = x.parts.slice(h).join('').toLowerCase();
      if (firsts.has(a) || seconds.has(b)) continue;
      firsts.add(a); seconds.add(b); out.push({a:a+'-', b:'-'+b, aw:true, bw:true, done:a+b, bank:x.bank, key:a+b});
      if (out.length === 6) break;
    }
    return out;
  }
  // prefix: words that share a root sit on the same board (careful, careless), so the word part is what tells them apart
  const items = uniqBy((hi ? MW.affix5.concat(MW.affix3.slice(0)) : MW.affix3), x => x.word);
  const fam = new Map(); items.forEach(x => { if (!fam.has(x.root)) fam.set(x.root, []); fam.get(x.root).push(x); });
  const roots = freshOrder(p, kind, [...fam.keys()], r => r);
  const out = [], meanings = new Set();
  const take = x => { if (meanings.has(x.meaning) || out.some(o => o.a === x.word)) return; meanings.add(x.meaning); out.push({a:x.word, b:x.meaning, aw:true, bw:false, key:x.root}); };
  for (const r of roots){ const f = fam.get(r); if (f.length < 2 || out.length > 4) continue; shuffle(f).slice(0, 2).forEach(take); }
  for (const r of roots){ if (out.length >= 6) break; if (!out.some(o => o.key === r)) take(shuffle(fam.get(r))[0]); }
  return shuffle(out.slice(0, 6));
}

    G = {k:kind, pairs, cards, open:[], got:new Set(), moves:0, lock:false};
    markSeen(p, kind, pairs.map(x => x.key));
  }
  const g = G, n = g.pairs.length, gm = GAMES[kind];
  app.innerHTML = `${topbar(()=>go({name:'arcade'}))}

    <div class="row spread"><h2>${gm.icon} ${gm.name}</h2><span class="chip" style="font-size:1rem">Tries <b>${g.moves}</b> · Pairs ${g.got.size/2} of ${n}</span></div>
    <p class="mut">${MATCH_HOW[kind]}</p>
    <div class="mgrid ${n === 5 ? 'five' : ''}">${g.cards.map((c,i) => { const shown = g.open.includes(i) || g.got.has(i);
      return `<button class="mcard ${shown?'open':''} ${g.got.has(i)?'got':''} ${c.word?'word':''} ${c.long?'long':''}" aria-label="${shown ? esc(c.txt) : 'Hidden card'}" ${shown && c.word ? `style="font-size:${wordFs(g.got.has(i) ? c.got : c.txt, n)}rem"` : ''} data-a="${A(()=>matchTap(i))}">${shown ? esc(g.got.has(i) ? c.got : c.txt) : '★'}</button>`; }).join('')}</div>
  </div>`;
}
// long words shrink to fit their card instead of being cut or split mid-word
function wordFs(t, n){ const len = String(t).length, base = n === 5 ? 1.15 : 1.25, fit = n === 5 ? 6.5 : 7.5; return Math.max(0.74, Math.min(base, base*fit/len)).toFixed(2); }
function matchTap(i){
  const g = G; if (!g || !MATCH_KINDS.includes(g.k) || g.lock || g.open.includes(i) || g.got.has(i)) return;
  g.open.push(i);
  if (g.open.length === 2){
    g.moves++;
    const [a,b] = g.open;
    if (g.cards[a].pair === g.cards[b].pair){
      g.got.add(a); g.got.add(b); g.open = []; confetti(10);
      const pr = g.pairs[g.cards[a].pair]; if (pr.bank) bankOk(pr.bank);
      if (g.k === 'meaning' || g.k === 'prefix') skillMark('vocabulary', true);
      if (g.got.size === g.cards.length){ const m = g.moves, n = g.pairs.length; render(); setTimeout(() => endGame(g.k, Math.max(20, 100 - (m-n)*6), {moves:m}), 700); return; }
    } else { g.lock = true; setTimeout(() => { if (G === g){ g.open = []; g.lock = false; render(); } }, 1100); }
  }
  render();
}

// Hangman (balloon style): guess the word a letter at a time; the clue is its meaning. Each wrong letter pops a balloon.
const HANG_BALLOONS = 7, HANG_WORDS = 5;
// a word's syllables: the hand-made split from the word lists when there is one, else the automatic one
let _splits = null;
function splitOf(w){
  if (!_splits){ _splits = new Map(); MATCHWORDS.chunks3.concat(MATCHWORDS.chunks5, SMASH3, SMASH5, SPELL3.flatMap(x => x.w)).forEach(x => _splits.set(x.replace(/-/g,'').toLowerCase(), x.split('-')));
    allStories().concat(chapterStories()).forEach(s => s.tricky.forEach(t => _splits.set(t[0].toLowerCase(), t[1].split('-')))); }
  return _splits.get(String(w).toLowerCase()) || syllables(w);
}
function hangPick(p){
  const hi = p.grade >= 5, ok = w => /^[a-z]+$/.test(w) && w.length >= (hi ? 5 : 4) && w.length <= (hi ? 12 : 9);
  const vocab = (hi ? MATCHWORDS.vocab5 : MATCHWORDS.vocab3).map(([w, def]) => ({w:w.toLowerCase(), def})).filter(x => ok(x.w));
  const banked = bankWords(p).filter(k => ok(k) && (EXTRA.defs||{})[k]).map(k => ({w:k, def:EXTRA.defs[k], bank:k}));
  const list = banked.slice(0, 2).concat(freshOrder(p, 'hang', vocab, x => x.w));
  return uniqBy(list, x => x.w).slice(0, HANG_WORDS);
}
function vHang(){
  const p = me();
  if (!G || G.k !== 'hang'){
    G = {k:'hang', words: hangPick(p), i:0, guessed:new Set(), wrong:0, score:0, solved:0, hint:false, state:'play'};
    markSeen(p, 'hang', G.words.map(x => x.w));
    const key = e => { if (!G || G.k !== 'hang' || view.name !== 'g_hang') return; const c = (e.key||'').toLowerCase(); if (/^[a-z]$/.test(c)) hangGuess(c); else if (e.key === 'Enter' && G.state !== 'play') hangNext(); };
    addEventListener('keydown', key); G.cleanup = () => removeEventListener('keydown', key);
  }
  const g = G, x = g.words[g.i], left = HANG_BALLOONS - g.wrong;
  const slots = [...x.w].map(c => g.guessed.has(c) || g.state !== 'play' ? c : '');
  app.innerHTML = `${topbar(()=>go({name:'arcade'}))}
  <div class="card" style="display:flex;flex-direction:column;gap:14px">
    <div class="row spread"><h2>🎈 Hangman</h2><span class="chip" style="font-size:1rem">Word ${g.i+1} of ${g.words.length} · Score <b>${g.score}</b></span></div>
    <div class="hballoons" aria-label="${left} balloons left">${'🎈'.repeat(left)}${'<span class="popped">💥</span>'.repeat(g.wrong)}</div>
    <div class="havatar">${p.av}</div>
    <p class="hclue"><span class="skill">Clue</span><br>${esc(x.def)}</p>
    <div class="hslots">${slots.map(c => `<span class="hslot ${g.state==='lost' && !g.guessed.has(c) ? 'miss' : ''}">${esc(c)}</span>`).join('')}</div>
    ${g.state === 'play' ? `<div class="hkeys">${'abcdefghijklmnopqrstuvwxyz'.split('').map(c => { const used = g.guessed.has(c), hit = used && x.w.includes(c);
        return `<button class="hkey ${used ? (hit ? 'hit' : 'miss') : ''}" ${used ? 'disabled' : ''} data-a="${A(()=>hangGuess(c))}">${c}</button>`; }).join('')}</div>
      <div class="row">${g.hint ? '' : `<button class="btn ghost small" data-a="${A(hangHint)}">💡 Show me one letter</button>`}<span class="mut">${x.w.length} letters</span></div>`
    : `<div class="result">${g.state === 'won' ? '🎉 You got it!' : 'The balloons are gone. The word was:'} <b>${esc(splitOf(x.w).join('-'))}</b>. Say it out loud!<br>It means: ${esc(x.def)}</div>
      <div><button class="btn" data-a="${A(hangNext)}">${g.i + 1 >= g.words.length ? 'Finish' : 'Next word'}</button></div>`}
  </div>`;
}
function hangGuess(c){
  const g = G; if (!g || g.k !== 'hang' || g.state !== 'play' || g.guessed.has(c)) return;
  const x = g.words[g.i]; g.guessed.add(c);
  if (!x.w.includes(c)) g.wrong++;
  if ([...x.w].every(ch => g.guessed.has(ch))){
    g.state = 'won'; g.solved++; g.score += 10 + 2*(HANG_BALLOONS - g.wrong) - (g.hint ? 3 : 0);
    skillMark('vocabulary', true); if (x.bank) bankOk(x.bank); confetti(30);
  } else if (g.wrong >= HANG_BALLOONS){ g.state = 'lost'; skillMark('vocabulary', false); }
  render();
}
function hangHint(){
  const g = G; if (!g || g.hint || g.state !== 'play') return;
  const x = g.words[g.i], missing = [...new Set(x.w)].filter(c => !g.guessed.has(c));
  if (!missing.length) return; g.hint = true; hangGuess(missing[Math.floor(Math.random()*missing.length)]);
}
function hangNext(){
  const g = G; if (!g || g.k !== 'hang' || g.state === 'play') return;
  if (g.i + 1 >= g.words.length){ endGame('hang', g.score, {solved:g.solved, total:g.words.length}); return; }
  g.i++; g.guessed = new Set(); g.wrong = 0; g.hint = false; g.state = 'play'; render();
}

// ---------- Celebration ----------
function floatText(t){ const d = document.createElement('div'); d.className = 'float'; d.textContent = t; document.body.appendChild(d); setTimeout(()=>d.remove(), 1200); }
const fx = document.getElementById('fx'), ctx = fx.getContext('2d'); let parts = [], fxOn = false;
function confetti(n){
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  fx.width = innerWidth; fx.height = innerHeight;
  const cols = ['#f4b324','#2a5bd7','#1c8f5a','#e2553a','#9b6bff'];
  for (let i=0;i<n;i++) parts.push({x:innerWidth/2, y:innerHeight*0.45, vx:(Math.random()-.5)*12, vy:-Math.random()*12-4, r:4+Math.random()*5, c:cols[i%cols.length], life:70+Math.random()*30});
  if (!fxOn){ fxOn = true; requestAnimationFrame(tick); }
}
function tick(){
  ctx.clearRect(0,0,fx.width,fx.height);
  parts.forEach(p => { p.x += p.vx; p.y += p.vy; p.vy += .35; p.life--; ctx.fillStyle = p.c; ctx.fillRect(p.x, p.y, p.r, p.r*1.6); });
  parts = parts.filter(p => p.life > 0 && p.y < fx.height+20);
  if (parts.length) requestAnimationFrame(tick); else { fxOn = false; ctx.clearRect(0,0,fx.width,fx.height); }
}

{id:'s5-friends', title:'Room for Three', icon:'🌳', lvl:5,
 blurb:'Jonah thinks his tree house only has room for two best friends, until a new neighbor, a storm, and his grandfather\'s old secret change his mind.',
 chapters:[
  {title:'The Rule of Two',
   tricky:[['permanent','per-ma-nent','lasting forever, never changing'],['particular','par-tic-u-lar','one special or specific one'],['announced','an-nounced','told everyone something important'],['privacy','pri-va-cy','being alone, away from others']],
   pages:[
    {t:'Jonah Price and Felix Hill had built the tree house in the old maple behind Jonah\'s house the summer they were nine. Two summers later, it was still the most important place in Jonah\'s world. Painted on the trapdoor, in letters that had faded to pale orange, was their one and only rule: MEMBERS ONLY, TWO MAXIMUM. Felix had suggested it as a joke, but Jonah had taken it seriously. To him, the rule meant something permanent. People changed schools, teachers, and haircuts, but the tree house stayed the same. Every Saturday, the boys climbed up with a bag of pretzels and a stack of comic books, and nothing interrupted them. At least, nothing had until this particular Saturday.',
     q:'What does the rule on the trapdoor show about Jonah?', o:['He wants things in his life to stay the same','He wants to meet as many new people as possible','He does not really care about the tree house'], e:'To him, the rule meant something permanent.', k:'character'},
    {t:'That morning, Jonah\'s mom had announced that Pop, Jonah\'s grandfather, was moving in. Pop had lived alone in a small apartment across town since Grandma died, but lately he had been forgetting to eat lunch and leaving the stove on. "He needs family nearby," Mom explained gently. "And he\'ll need your room, Jonah. You can share with your little brother." Jonah stared at his cereal until it turned soggy. He loved Pop, but Pop was quiet and old-fashioned, and he smelled like peppermints and motor oil. Jonah never knew what to say to him. Now he was losing his room, his privacy, and maybe his Saturday mornings, all at once.',
     q:'Why is Pop moving in with Jonah\'s family?', o:['He has been forgetting things and needs family nearby','He wants to help build the tree house','His apartment was much too big for him'], e:'"He needs family nearby," Mom explained gently.', k:'detail'},
    {t:'By noon, Pop\'s boxes filled the hallway. Jonah escaped to the tree house and waited for Felix, who was late. When Felix finally appeared at the bottom of the ladder, he was not alone. Beside him stood a girl Jonah had never seen before. She had a backpack covered in patches and a toolbox in one hand. "This is Kate," Felix called up cheerfully. "She just moved in next door to me. She knows how to wire lights, Jonah. Real lights! Can she come up?" Jonah looked down at the two of them. Then he looked at the faded orange letters on the trapdoor. His hand tightened on the edge of the floorboards.',
     q:'Why does the author end the chapter with Jonah looking at the faded letters?', o:['To build suspense about whether he will follow the rule','To describe what color the tree house is painted','To show that Jonah is planning to repaint the trapdoor'], e:'Then he looked at the faded orange letters on the trapdoor.', k:'inference'}
   ],
   seq:['Jonah and Felix follow their two-member rule each Saturday','Mom announces that Pop is moving in','Pop\'s boxes fill the hallway','Felix brings Kate to the tree house'],

  {title:'Two Maximum',

   recall:{q:'In Chapter 1, what was Kate carrying when she arrived at the tree house?', o:['A toolbox','A bag of pretzels','A stack of comic books']},
   pages:[
    {t:'"Sorry," Jonah said, and his voice came out harder than he meant it to. "Members only. Two maximum. You know the rule." Felix laughed, waiting for Jonah to laugh too. When he didn\'t, Felix\'s smile slowly disappeared. Kate shifted her toolbox to her other hand and studied the grass. "It\'s fine," she said quietly. "I should finish unpacking anyway." "No, wait," Felix said. He squinted up at Jonah. "That rule was a joke, man. I made it up when we were nine." "Well, I didn\'t think it was a joke," Jonah replied. The words hung in the air between them like a rope pulled too tight, ready to snap. Neither of them said anything for a long, awful moment.',
     q:'What does the simile "like a rope pulled too tight" suggest about the friendship?', o:['The friendship is tense and could break','The boys are about to play tug-of-war','Jonah needs a new rope for the ladder'], e:'like a rope pulled too tight, ready to snap', k:'vocabulary'},
    {t:'Felix was usually the most easygoing person Jonah knew. He never stayed angry for more than five minutes, and he shared his snacks with anybody who asked. So it surprised Jonah when Felix crossed his arms. "You know what, Jonah? You\'re acting like the tree house is a castle and you\'re the king," Felix said. "Kate is nice. You haven\'t even said hello to her." Jonah felt his face burn. He knew Felix was partly right, which only made him angrier. "Then go hang out at her house," he snapped. Felix stared at him for a long moment. Then he turned and walked away with Kate, and he did not look back.',
     q:'Why is it surprising that Felix crosses his arms and argues?', o:['Felix is usually easygoing and rarely gets angry','Felix is always grumpy with everyone','Felix has never liked the tree house'], e:'Felix was usually the most easygoing person Jonah knew.', k:'character'},
    {t:'Jonah stayed in the tree house all afternoon, reading the same comic book three times without understanding a single page. He told himself he was glad to have the place to himself. That was the whole point of the rule, wasn\'t it? But the tree house felt larger and emptier than it ever had. At dinner, Pop tried to ask him about school, and Jonah answered with one-word replies until Pop gave up. The next morning, Jonah biked past Felix\'s street on his way to the store. He slowed down when he heard hammering. In Kate\'s backyard, Felix and Kate were nailing boards together, building something big, and they were both laughing.',
     q:'What does the tree house feeling "larger and emptier" show about Jonah?', o:['He misses Felix more than he wants to admit','He thinks the tree house needs more furniture','He is truly happy to be alone'], e:'But the tree house felt larger and emptier than it ever had.', k:'character'}

   seq:['Jonah refuses to let Kate come up','Felix tells Jonah he is acting like a king','Felix walks away with Kate','Jonah sees Felix and Kate building together'],

    {t:'For three days, Jonah avoided everyone. He took the long way to the bus stop so he would not pass Felix\'s street, and he ate lunch in the library. At home, he stayed out of Pop\'s way. On the fourth evening, Pop knocked on the doorframe of the room Jonah now shared with his little brother, Matt. In his hands was an old radio with a cracked wooden case. "This was my father\'s," Pop said. "It hasn\'t worked in years. My eyes aren\'t good enough for the tiny parts anymore. Would you help me?" Jonah almost said no. Then he noticed how carefully Pop was holding it, as if it were a sleeping bird.',
     q:'What does the comparison to "a sleeping bird" tell the reader about the radio?', o:['It is precious and fragile to Pop','It makes chirping noises when it plays','It actually belongs to Matt'], e:'as if it were a sleeping bird', k:'vocabulary'},
    {t:'They worked at the kitchen table with a magnifying glass and a set of tiny screwdrivers. Pop explained each part patiently, never once hurrying Jonah, even when he dropped a screw on the floor for the third time. As they worked, Pop began to talk. He told Jonah about Walt, his best friend from when he was a boy. "We did everything together," Pop said. "Fished, built go-karts, fixed engines. Then Walt met a fellow named Henry at work, and suddenly it was the three of them. I didn\'t like that one bit." Pop tightened a wire. "So I said some things I regret. Walt stopped calling. That was fifty years ago."',
     q:'How is Pop\'s story about Walt similar to Jonah\'s problem?', o:['Both were jealous when a best friend made a new friend','Both of them loved going fishing','Both of them broke an old radio'], e:'and suddenly it was the three of them. I didn\'t like that one bit.', k:'character'},
    {t:'Jonah didn\'t say anything, but he listened harder than he had listened to anyone in weeks. Finally, Pop connected the last wire and turned the dial. At first there was only crackling static. Then, faintly, a trumpet came through, playing an old song. Pop closed his eyes and smiled. Later that night, Jonah went to the garage to return the screwdrivers to Pop\'s toolbox. Underneath the tray, he found a bundle of envelopes tied with string. The top one was addressed to Pop in shaky handwriting. The return address said Walter Dunn. Jonah turned it over. The envelope had never been opened, and the postmark was from just last spring.',
     q:'Why might Pop have never opened Walt\'s letter?', o:['He may be afraid of what Walt wrote','He did not have time to read his mail','He thought it was a bill from the bank'], e:'The envelope had never been opened', k:'inference'}

  {title:'The Unopened Letter',
   tricky:[['apology','a-pol-o-gy','words that say you are sorry'],['protecting','pro-tect-ing','keeping something safe from harm'],['argument','ar-gu-ment','an angry talk where people disagree'],['lightning','light-ning','a bright flash in the sky during storms']],
   recall:{q:'In Chapter 3, who was Walt?', o:['Pop\'s best friend from when he was a boy','Jonah\'s new science teacher','Kate\'s older brother']},
   pages:[
    {t:'Jonah carried the envelope inside and set it on the table in front of Pop. For a long moment, Pop just looked at it. "Walt wrote you last spring," Jonah said. "Why didn\'t you open it?" Pop rubbed his thumb across the shaky handwriting. "Because I was a coward," he admitted. "I figured it was either an apology or an argument. If it was an apology, I would have to admit I was wrong too. If it was an argument, I would lose him all over again." He set the letter down. "Pride is a funny thing, Jonah. It feels like strength, but mostly it just keeps you lonely." Jonah felt the words land somewhere deep inside him.',
     q:'What does Pop mean when he says pride "keeps you lonely"?', o:['Being too proud to admit mistakes can push people away','Proud people prefer to live alone','Pride makes you stronger than your friends'], e:'It feels like strength, but mostly it just keeps you lonely.', k:'main idea'},
    {t:'Jonah lay awake that night listening to Matt snore. He kept thinking about the faded letters on the trapdoor and about Felix\'s face when Jonah said the rule wasn\'t a joke. He had told himself that he was protecting the tree house. Now he wondered whether he had really been protecting himself, from the fear that Felix would like Kate better. At breakfast, Jonah tore a page from his notebook and wrote a note. It was short, because every longer version sounded wrong. "I was a jerk. I\'m sorry. The rule was dumb. Jonah." He slipped it into Felix\'s mailbox on his way to school, his heart thudding the whole time.',
     q:'How has Jonah changed since Chapter 2?', o:['He realizes he was wrong and decides to apologize','He decides to put a lock on the tree house','He becomes even angrier at Felix'], e:'"I was a jerk. I\'m sorry. The rule was dumb. Jonah."', k:'character'},
    {t:'Felix did not answer that day, or the next. Jonah checked his own mailbox so many times that Matt started teasing him about it. Maybe Pop had been right to be afraid, Jonah thought. Maybe some things could not be fixed once they were broken. On Friday night, a storm rolled in. Thunder shook the windows, and wind howled through the backyard. Jonah sat at the window with Pop, watching the maple tree bend and sway. Then, with a crack louder than any thunder, a huge branch split away from the trunk. In the next flash of lightning, Jonah saw the tree house tilting sideways, half its floor hanging in the air.',
     q:'Why might the author have the storm break the tree house right after Jonah worries about broken things?', o:['It makes Jonah\'s fear feel real and raises the stakes','It shows that Felix has finally answered the note','It makes the ending feel calm and peaceful'], e:'Maybe some things could not be fixed once they were broken.', k:'inference'}
   ],
   seq:['Jonah asks Pop why he never opened the letter','Pop explains how pride kept him lonely','Jonah writes an apology note to Felix','A storm breaks the tree house'],

   pages:[
    {t:'In the morning, the backyard was a mess of leaves and splintered boards. Jonah stood at the bottom of the maple, staring at what was left of the tree house. The trapdoor lay in the mud, its orange letters facing the sky. He was trying not to cry when he heard footsteps. Felix was walking up the driveway. Kate was right behind him, carrying her patched backpack and her toolbox. "I got your note," Felix said. "Sorry I took so long. I was still kind of mad." He looked up at the broken floor. "Kate and I have been practicing on her shed. We figured you might need some help."',
     q:'What does Felix\'s choice to come and help show about him?', o:['He is forgiving and still cares about Jonah','He wants to take over the tree house','He is still too angry to talk'], e:'We figured you might need some help.', k:'character'},
    {t:'Jonah swallowed hard. He turned to Kate. "I\'m sorry I didn\'t even say hello," he said. "That wasn\'t fair to you." Kate shrugged, but she was smiling. "I\'ve moved four times," she said. "Everybody is weird about new people at first." Then Pop came out of the house in his old work boots, carrying his own toolbox. All weekend, the four of them rebuilt the tree house. Pop showed them how to brace the beams so the next storm would not knock them loose. Kate wired a string of lights along the roof. When they finished, the new floor was wider than before, wide enough for three, or even four.',
     q:'Why might the author make the new floor wider than the old one?', o:['To show the friendship now has room for more people','Because the old wood was too heavy','To give Pop a place to sleep'], e:'the new floor was wider than before, wide enough for three, or even four', k:'inference'},
    {t:'That evening, Felix found the old trapdoor in the mud and held it up. "What should we do with the rule?" he asked. Jonah thought for a moment. Then he took a can of paint and wrote across the faded letters in bright blue: ALWAYS ROOM FOR ONE MORE. Inside the house, Pop was sitting at the kitchen table with the radio playing softly. In his hand was Walt\'s letter, finally open. He looked up as Jonah came in, his eyes shining. "Walt says he has been wanting to call for years," Pop said, reaching for the phone. "I think it\'s time I let him." Out in the yard, the new lights in the tree house flickered on, one by one.',
     q:'How does the new rule show how Jonah has changed?', o:['He now welcomes others instead of keeping them out','He wants the tree house to be private again','He thinks only Pop should be allowed inside'], e:'ALWAYS ROOM FOR ONE MORE', k:'character'}

    {t:'Ben lived in a small town by a lake. He loved to build things. On Monday, his teacher, Mr. Owen, had big news. "The school science fair is on Friday," he said. "Everyone must make a project." Some kids planned to grow beans. Some kids planned to make volcanoes. Ben did not want to grow beans. He wanted to make something that could move. "I will build a robot," he told his best friend, Zoe. Zoe grinned. "Cool! I will help."',
     q:'What did Ben decide to make for the science fair?', o:['A robot','A volcano','A bean plant'], e:'"I will build a robot," he told his best friend, Zoe.', k:'detail'},
    {t:'After school, Ben and Zoe went to his garage. It was full of junk. There was an old toaster and a bent bike wheel. There was a mop, a pot, and two flashlights. Ben\'s mom peeked in. "Use anything you want," she said. "Just do not use my good pot." The kids got to work. The toaster became the body. The pot became the head. The flashlights became two big eyes. The bike wheel went on the bottom.',
     q:'What did Ben and Zoe use to make the robot\'s eyes?', o:['Two flashlights','An old toaster','A bent bike wheel'], e:'The flashlights became two big eyes.', k:'detail'},
    {t:'At last the robot was done. It was lumpy and a little crooked. The mop stuck out like one long arm. "He needs a name," said Zoe. Ben tapped the pot head. It went clank! "His name is Clank," Ben said. He flipped the switch on the back. Clank\'s eyes blinked on. He beeped three times. Then his wheel began to spin. Before Ben could grab him, Clank zoomed out the garage door and down the street!',
     q:'Why do you think Ben named the robot Clank?', o:['The pot head made a clank sound when he tapped it','Zoe told him a robot must be called Clank','Clank said his own name out loud'], e:'Ben tapped the pot head. It went clank!', k:'inference'}
   ],
   seq:['Mr. Owen tells the class about the science fair','Ben decides to build a robot with Zoe','The kids build the robot from junk in the garage','Clank zooms out the garage door'],
   sum:['Ben and Zoe build a clumsy robot named Clank out of junk, and he rolls away as soon as he is turned on.','Ben\'s mom does not want them to use her good pot.','Ben and Zoe grow beans for the science fair.']},

  {title:'Trouble at the Bakery',
   tricky:[['bakery','bak-er-y','a shop that makes and sells bread'],['sidewalk','side-walk','a path for walking next to a street'],['customers','cus-tom-ers','people who buy things at a store'],['powdered','pow-dered','covered with a fine, soft dust']],
   recall:{q:'In Chapter 1, what did Ben and Zoe use for Clank\'s body?', o:['An old toaster','Ben\'s mom\'s good pot','A bent bike wheel']},
   pages:[
    {t:'Ben and Zoe ran after Clank. "Stop, Clank!" Ben yelled. But Clank did not stop. He rolled down the sidewalk, beeping happily. He bumped into a trash can. Bonk! He spun around a lamp post. Then he turned and rolled right into Rosa\'s Bakery. The bell on the door jingled. Ben and Zoe looked at each other. "Oh no," said Zoe. "Rosa\'s Bakery is full of cakes and pies." They raced inside after him.',
     q:'Where did Clank roll into?', o:['Rosa\'s Bakery','The school gym','The park by the lake'], e:'Then he turned and rolled right into Rosa\'s Bakery.', k:'detail'},
    {t:'Inside, Clank was waving his mop arm. He knocked a bag of flour off a shelf. Poof! A white cloud filled the air. Everyone was powdered with flour. The customers coughed. Rosa the baker looked like a snowman. Even Clank was white. "Is this your robot?" Rosa asked. Ben\'s face got hot. He wanted to run out the door and hide. But he took a deep breath. "Yes," he said. "I am sorry. I will clean it up."',
     q:'What does Ben\'s choice to stay show about him?', o:['He is honest and takes care of his mistakes','He thinks the mess is very funny','He wants to sell Clank to Rosa'], e:'"Yes," he said. "I am sorry. I will clean it up."', k:'character'},
    {t:'Ben and Zoe swept the floor. They wiped the counters. Rosa smiled and gave them each a cookie. "Thank you for being so helpful," she said. "Your robot is clumsy, but you are not." Ben switched Clank off and pushed him home. That night, he tightened every bolt. "Tomorrow you will be good," he whispered. But in the morning, the garage door was open. Clank was gone again. His wheel tracks led toward the park.',
     q:'Why did Rosa give the kids cookies?', o:['They cleaned up the bakery','They bought all her pies','Clank fixed her oven'], e:'"Thank you for being so helpful," she said.', k:'inference'}
   ],
   seq:['Clank rolls down the sidewalk','Clank knocks a bag of flour off a shelf','Ben says sorry and cleans up the bakery','Clank is gone again in the morning'],
   sum:['Clank makes a floury mess at the bakery, and Ben owns up and cleans it, but the next day Clank escapes again.','Rosa looked like a snowman.','Rosa buys Clank for her bakery.']},

  {title:'A Splash in the Park',
   tricky:[['sprinkler','sprin-kler','a tool that sprays water on grass'],['newspaper','news-pa-per','printed pages that tell what is happening'],['dripping','drip-ping','so wet that water falls off'],['squeaky','squeak-y','making a small, high sound']],
   recall:{q:'In Chapter 2, what did Clank knock off the shelf at the bakery?', o:['A bag of flour','A big chocolate cake','A jar of cookies']},
   pages:[
    {t:'Ben and Zoe followed the wheel tracks to the park. They found Clank near the pond. He was standing next to a sprinkler. He was trying to help water the flowers. But he had pointed the sprinkler the wrong way. Water was spraying all over the benches. A man named Mr. Jake was sitting on one bench. He was reading a newspaper. Splash! Now Mr. Jake was dripping wet, and so was his newspaper.',
     q:'What was Clank trying to do with the sprinkler?', o:['Help water the flowers','Wash Mr. Jake\'s car','Fill up the pond'], e:'He was trying to help water the flowers.', k:'detail'},
    {t:'Zoe ran and turned off the water. Ben hurried over to Mr. Jake. "I am so sorry," Ben said. "My robot was trying to help." Mr. Jake wiped his glasses. Then, to their surprise, he laughed. "It was a hot day," he said. "I needed a bath anyway." He looked at Clank. "Your robot has a squeaky wheel," he said. "I fix bikes. Bring him to my shop, and I will help you oil it."',
     q:'How did Mr. Jake feel after he got wet?', o:['He was not mad and even laughed','He was very angry and yelled','He was scared of Clank'], e:'Then, to their surprise, he laughed.', k:'character'},
    {t:'At the bike shop, Mr. Jake oiled Clank\'s wheel. Ben watched closely and learned how. "A good builder never gives up," said Mr. Jake. Ben felt proud. Clank rolled smoothly now. "The science fair is tomorrow," Zoe said. "Do you think Clank is ready?" Ben was not sure. On the way home, Clank started making a new sound. Beep, beep, BOOP. His eyes flickered on and off. "Uh oh," said Ben. "What does that mean?"',
     q:'What lesson did Mr. Jake teach Ben?', o:['A good builder never gives up','Robots should stay in the garage','Always water flowers at night'], e:'"A good builder never gives up," said Mr. Jake.', k:'main idea'}
   ],
   seq:['Ben and Zoe follow the tracks to the park','Clank sprays water on Mr. Jake','Mr. Jake laughs and offers to help','Mr. Jake oils Clank\'s squeaky wheel'],
   sum:['Clank soaks Mr. Jake at the park, but Mr. Jake is kind and helps Ben fix Clank\'s squeaky wheel before the fair.','Mr. Jake was reading a newspaper on a bench.','Mr. Jake takes Clank away and keeps him at the bike shop.']},

  {title:'The Science Fair Flop',
   tricky:[['volcano','vol-ca-no','a mountain that can shoot out hot rock'],['hamster','ham-ster','a small, furry pet with a short tail'],['wobbled','wob-bled','moved from side to side, almost falling'],['darkness','dark-ness','when there is no light at all']],
   recall:{q:'In Chapter 3, who helped Ben fix Clank\'s squeaky wheel?', o:['Mr. Jake from the bike shop','Rosa the baker','Mr. Owen the teacher']},
   pages:[
    {t:'On Friday, the gym was full of projects. There was a volcano that fizzed. There was a tall bean plant in a cup. The class pet, a hamster named Peanut, was there too. He was part of Emma\'s project about animals. Ben set Clank on his table. Clank\'s eyes were still blinking oddly. "Please be good," Ben whispered. The judges walked over with their clipboards. Ben\'s heart thumped. "Show us what your robot can do," said a judge.',
     q:'Who was Peanut?', o:['The class pet hamster','One of the judges','Zoe\'s little brother'], e:'The class pet, a hamster named Peanut, was there too.', k:'detail'},
    {t:'Ben flipped the switch. Clank beeped. He rolled forward one inch. Then he wobbled. Then he tipped over with a loud CRASH. His pot head rolled across the floor. Some kids giggled. Ben\'s cheeks turned red. He wanted to crawl under the table. Zoe picked up the pot and put her hand on Ben\'s shoulder. "It is okay," she said. "We can fix him. You heard Mr. Jake. A good builder never gives up."',
     q:'How did Zoe help Ben when Clank fell over?', o:['She cheered him up and reminded him not to give up','She laughed at him with the other kids','She told the judges to go away'], e:'Zoe picked up the pot and put her hand on Ben\'s shoulder.', k:'character'},
    {t:'Ben nodded. He put the pot head back on. He was just about to try again when there was a loud snap. Then every light in the gym went out. A big storm had knocked out the power. It was so dark that Ben could not see his own hand. Kids screamed. Then Emma yelled, "Peanut\'s cage is open! He got out!" Somewhere in the darkness, a tiny hamster was running loose.',
     q:'Why did the lights in the gym go out?', o:['A big storm knocked out the power','Clank pulled the plug','Mr. Owen turned them off for a game'], e:'A big storm had knocked out the power.', k:'detail'}
   ],
   seq:['The judges come to Ben\'s table','Clank tips over and his head rolls away','Zoe tells Ben not to give up','The lights go out and Peanut escapes'],
   sum:['At the science fair Clank falls over, and then the lights go out and Peanut the hamster gets loose in the dark gym.','There was a volcano that fizzed.','Ben wins first prize as soon as the fair begins.']},

  {title:'Clank Saves the Day',
   tricky:[['flashlight','flash-light','a small lamp you can carry'],['bleachers','bleach-ers','rows of seats in a gym'],['wonderful','won-der-ful','very, very good'],['ribbon','rib-bon','a strip of cloth given as a prize']],
   recall:{q:'In Chapter 4, what happened right after Clank tipped over?', o:['The lights went out and Peanut got loose','Clank won first prize','Rosa brought cookies to the gym']},
   pages:[
    {t:'Ben had an idea. Clank\'s eyes were flashlights! He felt for the switch on Clank\'s back and flipped it. Beep, beep, BOOP. Clank\'s eyes blinked, and then they shined bright and steady. Two beams of light cut through the dark gym. "Wow!" said the kids. "Clank, find Peanut," Ben said. He did not know if Clank could understand. But Clank\'s wheel began to roll, slowly and carefully, across the floor.',
     q:'Why did Ben turn Clank on in the dark?', o:['Clank\'s flashlight eyes could light up the gym','He wanted Clank to fix the power','He wanted to scare the hamster'], e:'Clank\'s eyes were flashlights!', k:'inference'},
    {t:'Clank rolled past the volcano. He rolled past the bean plant. He stopped by the bleachers and shined his eyes underneath. There, in the bright light, sat Peanut! He was nibbling a cracker. Emma ran over and scooped him up. "Peanut! You are safe!" she cried. Everyone clapped and cheered. Just then, the power came back on. The gym was bright again. Clank beeped three times, like he was very proud.',
     q:'Where did Clank find Peanut?', o:['Under the bleachers','Inside the volcano','In Ben\'s backpack'], e:'He stopped by the bleachers and shined his eyes underneath.', k:'detail'},
    {t:'The judges walked over to Ben and Zoe. "Your robot is a little clumsy," one judge said. "But he is also very helpful." She pinned a blue ribbon on Clank. It said MOST HELPFUL PROJECT. Ben could not stop smiling. That weekend, Clank rolled through town again, but this time Ben and Zoe walked with him. Rosa waved from the bakery. Mr. Jake waved from his shop. "What a wonderful robot," everyone said. Clank just beeped happily.',
     q:'What is the main idea of this ending?', o:['Clank\'s good deed made him a hero in town','Clank broke apart and was thrown away','The judges did not like Clank at all'], e:'"What a wonderful robot," everyone said.', k:'main idea'}
   ],
   seq:['Ben turns on Clank\'s flashlight eyes','Clank finds Peanut under the bleachers','The power comes back on','The judges give Clank a blue ribbon'],
   sum:['Clank lights up the dark gym and finds Peanut, so he wins a ribbon for Most Helpful Project and becomes a town hero.','Peanut was nibbling a cracker.','Clank runs away from town for good.']}
 ]},

{id:'s5-soccer', title:'Nora and the Comets: The Underdog Season', icon:'⚽', lvl:5,
 blurb:'The Lakeside Comets have not won a game in a year. With a new coach, a new rival, and a big setback, Nora must learn what being a teammate really means.',
 chapters:[
  {title:'The Worst Team in the League',
   tricky:[['introduced','in-tro-duced','brought someone in to meet others'],['announced','an-nounced','told everyone something important'],['confident','con-fi-dent','sure of yourself'],['frustrated','frus-trat-ed','upset because something is not working']],
   pages:[
    {t:'Everyone in town knew the Lakeside Comets were the worst team in the middle-school soccer league. Last season they had lost every single game. Nora had played forward for the Comets since fourth grade, and she was tired of losing. She was fast and confident, and she usually tried to score every goal by herself. On the first day of practice, the old coach was gone. A tall woman with a whistle stood on the field instead. "I\'m Coach Rosa," she announced. "I don\'t care what happened last year. This year, we start over." Nora crossed her arms. She had heard speeches like that before, and they never changed anything. Still, something about Coach Rosa\'s steady voice made her listen.',
     q:'What can you tell about Nora from the way she plays?', o:['She is confident but tries to do everything herself','She is shy and never wants the ball','She does not care about soccer at all'], e:'she usually tried to score every goal by herself', k:'character'},
    {t:'Coach Rosa did not start with shooting drills. Instead, she made the team pass the ball in a big circle, over and over, until their legs ached. "A team that passes is harder to beat than one fast player," she said. Nora rolled her eyes. Passing was boring. Then Coach Rosa introduced someone new. "This is Ava. She just moved here from the city, and she played forward on her old team." Ava was small, with a tight braid and a serious face. She did not smile at anyone. During the scrimmage, Ava stole the ball from Nora twice and scored both times. Nora felt her cheeks burn. Who did this new girl think she was?',
     q:'Why did Coach Rosa have the team practice passing?', o:['She believed a passing team is harder to beat','She wanted the players to get tired and quit','She thought shooting was too dangerous'], e:'"A team that passes is harder to beat than one fast player,"', k:'detail'},
    {t:'At the end of practice, Coach Rosa called everyone together. "Our first game is on Saturday against the Hillcrest Hawks," she said. A groan went through the team. The Hawks were the best team in the league, and they had beaten the Comets ten to zero last year. "I\'m going to pair you up," Coach Rosa continued. "Partners will practice together all week. You will learn each other\'s moves and help each other improve." She looked down at her clipboard. "Nora, your partner is Ava." Nora turned to look at Ava. Ava was already looking at her, and she did not look happy about it either. Nora felt frustrated. This was going to be the longest week of her life.',
     q:'How did Nora and Ava feel about being partners?', o:['Neither of them was happy about it','They were both excited','Only Ava was upset'], e:'she did not look happy about it either', k:'inference'}
   ],
   seq:['Coach Rosa introduces herself to the team','The team practices passing in a circle','Ava steals the ball from Nora and scores','Coach Rosa makes Nora and Ava partners'],
   sum:['The losing Lakeside Comets get a new coach who stresses teamwork, and proud Nora is paired with Ava, a new rival.','Ava wore her hair in a tight braid.','Nora becomes the team captain and scores ten goals.']},

  {title:'Partners Who Will Not Pass',
   tricky:[['scoreboard','score-board','a big sign that shows the score'],['defenders','de-fend-ers','players who try to stop the other team'],['stubborn','stub-born','not willing to change your mind'],['disappointed','dis-ap-point-ed','sad because something did not go as hoped']],
   recall:{q:'In Chapter 1, which team did Coach Rosa say the Comets would play first?', o:['The Hillcrest Hawks','The Lakeside Lions','The City Stars']},
   pages:[
    {t:'All week, Nora and Ava practiced together, but they did not really practice as partners. When Coach Rosa told them to pass back and forth, Nora kicked the ball as hard as she could, and Ava kicked it back even harder. When they ran drills, each one tried to finish first. "You two are working against each other," Coach Rosa warned on Thursday. "That won\'t work on Saturday." Nora pretended not to hear. She had a plan. In the game, she would get the ball and dribble past every defender on the field. She would score a goal all by herself, and then everyone, especially Ava, would see who the real star of the Comets was.',
     q:'What was Nora\'s plan for the game?', o:['To score a goal by herself to prove she was the star','To pass to Ava as often as she could','To stay on the bench and watch'], e:'She would score a goal all by herself', k:'detail'},
    {t:'On Saturday, the Hawks arrived in shiny red jerseys. They warmed up like a machine, passing quickly and neatly. When the game started, Nora got the ball near midfield. She saw Ava wide open on the left side, waving her arms. Nora ignored her. She charged straight ahead, but three Hawks defenders closed in around her and took the ball away. A minute later, the Hawks scored. It happened again and again. Each time Nora got the ball, she tried to go alone, and each time she lost it. Ava stopped calling for passes. By halftime, the scoreboard read Hawks 4, Comets 0, and Nora was out of breath and furious.',
     q:'Why do you think Ava stopped calling for passes?', o:['She realized Nora was never going to pass to her','She was hurt and had to leave the game','Coach Rosa told her to be quiet'], e:'Ava stopped calling for passes.', k:'inference'},
    {t:'At halftime, Coach Rosa knelt down beside Nora. "You are one of the fastest players I have ever coached," she said quietly. "But you have to trust your teammates. I\'m going to start the second half with you on the bench." Nora could not believe it. She sat on the cold metal bench, stubborn and silent, as the Comets lost six to zero. After the game, the team packed up without speaking. Nora walked to the parking lot, still disappointed and angry. Then she stopped. Behind a car, Ava was sitting on the curb with her face in her hands. Her shoulders were shaking. Nora realized, with surprise, that Ava was crying.',
     q:'Why did Coach Rosa put Nora on the bench?', o:['Nora would not trust or pass to her teammates','Nora had hurt her ankle','Nora was late to the game'], e:'"But you have to trust your teammates.', k:'character'}
   ],
   seq:['Nora and Ava compete instead of practicing together','Nora ignores Ava, who is wide open','The Hawks lead 4 to 0 at halftime','Nora finds Ava crying in the parking lot'],
   sum:['Nora refuses to pass to Ava, the Comets lose badly, Nora is benched, and afterward she finds Ava crying.','The Hawks wore shiny red jerseys.','Nora scores a goal and the Comets beat the Hawks.']},

  {title:'The Real Ava',
   tricky:[['apartment','a-part-ment','a home inside a bigger building'],['practiced','prac-ticed','did something again and again to improve'],['together','to-geth-er','with each other'],['semifinal','sem-i-fi-nal','the game just before the championship']],
   recall:{q:'In Chapter 2, what was the final score of the game against the Hawks?', o:['Hawks 6, Comets 0','Hawks 4, Comets 0','Comets 1, Hawks 0']},
   pages:[
    {t:'Nora almost turned around and walked away. It would be easy to pretend she had not seen anything. Instead, she took a deep breath and sat down on the curb a few feet from Ava. For a while, neither of them said anything. Finally, Ava wiped her eyes. "On my old team, I had friends," she said. "We passed to each other without even looking. Here, nobody even wants me." Nora felt a hot wave of guilt. She had been so busy trying to beat Ava that she had never once wondered how Ava felt. Ava had left her whole life behind, and Nora had treated her like an enemy. "I\'m sorry," Nora said slowly. "I wasn\'t fair to you."',
     q:'What choice did Nora make when she saw Ava crying?', o:['She sat down and talked with Ava','She walked away and pretended not to see','She told the team that Ava was crying'], e:'Instead, she took a deep breath and sat down on the curb a few feet from Ava.', k:'character'},
    {t:'Ava looked surprised. Then she gave a tiny smile, the first one Nora had ever seen on her. "You really are fast, you know," Ava said. "If you passed to me, I could set you up for a shot." Nora thought about it. "Want to practice tomorrow? Just us?" she asked. The next day, they met at the park by the lake. They practiced passes until the sun went down. Ava showed Nora a trick her old coach had taught her: look up before you get the ball, so you already know where your teammates are. Nora taught Ava a quick turn she had invented. By the end of the week, they were laughing together, and Ava was coming over to Nora\'s apartment for dinner.',
     q:'What does the word trick mean in this passage?', o:['A clever skill or way of doing something','A mean joke played on someone','A magic show'], e:'Ava showed Nora a trick her old coach had taught her', k:'vocabulary'},
    {t:'The Comets started to change. Nora and Ava passed the ball back and forth like they could read each other\'s minds, and the rest of the team began to copy them. They lost their next game by only one goal. Then, to everyone\'s amazement, they won. Then they won again. By the end of the season, the worst team in the league had earned a spot in the semifinal. Two days before the big game, Nora was racing down the field in practice. Ava sent her a perfect pass. Nora planted her foot to shoot, and her ankle twisted under her. She heard a small pop, and pain shot up her leg as she fell to the grass.',
     q:'What is the main idea of this page?', o:['Teamwork helps the Comets improve, until Nora gets hurt','The Comets keep losing every game','Ava decides to quit the team'], e:'The Comets started to change.', k:'main idea'}
   ],
   seq:['Nora sits down to talk with Ava','Nora says she is sorry','Nora and Ava practice together at the park','Nora hurts her ankle at practice'],
   sum:['Nora apologizes, she and Ava become friends and teach the team to pass, and the Comets reach the semifinal before Nora gets hurt.','Ava came over to Nora\'s apartment for dinner.','Ava moves back to the city and leaves the team.']},

  {title:'From the Sidelines',
   tricky:[['sprained','sprained','hurt by twisting too far'],['crutches','crutch-es','sticks that help you walk when hurt'],['goalkeeper','goal-keep-er','the player who guards the net'],['notebook','note-book','a book of blank pages for writing']],
   recall:{q:'In Chapter 3, how did Nora hurt her ankle?', o:['It twisted when she planted her foot to shoot','She tripped over a ball in the parking lot','A Hawks player kicked her in a game']},
   pages:[
    {t:'The doctor said Nora\'s ankle was badly sprained. She would need crutches for a week, and she could not play in the semifinal. Nora lay on her bed and stared at the ceiling. After everything, after all the practice, she would have to sit and watch. Her older brother, Owen, knocked on her door and brought her a bowl of popcorn. "You know you can still help the team," he said. Nora frowned. "How? I can\'t even walk." Owen shrugged. "You know every player in this league. You watch everything. Maybe you can see things the others can\'t." Nora did not answer, but after he left, she kept thinking about what he had said.',
     q:'What did Owen suggest Nora could still do?', o:['Help the team by watching and noticing things','Play in the game anyway','Quit the team and rest'], e:'Maybe you can see things the others can\'t.', k:'detail'},
    {t:'At the semifinal, Nora sat on the bench with her crutches and a notebook. At first, it was hard to watch. Every time the Comets got the ball, her legs twitched, wanting to run. But she made herself pay attention. She noticed that the other team\'s goalkeeper always leaned to her right before a shot. She noticed that their tallest defender was slow to turn. Nora wrote everything down. At halftime, the score was tied one to one. Nora limped over to Coach Rosa and held out the notebook. "Their goalkeeper leans right," she said. "Tell everyone to shoot left." Coach Rosa looked at the notes and raised her eyebrows. "Tell them yourself," she said.',
     q:'What does Nora\'s behavior at the semifinal show about how she has changed?', o:['She now cares more about helping the team than being the star','She only cares about getting back on the field','She thinks the Comets cannot win without her'], e:'"Tell everyone to shoot left."', k:'character'},
    {t:'So Nora stood in front of the whole team and explained what she had seen. Nobody rolled their eyes. They listened. In the second half, Ava got the ball near the goal. She glanced at Nora on the bench, then aimed her shot to the left. The goalkeeper leaned right, just as Nora had predicted, and the ball sailed into the corner of the net. The Comets won two to one. The team piled onto the bench and hugged Nora, crutches and all. They were going to the championship. Their opponent would be the Hillcrest Hawks. That night, the doctor checked Nora\'s ankle again. "You might be able to play," he said, "but only for a little while."',
     q:'How did Nora\'s notes help the Comets win?', o:['Ava shot left because the goalkeeper leaned right','Nora scored the winning goal herself','The other team read the notes and gave up'], e:'aimed her shot to the left', k:'inference'}
   ],
   seq:['The doctor says Nora cannot play in the semifinal','Owen tells Nora she can still help','Nora takes notes about the other team','Ava scores using Nora\'s idea and the Comets win'],
   sum:['Though Nora is hurt, she helps from the bench by studying the other team, and her idea helps the Comets reach the championship.','Owen brought Nora a bowl of popcorn.','Nora is angry and stays home during the semifinal.']},

  {title:'The Championship',
   tricky:[['championship','cham-pi-on-ship','the final game that decides the winner'],['bleachers','bleach-ers','rows of seats for people watching'],['teammate','team-mate','a person on the same team'],['trophy','tro-phy','a prize, often a shiny cup']],
   recall:{q:'In Chapter 4, what did Nora notice about the other team\'s goalkeeper?', o:['She always leaned to her right before a shot','She was the tallest player on the field','She could not catch high balls']},
   pages:[
    {t:'On the day of the championship, the bleachers were packed. It seemed like the whole town had come to watch the Comets, the team that used to lose every game, play the mighty Hillcrest Hawks. Nora sat on the bench with her ankle wrapped tightly. Coach Rosa had promised to put her in for the last ten minutes if the team needed her. The Hawks scored first, but this time the Comets did not fall apart. They kept passing, kept talking, and kept believing. Late in the first half, Ava scored on a beautiful pass from their goalkeeper. The score was tied. Nora cheered so loudly that her throat hurt. Win or lose, she thought, this team was different now.',
     q:'How was this game different from the first game against the Hawks?', o:['The Comets kept passing and did not fall apart','The Comets did not have a coach','Nora played the whole game'], e:'but this time the Comets did not fall apart', k:'inference'},
    {t:'The second half was a battle. Neither team could score. With ten minutes left, Coach Rosa turned to Nora. "Ready?" she asked. Nora nodded and jogged onto the field, her ankle stiff but strong. With two minutes left, Nora got the ball near midfield. She looked up, just as Ava had taught her. Two Hawks defenders were rushing toward her, and the goal was far away. The old Nora would have tried to dribble past them alone. Instead, she spotted Ava sprinting down the left side, wide open. Nora sent a long, perfect pass across the field. Ava trapped it, turned, and shot to the left. The ball flew past the goalkeeper and into the net.',
     q:'What does Nora\'s pass to Ava show about her?', o:['She has learned to trust her teammates','She was too tired to keep running','She did not see the goal'], e:'Instead, she spotted Ava sprinting down the left side, wide open.', k:'character'},
    {t:'The whistle blew. The Comets had won the championship, two to one. The crowd roared, and the team rushed onto the field in one big, happy pile. When Coach Rosa handed them the shiny trophy, the team lifted it high above their heads. Afterward, Ava found Nora by the bench. "You could have taken that shot yourself," Ava said. Nora grinned. "Maybe. But you were open. That\'s what teammates do." Ava laughed and threw an arm around her shoulders. Back in the fall, Nora had wanted everyone to see that she was the star. Now she understood something better. The Comets had not won because of one fast player. They had won because they finally played as a team, and because two rivals had become best friends.',

{id:'s5-museum', title:'Emma and Nate: The Map That Disappeared', icon:'🗺️', lvl:5,
 blurb:'On a class trip, a famous old map vanishes from a small town museum, and a talkative girl and her quiet classmate must work together to find it.',

   pages:[
    {t:'It had rained all night in the little town by the river, and the sidewalks still shone like glass. Emma hopped off the school bus first, as usual. She loved field trips, and today the fifth grade was visiting the Town Museum. Then Mr. Fox, her teacher, read the list of partners. "Emma, you will be with Nate." Emma tried not to look disappointed. Nate was the quietest kid in class. He hardly ever raised his hand, and at lunch he usually read a book about rocks or birds. Emma had wanted to be partners with Ava, who talked as fast as she did. When they were partnered up, Nate said "Hi" softly, pushing up his glasses. "Hi," said Emma, and she marched toward the door.',
     q:'How did Emma feel when she was partnered with Nate?', o:['Disappointed, because she wanted to work with Ava','Excited, because Nate was her best friend','Angry, because she wanted to stay on the bus'], e:'Emma tried not to look disappointed.', k:'character'},
    {t:'Inside, the museum smelled like old wood and lemon polish. A tall woman with silver hair greeted them. "Welcome! I am Mrs. Price, and I take care of this museum." She led the class past a row of old farm tools and a canoe hanging from the ceiling. "Our greatest treasure is in the next room," she said proudly. "It is the first map of our town, drawn by hand more than one hundred fifty years ago. It shows every street, every barn, and even the old mill by the river." Emma bounced on her toes. Beside her, Nate was not looking at Mrs. Price at all. He was staring up at the ceiling with a small frown.',
     q:'What was Nate doing while Mrs. Price talked about the map?', o:['Staring up at the ceiling with a frown','Reading a book about birds','Talking to Ava'], e:'He was staring up at the ceiling with a small frown.', k:'detail'},
    {t:'Mrs. Price stopped in front of a long glass case in the middle of the room. A guard in a blue uniform stood nearby, holding a ring of keys. "Mr. Bell has guarded this map for thirty years," Mrs. Price said with a smile. Mr. Bell gave a little wave, but he looked tired, and Emma noticed his sleeves were dark and damp. "And here," Mrs. Price said, sweeping her hand toward the case, "is our famous map." The whole class leaned forward, and some kids stood on tiptoe to see. Then Mrs. Price\'s smile froze. Inside the glass case, there was nothing but a faded square of green cloth. The map was gone.',
     q:'What did Emma notice about Mr. Bell?', o:['His sleeves were dark and damp','He was wearing a red hat','He was laughing loudly'], e:'Emma noticed his sleeves were dark and damp', k:'detail'}

  {title:'Clues Under Glass',

    {t:'Emma studied the case. The glass was not cracked, and the lock had no scratches. "So nobody broke in," she said. "They opened it with a key." Nate pointed to the top of the case. A small puddle of water sat on the glass, right in the middle. Then he pointed up. On the white ceiling, directly above the case, was a brown stain shaped like a cloud. Its edge was still dark and wet. "The roof leaks," Nate said quietly. "It rained all night." Emma looked from the stain to the puddle. She had walked right past those clues. Nate had discovered them in less than a minute, without saying a word until now.',
     q:'What can the reader infer from the stain and the puddle?', o:['Rain leaked through the roof and dripped onto the case','Someone spilled a drink on the case','Mrs. Price washed the glass that morning'], e:'"The roof leaks," Nate said quietly.', k:'inference'},
    {t:'Before Emma could ask what the leak had to do with a missing map, something caught her eye. Across the room, a man in a long gray coat stood near the gift shop. Over his shoulder hung a long black tube, the kind people use to carry big posters. He kept checking his watch and glancing nervously toward the exit, as if he had somewhere important to be. "Nate," Emma whispered, "that tube is exactly the right size for a rolled-up map." Her heart thumped. The man looked suspicious, and he looked like he was in a hurry. As they watched, he zipped his coat, gripped the tube, and started walking quickly toward the front doors.',

   pages:[
    {t:'Emma wanted to run after the man and shout, "Stop, thief!" She could already picture it: the man would drop the tube, the map would roll out, and everyone would cheer. She took one step forward, but Nate touched her arm. "Wait," he said. "What if he didn\'t do it?" Emma frowned. "But the tube, and the hurrying, and the coat!" Nate thought for a second. "Those are reasons to ask him," he said. "Not reasons to yell at him." Emma opened her mouth to argue, then closed it again. Accusing someone in front of a whole class would be awful if she were wrong. "Okay," she said. "We\'ll ask him politely."',
     q:'What does Nate\'s advice show about him?', o:['He is careful and fair, and does not want to blame someone without proof','He is scared of the man and wants to hide','He does not care about the missing map'], e:'"Those are reasons to ask him," he said. "Not reasons to yell at him."', k:'character'},
    {t:'They caught up with the man just inside the front doors. "Excuse me, sir," Emma said, as politely as she could. "The old map is missing, and we\'re trying to help find it. Could we ask what\'s in your tube?" The man looked surprised, then he laughed kindly. "Of course," he said. He popped off the cap and slid out a roll of thick paper. They were pencil sketches of birds: a heron, a kingfisher, a row of ducks on the river. "I\'m Mr. Ross," he said. "I teach art at the high school. I come here early to draw the stuffed birds upstairs, and now I\'m late for class."',

     q:'What new clue does Mr. Ross give the kids?', o:['He saw the guard carry something flat and wrapped through the Staff Only door','He saw a woman run out with the map','He heard glass breaking'], e:'I saw the guard carrying something big and flat, wrapped in white paper.', k:'detail'}

  {title:'Mr. Bell\'s Secret',
