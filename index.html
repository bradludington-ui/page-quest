{id:'parks',title:'Rosa Parks: The Seat That Changed a Nation',icon:'🚌',cat:'people',lvl:5,
 tricky:[['segregation','seg-re-ga-tion','keeping people apart because of their race'],['arrested','ar-rest-ed','taken away by police for breaking a rule'],['boycott','boy-cott','refusing to use something to protest'],['courageous','cou-ra-geous','brave even when something is scary']],
 pages:[
 {t:'Rosa Parks was born in 1913 in a small town in Alabama. She grew up on her grandparents\' farm, where she learned to work hard and stand up for herself. Back then, Alabama had cruel laws called segregation. Black people and white people were kept apart in schools, restaurants, and even on buses. Black children often walked to school while white children rode. Rosa saw that these laws were unfair. As a grown woman, she worked as a seamstress, sewing clothes in a department store. She also joined a group that fought for the rights of Black Americans. She worked as its secretary, writing down stories of people who had been treated unfairly. Rosa was quiet and polite, but she was never willing to accept unfairness.',
  q:'What were segregation laws?',o:['Laws that kept Black and white people apart','Laws about sewing clothes','Laws that let everyone ride the bus free'],e:'Black people and white people were kept apart in schools, restaurants, and even on buses.',k:'vocabulary'},
 {t:'On December 1, 1955, Rosa finished a long day of work in Montgomery, Alabama. She paid her fare and sat down on a city bus. The rules said Black riders had to give up their seats if white riders needed them. When the bus filled up, the driver told Rosa to stand. She said no. The driver called the police, and Rosa was arrested. Many people later said she stayed seated because her feet hurt. Rosa explained that was not true. In her own book, she wrote, "The only tired I was, was tired of giving in." She knew she might be hurt or lose her job. She chose to be brave anyway.',
  q:'Why did Rosa refuse to give up her seat?',o:['She was tired of giving in to unfair rules','Her feet hurt too much to stand','She did not hear the driver'],e:'"The only tired I was, was tired of giving in."',k:'character'},
 {t:'News of Rosa\'s arrest spread fast. Black leaders in Montgomery decided to boycott the city buses. That meant no Black riders would use them until the rules changed. A young minister named Martin Luther King Jr. helped lead the protest. For more than a year, people walked miles to work in rain and cold. Neighbors shared rides in their cars. The bus company lost lots of money, because most of its riders had been Black. The boycott lasted 381 days, but the people refused to quit. In 1956, the United States Supreme Court ruled that segregation on buses was against the law. At last, Black riders in Montgomery could sit in any open seat.',
  q:'What can you tell about the people who walked for more than a year?',o:['They were determined to change the unfair rules','They liked walking better than riding','They did not have jobs to go to'],e:'For more than a year, people walked miles to work in rain and cold.',k:'inference'},
 {t:'Standing up for fairness was not easy for Rosa. After the boycott, she and her husband had trouble finding work, and some people sent them threats. In 1957, they moved to Detroit, Michigan. Rosa kept working for equal rights for the rest of her life. She helped young people learn about history and believe in themselves. Over the years, she received some of the highest honors in the country, including a special gold medal from Congress. When Rosa died in 2005, at age 92, thousands of people came to pay their respects. Today she is often called the mother of the civil rights movement. Her quiet, courageous choice helped change a nation.',
  q:'What is the main idea of this page?',o:['Rosa kept working for fairness and is honored for changing the nation','Rosa moved to Detroit, Michigan','Rosa got a gold medal from Congress'],e:'Her quiet, courageous choice helped change a nation.',k:'main idea'}],
 seq:['Rosa grew up on her grandparents\' farm.','Rosa was arrested for keeping her bus seat.','People in Montgomery boycotted the buses.','Rosa moved to Detroit and kept working for equal rights.'],
 sum:['Rosa Parks bravely refused to give up her bus seat, which sparked a boycott that helped end unfair segregation laws.','Rosa Parks worked as a seamstress in a department store.','Rosa Parks was arrested because she did not pay her bus fare.']},

{id:'tut',title:'King Tut: The Boy Pharaoh\'s Hidden Treasure',icon:'👑',cat:'people',lvl:5,
 tricky:[['pharaoh','phar-aoh','a king of ancient Egypt'],['archaeologist','ar-chae-ol-o-gist','a scientist who digs up clues from the past'],['treasures','trea-sures','valuable things like gold and jewels'],['mysteries','mys-ter-ies','things nobody can fully explain']],
 pages:[
 {t:'More than 3,000 years ago, a boy named Tutankhamun became the ruler of ancient Egypt. Most people call him King Tut. He was only about nine years old when he became pharaoh, which is what Egyptians called their king. Imagine being in charge of a whole country before you finish fourth grade! Because he was so young, wise grown-up advisers helped him make decisions. King Tut married a young woman from the royal family. Before Tut\'s rule, his father had made big changes to Egypt\'s religion. People were told to worship only one god. During Tut\'s rule, Egypt went back to honoring its many old gods, and Tut helped repair temples that had been closed.',
  q:'Why did King Tut need advisers?',o:['He was very young when he became pharaoh','He did not live in Egypt','He did not want to be king'],e:'Because he was so young, wise grown-up advisers helped him make decisions.',k:'detail'},
 {t:'King Tut did not rule for long. He died when he was only about eighteen or nineteen years old. Scientists still are not sure how he died. It is one of ancient Egypt\'s great mysteries. Some think he was sick, and some think he hurt his leg badly. Ancient Egyptians believed a person needed their body and belongings in the next life. So they carefully preserved Tut\'s body as a mummy. They wrapped it in linen and placed it inside coffins, one inside another. They buried him in a tomb in a rocky place called the Valley of the Kings. They filled the tomb with everything a king might need, from chariots and beds to games and food. Then they sealed the doors.',
  q:'Why did Egyptians fill the tomb with chariots, beds, and food?',o:['They believed Tut would need them in the next life','They wanted to hide them from robbers','They had no other place to store them'],e:'Ancient Egyptians believed a person needed their body and belongings in the next life.',k:'inference'},
 {t:'Over thousands of years, robbers broke into almost every royal tomb and stole the treasures. Sand and rock covered King Tut\'s tomb, and people forgot it was there. An English archaeologist named Howard Carter believed it was still hidden. He searched the Valley of the Kings for years and found nothing. His supporters wanted to quit. Howard asked for one more season of digging. In November 1922, his workers found a stone step buried in the sand. The step led to a sealed doorway. Howard made a small hole and held up a candle to peek inside. Gold glittered everywhere in the flickering light. He had found King Tut\'s tomb, still mostly untouched.',
  q:'What does Howard asking for one more season show about him?',o:['He was patient and did not give up','He was bored with digging','He wanted to go home'],e:'Howard asked for one more season of digging.',k:'character'},
 {t:'Inside the tomb were more than 5,000 objects. It took Howard Carter and his team about ten years to record and remove them all. The most famous treasure is King Tut\'s burial mask. It is made of solid gold and weighs about 22 pounds. It has stripes of blue glass and stone and shows the young king\'s calm face. Tut\'s innermost coffin was solid gold, too. King Tut was not one of Egypt\'s most powerful pharaohs. He is famous today because his tomb survived when so many others were robbed. His treasures have traveled the world, drawing huge crowds of visitors, and they still teach people how ancient Egyptians lived, worked, and believed.',
  q:'What is the main idea of this page?',o:['King Tut is famous because his treasure-filled tomb survived','The mask weighs about 22 pounds','It took ten years to remove the objects'],e:'He is famous today because his tomb survived when so many others were robbed.',k:'main idea'}],
 seq:['Tutankhamun became pharaoh at about age nine.','King Tut died and was buried in the Valley of the Kings.','Howard Carter\'s workers found a buried stone step.','The team spent about ten years removing the treasures.'],
 sum:['King Tut was a young pharaoh whose hidden tomb, found in 1922, was full of treasures that teach us about ancient Egypt.','King Tut\'s burial mask weighs about 22 pounds.','King Tut was the most powerful pharaoh who ever ruled Egypt.'],
 say:[['Tutankhamun','toot-ahnk-AH-mun']]},

{id:'williams',title:'Venus and Serena Williams: Sisters of the Court',icon:'🎾',cat:'people',lvl:5,
 tricky:[['professional','pro-fes-sion-al','paid to do something as a job'],['tournament','tour-na-ment','a contest with many games to find a winner'],['championship','cham-pi-on-ship','a contest to decide who is best'],['opponent','op-po-nent','the person you play against']],
 pages:[
 {t:'Venus Williams was born in 1980, and her little sister Serena was born in 1981. They grew up in Compton, California, with their parents and three older sisters. Their father decided his two youngest girls could become tennis stars, even though he had never played tennis himself. He taught himself by reading books and watching videos. He wrote out a plan for their future. Then he coached Venus and Serena on public courts that were cracked and covered with broken glass. The girls practiced for hours, hitting ball after ball. Some people laughed at the family\'s big dreams. Venus and Serena kept practicing anyway. When they were young, the family moved to Florida so the sisters could train even more.',
  q:'How did the sisters\' father learn about tennis?',o:['He read books and watched videos','He was a famous tennis player','He went to a tennis college'],e:'He taught himself by reading books and watching videos.',k:'detail'},
 {t:'Venus and Serena both became professional tennis players as teenagers. Back then, few Black players were at the top of the sport, and the sisters stood out. They hit the ball harder and faster than almost anyone. In 1999, Serena won the U.S. Open, one of tennis\'s four biggest tournaments, called the Grand Slams. She was only seventeen. The next year, Venus won Wimbledon, the oldest tennis tournament in the world. Soon the sisters were often meeting each other in the final match. Playing against your own sister for a championship is hard! On the court they were fierce opponents. Off the court, they were best friends who cheered each other on.',
  q:'What does the word "opponents" mean on this page?',o:['People playing against each other','People on the same team','People who watch the game'],e:'On the court they were fierce opponents.',k:'vocabulary'},
 {t:'Serena went on to win 23 Grand Slam singles titles, more than any other player in modern times. Venus won seven, including five at Wimbledon. The sisters were also amazing as a doubles team, playing side by side. Together they won 14 Grand Slam doubles titles and never lost a Grand Slam doubles final. They also won three Olympic gold medals in doubles. One of Serena\'s most famous wins came in 2017, at the Australian Open. She won the whole tournament without losing a set. Later, fans and reporters learned she had been about two months pregnant with her daughter the entire time! Serena\'s strength and determination amazed fans around the world.',
  q:'What does winning while pregnant tell you about Serena?',o:['She was strong and determined','She did not care about tennis','She played only easy matches'],e:'She won the whole tournament without losing a set.',k:'character'},
 {t:'The sisters fought for fairness off the court, too. For many years, the biggest tournaments paid women less prize money than men, even for winning the same title. Venus spoke out and wrote about why that was wrong. In 2007, Wimbledon finally agreed to pay women and men equally. That same year, Venus won Wimbledon again. Both sisters have also worked to help children, especially kids growing up in neighborhoods like Compton. Serena played her final professional match in 2022. The sisters showed that two girls practicing on cracked public courts could become champions. They changed what a tennis champion looks like and inspired kids everywhere to chase big dreams.',
  q:'Why did Venus speak out about prize money?',o:['Women were paid less than men for winning the same title','She wanted to stop playing tennis','Men were paid less than women'],e:'the biggest tournaments paid women less prize money than men, even for winning the same title',k:'inference'}],
 seq:['Their father coached them on cracked public courts.','Serena won the U.S. Open at age seventeen.','Serena won the Australian Open while pregnant.','Serena played her final professional match.'],
 sum:['Venus and Serena Williams practiced on cracked public courts and became tennis champions who also fought for fairness.','Venus Williams won Wimbledon five times.','Venus and Serena Williams always refused to play against each other.']},

{id:'rapinoe',title:'Megan Rapinoe: Captain of Courage',icon:'⚽',cat:'people',lvl:5,
 tricky:[['national','na-tion-al','having to do with a whole country'],['tournament','tour-na-ment','a contest with many games to find a winner'],['celebration','cel-e-bra-tion','a happy way to show you are proud'],['equality','e-qual-i-ty','being treated the same and fairly']],
 pages:[
 {t:'Megan Rapinoe was born in 1985 in Redding, a small city in Northern California. She grew up in a big family and had a twin sister named Rachael. The twins loved sports, especially soccer. They followed their older brother around and copied the tricks he did with the ball. Megan practiced in her backyard for hours, long after dinner and sometimes until dark. She learned to kick with both feet and to send long, curving passes to her teammates. Megan and Rachael played on the same teams growing up and later at the same college in Oregon. Megan was full of energy and was never afraid to try a bold move on the field.',
  q:'Who did Megan and Rachael copy when they were learning soccer?',o:['Their older brother','A famous coach','Their twin cousins'],e:'They followed their older brother around and copied the tricks he did with the ball.',k:'detail'},
 {t:'In 2006, Megan joined the United States women\'s national soccer team. She became famous for her creative passes. At the 2011 Women\'s World Cup, the United States was losing to Brazil in extra time. Only seconds remained. Megan kicked a long, curving pass from the left side all the way across the field. A teammate leaped up and headed it into the net! The game was tied, and the Americans went on to win. It became one of the most famous moments in women\'s soccer. The next year, Megan and her team won the gold medal at the Olympics in London. In 2015, they won the World Cup. Megan was becoming one of the biggest stars in the sport.',
  q:'What happened right after Megan\'s long pass in 2011?',o:['A teammate headed the ball into the net','Brazil scored a goal','The game was canceled'],e:'A teammate leaped up and headed it into the net!',k:'detail'},
 {t:'The 2019 Women\'s World Cup in France was Megan\'s greatest tournament. She was one of the team\'s captains and a leader in the locker room, and she scored six goals and won the award for the tournament\'s top scorer. She even scored in the final match against the Netherlands. The Americans won the World Cup again, their second title in a row! Megan was also named the best player of the whole tournament. Fans loved her bright purple hair and her famous goal celebration. After scoring, she would stand still with her arms stretched wide and her chin held high. The pose seemed to say, "Here I am!" Megan was proud of who she was, and she wanted others to feel proud of themselves, too.',
  q:'What does Megan\'s goal celebration show about her?',o:['She was confident and proud of who she was','She was shy and nervous','She was tired after scoring'],e:'Megan was proud of who she was, and she wanted others to feel proud of themselves, too.',k:'character'},
 {t:'Megan used her fame to speak up for fairness. She is gay, and she spoke out for the rights of gay people. She also knelt during the national anthem before a game to show she cared about unfair treatment of Black Americans. Some people disagreed, but Megan believed in using her voice. She and her teammates also fought for equality in pay. The women\'s team was winning more than the men\'s team, but the women were paid less. In 2022, the team won its fight for equal pay. That same year, Megan received the Presidential Medal of Freedom. She retired in 2023, remembered as a champion on and off the field.',
  q:'What is the main idea of this page?',o:['Megan used her fame to speak up for fairness','Megan retired from soccer in 2023','Megan knelt during the national anthem'],e:'Megan used her fame to speak up for fairness.',k:'main idea'}],
 seq:['Megan practiced soccer with her twin sister.','Megan made a famous pass against Brazil.','Megan scored six goals at the 2019 World Cup.','Megan\'s team won its fight for equal pay.'],
 sum:['Megan Rapinoe became a World Cup champion and used her fame to speak up for fairness and equal pay.','Megan Rapinoe dyed her hair bright purple.','Megan Rapinoe stopped playing soccer after college to become a coach.'],
 say:[['Rapinoe','ruh-PEE-no']]},

{id:'biles',title:'Simone Biles: Flying Higher Than Ever',icon:'🤸',cat:'people',lvl:5,
 tricky:[['gymnastics','gym-nas-tics','a sport of flips, jumps, and balance'],['adopted','a-dopt-ed','made part of a new family forever'],['incredible','in-cred-i-ble','so amazing it is hard to believe'],['decorated','dec-o-rat-ed','given many medals or honors']],
 pages:[
 {t:'Simone Biles was born in 1997 in Columbus, Ohio. Her early childhood was hard. Her mother was struggling and could not take care of her children, so Simone and her little sister spent time in foster care. Then their grandparents stepped in. They adopted the two girls and raised them in Texas, near the city of Houston. Simone calls them Mom and Dad. When Simone was six, her daycare group took a field trip to a gymnastics gym. Simone watched the gymnasts and then began copying their flips and jumps. A coach noticed her right away. She sent a note home suggesting that Simone try gymnastics. Simone loved it from the start.',
  q:'Who raised Simone and her little sister?',o:['Their grandparents','Their coach','Their older brothers'],e:'They adopted the two girls and raised them in Texas',k:'detail'},
 {t:'Simone trained for many hours every week. She was short, only about four feet eight inches tall as an adult, but she was incredible at twisting and flipping. She was powerful, too. She could soar higher than gymnasts who were much bigger. In 2013, when she was sixteen, Simone won her first world championship in the all-around. That means she was the best on all four events together: vault, uneven bars, balance beam, and floor. She kept winning, year after year. Simone also invented moves so hard that almost no one else can do them. When a gymnast is the first to do a new skill at a big contest, it is named after her. Several skills are named "the Biles."',
  q:'What does it mean to win the "all-around"?',o:['To be the best on all four events together','To win only on the balance beam','To run around the gym fastest'],e:'That means she was the best on all four events together',k:'vocabulary'},
 {t:'At the 2016 Olympics in Brazil, Simone won four gold medals and a bronze. The world was amazed. Five years later, at the Olympics in Tokyo, Japan, something scary happened. During a vault, Simone lost track of where she was in the air. Gymnasts call this the twisties. Flipping without knowing where the ground is can lead to terrible injuries. Simone made a tough and brave choice. She pulled out of several events to protect her body and her mind. Some people criticized her, but many other athletes and fans praised her for putting her health first. Later in those Games, she came back to win a bronze medal on the balance beam.',
  q:'Why did Simone pull out of several events in Tokyo?',o:['To protect her body and her mind','Because she wanted a vacation','Because she was not allowed to compete'],e:'She pulled out of several events to protect her body and her mind.',k:'character'},
 {t:'After Tokyo, Simone took time to rest and work on feeling better. She also got married. Then she went back to the gym. At the 2024 Olympics in Paris, France, Simone won three more gold medals and a silver. She helped her team win gold and won the Olympic all-around title again, eight years after her first one. Today Simone is called the most decorated gymnast in history, because she has won more world and Olympic medals than any other gymnast. She also speaks openly about mental health, so kids know it is okay to ask for help. Simone shows that being strong means taking care of your mind as well as your body.',
  q:'What lesson does Simone want kids to learn?',o:['Taking care of your mind is part of being strong','Never take a break from practice','Only gold medals matter'],e:'Simone shows that being strong means taking care of your mind as well as your body.',k:'main idea'}],
 seq:['Simone tried gymnastics on a daycare field trip.','Simone won her first world all-around title.','Simone pulled out of events at the Tokyo Olympics.','Simone won three gold medals in Paris.'],
 sum:['Simone Biles overcame a hard start to become the most decorated gymnast in history and a voice for mental health.','Simone Biles is about four feet eight inches tall.','Simone Biles quit gymnastics forever after the Tokyo Olympics.']},

{id:'ride',title:'Sally Ride: First American Woman in Space',icon:'🚀',cat:'people',lvl:5,
 tricky:[['astronaut','as-tro-naut','a person trained to travel into space'],['physics','phys-ics','the science of energy, motion, and matter'],['scientist','sci-en-tist','a person who studies how the world works'],['curious','cu-ri-ous','wanting to learn and know more']],
 pages:[
 {t:'Sally Ride was born in 1951 in Los Angeles, California. She was a curious girl who loved science, puzzles, and the stars. She also loved sports. She played football with neighborhood kids, and she became so good at tennis that she was one of the best young players in the country. In school, Sally had a science teacher who helped her see how exciting science could be. She went to Stanford University, where she studied both physics and English literature. She loved learning about how the universe works. She kept studying until she earned the highest degree in physics, called a doctorate. Sally was ready for a big challenge, but she did not know yet what it would be.',
  q:'What two subjects did Sally study at Stanford?',o:['Physics and English literature','Art and music','History and math'],e:'she studied both physics and English literature',k:'detail'},
 {t:'One day in 1977, Sally read an ad in her school newspaper. The space agency, NASA, was looking for new astronauts. For the first time, NASA wanted women to apply, too. Sally was excited and sent in her application right away. So did about 8,000 other people! Only 35 were chosen, and six of them were women. Sally was one of them. Astronaut training was tough. She learned to fly jets, practiced parachuting, and studied every part of the space shuttle. She also helped build and test a robot arm the shuttle would use to move things in space. Sally worked hard to learn every skill she would need to do her job safely in space.',
  q:'Why was the newspaper ad so important to Sally?',o:['For the first time, NASA wanted women to become astronauts','It offered free tennis lessons','It said she had won a prize'],e:'For the first time, NASA wanted women to apply, too.',k:'inference'},
 {t:'On June 18, 1983, Sally climbed aboard the space shuttle Challenger. The rockets roared, and the shuttle blasted into the sky. Sally became the first American woman in space. She was 32 years old. During the six-day trip, she used the robot arm to launch and catch a satellite. She also floated around the cabin and looked down at Earth, a beautiful blue ball. Back home, some reporters asked her silly questions that they never asked the men, like whether she would cry if something went wrong. Sally stayed calm and patient, and she answered with good humor. She wanted people to see her as an astronaut and a scientist, not just as a woman.',
  q:'How did Sally handle the silly questions?',o:['She stayed calm and patient','She refused to talk to anyone','She cried and went home'],e:'Sally stayed calm and patient, and she answered with good humor.',k:'character'},
 {t:'Sally flew into space again in 1984. Later, after two terrible shuttle accidents, she helped investigate what went wrong, so future astronauts would be safer. Sally also became a science professor at a university in California. But she worried that many girls stopped liking science as they grew older. In 2001, she started a company that created science books, camps, and festivals for kids, especially girls. She wanted every child to know that science could be fun and that they could become scientists, too. Sally died in 2012. Today schools, a research ship, and science awards carry her name, and many kids learn her story. Her trip into space opened the door for many more women to explore the stars.',
  q:'What is the main idea of this page?',o:['Sally kept helping others, especially girls, explore science','Sally flew into space again in 1984','Sally became a professor'],e:'She wanted every child to know that science could be fun and that they could become scientists, too.',k:'main idea'}],
 seq:['Sally became one of the best young tennis players.','Sally answered NASA\'s ad for astronauts.','Sally flew into space on the shuttle Challenger.','Sally started a company to help kids love science.'],
 sum:['Sally Ride became the first American woman in space and then helped girls and boys love science.','Sally Ride used a robot arm to catch a satellite.','Sally Ride was the first person ever to walk on the moon.']},

{id:'goodall',title:'Jane Goodall: Friend of the Chimpanzees',icon:'🐒',cat:'people',lvl:5,
 tricky:[['chimpanzee','chim-pan-zee','a smart ape that lives in African forests'],['patience','pa-tience','being able to wait calmly'],['scientists','sci-en-tists','people who study how the world works'],['discovery','dis-cov-er-y','finding something new for the first time']],
 pages:[
 {t:'Jane Goodall was born in London, England, in 1934. When she was a baby, her father gave her a toy chimpanzee named Jubilee. Some grown-ups worried the toy would give her nightmares, but Jane loved it and carried it everywhere. She loved real animals, too. Once, when she was small, she hid in a henhouse for hours just to find out how a hen lays an egg. Her family did not know where she was! When she finally came out, her mother did not scold her. Instead, she listened to Jane\'s exciting story. Jane read books about animals and about Africa. She dreamed of living with wild animals there someday and writing books about them.',
  q:'What does hiding in the henhouse show about Jane?',o:['She was curious and patient about animals','She was afraid of chickens','She liked to play tricks on her family'],e:'she hid in a henhouse for hours just to find out how a hen lays an egg',k:'character'},
 {t:'Jane\'s family did not have much money, so she worked as a secretary and a waitress to save for a trip to Africa. In 1957, she sailed to Kenya. There she met a famous scientist who studied early humans. He was impressed by how much Jane knew about animals. He asked her to study wild chimpanzees in a forest in Tanzania, even though she had not gone to college yet. In 1960, Jane arrived at the forest. Her mother came with her for the first few months. At first, the chimps ran away whenever they saw her. Jane did not give up. Every day, she sat quietly and watched with great patience.',
  q:'What does "patience" mean on this page?',o:['Being able to wait calmly','Being very loud','Being in a hurry'],e:'Every day, she sat quietly and watched with great patience.',k:'vocabulary'},
 {t:'Slowly, the chimps got used to Jane. One chimp with a gray chin let her come close first. Jane named him David Greybeard. One day she saw him poke a long grass stem into a termite mound. He pulled it out covered with termites and ate them like a snack. Then she saw chimps pull the leaves off twigs to make them work better. This was a huge discovery. Back then, most scientists believed only humans made and used tools. Jane proved that chimps did, too. She also learned that chimps hug, kiss, play, and take care of one another. Each chimp had its own personality, just like people do.',
  q:'Why was it so surprising that chimps made tools?',o:['Scientists believed only humans made and used tools','Chimps had never been seen eating termites','Tools were not invented yet'],e:'Back then, most scientists believed only humans made and used tools.',k:'inference'},
 {t:'Jane studied the chimps for many years and became one of the most famous scientists in the world. Over time, she saw that forests were being cut down and chimpanzees were in danger. So she decided to spend her life protecting them. She started a group to care for chimps and their homes. Later, she started a club for young people called Roots and Shoots. Its members work on projects to help animals, people, and the planet. Jane traveled around the world for most of each year, giving speeches telling people that every person can make a difference. She kept speaking up for animals until she died in 2025, at age 91.',
  q:'What is the main idea of this page?',o:['Jane spent her life protecting chimps and teaching others to help','Jane started a club called Roots and Shoots','Jane traveled to give speeches'],e:'So she decided to spend her life protecting them.',k:'main idea'}],
 seq:['Jane got a toy chimpanzee named Jubilee.','Jane saved money and sailed to Kenya.','Jane saw David Greybeard use a grass stem as a tool.','Jane started the Roots and Shoots club for young people.'],
 sum:['Jane Goodall made surprising discoveries about wild chimpanzees and spent her life protecting them.','Jane Goodall once hid in a henhouse to watch a hen.','Jane Goodall proved that chimpanzees cannot use tools.']},

{id:'disney',title:'Walt Disney: The Man Behind the Mouse',icon:'🐭',cat:'people',lvl:5,
 tricky:[['cartoonist','car-toon-ist','a person who draws funny pictures and comics'],['animation','an-i-ma-tion','drawings that seem to move on a screen'],['studio','stu-di-o','a place where movies or art are made'],['imagination','i-mag-i-na-tion','the ability to dream up new ideas']],
 pages:[
 {t:'Walt Disney was born in Chicago, Illinois, in 1901. When he was a young boy, his family moved to a farm in a small town in Missouri. Walt loved the farm animals, and he loved to draw them. Later the family moved to Kansas City. There, Walt and his older brother Roy delivered newspapers before school, waking up in the dark, even on snowy mornings. Walt still found time to draw. He took art classes and drew pictures for his school newspaper. At sixteen, near the end of World War I, he joined the Red Cross and went to France to drive an ambulance. He covered the ambulance with his drawings. Walt dreamed of becoming a cartoonist.',
  q:'What did Walt and his brother do before school?',o:['They delivered newspapers','They fed the farm animals','They drew pictures for money'],e:'Walt and his older brother Roy delivered newspapers before school',k:'detail'},
 {t:'After the war, Walt started a small cartoon company in Kansas City. He made short films using animation, but the company ran out of money and had to close. Walt did not give up. In 1923, he moved to Hollywood, California, with only a little money in his pocket. He and his brother Roy started a new studio. They created a popular cartoon character, a rabbit named Oswald. But the company that sold their cartoons took Oswald away from them. According to Walt, on a train ride home he thought up a brand new character: a cheerful mouse. That mouse became Mickey Mouse. Losing Oswald turned into the luckiest thing that ever happened to Walt.',
  q:'What does this page show about Walt\'s character?',o:['He kept trying after failures','He gave up easily','He did not like cartoons'],e:'Walt did not give up.',k:'character'},
 {t:'In 1928, Mickey Mouse starred in a cartoon called Steamboat Willie. It was one of the first cartoons with sound that matched the pictures. Audiences heard Mickey whistle and saw him turn the animals on the boat into musical instruments. Walt himself was the voice of Mickey. The cartoon was a huge hit! Then Walt had an even bigger idea: a full-length cartoon movie. Many people thought nobody would sit through a long cartoon, and they called the project a foolish mistake. Hundreds of artists drew for years. In 1937, Snow White and the Seven Dwarfs came out. Audiences laughed, cried, and cheered. It was the first full-length animated movie made in America.',
  q:'What does "animated" mean in this story?',o:['Made from drawings that seem to move','Filmed with real actors','Made without any sound'],e:'Then Walt had an even bigger idea: a full-length cartoon movie.',k:'vocabulary'},
 {t:'Walt wanted a place where parents and children could have fun together. He imagined a clean, magical park with rides, castles, and characters from his movies. On July 17, 1955, Disneyland opened in Anaheim, California. People lined up for hours to get in. Walt kept dreaming up new ideas with his amazing imagination until he died in 1966. He won 22 Academy Awards, more than any other person in history. After his death, his brother Roy helped finish Walt\'s next dream, a giant park in Florida called Walt Disney World. Today, millions of people visit Disney parks and watch Disney movies. It all started with a boy who loved to draw.',
  q:'What is the main idea of this page?',o:['Walt\'s big dreams, like Disneyland, still bring joy to millions','Disneyland is in Anaheim, California','Walt won 22 Academy Awards'],e:'Today, millions of people visit Disney parks and watch Disney movies.',k:'main idea'}],
 seq:['Walt delivered newspapers with his brother Roy.','Walt created Mickey Mouse on a train ride.','Snow White and the Seven Dwarfs came out.','Disneyland opened in California.'],
 sum:['Walt Disney turned his love of drawing into Mickey Mouse, famous movies, and Disneyland.','Walt Disney drove an ambulance in France.','Walt Disney invented the first movie camera.']}

];

{id:'keller',title:'Helen Keller: The Girl Who Found the Words',icon:'🤲',cat:'people',lvl:5,
 tricky:[['illness','ill-ness','a sickness'],['frustrated','frus-trat-ed','upset because you cannot do something'],['alphabet','al-pha-bet','all the letters used to make words'],['graduated','grad-u-at-ed','finished school and earned a diploma']],
 pages:[
 {t:'Helen Keller was born in 1880 in a small town in Alabama. She was a healthy, curious baby who loved to look around and babble. When she was about a year and a half old, a terrible illness gave her a very high fever. Helen got better, but the sickness left her unable to see or hear. Her world became dark and silent. Helen could not understand words, so she could not tell anyone what she wanted. She invented her own signs, like pretending to slice bread when she was hungry. Still, she felt frustrated almost all the time. She kicked, screamed, and grabbed food from other people\'s plates. Her family loved her, but they did not know how to reach her.',
  q:'Why did Helen kick and scream so often?',o:['She was frustrated because she could not share her thoughts','She wanted to be the loudest child','She was angry at her teacher'],e:'Still, she felt frustrated almost all the time.',k:'inference'},
 {t:'When Helen was almost seven, her parents found a teacher for her. Her name was Anne Sullivan, and she had trouble seeing, too. Anne spelled words into Helen\'s hand, making the shapes of letters with her fingers. At first, Helen copied the shapes, but she did not know they meant anything. Then one day, Anne held Helen\'s hand under a water pump. As cool water rushed over one hand, Anne spelled w-a-t-e-r into the other. Suddenly, Helen understood! The shapes were names for things. That same day, she learned many more words. She wanted to know the name of everything she touched. Anne had opened a door for Helen, and Helen raced right through it.',
  q:'What did Helen finally understand at the water pump?',o:['The finger shapes were names for things','Water was cold','She was thirsty'],e:'The shapes were names for things.',k:'main idea'},
 {t:'Once Helen understood words, she could not stop learning. She learned the finger alphabet and then braille, which is a way of reading raised dots with your fingertips. Later, she worked very hard to learn to speak out loud. She also learned to understand others by resting her fingers on their lips and throat. Helen dreamed of going to college, even though many people said a deaf and blind student could never keep up. Anne went to classes with her and spelled the lessons into her hand. Helen studied for hours every day. In 1904, she graduated from college with honors. She was the first deaf and blind person in the United States to earn a college degree.',
  q:'What word best describes Helen as a student?',o:['Determined','Lazy','Careless'],e:'Helen studied for hours every day.',k:'character'},
 {t:'Helen wanted to help other people who could not see or hear. She wrote books and articles about her life, which were read around the world. She traveled to dozens of countries to give speeches. Her speaking voice was hard for some listeners to understand, so Anne or a helper often repeated her words for the crowd. Helen asked leaders to build schools and give jobs to people with disabilities. She raised money for groups that helped blind people. In 1964, she received the Presidential Medal of Freedom, one of the highest honors in the country. Helen died in 1968, at age 87. She showed the world that people with disabilities can learn, work, and lead.',
  q:'What is the main idea of this page?',o:['Helen spent her life helping people with disabilities','Helen\'s voice was hard to understand','Helen died at age 87'],e:'She showed the world that people with disabilities can learn, work, and lead.',k:'main idea'}],
 seq:['A high fever left Helen unable to see or hear.','Anne Sullivan came to teach Helen.','Helen learned the word water at the pump.','Helen graduated from college with honors.'],
 sum:['Helen Keller lost her sight and hearing as a baby, learned to communicate with her teacher\'s help, and spent her life helping others.','Helen Keller learned to read braille with her fingertips.','Helen Keller was born blind and never learned any words.']},

{id:'lincoln',title:'Abraham Lincoln: From Log Cabin to Leader',icon:'🎩',cat:'people',lvl:5,
 tricky:[['borrowed','bor-rowed','took something for a short time and gave it back'],['president','pres-i-dent','the leader of the country'],['slavery','slav-er-y','owning people and forcing them to work for no pay'],['proclamation','proc-la-ma-tion','an important official announcement']],
 pages:[
 {t:'Abraham Lincoln was born in 1809 in a one-room log cabin in Kentucky. His family was poor, and young Abe spent his days chopping wood, planting crops, and doing chores. When he was seven, his family moved to the wild woods of Indiana. When Abe was nine, his mother died, and he was very sad. Later, his father married a kind woman who encouraged Abe to learn. Abe went to school for less than one year in all. Still, he loved to read. He borrowed every book he could find and walked miles to get one. He read by firelight after a long day of work. He taught himself almost everything he knew.',
  q:'How did Abe get most of his learning?',o:['He taught himself by reading borrowed books','He went to school every day for many years','He had a tutor at home'],e:'He taught himself almost everything he knew.',k:'detail'},
 {t:'As a young man, Abe moved to Illinois. He was very tall and strong, and he could split logs into fence rails faster than most men. He worked in a store, delivered mail, and even served as a soldier. People liked him because he told funny stories and was fair. A famous story says he once walked miles to return a few cents to a customer he had charged too much. Folks called him Honest Abe. He studied law books on his own and became a lawyer. He was elected to make laws for Illinois and later served in the United States Congress. In 1860, Americans elected him the sixteenth president.',
  q:'Why did people call him Honest Abe?',o:['He was known for being fair and truthful','He was the tallest man in town','He split logs very fast'],e:'Folks called him Honest Abe.',k:'character'},
 {t:'When Lincoln became president, the country was splitting apart. Many Southern states allowed slavery, and they did not want it to end. Eleven of those states left the United States, and in 1861, the Civil War began. It was a long and terrible war, and hundreds of thousands of soldiers died. Lincoln worked to keep the country together. In 1863, he signed the Emancipation Proclamation, which declared that enslaved people in the states fighting the Union were free. That same year, he gave a short speech at a battlefield in Pennsylvania. It was only about two minutes long, but people still study his words today. He said the nation must have a new birth of freedom.',
  q:'What does the word proclamation mean?',o:['An important official announcement','A battle in a war','A kind of speech teacher'],e:'In 1863, he signed the Emancipation Proclamation, which declared that enslaved people in the states fighting the Union were free.',k:'vocabulary'},
 {t:'In April 1865, the Civil War finally ended, and the country began to heal. Just days later, President Lincoln went to see a play at a theater in Washington, D.C. A man who was angry that the South had lost shot him. Lincoln died the next morning, and the whole nation mourned. He was 56 years old. Later that year, a change to the Constitution called the Thirteenth Amendment ended slavery everywhere in the United States. Lincoln had worked hard to help pass it. Today, his face is on the penny and the five-dollar bill. A giant statue of him sits in the Lincoln Memorial. Many people call him one of America\'s greatest presidents.',
  q:'What can you tell about how Americans feel about Lincoln today?',o:['They honor him as a great leader','They have forgotten him','They think he was a bad president'],e:'Many people call him one of America\'s greatest presidents.',k:'inference'}],
 seq:['Abe was born in a log cabin in Kentucky.','Abe became a lawyer in Illinois.','The Civil War began after Abe became president.','The Thirteenth Amendment ended slavery.'],
 sum:['Abraham Lincoln grew up poor, taught himself, and became the president who kept the country together and worked to end slavery.','Abraham Lincoln\'s face is on the penny.','Abraham Lincoln was a rich lawyer who started the Civil War.']},

{id:'mlk',title:'Martin Luther King Jr.: A Dream for Everyone',icon:'🕊️',cat:'people',lvl:5,
 tricky:[['minister','min-is-ter','a leader of a church'],['nonviolence','non-vi-o-lence','protesting peacefully without fighting or hurting anyone'],['equality','e-qual-i-ty','everyone being treated the same and fairly'],['holiday','hol-i-day','a special day when people celebrate or remember']],
 pages:[
 {t:'Martin Luther King Jr. was born in 1929 in Atlanta, Georgia. His father was a minister, and Martin grew up in a loving family that went to church every Sunday. As a boy, Martin had a white friend who lived nearby. When the boys reached school age, the friend\'s father said they could no longer play together because Martin was Black. Martin was deeply hurt. He saw unfair laws all around him that kept Black and white people apart. Martin was a strong student who loved words and big ideas. He skipped grades and started college when he was only 15. He decided to become a minister like his father, and he studied hard to earn advanced degrees.',
  q:'How did Martin feel when he could no longer play with his friend?',o:['Deeply hurt','Happy and excited','Bored'],e:'Martin was deeply hurt.',k:'detail'},
 {t:'Martin became the minister of a church in Montgomery, Alabama. In 1955, a woman was arrested for refusing to give up her bus seat to a white rider. Black people in Montgomery decided to stop riding the city buses until the rules changed. They asked Martin to lead the protest. He was just 26 years old. Martin believed in nonviolence. He had learned about a leader in India who used peaceful protest to win freedom. Martin told people to stay calm, even when others were cruel to them. Someone threw a bomb at his house, but he still asked his followers not to fight back. After about a year, the unfair bus rules ended.',
  q:'What does Martin\'s choice not to fight back show about him?',o:['He believed in peace even when it was hard','He was afraid of everyone','He did not care about the protest'],e:'Someone threw a bomb at his house, but he still asked his followers not to fight back.',k:'character'},
 {t:'Martin traveled across the country to speak, march, and fight for equality. Sometimes he was arrested and put in jail, but he kept going. In 1963, about 250,000 people gathered in Washington, D.C., for a giant march. Martin stood in front of the Lincoln Memorial and gave one of the most famous speeches in American history. Again and again, he said, "I have a dream." He dreamed that one day his four children would be judged by who they were inside, not by the color of their skin. The next year, Congress passed a law that made segregation in public places illegal. Martin also won the Nobel Peace Prize, a world honor for peacemakers.',
  q:'What was Martin\'s dream for his children?',o:['That they would be judged by who they were inside','That they would become famous speakers','That they would live in Washington, D.C.'],e:'He dreamed that one day his four children would be judged by who they were inside, not by the color of their skin.',k:'detail'},
 {t:'Martin kept working for fairness. He spoke up for workers who were paid too little and for families who were poor. In 1968, he went to Memphis, Tennessee, to help sanitation workers who collected trash. They wanted safer jobs and fair pay. While he was there, a man shot and killed him. Martin was only 39 years old. People all over the world were heartbroken. But his ideas did not die. Today, the United States honors him with a national holiday on the third Monday in January. Many people spend that day helping their neighbors. A huge stone memorial of Martin stands in Washington, D.C. His words still inspire people to make the world fairer.',
  q:'What is the main idea of this page?',o:['Martin\'s ideas lived on after his death and still inspire people','Martin went to Memphis, Tennessee','The holiday is in January'],e:'But his ideas did not die.',k:'main idea'}],
 seq:['Martin was born in Atlanta, Georgia.','Martin led the bus protest in Montgomery.','Martin gave his "I have a dream" speech.','A national holiday was created to honor Martin.'],
 sum:['Martin Luther King Jr. led peaceful protests and gave powerful speeches that helped Black Americans win equal rights.','Martin Luther King Jr. started college at age 15.','Martin Luther King Jr. was a soldier who fought in a war.']},

{id:'curie',title:'Marie Curie: The Scientist Who Glowed with Genius',icon:'🔬',cat:'people',lvl:5,
 tricky:[['university','u-ni-ver-si-ty','a school for learning after high school'],['experiments','ex-per-i-ments','tests scientists do to learn something new'],['radiation','ra-di-a-tion','invisible energy given off by some materials'],['discovered','dis-cov-ered','found something for the first time']],
 pages:[
 {t:'Marie Curie was born in 1867 in Warsaw, Poland. Her family called her Manya. She was the youngest of five children, and she had an amazing memory. Her parents were both teachers, and they filled their home with books. But life was hard. Her mother died when Manya was ten. Back then, Poland was ruled by Russia, and the leaders did not let girls go to university. Manya did not give up. She and her sister made a deal. Manya would work as a teacher for a family and send money so her sister could study medicine in France. Later, her sister would help pay for Manya\'s studies. Manya waited years for her turn.',
  q:'What deal did Manya make with her sister?',o:['They would take turns helping pay for each other\'s schooling','They would both move to Russia','They would open a school together'],e:'Later, her sister would help pay for Manya\'s studies.',k:'detail'},
 {t:'In 1891, Manya finally moved to Paris, France, to study at a famous university. She began using the French name Marie. She was very poor and lived in a tiny, cold room at the top of a building. Some nights she wore every piece of clothing she owned just to stay warm. Sometimes she studied so hard that she forgot to eat. But Marie did not complain. She earned top grades in physics and math. In Paris, she met a scientist named Pierre who loved science as much as she did. They got married and became partners in the lab. They worked side by side, doing experiments for long hours in a drafty shed.',
  q:'What word best describes Marie as a student?',o:['Hardworking','Lazy','Spoiled'],e:'Sometimes she studied so hard that she forgot to eat.',k:'character'},
 {t:'Marie wanted to learn about a strange kind of invisible energy that some rocks gave off. She named it radioactivity. Marie and Pierre ground up tons of rock and boiled it in huge pots. In 1898, they discovered two new elements, which are basic building blocks of everything. Marie named the first one polonium, after her home country, Poland. She named the other one radium. Radium even glowed in the dark! In 1903, Marie and Pierre shared the Nobel Prize in Physics with another scientist. Marie was the first woman ever to win a Nobel Prize. Sadly, Pierre died in a street accident three years later. Marie was heartbroken, but she kept working.',
  q:'Why did Marie name an element polonium?',o:['To honor her home country, Poland','Because it glowed in the dark','Because Pierre chose the name'],e:'Marie named the first one polonium, after her home country, Poland.',k:'inference'},
 {t:'In 1911, Marie won a second Nobel Prize, this time in chemistry. She was the first person ever to win two. During World War I, she helped build trucks that carried X-ray machines to the battlefields. The X-rays helped doctors find bullets and broken bones in hurt soldiers. Marie even learned to drive so she could take the trucks there herself. Back then, no one knew that radiation could make people sick. Marie often carried radium in her pockets. Years of working with it damaged her health, and she died in 1934. Her old notebooks are still so radioactive that they are kept in special boxes. Her discoveries changed science and medicine forever.',
  q:'What does the word radiation mean in this story?',o:['Invisible energy that can make people sick','A kind of truck','A type of prize'],e:'Back then, no one knew that radiation could make people sick.',k:'vocabulary'}],
 seq:['Manya worked as a teacher to help her sister.','Marie moved to Paris to study.','Marie and Pierre discovered polonium and radium.','Marie won her second Nobel Prize.'],
 sum:['Marie Curie overcame poverty and unfair rules to make discoveries about radioactivity and became the first person to win two Nobel Prizes.','Marie Curie wore all her clothes to stay warm.','Marie Curie invented the X-ray machine by herself.']},

{id:'einstein',title:'Albert Einstein: The Wonder of a Curious Mind',icon:'💡',cat:'people',lvl:5,
 tricky:[['compass','com-pass','a tool with a needle that always points north'],['scientist','sci-en-tist','a person who studies how the world works'],['imagination','i-mag-i-na-tion','the power to picture things in your mind'],['universe','u-ni-verse','everything in space, including stars and planets']],
 pages:[
 {t:'Albert Einstein was born in 1879 in Germany. When he was about five years old, his father showed him a small compass. Albert watched the needle carefully. No matter how he turned the compass, the needle always pointed the same way. Some invisible force was moving it! Albert never forgot that feeling of wonder. He wanted to know how the world really worked. Some people say Albert was bad at math, but that is a myth. He loved math and taught himself hard lessons for fun. He did not like schools that made students memorize facts without asking questions. Albert also loved music, and he played the violin his whole life.',
  q:'What does the story say about the idea that Albert was bad at math?',o:['It is a myth, because he loved math','It is true, because he failed math','It is true, because he only liked music'],e:'Some people say Albert was bad at math, but that is a myth.',k:'detail'},
 {t:'After college, Albert had trouble finding a job as a teacher. So he took a job in Switzerland at an office that checked people\'s ideas for new inventions. In his free time, he thought about big puzzles of science. He liked to do thought experiments, which means he imagined things in his head. He pictured what it would be like to ride alongside a beam of light. In 1905, Albert wrote several papers that amazed other scientists. One included his famous equation, E = mc squared. It shows that a tiny bit of matter holds a giant amount of energy. Albert later said that imagination is even more important than knowledge.',
  q:'What can you tell about how Albert solved science puzzles?',o:['He used his imagination to picture ideas','He only copied other people\'s answers','He never thought about science at work'],e:'He liked to do thought experiments, which means he imagined things in his head.',k:'inference'},
 {t:'Albert kept thinking about space and time. In 1915, he shared a new idea about gravity. He said that heavy objects, like the sun, bend space around them, a little like a bowling ball sinking into a trampoline. That bend can even make light curve. In 1919, scientists tested his idea during a solar eclipse, when the moon blocked the sun. They found that starlight passing near the sun really did bend! Newspapers around the world called Albert a genius, and he became famous almost overnight. In 1921, he won the Nobel Prize in Physics. Scientists still use his ideas today, even to help make the maps on phones more accurate.',
  q:'What made Albert famous almost overnight?',o:['Scientists proved his idea that starlight bends near the sun','He played the violin on the radio','He won a contest at school'],e:'They found that starlight passing near the sun really did bend!',k:'main idea'},
 {t:'In the 1930s, a cruel group took over Germany. Its leaders treated Jewish people very unfairly, and Albert was Jewish. In 1933, he moved to the United States and became an American citizen. He worked at a research center in Princeton, New Jersey, for the rest of his life. Albert became one of the most recognized people on Earth, with his wild white hair and friendly eyes. He often walked around town in baggy sweaters. He answered letters from children who asked him questions about the universe. Albert spoke up for peace and fair treatment for all people. He died in 1955, at age 76. Today, the word einstein is used to mean a genius.',
  q:'What does Albert answering children\'s letters show about him?',o:['He was kind and cared about young learners','He did not like children','He was too busy to read'],e:'He answered letters from children who asked him questions about the universe.',k:'character'}],
 seq:['Albert was amazed by a compass as a boy.','Albert wrote his famous papers in 1905.','Scientists tested his idea during an eclipse.','Albert moved to the United States.'],
 sum:['Albert Einstein used his curious mind and imagination to discover new ideas about energy, space, and time that changed science.','Albert Einstein played the violin.','Albert Einstein failed math and never went to college.']},

{id:'kahlo',title:'Frida Kahlo: Painting Her Own Story',icon:'🎨',cat:'people',lvl:5,
 tricky:[['accident','ac-ci-dent','something bad that happens by surprise'],['portraits','por-traits','paintings or pictures of people'],['traditional','tra-di-tion-al','done the same way for a very long time'],['museum','mu-se-um','a building where people go to see special things']],
 pages:[
 {t:'Frida Kahlo was born in 1907 in Mexico City, Mexico. She grew up in a bright blue house with a garden. Her father was a photographer, and Frida liked to help him. When she was six, Frida got a sickness called polio. It made her right leg thinner and weaker than her left. Some kids at school teased her and called her names. Frida did not let that stop her. Her father encouraged her to play sports to make her leg stronger. She swam, boxed, and rode a bike, which was unusual for girls back then. Frida was smart and full of fun. She went to one of the best schools in Mexico and planned to become a doctor.',
  q:'What does Frida playing sports after polio show about her?',o:['She was brave and did not give up','She did not like school','She wanted to be a photographer'],e:'Frida did not let that stop her.',k:'character'},
 {t:'When Frida was 18, she was riding a bus home from school. Suddenly, a streetcar crashed into the bus. Frida was badly hurt. Her back, her leg, and many other bones were broken. Doctors were not sure she would live. She had to stay in bed for months, wrapped in a stiff body cast. Frida was bored and lonely. Her mother had a special easel built so Frida could paint while lying down. Her parents also put a mirror above her bed. Frida looked at her own face for hours, so she started to paint herself. The terrible accident changed her plans. Instead of becoming a doctor, she became an artist.',
  q:'Why did Frida start painting pictures of herself?',o:['She could see her face in a mirror above her bed','Her teacher told her to','She did not have any paint colors'],e:'Frida looked at her own face for hours, so she started to paint herself.',k:'detail'},
 {t:'Frida painted many portraits of herself. In them, she often wore flowers and ribbons in her braided hair. She dressed in long, colorful skirts and traditional clothes from Mexico. She painted her eyebrows just as they were, thick and meeting in the middle. She did not try to look like anyone else. Frida painted her feelings, too. When she was sad or in pain, her paintings showed it. She often added parrots, monkeys, and plants to her pictures. In real life, she kept many pets at her blue house, including monkeys, parrots, and dogs. Frida married a famous Mexican painter, and together they welcomed artists and thinkers from around the world.',
  q:'What is the main idea of this page?',o:['Frida painted herself and her feelings in a bold, honest way','Frida kept many pets','Frida wore ribbons in her hair'],e:'Frida painted her feelings, too.',k:'main idea'},
 {t:'Frida\'s injuries caused her pain her whole life. She had many operations, and she often had to paint from bed. But she never stopped making art. In 1953, a gallery in Mexico held her first solo show in her home country. Her doctors told her she was too sick to go. Frida came anyway. She arrived in an ambulance, and her own bed was carried into the gallery! She greeted her guests from it. Frida died the next year, at age 47. Today, her blue house is a museum that many people visit. Her paintings hang in museums around the world. Frida showed that you can turn hard times into something beautiful.',
  q:'What can you tell about Frida from how she went to her own art show?',o:['She was determined and loved her art','She did not care about her show','She was afraid of crowds'],e:'She arrived in an ambulance, and her own bed was carried into the gallery!',k:'inference'}],
 seq:['Frida got polio when she was six.','Frida was hurt in a bus accident.','Frida began painting pictures of herself.','Frida went to her art show in her bed.'],
 sum:['Frida Kahlo was badly hurt as a teenager, then became a famous artist by boldly painting herself and her feelings.','Frida Kahlo kept monkeys and parrots as pets.','Frida Kahlo was a doctor who painted in her free time.'],
 say:[['Kahlo','KAH-lo']]},

{id:'malala',title:'Malala Yousafzai: One Girl, One Voice',icon:'📚',cat:'people',lvl:5,
 tricky:[['education','ed-u-ca-tion','learning, especially in school'],['speeches','speech-es','talks given to a group of people'],['recovered','re-cov-ered','got better after being sick or hurt'],['youngest','young-est','the least old of everyone']],
 pages:[
 {t:'Malala Yousafzai was born in 1997 in a green valley in Pakistan, surrounded by tall mountains. Her father ran a school, and Malala loved learning there. She liked to be first in her class. Her father believed girls should have the same chance to learn as boys. But when Malala was about 11, a violent group took control of her valley. They made strict rules. They said girls were not allowed to go to school. Many schools for girls were destroyed. Malala was heartbroken. She wanted to become a doctor, and she knew she needed an education. She decided she would not stay quiet. She would speak up for girls everywhere.',
  q:'Why did Malala decide to speak up?',o:['A group said girls could not go to school','She wanted to be on television','Her school was too easy'],e:'They said girls were not allowed to go to school.',k:'detail'},
 {t:'Malala began writing a blog, or online diary, about her life. She used a made-up name so that people would not know it was her. She wrote about how scared she felt and how much she missed school. People around the world read her words. Later, she began speaking out using her real name. She gave interviews on TV and said that every girl has a right to learn. Many people admired her courage. But the violent group was angry. In 2012, when Malala was 15, a man stopped her school bus and shot her. She was badly hurt. Doctors rushed to save her life, and she was flown to a hospital in England.',
  q:'What does Malala\'s choice to use her real name show about her?',o:['She was brave enough to stand up for her beliefs','She wanted to be famous for fun','She was not worried about anything'],e:'Later, she began speaking out using her real name.',k:'character'},
 {t:'Malala spent months in the hospital in England. Slowly, she recovered. She needed several operations to heal, and it took a long time to feel strong again. Cards and gifts poured in from people all over the world who were cheering for her. Malala\'s family moved to England to be with her, and she went back to school there. The attack did not make her quiet. Instead, it made her voice louder. On her sixteenth birthday, she gave a powerful speech at the United Nations, where leaders from many countries meet. She said that one child, one teacher, one book, and one pen can change the world. People stood and clapped for her.',
  q:'What does the word recovered mean?',o:['Got better after being hurt','Got a new cover','Got lost'],e:'Slowly, she recovered.',k:'vocabulary'},
 {t:'In 2014, Malala won the Nobel Peace Prize, one of the most important awards in the world. She was only 17. That made her the youngest person ever to win a Nobel Prize! She shared the prize with a man from India who worked to protect children. Malala and her father started a group called the Malala Fund. It helps girls in many countries go to school and stay there. Malala kept studying, too. In 2020, she graduated from a famous university in England. She still gives speeches and writes books. Malala\'s story shows that even one young person can stand up for what is right and make a difference.',
  q:'What is the main idea of this page?',o:['Malala keeps working so that girls everywhere can go to school','Malala graduated in 2020','Malala shared her prize'],e:'It helps girls in many countries go to school and stay there.',k:'main idea'}],
 seq:['A violent group said girls could not go to school.','Malala wrote a blog using a made-up name.','Malala was hurt and flown to England.','Malala won the Nobel Peace Prize.'],
 sum:['Malala Yousafzai spoke up for girls\' education, survived an attack, and became the youngest person to win a Nobel Prize.','Malala Yousafzai wrote a blog about missing school.','Malala Yousafzai was a famous doctor in England.'],
 say:[['Malala','mah-LAH-lah'],['Yousafzai','YOO-suf-zye']]},

{id:'swift',title:'Taylor Swift: Writing Her Way to the Top',icon:'🎤',cat:'people',lvl:5,
 tricky:[['songwriter','song-writ-er','a person who writes the words and music of songs'],['determined','de-ter-mined','not giving up on a goal'],['concerts','con-certs','shows where musicians perform for a crowd'],['album','al-bum','a group of songs put out together']],
 pages:[
 {t:'Taylor Swift was born in 1989 in Pennsylvania. She spent her early years on a Christmas tree farm, where she helped with chores like picking insect egg pods off the trees. Taylor loved to sing, and she loved stories. As a kid, she wrote poems and even won a poetry contest. When she was about 12, she started learning to play the guitar. Soon she was writing her own songs about her life and feelings. Taylor dreamed of becoming a country music star. She asked her parents to take her to Nashville, Tennessee, the home of country music. There, she handed out her demo CDs to music companies. Every one said no, but she kept trying. She was determined to share her songs.',
  q:'What does the story show about Taylor when every music company said no?',o:['She was determined and kept trying','She gave up on music','She stopped writing songs'],e:'Every one said no, but she kept trying.',k:'character'},
 {t:'Taylor\'s family decided to move to a town near Nashville so she could chase her dream. At 14, she became one of the youngest songwriters ever hired by a big music publishing company. She sang at cafes, fairs, and ball games whenever she could. One night, she played at a famous cafe in Nashville, and a music business leader heard her. He signed her to his brand-new record label. In 2006, when Taylor was 16, her first album came out. She had written or helped write every song on it. Her songs told stories that teenagers knew well, like crushes and hurt feelings. Many fans felt like Taylor understood them.',
  q:'Why did many fans feel close to Taylor?',o:['Her songs told stories they knew well','She lived next door to them','She only sang old songs'],e:'Many fans felt like Taylor understood them.',k:'inference'},
 {t:'Taylor kept writing and growing as an artist. Her second album, Fearless, won the Grammy for Album of the Year. At age 20, she was the youngest person to win that award at the time. A few years later, she changed her style from country to pop music, and her fans followed her. Taylor is known for hiding little clues in her songs and videos for fans to find. Her fans call themselves Swifties. Later, Taylor decided she wanted to own the music she had made. So she recorded many of her old albums again, calling the new ones Taylor\'s Version. This showed that she cared about artists being in charge of their own work.',
  q:'What is the main idea of this page?',o:['Taylor kept growing as an artist and stood up for her own music','Taylor\'s fans are called Swifties','Taylor hid clues in her videos'],e:'Taylor kept writing and growing as an artist.',k:'main idea'},
 {t:'In 2023, Taylor began a giant concert tour called the Eras Tour. Each show lasted more than three hours and included songs from every part of her career. The tour traveled to five continents, and millions of fans came to the concerts. Fans made friendship bracelets and traded them with people they met. The Eras Tour became the highest-earning concert tour of all time. Taylor has won more Grammy Awards for Album of the Year than any other artist. She is also known for giving to charities and helping people in need. From a Christmas tree farm to stadiums around the world, Taylor showed that hard work and big dreams can take you far.',
  q:'What did fans trade at the concerts?',o:['Friendship bracelets','Christmas trees','Guitars'],e:'Fans made friendship bracelets and traded them with people they met.',k:'detail'}],
 seq:['Taylor grew up on a Christmas tree farm.','Taylor handed out her demo CDs in Nashville.','Taylor\'s first album came out when she was 16.','Taylor began the Eras Tour.'],
 sum:['Taylor Swift wrote songs from a young age, never gave up, and became one of the most successful musicians in the world.','Taylor Swift picked bugs off Christmas trees.','Taylor Swift became famous by singing other people\'s songs.']},

{id:'hamm',title:'Mia Hamm: Soccer Superstar',icon:'⚽',cat:'people',lvl:5,
 tricky:[['national','na-tion-al','having to do with a whole country'],['championships','cham-pi-on-ships','contests that decide who is the best'],['Olympics','O-lym-pics','a huge sports event with athletes from around the world'],['foundation','foun-da-tion','a group that raises money to help others']],
 pages:[
 {t:'Mia Hamm was born in 1972 in a town in Alabama. Her father was a pilot in the Air Force, so her family moved often. When Mia was a toddler, they lived in Italy, where soccer is hugely popular. Little Mia loved kicking a ball around. Mia grew up in a big, busy family with lots of brothers and sisters. Her family also adopted a boy named Garrett, who was eight years older than Mia. Garrett was a great athlete, and he let Mia tag along when he played with older kids. She was small, but she was fast and fearless. Mia looked up to Garrett more than anyone. She said he made her want to be a great athlete.',
  q:'Who inspired Mia to become a great athlete?',o:['Her brother Garrett','Her coach in Italy','A famous soccer star on TV'],e:'She said he made her want to be a great athlete.',k:'detail'},
 {t:'Mia was a soccer star in high school. When she was only 15, she was chosen for the United States women\'s national team. She was the youngest player ever to join it! It was a huge honor for a high school student. At first, Mia was nervous around the older players. She did not think she was good enough. She worked even harder and practiced her skills again and again. Later, she played college soccer for the University of North Carolina. Her team won four national championships while she was there. In 1991, when Mia was 19, the United States won the very first Women\'s World Cup. Mia was one of the youngest players on the winning team.',
  q:'What can you tell about Mia from how she handled feeling nervous?',o:['She used hard work to build her confidence','She quit the team','She stopped practicing'],e:'She worked even harder and practiced her skills again and again.',k:'character'},
 {t:'Mia became one of the most famous players in the world. In 1996, women\'s soccer was played at the Olympics for the first time, in Atlanta, Georgia. Huge crowds came to cheer, and Mia and her team won the gold medal. Then came the 1999 Women\'s World Cup, played in the United States. More than 90,000 fans packed a stadium in California for the final game. It was tied, so the game was decided by penalty kicks. Mia made her kick, and the Americans won! The crowd roared, and players hugged and cried on the field. The win inspired thousands of girls to start playing soccer. Many of today\'s stars say they grew up wanting to be just like Mia.',
  q:'What is the main idea of this page?',o:['Mia helped win huge games that inspired many girls to play soccer','Mia had a hurt ankle','The stadium was in California'],e:'The win inspired thousands of girls to start playing soccer.',k:'main idea'},
 {t:'Mia also faced great sadness. Garrett got a rare blood disease. In 1997, he died. Mia was heartbroken, and she missed him every day. To honor him, she started the Mia Hamm Foundation. It helps families who need bone marrow transplants and supports girls who play sports. Mia kept playing for her country until 2004. That year, she won another Olympic gold medal. When she retired, she had scored 158 goals in international games. At that time, that was more than any other player in the world, man or woman! In 2007, she was voted into the National Soccer Hall of Fame. Mia always said that a team is more important than any one player.',
  q:'What does the word foundation mean in this story?',o:['A group that raises money to help others','The bottom of a house','A soccer field'],e:'To honor him, she started the Mia Hamm Foundation.',k:'vocabulary'}],
 seq:['Mia learned to love soccer as a toddler in Italy.','Mia joined the national team at age 15.','The Americans won the 1999 Women\'s World Cup.','Mia retired after winning another gold medal.'],
 sum:['Mia Hamm worked hard to become a soccer superstar, helped her team win huge championships, and inspired many girls to play.','Mia Hamm lived in Italy as a toddler.','Mia Hamm was a basketball player who never played soccer.']},

{id:'franklin',title:'Benjamin Franklin: The Man Who Did It All',icon:'🪁',cat:'people',lvl:5,
 tricky:[['apprentice','ap-pren-tice','a young person learning a job from an expert'],['electricity','e-lec-tric-i-ty','a kind of energy that powers lights and machines'],['inventions','in-ven-tions','new things someone creates for the first time'],['independence','in-de-pen-dence','being free from control by others']],
 pages:[
 {t:'Benjamin Franklin was born in 1706 in Boston, Massachusetts. He was one of seventeen children! His family could not afford much school, so Ben stopped going when he was ten. But he never stopped learning. He read every book he could find. When Ben was 12, he became an apprentice in his older brother\'s printing shop. He learned to set letters in rows to print newspapers. Ben wanted to write for the paper, but he knew his brother would say no. So he wrote funny letters pretending to be a lady named Silence Dogood. He slipped them under the shop door at night. Readers loved them, and nobody guessed the writer was a teenage boy!',
  q:'What does Ben writing the secret letters show about him?',o:['He was clever and creative','He was shy about reading','He did not like newspapers'],e:'So he wrote funny letters pretending to be a lady named Silence Dogood.',k:'character'},
 {t:'At 17, Ben ran away to Philadelphia with almost no money in his pockets. He found work as a printer and later opened his own shop. He printed a newspaper and a yearly book called Poor Richard\'s Almanack. It had weather guesses, jokes, and wise sayings, like "Early to bed and early to rise makes a man healthy, wealthy, and wise." Ben also wanted to make his city better. He helped start one of the first lending libraries in America, so people could borrow books. He helped create a fire company and a hospital, too. Ben believed that people working together could solve problems that no one person could solve alone. He even studied ocean currents on his trips across the sea.',
  q:'What can you tell about why Ben started a lending library?',o:['He wanted others to be able to read and learn like he did','He wanted to sell more newspapers','He did not like his own books'],e:'He helped start one of the first lending libraries in America, so people could borrow books.',k:'inference'},
 {t:'Ben was curious about science, especially electricity. Many people thought lightning was a mystery. Ben guessed that lightning was electricity. In 1752, he tested his idea by flying a kite during a storm. A metal key hung from the kite string. When Ben touched the key, he felt a spark. His idea was right! This experiment was very dangerous, and no one should ever try it. Ben then invented the lightning rod, which protects buildings from lightning strikes. He also invented bifocal glasses and a stove that heated rooms better. Ben did not try to get rich from his inventions. He wanted everyone to be able to use them for free, because he believed new ideas should help everybody.',
  q:'What is the main idea of this page?',o:['Ben made important discoveries and inventions to help people','Ben flew a kite','Ben invented a stove'],e:'Ben was curious about science, especially electricity.',k:'main idea'},
 {t:'Ben also helped create a new country. In the 1770s, many colonists wanted independence from Great Britain. Ben helped write and signed the Declaration of Independence in 1776. Then he sailed to France, where he convinced its leaders to send money, ships, and soldiers to help the Americans win their war. After the war, Ben was 81 years old when he helped write the United States Constitution. He signed the Declaration, the peace treaty that ended the war, and the Constitution. Few people did more to start the new nation. Ben died in 1790, at age 84, and about 20,000 people came to his funeral. Today, his face appears on the hundred-dollar bill.',
  q:'What does the word independence mean?',o:['Being free from control by others','A kind of kite','A newspaper'],e:'In the 1770s, many colonists wanted independence from Great Britain.',k:'vocabulary'}],
 seq:['Ben became an apprentice in his brother\'s printing shop.','Ben ran away to Philadelphia.','Ben flew a kite to test his idea about lightning.','Ben helped write the United States Constitution.'],
 sum:['Benjamin Franklin was a printer, inventor, and scientist who helped create the United States.','Benjamin Franklin wrote letters as Silence Dogood.','Benjamin Franklin was the first president of the United States.']}

];

// How to say the few real names that have to stay in the stories (shown in the warm-up and when the name is tapped)
const SAY = {
  midas:[['Midas','MY-dus']], earhart:[['Earhart','AIR-hart']],
  aryabhata:[['Aryabhata','AR-yah-BAH-tah']], cailun:[['Cai Lun','tsy LOON'],['Han','hahn']],
  anning:[['ichthyosaur','IK-thee-oh-sor'],['plesiosaur','PLEE-zee-oh-sor'],['pterosaur','TAIR-oh-sor']]};
function sayOf(s){ return s && (SAY[s.id] || s.say) || null; }
const CATS = {fun:'Fun stories', tales:'Tales, myths & poems', fiction:'Realistic fiction', people:'Real people', mine:'My new stories'};
const SKILLS = ['detail','inference','vocabulary','main idea','character','figurative language','memory'];
const SHOP = [
